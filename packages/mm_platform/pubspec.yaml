name: mm_platform
description: MarginMind platform integration — native window chrome, menus and system appearance.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  file_selector: ^1.1.0
  path: ^1.9.0
  desktop_drop:
    path: ../../third_party/desktop_drop
  record: ^7.1.2
  mm_core: any
  flutter:
    sdk: flutter
  window_manager: ^0.5.1
  macos_window_utils: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/readability/Readability.js
    - assets/readability/LICENSE.md
