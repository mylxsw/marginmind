<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarginMind · 学习笔记：AI 整理与导出 · 高保真交互原型</title>
<style>
/* Tokens mirror packages/mm_design (MMColors / MMTypography / MMRadii), same as the other prototypes. */
:root{
  --win:#FFFFFF; --side:#F2F2F5; --reader:#F5F5F7; --card:#FFFFFF; --page:#FFFFFF;
  --label:#1D1D1F; --label2:#636366; --label3:#8E8E93; --icon:#6E6E73; --sep:rgba(0,0,0,.09); --fill:rgba(120,120,128,.12); --fill4:rgba(120,120,128,.08);
  --hover:rgba(0,0,0,.045); --pressed:rgba(0,0,0,.09);
  --accent:#007AFF; --accentTint:rgba(0,122,255,.12); --onAccent:#fff;
  --glass:rgba(255,255,255,.88); --hair:rgba(0,0,0,.10); --excerpt:#3A3A3C; --ctx:#8E8E93;
  --cardShadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05); --popShadow:0 10px 36px rgba(0,0,0,.16);
  --ai:#8E5BD8; --aiTint:rgba(142,91,216,.10); --own:#C98A00; --ownTint:rgba(255,204,0,.14); --ok:#248A3D; --okTint:rgba(52,199,89,.14); --err:#D70015;
  --y:#FFCC00; --g:#34C759; --b:#007AFF; --p:#FF2D55; --o:#FF9500; --v:#AF52DE;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
.dark{
  --win:#1E1E1F; --side:#262628; --reader:#1E1E1F; --card:#2C2C2E; --page:#2A2A2C;
  --label:#F5F5F7; --label2:#AEAEB2; --label3:#8E8E93; --icon:#AEAEB2; --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.24); --fill4:rgba(118,118,128,.14);
  --hover:rgba(255,255,255,.06); --pressed:rgba(255,255,255,.12);
  --accent:#0A84FF; --accentTint:rgba(10,132,255,.22);
  --glass:rgba(44,44,47,.92); --hair:rgba(255,255,255,.10); --excerpt:#D1D1D6; --ctx:#8E8E93;
  --cardShadow:0 2px 10px rgba(0,0,0,.35); --popShadow:0 12px 40px rgba(0,0,0,.5);
  --ai:#B38CF0; --aiTint:rgba(179,140,240,.14); --own:#FFD60A; --ownTint:rgba(255,214,10,.12); --ok:#30D158; --okTint:rgba(48,209,88,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--sans);font-size:13px;color:var(--label);-webkit-font-smoothing:antialiased}
body{background:linear-gradient(135deg,#c9d6e8 0%,#e6dcef 50%,#f1e2d6 100%);overflow:hidden}
body.dark{background:linear-gradient(135deg,#1b2333 0%,#2a2333 50%,#33281f 100%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:14px;height:14px}.i.xs{width:12px;height:12px}
.grow{flex:1}
.kbd{font-size:11px;color:var(--label2);margin-left:auto;padding-left:14px}

#desk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px 338px 18px 18px}
#win{position:relative;width:100%;max-width:1560px;height:100%;max-height:960px;background:var(--win);border-radius:24px;overflow:hidden;
  box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 30px 80px rgba(0,0,0,.28);display:flex}

/* ---------- Sidebar (floating glass) ---------- */
#side{width:212px;flex:none;padding:10px;display:flex;flex-direction:column}
#side .glassbar{flex:1;border-radius:16px;background:var(--side);box-shadow:0 0 0 .5px var(--hair);padding:12px 8px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.lights{display:flex;gap:8px;padding:2px 6px 14px}.lights span{width:12px;height:12px;border-radius:6px}
.sg-h{font-size:11px;font-weight:600;color:var(--label3);padding:10px 8px 4px;display:flex;align-items:center}
.sg-h button{margin-left:auto;width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--icon)}
.sg-h button:hover{background:var(--hover)}
.si{height:28px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:7px;font-size:13px;color:var(--label);white-space:nowrap;overflow:hidden}
.si .i{color:var(--accent)}
.si:hover{background:var(--hover)}
.si.on{background:var(--fill)}
.si .cnt{margin-left:auto;font-size:11px;color:var(--label3)}
.si .nb{font-size:10px;font-weight:600;color:#fff;background:var(--accent);border-radius:8px;padding:0 5px;height:15px;line-height:15px;margin-left:auto}
.si .el{overflow:hidden;text-overflow:ellipsis}

/* ---------- Content column ---------- */
#content{flex:1;display:flex;flex-direction:column;min-width:0}
#tb{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px 0 6px}
#tb .ttl{font-weight:600;font-size:13px}
#tb .sub{color:var(--label2);font-size:11.5px;margin-left:6px}
.seg{display:inline-flex;background:var(--fill);border-radius:8px;padding:2px;gap:2px}
.seg button{height:22px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--label2);display:inline-flex;align-items:center;gap:5px}
.seg button.on{background:var(--card);color:var(--label);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.dark .seg button.on{background:#636366}
.capsule{display:flex;align-items:center;gap:2px;height:30px;padding:0 3px;border-radius:15px;background:var(--glass);box-shadow:0 0 0 .5px var(--hair)}
.tbtn{height:24px;min-width:24px;padding:0 7px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--label);font-size:12px;position:relative;white-space:nowrap}
.tbtn .i{color:var(--icon)}
.tbtn:hover{background:var(--hover)}
.tbtn.on{background:var(--accentTint);color:var(--accent)}.tbtn.on .i{color:var(--accent)}
.tbtn[disabled]{opacity:.38}.tbtn[disabled]:hover{background:none}
.badge{min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;padding:0 4px;display:inline-flex;align-items:center;justify-content:center}
#main{flex:1;display:flex;min-height:0;border-top:.5px solid var(--sep)}

/* ---------- Reader ---------- */
#reader{width:40%;min-width:300px;max-width:560px;display:flex;flex-direction:column;background:var(--reader);border-right:.5px solid var(--sep);transition:width .25s}
#reader.collapsed{width:0;min-width:0;border:0;overflow:hidden}
.rbar{height:38px;display:flex;align-items:center;gap:6px;padding:0 12px;flex:none}
.dtab{height:26px;padding:0 10px;border-radius:7px;font-size:12px;color:var(--label2);display:flex;align-items:center;gap:6px}
.dtab.on{background:var(--fill);color:var(--label);font-weight:500}
.dtab:hover:not(.on){background:var(--hover)}
#page{flex:1;overflow:auto;position:relative;padding:4px 18px 40px}
.paper{background:var(--page);border-radius:4px;box-shadow:0 0 0 .5px var(--hair),0 2px 8px rgba(0,0,0,.06);padding:30px 36px 34px;max-width:500px;margin:0 auto 14px}
.paper h3{font-family:var(--serif);font-size:17px;margin:0 0 14px;font-weight:600}
.paper .pg{font-size:11px;color:var(--label3);margin:14px 0 4px;text-align:right}
.paper p{font-family:var(--serif);font-size:14.5px;line-height:27px;margin:0 0 10px;color:var(--label);text-align:justify}
mark.hl{background:none;color:inherit;border-radius:2px;cursor:pointer;padding:1px 0}
mark.hl.y{background:rgba(255,204,0,.36)}mark.hl.g{background:rgba(52,199,89,.30)}mark.hl.b{background:rgba(0,122,255,.24)}
mark.hl.p{background:rgba(255,45,85,.24)}mark.hl.o{background:rgba(255,149,0,.32)}mark.hl.v{background:rgba(175,82,222,.26)}
mark.hl.new{outline:1.5px dashed var(--ok);outline-offset:1px}
mark.hl.flash{animation:hflash 1.8s}
@keyframes hflash{0%,55%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.mnote{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--y);vertical-align:1px;margin-left:3px;position:relative;cursor:pointer}
.mnote::after{content:"";position:absolute;left:3px;right:3px;top:4px;height:1px;background:rgba(0,0,0,.45);box-shadow:0 3px 0 rgba(0,0,0,.45)}

/* ---------- Right pane ---------- */
#right{flex:1;position:relative;min-width:0;display:flex;flex-direction:column;background:var(--win)}

/* Annotation list */
.anno-head{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;flex:none;border-bottom:.5px solid var(--sep)}
.anno-head .ttl{font-weight:600}
.cfilter{display:flex;gap:5px;margin-left:8px}
.cfilter span{width:14px;height:14px;border-radius:7px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15);cursor:pointer;opacity:.35}
.cfilter span.on{opacity:1;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15),0 0 0 2px var(--win),0 0 0 3.5px var(--line,rgba(60,60,67,.3))}
#annoList{flex:1;overflow:auto;padding:6px 12px 90px}
.agrp{font-size:11px;font-weight:600;color:var(--label3);margin:14px 6px 6px;display:flex;gap:6px;align-items:center}
.arow{display:flex;gap:10px;padding:9px 10px;border-radius:10px;align-items:flex-start}
.arow:hover{background:var(--hover)}
.arow.sel{background:var(--accentTint)}
.chk{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--label3);flex:none;margin-top:3px;display:flex;align-items:center;justify-content:center;color:#fff}
.chk.on{background:var(--accent);box-shadow:none}
.arow .bar{width:3px;align-self:stretch;border-radius:2px;flex:none}
.arow .q{font-family:var(--serif);font-size:13.5px;line-height:21px;color:var(--excerpt)}
.arow .m{font-size:11px;color:var(--label2);margin-top:4px;display:flex;gap:8px;align-items:center}
.arow .own{font-size:12px;color:var(--label);background:var(--ownTint);border-radius:6px;padding:4px 7px;margin-top:6px;line-height:1.5}
#annoBar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;height:38px;padding:0 5px 0 14px;border-radius:19px;background:var(--glass);
  box-shadow:0 0 0 .5px var(--hair),var(--popShadow);backdrop-filter:blur(24px) saturate(1.6);white-space:nowrap;z-index:5}
#annoBar .cnt{font-size:12px;color:var(--label2);font-weight:500;margin-right:6px}
.btn{height:28px;padding:0 13px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;background:var(--fill);color:var(--label);white-space:nowrap}
.btn:hover{background:var(--pressed)}
.btn.pri{background:var(--accent);color:#fff}.btn.pri .i{color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.pill{border-radius:14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.ghost{background:none}.btn.ghost:hover{background:var(--hover)}

/* ---------- Note view ---------- */
.note-bar{height:44px;display:flex;align-items:center;gap:6px;padding:0 12px;flex:none;border-bottom:.5px solid var(--sep)}
.note-bar .ttl{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
#noteScroll{flex:1;overflow:auto;position:relative}
#noteDoc{max-width:720px;margin:0 auto;padding:30px 56px 120px 64px;position:relative}
.n-title{font-size:24px;font-weight:700;line-height:1.3;margin:0 0 8px;outline:none}
.n-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:11.5px;color:var(--label2);margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;background:var(--fill4);font-size:11px;color:var(--label2);white-space:nowrap}
.chip.ok{background:var(--okTint);color:var(--ok);cursor:pointer}
.chip.warn{background:rgba(255,149,0,.16);color:#B25000;cursor:pointer}
.dark .chip.warn{color:#FFB340}
.legend{display:flex;gap:14px;font-size:11px;color:var(--label2);padding:8px 10px;border-radius:8px;background:var(--fill4);margin-bottom:22px;align-items:center}
.legend .lg{display:flex;align-items:center;gap:5px}
.legend .swatch{width:3px;height:12px;border-radius:2px}
.legend .ser{font-family:var(--serif);font-size:12px;color:var(--label)}
.n-h2{font-size:17px;font-weight:700;margin:30px 0 10px;display:flex;align-items:baseline;gap:8px;outline:none}
.n-h2 .num{color:var(--label3);font-weight:600;font-variant-numeric:tabular-nums}
.blk{position:relative;margin:0 0 12px;border-radius:6px}
.blk .gut{position:absolute;left:-30px;top:2px;width:22px;height:22px;border-radius:6px;display:none;align-items:center;justify-content:center;color:var(--icon)}
.blk:hover>.gut,.blk.menu>.gut{display:flex}
.blk .gut:hover{background:var(--hover)}
.blk.hlnew{animation:blnew 2.4s}
@keyframes blnew{0%,60%{background:var(--okTint)}100%{background:transparent}}
.blk.pending{background:var(--okTint);box-shadow:-4px 0 0 var(--ok);padding:6px 8px;margin-left:-8px;margin-right:-8px}
.blk.pending .ptag{font-size:10.5px;color:var(--ok);font-weight:600;margin-bottom:4px;display:flex;gap:4px;align-items:center}
.p-ai,.p-own{font-size:14px;line-height:1.75;outline:none}
.marks .blk.ai{padding-left:12px;margin-left:-12px;border-left:2px solid var(--aiTint)}
.marks .blk.ai:hover{border-left-color:var(--ai)}
.vt{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;border-radius:4px;padding:0 4px;height:16px;vertical-align:1px;margin-right:4px;white-space:nowrap}
.vt.ai{color:var(--ai);background:var(--aiTint)}
.vt.mix{color:var(--ai);background:transparent;box-shadow:inset 0 0 0 1px var(--aiTint)}
.vt.own{color:var(--own);background:var(--ownTint)}
.nomarks .vt.ai,.nomarks .vt.mix{display:none}
.callout{background:var(--aiTint);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.7}
.nomarks .callout{background:var(--fill4)}
.quote{position:relative;padding:2px 0 2px 16px}
.quote .bar{position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:2px}
.quote .qt{font-family:var(--serif);font-size:15px;line-height:1.85;color:var(--excerpt)}
.quote .cx{font-family:var(--serif);font-size:14px;line-height:1.85;color:var(--ctx)}
.quote .src{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:11px;color:var(--label3)}
.cite{display:inline-flex;align-items:center;gap:3px;color:var(--accent);border-radius:4px;padding:0 3px;margin-left:-3px;cursor:pointer;font-size:11px}
.cite:hover{background:var(--accentTint)}
.cxbtn{display:inline-flex;align-items:center;gap:3px;border-radius:4px;padding:0 4px;cursor:pointer;color:var(--label3)}
.cxbtn:hover{background:var(--hover);color:var(--label)}
.cxbtn.on{color:var(--label2)}
.gloss{margin-top:6px;font-size:12.5px;line-height:1.6;color:var(--label2);background:var(--aiTint);border-radius:7px;padding:5px 9px}
.nomarks .gloss{background:var(--fill4)}
.ownbox{background:var(--ownTint);border-radius:8px;padding:7px 11px;font-size:13.5px;line-height:1.7;margin:6px 0 0 16px}
.ownbox .from{font-size:10.5px;color:var(--label3);margin-top:2px}
.xref{font-size:13px;color:var(--label2);display:flex;gap:6px;align-items:flex-start;line-height:1.6}
.xref a{color:var(--accent);cursor:pointer;text-decoration:none}
.xref a:hover{text-decoration:underline}
ul.tk{margin:0;padding-left:20px;font-size:14px;line-height:1.75}
ul.todo{list-style:none;margin:0;padding:0;font-size:14px;line-height:1.75}
ul.todo li{display:flex;gap:8px;align-items:flex-start}
ul.todo .cb{width:15px;height:15px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--label3);margin-top:5px;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff}
ul.todo .cb.on{background:var(--ok);box-shadow:none}
ul.todo li.done span.t{color:var(--label3);text-decoration:line-through}
.qa{border-radius:10px;box-shadow:0 0 0 .5px var(--hair);padding:10px 12px;margin-bottom:8px;background:var(--card)}
.qa .q{font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.qa .a{font-family:var(--serif);font-size:14px;line-height:1.75;color:var(--excerpt);margin-top:6px}
.qa .a.hide{filter:blur(5px);cursor:pointer;user-select:none}
.qa .acts{display:flex;gap:6px;margin-top:8px}
.refs{font-size:12px;color:var(--label2);line-height:1.9;margin:0;padding-left:18px}
.refs li::marker{color:var(--label3)}
[contenteditable]{cursor:text}
[contenteditable]:focus{box-shadow:0 0 0 2px var(--accentTint);border-radius:4px}

/* Cornell */
.cornell{display:grid;grid-template-columns:170px 1fr;border-top:1px solid var(--sep);margin:6px 0 18px}
.cornell .cue{border-right:1px solid var(--sep);padding:10px 12px 10px 0;font-size:12.5px;line-height:1.6;color:var(--label2)}
.cornell .cue div{margin-bottom:12px;font-weight:500}
.cornell .cue div::before{content:"Q ";color:var(--ai);font-weight:700}
.cornell .body{padding:10px 0 4px 16px}
.cornell .sum{grid-column:1/3;border-top:1px solid var(--sep);padding:10px 0;font-size:13.5px;line-height:1.7}
.cornell .sum b{font-size:11px;color:var(--label3);display:block;margin-bottom:2px}

/* TOC */
#toc{position:absolute;right:14px;top:62px;width:150px;font-size:11.5px;z-index:3}
#toc .th{font-size:10.5px;font-weight:600;color:var(--label3);margin-bottom:6px}
#toc a{display:block;color:var(--label2);padding:3px 0 3px 8px;border-left:2px solid var(--sep);text-decoration:none;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toc a:hover{color:var(--label)}
#toc a.on{color:var(--accent);border-left-color:var(--accent)}
.notoc #toc{display:none}
.quote .qt.lit{color:var(--label);border-radius:2px}

/* Banner */
.banner{margin:12px auto 0;max-width:600px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--okTint);font-size:12.5px}
.banner .i{color:var(--ok)}
.banner b{font-weight:600}
.diffbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);font-size:12.5px}
.lock{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--label3);margin-left:6px}

/* Block menu, popovers */
.pop{position:fixed;z-index:80;min-width:200px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);border-radius:10px;padding:5px;box-shadow:0 0 0 .5px var(--hair),var(--popShadow);display:none}
.pop.on{display:block;animation:fadein .12s}
@keyframes fadein{from{opacity:0;transform:translateY(-3px)}}
.pop .mi{height:26px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:6px;font-size:13px;white-space:nowrap}
.pop .mi .i{color:var(--icon)}
.pop .mi:hover:not(.dis){background:var(--accent);color:#fff}
.pop .mi:hover:not(.dis) .i,.pop .mi:hover:not(.dis) .kbd{color:#fff}
.pop .mi.dis{color:var(--label3)}
.pop .msep{height:.5px;background:var(--sep);margin:4px 8px}
.pop .mh{font-size:11px;color:var(--label3);padding:4px 10px 2px}
.pop .why{font-size:11px;color:var(--label3);padding:0 10px 4px 34px;max-width:260px;line-height:1.4;white-space:normal}
.cov{width:340px;padding:10px}
.cov .row{display:flex;gap:8px;align-items:flex-start;padding:6px 6px;border-radius:7px;font-size:12px;line-height:1.5}
.cov .row:hover{background:var(--hover)}
.cov .row .bar{width:3px;align-self:stretch;border-radius:2px;flex:none}
.cov .row .t{font-family:var(--serif);flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cov .row .w{font-size:10.5px;color:var(--label3);white-space:nowrap}

/* ---------- Sheets ---------- */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:50;display:none;align-items:flex-start;justify-content:center;padding-top:52px}
.dark #scrim{background:rgba(0,0,0,.4)}
#scrim.on{display:flex}
.sheet{background:var(--win);border-radius:16px;box-shadow:0 0 0 .5px var(--hair),0 24px 70px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:calc(100% - 70px);animation:sheetin .22s cubic-bezier(.2,0,0,1)}
.dark .sheet{background:#2A2A2C}
@keyframes sheetin{from{transform:translateY(-14px);opacity:0}}
.sh-h{padding:16px 20px 6px;display:flex;align-items:center;gap:8px}
.sh-h b{font-size:15px}
.sh-h .s{font-size:12px;color:var(--label2)}
.sh-b{padding:8px 20px 14px;overflow:auto;flex:1}
.sh-f{padding:12px 20px;border-top:.5px solid var(--sep);display:flex;align-items:center;gap:8px}
.sh-f .note{font-size:11.5px;color:var(--label2);display:flex;align-items:center;gap:6px;line-height:1.4}
.frow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:.5px solid var(--sep)}
.frow:last-child{border:0}
.frow>label{font-size:12.5px;color:var(--label2);padding-top:5px;text-align:right}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{height:28px;padding:0 11px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--sep);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.opt:hover{background:var(--hover)}
.opt.on{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accentTint);color:var(--accent);font-weight:500}
.opt.dis{opacity:.4;pointer-events:none}
.opt .c{font-size:11px;color:var(--label3);font-weight:400}
.opt.on .c{color:var(--accent)}
.help{font-size:11.5px;color:var(--label2);margin-top:6px;line-height:1.5}
.help.warn{color:#B25000}.dark .help.warn{color:#FFB340}
.help a{color:var(--accent);cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ocard{border-radius:10px;padding:10px;box-shadow:inset 0 0 0 1px var(--sep);font-size:12px;line-height:1.45;position:relative}
.ocard:hover{background:var(--hover)}
.ocard.on{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accentTint)}
.ocard.dis{opacity:.4;pointer-events:none}
.ocard b{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:3px}
.ocard .d{color:var(--label2);font-size:11.5px}
.ocard .ai{position:absolute;right:8px;top:9px}
.thumb{height:56px;border-radius:6px;background:var(--card);box-shadow:0 0 0 .5px var(--hair);margin-bottom:8px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.dark .thumb{background:#3A3A3C}
.thumb i{display:block;height:3px;border-radius:2px;background:var(--label3);opacity:.35}
.thumb i.h{height:4px;width:45%;opacity:.7;background:var(--label)}
.thumb i.q{background:var(--y);opacity:.8}
.thumb i.a{background:var(--ai);opacity:.55}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;cursor:default}
.sw{width:28px;height:16px;border-radius:8px;background:var(--fill);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--ok)}.sw.on::after{left:14px}
.toggle.dis{opacity:.4;pointer-events:none}
.range{display:flex;align-items:center;gap:10px;font-size:12.5px}
.range input{width:160px;accent-color:var(--accent)}
.privacy{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--label2);line-height:1.5;background:var(--fill4);border-radius:8px;padding:8px 10px;margin-top:10px}

/* Outline sheet */
.ol-sec{border-radius:12px;box-shadow:0 0 0 .5px var(--hair);background:var(--card);margin-bottom:8px;padding:8px 10px 10px}
.dark .ol-sec{background:#333336}
.ol-sec.over{box-shadow:0 0 0 2px var(--accent)}
.ol-sec.un{background:var(--fill4);box-shadow:inset 0 0 0 1px var(--sep);border:1px dashed transparent}
.ol-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ol-top .grip{color:var(--label3);cursor:grab}
.ol-top .n{color:var(--label3);font-weight:600;font-variant-numeric:tabular-nums;width:16px}
.ol-top input{flex:1;border:0;background:none;font-weight:600;font-size:13.5px;outline:none;padding:3px 4px;border-radius:5px}
.ol-top input:focus{background:var(--fill4)}
.ol-top .why{font-size:11px;color:var(--label3);white-space:nowrap}
.ol-chips{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;padding-left:22px}
.hchip{max-width:250px;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 7px;border-radius:7px;background:var(--fill4);box-shadow:inset 0 0 0 .5px var(--hair);font-family:var(--serif);font-size:12px;cursor:grab;white-space:nowrap;overflow:hidden}
.hchip .d{width:7px;height:7px;border-radius:4px;flex:none}
.hchip span{overflow:hidden;text-overflow:ellipsis}
.hchip.drag{opacity:.4}
.ol-empty{font-size:11.5px;color:var(--label3);padding:5px 0}

/* Generating */
.gen-wrap{display:grid;grid-template-columns:230px 1fr;gap:18px;min-height:380px}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:12.5px;color:var(--label3)}
.step .ico{width:16px;height:16px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center}
.step.done{color:var(--label)}.step.done .ico{color:var(--ok)}
.step.run{color:var(--label);background:var(--fill4);font-weight:500}
.step .sub{font-size:11px;color:var(--label2);font-weight:400;margin-top:2px}
.spin{width:12px;height:12px;border-radius:6px;border:2px solid var(--accentTint);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-prev{border-radius:10px;box-shadow:inset 0 0 0 .5px var(--hair);background:var(--page);padding:18px 22px;overflow:auto;max-height:440px}
.gen-prev .blk{animation:fadein .3s}
.caret{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite;border-radius:1px}
@keyframes blink{50%{opacity:0}}

/* Export sheet */
.ex-wrap{display:grid;grid-template-columns:280px 1fr;gap:18px;height:520px}
.ex-left{overflow:auto;padding-right:4px}
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.fmt{border-radius:10px;padding:8px 6px;text-align:center;font-size:11.5px;box-shadow:inset 0 0 0 1px var(--sep);color:var(--label2)}
.fmt:hover{background:var(--hover)}
.fmt.on{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accentTint);color:var(--accent);font-weight:600}
.fmt .ico{width:28px;height:28px;margin:0 auto 4px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.ex-sec{font-size:11px;font-weight:600;color:var(--label3);margin:12px 0 6px}
.ex-right{border-radius:12px;background:var(--reader);box-shadow:inset 0 0 0 .5px var(--hair);overflow:auto;position:relative}
pre.md{margin:0;padding:16px 18px;font-family:var(--mono);font-size:11.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--label)}
pre.md .h{color:var(--accent);font-weight:600}
pre.md .qq{color:#9A6700}.dark pre.md .qq{color:#E3B341}
pre.md .ai{color:var(--ai)}
pre.md .fm{color:var(--label3)}
.ppage{width:420px;margin:18px auto;background:#fff;color:#1D1D1F;box-shadow:0 2px 12px rgba(0,0,0,.12);padding:34px 38px;font-size:9.5px;line-height:1.6;border-radius:2px}
.ppage h1{font-size:15px;margin:0 0 4px}
.ppage .m{color:#8E8E93;font-size:8px;margin-bottom:10px}
.ppage h2{font-size:11px;margin:14px 0 5px}
.ppage .q{font-family:var(--serif);border-left:2px solid #FFCC00;padding-left:8px;margin:5px 0;color:#3A3A3C}
.ppage .q small{display:block;color:#8E8E93;font-family:var(--sans);font-size:7.5px}
.ppage .o{background:#FFF8DB;padding:3px 6px;border-radius:3px;margin:3px 0 5px 10px}
.ppage .a{color:#3A3A3C}
.ppage .fn{font-size:7.5px;color:#8E8E93;border-top:.5px solid #ddd;margin-top:14px;padding-top:5px}
.ppage .pn{text-align:center;font-size:7.5px;color:#8E8E93;margin-top:12px}
.ex-tag{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:11px;color:var(--label2);background:var(--reader);border-bottom:.5px solid var(--sep);z-index:2}

/* Share */
.sh-wrap{display:grid;grid-template-columns:250px 1fr;gap:18px;height:540px}
.share-stage{border-radius:12px;background:var(--fill4);overflow:auto;display:flex;justify-content:center;padding:20px}
.lcard{width:330px;border-radius:14px;padding:26px 24px 20px;flex:none;align-self:flex-start;box-shadow:0 6px 24px rgba(0,0,0,.14)}
.lcard.t-paper{background:#FBF7EE;color:#2B2A27}
.lcard.t-plain{background:#FFFFFF;color:#1D1D1F}
.lcard.t-night{background:#1C1C1E;color:#F2F2F7}
.lcard .kick{font-size:10px;letter-spacing:.08em;opacity:.55;margin-bottom:8px}
.lcard h4{font-size:18px;margin:0 0 14px;line-height:1.35}
.lcard .lq{font-family:var(--serif);font-size:13.5px;line-height:1.8;margin:0 0 6px;position:relative;padding-left:12px}
.lcard .lq::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2.5px;border-radius:2px;background:currentColor;opacity:.25}
.lcard .ls{font-size:10px;opacity:.5;margin:0 0 12px 12px}
.lcard .lo{font-size:12px;line-height:1.65;border-radius:8px;padding:7px 10px;margin:0 0 14px;background:rgba(255,204,0,.16)}
.lcard .la{font-size:12px;line-height:1.7;opacity:.85;margin:0 0 14px}
.lcard .lsec{font-size:12px;font-weight:700;margin:16px 0 8px;opacity:.85}
.lcard .foot{display:flex;align-items:center;gap:8px;border-top:.5px solid currentColor;border-color:rgba(127,127,127,.25);padding-top:12px;margin-top:16px;font-size:10px;opacity:.6}
.lcard .foot img,.lcard .foot .logo{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#5E9CFF,#8E5BD8)}
.lcard.quote{padding:34px 28px 22px}
.lcard.quote .big{font-family:var(--serif);font-size:20px;line-height:1.7;margin:4px 0 14px}
.lcard.quote .mark{font-family:var(--serif);font-size:44px;line-height:.6;opacity:.25}

/* HUD */
#hud{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:none;align-items:center;gap:10px;height:34px;padding:0 6px 0 14px;border-radius:17px;
  background:rgba(40,40,42,.92);color:#fff;font-size:12.5px;box-shadow:0 8px 28px rgba(0,0,0,.25);white-space:nowrap}
#hud.on{display:flex;animation:fadeup3 .2s}
@keyframes fadeup3{from{opacity:0;transform:translate(-50%,6px)}}
#hud button{height:24px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:500}
#hud button:hover{background:rgba(255,255,255,.24)}
#hud.noact{padding-right:14px}

  box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 18px 50px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;color:#1D1D1F;z-index:100}

#demo .dh{padding:14px 16px 10px;border-bottom:.5px solid rgba(0,0,0,.08)}

#demo .dh .s{font-size:11.5px;opacity:.65;margin-top:3px;line-height:1.45}
#demo .dl{flex:1;overflow:auto;padding:8px}
#demo .grp{font-size:11px;font-weight:600;opacity:.55;margin:10px 8px 4px}
.sc-btn{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:8px;font-size:12.5px;line-height:1.35}
.sc-btn:hover{background:rgba(120,120,128,.12)}
.sc-btn.on{background:#007AFF;color:#fff}
.sc-btn .n{display:inline-block;width:22px;opacity:.6;font-variant-numeric:tabular-nums}
#notes{border-top:.5px solid rgba(0,0,0,.08);padding:12px 16px;font-size:12px;line-height:1.55;max-height:46%;overflow:auto}
body.dark #notes{border-color:rgba(255,255,255,.08)}
#notes h4{margin:0 0 6px;font-size:12.5px}
#notes ul{margin:4px 0 8px;padding-left:16px}
#notes li{margin-bottom:3px}
#notes .lab{font-size:11px;font-weight:600;opacity:.6;margin-top:8px}
#demo .df{display:flex;gap:6px;padding:10px 12px;border-top:.5px solid rgba(0,0,0,.08);flex-wrap:wrap}

#demo .df button{flex:1;height:28px;border-radius:8px;background:rgba(120,120,128,.14);font-size:12px;min-width:80px}
#demo .df button:hover{background:rgba(120,120,128,.24)}
#demo .df button.on{background:#007AFF;color:#fff}

<script>
/* MarginMind 学习笔记原型。单文件、无依赖；资料与 AI 输出为演示数据。 */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ic = (n, cls = 'i s') => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const COLOR = { y: '#FFCC00', g: '#34C759', b: '#007AFF', p: '#FF2D55', o: '#FF9500', v: '#AF52DE' };

/* ---------- Demo documents: chapters → paragraphs; [id:color|text] marks a highlight ---------- */
const DOCS = {
  d1: { title: '认知天性', short: '认知天性', chapters: [

/* ---------- Incremental update ---------- */
function simulateNew() {
  for (const h of NEW_HLS) if (!S.hls.includes(h)) S.hls.push(h);
  S.newSince = [...NEW_HLS];
}
function previewUpdate() {
  /* AI places each new highlight into the most relevant section; edited paragraphs are locked. */
  const secFor = h => { const want = h === 'h10' ? ['s2', 'm2', 'c3'] : ['s3', 'm3', 'c4']; return S.note.secs.find(s => want.includes(s.id)) || S.note.secs[S.note.secs.length - 1]; };
  if (S.tpl === 'review') S.tpl = 'reading';
  S.pending = S.newSince.map(h => ({ h, sec: secFor(h).id, why: h === 'h10' ? '同样在讲复习间隔' : '同样在讲反馈' }));
  renderNote();
  document.querySelector('.blk.pending')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function applyUpdate() {
  for (const p of S.pending) { const s = S.note.secs.find(x => x.id === p.sec); if (s && !s.refs.includes(p.h)) s.refs.push(p.h); if (!S.note.scope.includes(p.h)) S.note.scope.push(p.h); }
  const added = S.pending.map(p => p.h); S.pending = null; S.newSince = [];
  render();
  added.forEach(h => { const b = document.querySelector(`#noteDoc [data-ref="${h}"]`); if (b) b.classList.add('hlnew'); });
  document.querySelector(`#noteDoc [data-ref="${added[0]}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
  hud(`已更新 · 新增 ${added.length} 条，你改过的段落保持不变`);
}

/* ---------- Actions ---------- */
function act(a, el, e) {
  switch (a) {
    case 'newNote': S.setup.scope = S.right === 'anno' && S.sel.size && S.sel.size < S.hls.length ? 'sel' : 'all'; S.outline = null; S.unassigned = []; openSheet('setup'); break;
    case 'fromSel': S.setup.scope = 'sel'; S.outline = null; S.unassigned = []; openSheet('setup'); break;
    case 'selAll': { const vis = S.hls.filter(h => !S.colorOff.has(HL[h].c)); const all = vis.every(h => S.sel.has(h)); vis.forEach(h => all ? S.sel.delete(h) : S.sel.add(h)); renderAnno(); break; }
    case 'openNote': S.right = 'note'; render(); break;
    case 'toggleReader': S.readerOpen = !S.readerOpen; renderReader(); setTimeout(() => S.right === 'note' && keepScroll(renderNote), 280); break;
    case 'close': closeSheet(); break;
    case 'settings': hud('原型：打开 设置 › 助手'); break;
    case 'fixRefs': S.setup.fixRefs = !S.setup.fixRefs; sheetSetup(); break;
    case 'toOutline': S.outline = null; S.unassigned = []; openSheet('outline'); break;
    case 'backSetup': openSheet('setup'); break;
    case 'addSec': S.outline.push({ id: 'u' + Date.now(), title: '新的一节', refs: [], why: '' }); sheetOutline(); setTimeout(() => { const ins = document.querySelectorAll('[data-rename]'); ins[ins.length - 1]?.select(); }, 0); break;
    case 'generate': if (S.sheet === 'setup') { S.outline = null; S.unassigned = []; } S.edits = {}; S.deleted = new Set(); S.alts = {}; startGenerate(); break;
    case 'stopGen': finishGen(true); break;
    case 'export': S.ex.fmt = S.ex.fmt === 'img' ? 'md' : S.ex.fmt; openSheet('export'); break;
    case 'share': openSheet('share'); break;
    case 'copyMd': navigator.clipboard?.writeText(mdFor(S.ex.fmt === 'obsidian' ? 'obsidian' : 'md')).catch(() => {}); hud(S.ex.fmt === 'rich' ? '已拷贝，可直接粘贴到飞书、Notion、备忘录' : '已拷贝 Markdown'); break;
    case 'doExport': if (S.ex.fmt === 'md' || S.ex.fmt === 'obsidian') download(S.note.title + '.md', mdFor(S.ex.fmt)); closeSheet(); hud(S.ex.fmt === 'md' || S.ex.fmt === 'obsidian' ? '已导出（原型会真实下载 .md）' : `已导出 ${S.ex.fmt.toUpperCase()}（原型示意）`, '在访达中显示', () => hud('原型：在访达中显示')); break;
    case 'copyImg': hud('已拷贝图片'); break;
    case 'saveImg': closeSheet(); hud('已存储到“下载”（原型示意）'); break;
    case 'marks': S.marks = !S.marks; keepScroll(renderNote); break;
    case 'coverage': coveragePop(e); break;
    case 'tplMenu': tplMenu(e); break;
    case 'tocMenu': { const r = e.currentTarget.getBoundingClientRect(); const p = openPop(S.note.secs.map((s, i) => `<div class="mi" data-g2="${s.id}">${i + 1}. ${esc(s.title)}</div>`).join(''), r.left, r.bottom + 4);
      p.querySelectorAll('[data-g2]').forEach(m => m.onclick = () => { closePop(); document.getElementById('sec-' + m.dataset.g2)?.scrollIntoView({ behavior: 'smooth' }); }); break; }
    case 'regen': S.outline = S.note.secs.map(s => ({ ...s, refs: [...s.refs] })); startGenerate(S.note.title); break;
    case 'preview': previewUpdate(); break;
    case 'applyUpd': applyUpdate(); break;
    case 'cancelUpd': S.pending = null; renderNote(); break;
    case 'dismissNew': S.newSince = []; render(); hud('之后可以在“重新整理”里加入'); break;
    case 'addReview': hud(`已加入复习 · ${S.note.secs.filter(secMeta).length} 张卡片，今天就会出现`); break;
    case 'addOne': hud('已加入复习'); break;
  }
}
document.addEventListener('click', e => {

document.addEventListener('keydown', e => {

    notes: `<h4>直接拿来复习</h4><ul><li>问题在前、答案（原文）遮住，点一下显示。</li><li>“加入复习”生成 FSRS 卡片，题面是问题，答案是原文并带出处。</li></ul>` },
  { g: '持续更新', n: '新划线：增量更新', set() { quickNote(); simulateNew(); render(); },
    notes: `<h4>笔记跟着阅读长大</h4><ul><li>整理之后又划了线，笔记顶部提示“又划了 2 条”，侧栏笔记显示角标。</li><li>“预览更新”：AI 把每条放进最相关的一节（绿色），并说明理由；不重写整篇。</li><li><b>你改过的段落永远不会被覆盖</b>，带锁标记。</li><li>“忽略”后可以在“重新整理”中再加入。</li></ul><div class="lab">试试</div><ul><li>先改一段 AI 文字，再点“预览更新”→“应用更新”。</li></ul>` },
  { g: '导出与分享', n: '导出：Markdown / Obsidian', set() { quickNote(); S.ex.fmt = 'obsidian'; openSheet('export'); },
    notes: `<h4>导出给其他工具</h4><ul><li>Markdown：通用格式；Obsidian：frontmatter、callout、页码链接、Spaced Repetition 复习题格式。</li><li>出处：跟在原文后 / 脚注 / 不标。</li><li>可以去掉批注、AI 内容、复习题；AI 内容可标注或不标。</li><li>右侧预览就是实际文件内容。“导出”会真实下载 .md。</li></ul>` },
  { g: '导出与分享', n: '导出：PDF / Word', set() { quickNote(); S.ex.fmt = 'pdf'; S.ex.cite = 'foot'; openSheet('export'); },
    notes: `<h4>打印和提交</h4><ul><li>PDF：A4，原文宋体，左侧色条为划线颜色；Word：引用样式与原生脚注，方便继续修改或交作业。</li><li>“复制为富文本”直接粘贴到飞书、Notion、备忘录。</li></ul>` },
  { g: '导出与分享', n: '分享长图', set() { quickNote(); openSheet('share'); },
    notes: `<h4>分享给别人看</h4><ul><li>三种内容：一句金句 / 一节 / 整篇摘要；三种主题：纸张、简洁、夜读。</li><li>可隐藏我的批注、AI 小结。</li><li>只包含所选内容，本机生成，不上传。</li></ul><div class="lab">待确认</div><ul><li>是否在长图底部加二维码或链接？建议不加，保持本地优先。</li></ul>` },
];
function quickNote() {
  S.setup.scope = 'all'; S.sel = new Set(BASE_HLS); S.outline = null; S.unassigned = [];
  S.note = buildNote(); S.tpl = S.setup.tpl; S.right = 'note'; S.sheet = null; render();
}
let cur = 0;
function syncEnv() {
  document.body.classList.toggle('dark', env.dark); $('#win').classList.toggle('dark', env.dark); $('#pop').classList.toggle('dark', env.dark);
  $('#aiBtn').textContent = env.ai ? 'AI 已配置' : '未配置 AI'; $('#aiBtn').classList.toggle('on', !env.ai);
  $('#darkBtn').classList.toggle('on', env.dark); $('#narrowBtn').classList.toggle('on', env.narrow);
  $('#win').style.maxWidth = env.narrow ? '980px' : '';
}
function go(i) {
  cur = i; clearInterval(genTimer); closePop();
  S = fresh();
  if (!env.ai) { S.setup.depth = 'none'; S.setup.org = 'source'; }
  syncEnv(); render(); SCENES[i].set();
  if (!env.ai) { S.setup.depth = 'none'; }
  $('#notes').innerHTML = SCENES[i].notes;
  document.querySelectorAll('.sc-btn').forEach((b, j) => b.classList.toggle('on', j === i));
}
let lastG = '';
$('#scList').innerHTML = SCENES.map((s, i) => { const h = s.g !== lastG ? `<div class="grp">${s.g}</div>` : ''; lastG = s.g; return h + `<button class="sc-btn" data-i="${i}"><span class="n">${String(i + 1).padStart(2, '0')}</span>${s.n}</button>`; }).join('');
document.querySelectorAll('.sc-btn').forEach(b => b.onclick = () => { if (+b.dataset.i === 2) env.ai = false; else if (cur === 2) env.ai = true; go(+b.dataset.i); });
$('#darkBtn').onclick = () => { env.dark = !env.dark; syncEnv(); if (S.sheet) renderSheet(); };
$('#narrowBtn').onclick = () => { env.narrow = !env.narrow; syncEnv(); if (S.right === 'note') keepScroll(renderNote); };
$('#aiBtn').onclick = () => { env.ai = !env.ai; syncEnv(); if (!env.ai) { S.setup.depth = 'none'; if (S.setup.org === 'theme') S.setup.org = 'source'; } else { S.setup.depth = 'deep'; S.setup.org = 'theme'; }
  if (S.note) S.note = { ...buildNote(), title: S.note.title };
  render(); };
$('#resetBtn').onclick = () => go(cur);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => S.right === 'note' && !S.sheet && keepScroll(renderNote), 150); });
go(0);
</script>
</body>
