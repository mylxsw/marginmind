<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarginMind 四期 · 更多文档类型（EPUB / MOBI / Markdown / 网页）· 高保真交互原型</title>
<style>
/* Tokens mirror packages/mm_design (MMColors / MMTypography / MMRadii) and phase-3 prototypes. */
:root{
  --win:#FFFFFF; --sidebar:rgba(242,242,246,.86); --reader:#EDEDF0; --canvas:#FBFBFD; --card:#FFFFFF; --page:#FFFFFF;
  --label:#1D1D1F; --label2:#636366; --label3:#8E8E93; --icon:#6E6E73; --sep:rgba(0,0,0,.09); --fill:rgba(120,120,128,.12); --fill4:rgba(120,120,128,.08);
  --sel:rgba(0,0,0,.075); --hover:rgba(0,0,0,.045); --pressed:rgba(0,0,0,.09);
  --accent:#007AFF; --accentTint:rgba(0,122,255,.12); --onAccent:#fff;
  --glass:rgba(255,255,255,.80); --hair:rgba(0,0,0,.08); --line:rgba(60,60,67,.24); --excerpt:#3A3A3C;
  --root:#1D1D1F; --onRoot:#fff; --scrim:rgba(0,0,0,.18);
  --cardShadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --sheetShadow:0 24px 60px rgba(0,0,0,.25);
  --agent:#5E5CE6; --agentTint:rgba(94,92,230,.10);
  --ok:#28A745; --warn:#C27C0E; --err:#D70015;
  --y:#FFCC00; --g:#34C759; --b:#007AFF; --p:#FF2D55;
  --fPdf:#E5484D; --fEpub:#30A46C; --fMobi:#F76B15; --fMd:#6E6E73; --fWeb:#0A84FF;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  --mono:"SF Mono",Menlo,monospace;
}
.dark{
  --win:#1E1E1F; --sidebar:rgba(44,44,47,.86); --reader:#262628; --canvas:#1C1C1E; --card:#2C2C2E;
  --label:#F5F5F7; --label2:#AEAEB2; --label3:#8E8E93; --icon:#AEAEB2; --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.24); --fill4:rgba(118,118,128,.14);
  --sel:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06); --pressed:rgba(255,255,255,.12);
  --accent:#0A84FF; --accentTint:rgba(10,132,255,.20);
  --glass:rgba(50,50,53,.82); --hair:rgba(0,0,0,.5); --line:rgba(235,235,245,.22); --excerpt:#D1D1D6;
  --root:#F5F5F7; --onRoot:#1D1D1F; --scrim:rgba(0,0,0,.35);
  --cardShadow:0 2px 10px rgba(0,0,0,.35); --sheetShadow:0 24px 60px rgba(0,0,0,.55);
  --agent:#7D7AFF; --agentTint:rgba(125,122,255,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--sans);font-size:13px;color:var(--label);-webkit-font-smoothing:antialiased}
body{background:linear-gradient(135deg,#c9d6e8 0%,#e6dcef 50%,#f1e2d6 100%);overflow:hidden}
body.dark{background:linear-gradient(135deg,#1b2333 0%,#2a2333 50%,#33281f 100%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:14px;height:14px}.i.xs{width:12px;height:12px}.i.l{width:20px;height:20px}.i.xl{width:28px;height:28px}

#desk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px 318px 18px 18px;transition:padding 260ms}
body.demo-min #desk{padding-right:58px}
#win{position:relative;width:100%;max-width:1480px;height:100%;max-height:920px;background:var(--win);border-radius:24px;overflow:hidden;
  box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 30px 80px rgba(0,0,0,.28);display:flex}

/* ---------- Sidebar ---------- */
#side{position:relative;z-index:3;width:244px;flex:none;margin:8px 0 8px 8px;border-radius:16px;background:var(--sidebar);
  backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair),0 6px 24px rgba(0,0,0,.06);
  display:flex;flex-direction:column;padding:10px 8px;gap:2px;overflow:hidden}
.lights{display:flex;gap:8px;height:28px;align-items:center;padding:0 6px}
.lights span{width:12px;height:12px;border-radius:6px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.side-set{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:8px;font-weight:600}
.side-set .ic{width:22px;height:22px;border-radius:6px;background:linear-gradient(180deg,#5E9BFF,#2D6FE0);color:#fff;display:flex;align-items:center;justify-content:center}
.side-search{display:flex;align-items:center;gap:6px;height:28px;margin:4px 2px 6px;padding:0 8px;border-radius:8px;background:var(--fill4);color:var(--label2)}
.sec{font-size:11px;font-weight:600;color:var(--label2);padding:10px 8px 4px;display:flex;align-items:center;gap:4px}
.sec .grow{flex:1}
.sec .add{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--icon)}
.sec .add:hover,.sec .add.on{background:var(--pressed);color:var(--label)}
.row{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 8px;border-radius:8px;white-space:nowrap;overflow:hidden}
.row:hover{background:var(--hover)}.row.on{background:var(--sel)}
.row .ri{color:var(--accent);flex:none}.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row.new{animation:rowin 1.8s}
@keyframes rowin{0%,30%{background:var(--accentTint)}}
.count{font-size:11px;color:var(--label2);font-variant-numeric:tabular-nums}
.fbadge{flex:none;width:30px;height:16px;border-radius:4px;font-size:8.5px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;color:#fff}
.fbadge.pdf{background:var(--fPdf)}.fbadge.epub{background:var(--fEpub)}.fbadge.mobi{background:var(--fMobi)}.fbadge.md{background:var(--fMd)}.fbadge.web{background:var(--fWeb)}
.fbadge.web svg{width:11px;height:11px;stroke:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:9px;font-size:10.5px;font-weight:500;background:var(--fill);color:var(--label2);white-space:nowrap}
.pill.ok{background:rgba(52,199,89,.14);color:#1f8a3b}.dark .pill.ok{color:#4cd964}
.pill.warn{background:rgba(255,149,0,.15);color:#b86200}.dark .pill.warn{color:#ffb340}
.pill.err{background:rgba(255,59,48,.12);color:#c4161c}.dark .pill.err{color:#ff6961}
.pill.acc{background:var(--accentTint);color:var(--accent)}
.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Main ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.toolbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;position:relative;z-index:4}
.tb-title{min-width:0;margin-right:auto;display:flex;flex-direction:column;line-height:1.2}
.tb-title b{font-size:13px;font-weight:600}
.tb-title span{font-size:11px;color:var(--label2)}
.capsule{display:flex;align-items:center;height:34px;padding:2px;border-radius:17px;background:var(--glass);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px var(--hair)}
.tbtn{position:relative;height:28px;min-width:28px;padding:0 6px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--icon)}
.tbtn:hover{background:var(--hover)}.tbtn:active{background:var(--pressed)}
.tbtn.on{background:var(--accentTint);color:var(--accent)}
.tbtn[disabled]{opacity:.35;pointer-events:none}
.tbtn .lbl{font-size:12px}
.tdiv{width:1px;height:16px;background:var(--sep);margin:0 3px}
.seg{display:flex;height:30px;padding:2px;border-radius:15px;background:var(--fill4)}
.seg button{height:26px;padding:0 10px;border-radius:13px;font-size:12px;color:var(--label2);display:flex;align-items:center;gap:4px}
.seg button.on{background:var(--card);color:var(--label);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 .5px var(--hair)}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);padding:3px 7px;border-radius:5px;background:rgba(40,40,42,.92);color:#fff;font-size:11px;white-space:nowrap;pointer-events:none;z-index:50;font-weight:400}

#content{flex:1;min-height:0;display:flex;position:relative;margin:0 8px 8px 8px}
.pane{position:relative;min-width:0;border-radius:14px;overflow:hidden}
#reader{flex:1.15;background:var(--reader);display:flex;flex-direction:column}
#map{flex:1;background:var(--canvas);box-shadow:inset 0 0 0 .5px var(--sep)}
.vdiv{width:8px;flex:none}
.pane.hide{display:none}.vdiv.hide{display:none}

/* Reader pane bar */
.pane-bar{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;position:relative;z-index:6}
.pane-bar .ttl{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-right:auto;min-width:0}
.pane-bar .ttl span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-bar .capsule{height:34px}
.doc-tabs{display:flex;gap:4px;padding:0 8px 6px;flex:none;overflow:hidden}
.doc-tab{display:flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 8px;border-radius:8px;font-size:12px;color:var(--label2);max-width:220px;flex:none}
.doc-tab .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-tab .fbadge{width:26px;height:14px;font-size:8px}
.doc-tab .x{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;opacity:0}
.doc-tab:hover .x,.doc-tab.on .x{opacity:.7}.doc-tab .x:hover{background:var(--hover);opacity:1}
.doc-tab.on{background:var(--win);color:var(--label);box-shadow:0 0 0 .5px var(--hair)}
.doc-tab:hover:not(.on){background:var(--hover)}
.reader-body{flex:1;min-height:0;display:flex;position:relative}
.toc{width:200px;flex:none;padding:6px 6px 20px 8px;overflow:auto;border-right:1px solid var(--sep)}
.toc .th{font-size:11px;font-weight:600;color:var(--label2);padding:6px 8px}
.toc .ti{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:6px;font-size:12px;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc .ti.l2{padding-left:20px;color:var(--label2)}.toc .ti.l3{padding-left:32px;color:var(--label2)}
.toc .ti:hover{background:var(--hover)}.toc .ti.on{background:var(--sel);font-weight:500}
.toc .ti .pg{float:right;color:var(--label3);font-size:11px;font-variant-numeric:tabular-nums}
.reader-scroll{flex:1;overflow:auto;position:relative;padding:14px 0 90px}

/* Paginated (PDF / typeset rendition) pages */
.page{position:relative;margin:0 auto;background:var(--page);color:#1d1d1f;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06);
  width:min(var(--pw,540px),calc(100% - 28px));padding:var(--pp,54px 56px 60px);transition:width 200ms}
.page + .page{margin-top:16px}
.page .run-head{font-size:10px;color:#8e8e93;display:flex;justify-content:space-between;margin-bottom:24px;font-family:var(--sans)}
.page h2{font-family:var(--serif);font-size:calc(var(--fs,14.5px) + 6px);font-weight:600;margin:0 0 6px}
.page h3{font-family:var(--serif);font-size:calc(var(--fs,14.5px) + 1px);font-weight:600;margin:20px 0 10px}
.page p{font-family:var(--pfont,var(--serif));font-size:var(--fs,14.5px);line-height:var(--lh,2);margin:0 0 10px;text-align:justify;text-indent:2em}
.page .byline{font-family:var(--sans);font-size:11px;color:#8e8e93;margin:0 0 18px;text-indent:0}
.page .fig{margin:12px 0 14px;border-radius:6px;height:120px;background:linear-gradient(135deg,#dfe8f5,#efe4f2);display:flex;align-items:center;justify-content:center;color:#7a7f8c;font-size:11px;font-family:var(--sans)}
.page .pno{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:10px;color:#8e8e93;font-family:var(--sans)}
.page ::selection,.mdoc ::selection{background:rgba(0,122,255,.28)}
.hl{border-radius:2px;cursor:pointer}
.hl.y{background:rgba(255,204,0,.38)}.hl.g{background:rgba(52,199,89,.30)}.hl.b{background:rgba(0,122,255,.24)}.hl.p{background:rgba(255,45,85,.24)}
.hl.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px rgba(0,122,255,.45)}100%{box-shadow:0 0 0 0 rgba(0,122,255,0)}}
.ul{text-decoration:underline;text-decoration-color:#FF9500;text-decoration-thickness:2px;text-underline-offset:4px}
.retypeset .page{animation:retype 500ms}
@keyframes retype{from{opacity:.25;filter:blur(1.5px)}}

/* Source strip (rendition provenance) */
.src-strip{width:min(var(--pw,540px),calc(100% - 28px));margin:0 auto 12px;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;border-radius:10px;background:var(--win);box-shadow:0 0 0 .5px var(--hair);font-size:12px;color:var(--label2)}
.src-strip b{color:var(--label);font-weight:500}
.src-strip .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbtn{height:24px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--accent);white-space:nowrap}
.lbtn:hover{background:var(--accentTint)}

/* Markdown (native render, read-only) */
.mdoc{max-width:680px;margin:0 auto;padding:36px 48px 60px;background:var(--win);border-radius:10px;box-shadow:0 0 0 .5px var(--hair);color:var(--label);line-height:1.75;font-size:14.5px}
.mdoc h1{font-size:26px;line-height:1.3;margin:0 0 6px;font-weight:700}
.mdoc h2{font-size:19px;margin:28px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--sep)}
.mdoc h3{font-size:15.5px;margin:20px 0 6px}
.mdoc p{margin:0 0 12px}
.mdoc a{color:var(--accent);text-decoration:none}.mdoc a:hover{text-decoration:underline}
.mdoc blockquote{margin:0 0 12px;padding:2px 14px;border-left:3px solid var(--line);color:var(--label2)}
.mdoc code{font-family:var(--mono);font-size:12.5px;padding:1px 5px;border-radius:4px;background:var(--fill4)}
.mdoc pre{background:var(--fill4);border-radius:8px;padding:12px 14px;overflow:auto;margin:0 0 14px}
.mdoc pre code{background:none;padding:0;font-size:12px;line-height:1.6}
.mdoc table{border-collapse:collapse;margin:0 0 14px;font-size:13px;width:100%}
.mdoc th,.mdoc td{border:1px solid var(--sep);padding:6px 10px;text-align:left}.mdoc th{background:var(--fill4);font-weight:600}
.mdoc ul,.mdoc ol{margin:0 0 12px;padding-left:22px}.mdoc li{margin:2px 0}
.mdoc .task{list-style:none;margin-left:-20px}.mdoc .task input{margin-right:6px;vertical-align:-1px}
.mdoc .img{border-radius:8px;height:150px;background:linear-gradient(135deg,#d9e6f7,#f2e3ea);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#6b7280;font-size:11.5px;margin:4px 0 14px}
.mdoc .img.remote{background:var(--fill4);color:var(--label2);border:1px dashed var(--line)}
.mdoc .meta{font-size:12px;color:var(--label2);margin-bottom:22px}

/* Browser (in-app) */
.bbar{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--reader);position:relative;z-index:6}
.url{flex:1;min-width:0;height:30px;border-radius:9px;background:var(--win);box-shadow:0 0 0 .5px var(--hair);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--label2);font-size:12.5px}
.url input{flex:1;min-width:0;border:0;outline:none;background:none;color:var(--label)}
.url .lock{color:var(--label3)}
.bprog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);border-radius:1px;transition:width 200ms;z-index:7}
.btn{height:28px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  background:var(--card);box-shadow:0 0 0 .5px var(--hair),0 1px 1.5px rgba(0,0,0,.08)}
.btn:hover{filter:brightness(.97)}.btn:active{filter:brightness(.93)}
.btn.pri{background:var(--accent);color:#fff;box-shadow:none}
.btn.pri[disabled],.btn[disabled]{opacity:.4;pointer-events:none}
.btn.ghost{background:none;box-shadow:none;color:var(--accent)}.btn.ghost:hover{background:var(--accentTint)}
.btn.sm{height:24px;padding:0 9px;font-size:12px}
.btn.ready{animation:ready 1.4s ease-in-out 2}
@keyframes ready{50%{box-shadow:0 0 0 5px rgba(0,122,255,.22)}}
.webview{position:relative;flex:1;overflow:auto;background:#fff;color:#111;margin:0 8px 8px;border-radius:10px;box-shadow:0 0 0 .5px var(--hair)}
.webview .site-nav{height:52px;display:flex;align-items:center;gap:20px;padding:0 28px;border-bottom:1px solid #eee;font-size:13px;color:#555;position:sticky;top:0;background:#fff;z-index:2}
.webview .site-nav b{font-size:16px;color:#111;margin-right:auto;letter-spacing:-.01em}
.webview .site-nav .sub{height:30px;padding:0 12px;border-radius:15px;background:#111;color:#fff;display:flex;align-items:center;font-size:12px}
.webview .wrap{display:flex;gap:36px;padding:34px 40px 60px;max-width:980px;margin:0 auto}
.webview article{flex:1;min-width:0;font-family:Georgia,var(--serif);font-size:16px;line-height:1.8}
.webview article h1{font-family:var(--sans);font-size:30px;line-height:1.25;margin:6px 0 10px;letter-spacing:-.01em}
.webview article .kick{font-family:var(--sans);font-size:12px;color:#c2410c;font-weight:600;letter-spacing:.06em}
.webview article .by{font-family:var(--sans);font-size:13px;color:#666;margin-bottom:22px;display:flex;align-items:center;gap:8px}
.webview article .by i{width:26px;height:26px;border-radius:13px;background:linear-gradient(135deg,#fbbf24,#f97316);display:block}
.webview article .hero{height:200px;border-radius:10px;background:linear-gradient(135deg,#bfdbfe,#fbcfe8 60%,#fde68a);margin:0 0 22px;display:flex;align-items:flex-end;padding:10px;color:#475569;font:12px var(--sans)}
.webview article .hero.lazy{background:#f1f1f3;align-items:center;justify-content:center}
.webview article p{margin:0 0 16px}
.webview aside{width:230px;flex:none;font-size:12.5px;color:#555}
.webview aside .ad{height:250px;border-radius:8px;background:repeating-linear-gradient(45deg,#f4f4f5 0 10px,#fafafa 10px 20px);display:flex;align-items:center;justify-content:center;color:#a1a1aa;font-size:11px;margin-bottom:16px}
.webview aside h5{margin:0 0 8px;font-size:12px;color:#111}
.webview aside li{margin-bottom:6px}
.webview .cookie{position:sticky;bottom:12px;margin:0 auto;width:calc(100% - 40px);max-width:720px;border-radius:12px;background:#111;color:#eee;padding:12px 14px;font:12.5px var(--sans);display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.webview .cookie button{background:#fff;color:#111;border-radius:6px;padding:5px 10px;font-weight:600}
.webview .skel{padding:40px}
.webview .skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#f0f0f2,#e6e6ea,#f0f0f2);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.web-err{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--label2);text-align:center;padding:40px}
.web-err .big{width:56px;height:56px;border-radius:16px;background:var(--fill4);display:flex;align-items:center;justify-content:center;color:var(--icon)}
.web-err b{font-size:15px;color:var(--label)}

/* Ready prompt (popover anchored at the convert button) */
.ready-pop{position:absolute;right:12px;top:48px;z-index:30;width:320px;border-radius:14px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);
  box-shadow:0 0 0 .5px var(--hair),0 12px 36px rgba(0,0,0,.18);padding:14px}
.ready-pop.anim{animation:fin 220ms cubic-bezier(.2,0,0,1)}
.ready-pop::before{content:"";position:absolute;top:-6px;right:58px;width:12px;height:12px;background:var(--glass);transform:rotate(45deg);box-shadow:-.5px -.5px 0 var(--hair)}
.ready-pop .h{display:flex;gap:10px;align-items:flex-start}
.ready-pop .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(52,199,89,.15);color:#1f8a3b}
.ready-pop .ic.w{background:rgba(255,149,0,.15);color:#b86200}
.ready-pop b{display:block;font-size:13px;margin-bottom:2px}
.ready-pop p{margin:0;font-size:12px;line-height:1.5;color:var(--label2)}
.ready-pop .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
@keyframes fin{from{opacity:0;transform:translateY(-4px)}}

/* Floating selection toolbar */
.ftb{position:absolute;z-index:20;display:flex;align-items:center;gap:1px;height:38px;padding:4px;border-radius:19px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair),0 6px 20px rgba(0,0,0,.14);animation:fin 140ms}
.cdot{width:14px;height:14px;border-radius:7px;margin:0 5px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.cdot:hover{transform:scale(1.15)}
.ftb .tbtn.agent{color:var(--agent)}
.ftb .tbtn.agent:hover{background:var(--agentTint)}
.ftb .tbtn.dis{opacity:.35}
.ftb .note{font-size:11px;color:var(--label2);padding:0 8px 0 4px;white-space:nowrap}
.kbd{font-size:10.5px;color:var(--label2);padding:0 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--sep);line-height:16px}

/* Popovers & menus */
.pop{position:absolute;z-index:40;border-radius:12px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair),0 12px 36px rgba(0,0,0,.18);padding:6px}
.pop.anim{animation:fin 140ms}
.menu{min-width:250px}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 8px;border-radius:7px}
.mi:hover{background:var(--accent);color:#fff}.mi:hover small,.mi:hover .kbd{color:rgba(255,255,255,.8);box-shadow:none}
.mi .tx{flex:1}.mi small{display:block;font-size:11px;color:var(--label2)}
.msep{height:1px;background:var(--sep);margin:5px 8px}
.typeset{width:300px;padding:12px}
.typeset .row2{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;gap:10px}
.typeset .lab{font-size:12px;color:var(--label2);flex:none}
.typeset .seg{height:28px}.typeset .seg button{height:24px;padding:0 9px;font-size:11.5px}
.typeset .hint{font-size:11.5px;color:var(--label2);line-height:1.5;padding:10px;border-radius:8px;background:var(--fill4);margin-bottom:12px}
.mdinfo{width:300px;padding:14px}
.mdinfo b{display:block;margin-bottom:4px}
.mdinfo p{margin:0 0 10px;font-size:12px;line-height:1.55;color:var(--label2)}
.mdinfo .caps{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;margin:0 0 12px}
.mdinfo .caps span{display:flex;align-items:center;gap:5px}
.mdinfo .caps .no{color:var(--label3)}

/* Sheets */
.scrim{position:absolute;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center}
.scrim.anim{animation:sfade 160ms}
@keyframes sfade{from{opacity:0}}
.sheet{margin-top:52px;width:480px;border-radius:14px;background:var(--win);box-shadow:var(--sheetShadow),0 0 0 .5px var(--hair);overflow:hidden}
.scrim.anim .sheet{animation:sin 240ms cubic-bezier(.2,0,0,1)}
@keyframes sin{from{transform:translateY(-14px);opacity:0}}
.sheet.wide{width:720px}
.sheet .sh{padding:18px 20px 4px}
.sheet .sh b{font-size:15px;display:block}
.sheet .sh p{margin:4px 0 0;color:var(--label2);font-size:12.5px;line-height:1.5}
.sheet .sb{padding:14px 20px}
.sheet .sf{display:flex;align-items:center;gap:8px;padding:12px 20px 16px}
.sheet .sf .grow{flex:1;font-size:12px;color:var(--label2)}
.field{display:flex;align-items:center;gap:8px;height:32px;border-radius:8px;padding:0 10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--sep)}
.field:focus-within{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--accentTint)}
.field input{flex:1;border:0;outline:none;background:none;min-width:0}
.field.err{box-shadow:inset 0 0 0 1px var(--err)}
.ferr{font-size:11.5px;color:var(--err);margin-top:6px;min-height:16px}
.flab{font-size:12px;color:var(--label2);margin:0 0 6px;font-weight:500}
.picker .pf{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.picker .pf:hover{background:var(--hover)}
.picker .pf .tx{flex:1}.picker .pf small{display:block;color:var(--label2);font-size:11px}
.steps{display:flex;flex-direction:column;gap:10px;margin:4px 0 6px}
.step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--label3)}
.step .si{width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.step.run{color:var(--label)}.step.run .si{box-shadow:none;color:var(--accent)}
.step.done{color:var(--label)}.step.done .si{background:var(--ok);box-shadow:none;color:#fff}
.step .d{margin-left:auto;font-size:11.5px;color:var(--label2);font-variant-numeric:tabular-nums}
.pbar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width 180ms}
.fileline{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--fill4);margin-bottom:14px}
.fileline .tx{flex:1;min-width:0}.fileline small{display:block;color:var(--label2);font-size:11.5px}
.err-ic{width:44px;height:44px;border-radius:12px;background:rgba(255,59,48,.12);color:var(--err);display:flex;align-items:center;justify-content:center;flex:none}
.conv{display:flex;gap:18px}
.conv .prev{width:230px;flex:none;height:300px;border-radius:10px;background:var(--reader);padding:12px;position:relative;overflow:hidden}
.conv .prev .pg{background:#fff;border-radius:3px;height:100%;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:14px 14px;overflow:hidden;color:#222;font-size:6.5px;line-height:1.65}
.conv .prev .pg h6{font-size:10px;margin:0 0 4px;font-family:var(--serif)}
.conv .prev .pg .ln{height:3px;border-radius:2px;background:#d4d4d8;margin:0 0 4px}
.conv .prev .pg .im{height:48px;border-radius:3px;background:linear-gradient(135deg,#bfdbfe,#fbcfe8 60%,#fde68a);margin:6px 0}
.conv .prev .pg .nav{height:10px;background:#f4f4f5;margin:-14px -14px 8px}
.conv .prev .pg .side{position:absolute;right:26px;top:50px;width:44px;height:90px;background:repeating-linear-gradient(45deg,#f4f4f5 0 4px,#fafafa 4px 8px);border-radius:3px}
.conv .prev .pg.mdp{font-family:var(--mono);font-size:7.5px;color:#444;white-space:pre-wrap;line-height:1.7}
.conv .prev .cap{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;font-size:11px;color:var(--label2);background:var(--glass);border-radius:6px;padding:3px}
.conv .opts{flex:1;min-width:0}
.fmt{display:flex;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--sep);margin-bottom:8px;align-items:flex-start}
.fmt:hover{background:var(--hover)}
.fmt.on{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accentTint)}
.fmt .rd{width:16px;height:16px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--line);flex:none;margin-top:1px}
.fmt.on .rd{box-shadow:inset 0 0 0 5px var(--accent)}
.fmt .tx{flex:1}.fmt .tx b{font-size:13px;font-weight:600}.fmt small{display:block;color:var(--label2);font-size:11.5px;line-height:1.45;margin-top:2px}
.fmt .tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.chk input{margin:0;accent-color:var(--accent)}

/* Drop overlay */
.drop{position:absolute;inset:8px;z-index:55;border-radius:18px;background:rgba(0,122,255,.08);box-shadow:inset 0 0 0 2px var(--accent);display:flex;align-items:center;justify-content:center;animation:sfade 160ms;backdrop-filter:blur(2px)}
.drop .box{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 34px;border-radius:16px;background:var(--glass);box-shadow:0 0 0 .5px var(--hair),0 12px 36px rgba(0,0,0,.15)}
.drop b{font-size:15px}
.drop .chips{display:flex;gap:6px}
.ghost-file{position:absolute;z-index:56;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.25);transform:rotate(-3deg);font-size:12px;pointer-events:none}

/* HUD / toast */
.hud{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;padding:9px 12px 9px 14px;border-radius:12px;
  background:var(--glass);backdrop-filter:blur(30px);box-shadow:0 0 0 .5px var(--hair),0 10px 30px rgba(0,0,0,.18);font-size:12.5px;white-space:nowrap}
.hud.anim{animation:hin 220ms cubic-bezier(.2,0,0,1)}
@keyframes hin{from{opacity:0;transform:translate(-50%,8px)}}
.hud .pbar{width:120px;margin:0}
.hud .ok{color:var(--ok)}

/* Mind map (simplified) */
.map-inner{position:absolute;inset:0;padding:60px 26px 26px;overflow:auto}
.mtree{display:flex;align-items:center;gap:30px;min-height:100%}
.mroot{background:var(--root);color:var(--onRoot);font-weight:600;font-size:14px;padding:9px 16px;border-radius:12px;white-space:nowrap;flex:none}
.mkids{display:flex;flex-direction:column;gap:12px;position:relative;padding-left:18px;border-left:1.5px solid var(--line)}
.mcard{position:relative;background:var(--card);border-radius:12px;box-shadow:var(--cardShadow);width:250px;padding:9px 12px 9px 18px}
.mcard::before{content:"";position:absolute;left:-19.5px;top:50%;width:19px;height:1.5px;background:var(--line)}
.mcard .bar{position:absolute;left:7px;top:9px;bottom:9px;width:3px;border-radius:2px}
.mcard .q{font-family:var(--serif);font-size:12.5px;line-height:19px;color:var(--excerpt);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:3}
.mcard .s{font-size:10.5px;color:var(--label2);margin-top:5px;display:flex;align-items:center;gap:5px}
.mcard .s .fbadge{width:24px;height:13px;font-size:7.5px}
.mcard.flash{animation:nflash 1.6s}
@keyframes nflash{0%,50%{box-shadow:0 0 0 3px rgba(0,122,255,.45),var(--cardShadow)}}
.map-bar{position:absolute;left:10px;right:10px;top:8px;display:flex;align-items:center;gap:6px;z-index:2}
.map-bar .t{font-weight:600;margin-right:auto;padding-left:4px}

/* ---------- Demo console (outside the product) ---------- */

  backdrop-filter:blur(20px);box-shadow:0 10px 40px rgba(0,0,0,.35);font-size:12px;transition:transform 260ms}

      <h3>2.3 注意力残留</h3>
      <p>当我们从任务 A 切换到任务 B 时，心智并不会干净地完成交接。<span class="hl y">注意力不是被“消耗”掉的，而是被“分配”出去的；每一次切换都会留下一段注意力残留。</span>这段残留会在接下来的几分钟内持续占用工作记忆。</p>

  if (d.fmt === 'web') return strip + `
    <div class="page"><div class="run-head"><span>blog.example.com</span><span>1 / 4</span></div>
      <h2>间隔重复为什么有效</h2>
      <p class="byline">林知遥 · 2026年10月12日 · 约 8 分钟</p>
      <div class="fig">图 · 遗忘曲线与复习节点（已保存到本地）</div>
      <h3>遗忘曲线</h3>
      <p>一百多年前，艾宾浩斯用无意义音节测量自己的遗忘速度。他发现，新学的内容在最初几个小时里遗忘得最快，之后逐渐放缓。<span class="hl b">每一次在“快要忘记”时成功回想，都会让下一次遗忘来得更慢。</span></p>
      <h3>提取练习</h3>
      <p>比起重读，主动回想更能巩固记忆。回想的过程本身就是一次学习：它迫使大脑重建线索，而不仅仅是再次识别。</p>
      <div class="pno">1</div></div>
    <div class="page"><p>这也是为什么卡片的“题面”很重要：一张好卡片只问一件事，答案可以在几秒内判断对错。</p><p>把复习间隔交给算法，你只需要诚实地评分。</p><div class="pno">2</div></div>`;
  if (d.fmt === 'mobi') return strip + `
    <div class="page"><div class="run-head"><span>原则</span><span>第二部分 生活原则</span></div>
      <h3>2.1 拥抱现实，应对现实</h3>
      <p>做事的第一步，是看清事情本来的样子，而不是你希望它成为的样子。<span class="hl o" style="background:rgba(255,149,0,.3)">痛苦加反思等于进步</span>——当你感到痛苦时，往往说明你正站在学习的边缘。</p>

      <div class="pno">101</div></div>`;

  return strip + `
    <div class="page"><div class="run-head"><span>慢下来的大脑</span><span>第一章 自动驾驶的心智</span></div>
      <h3>1.1 快思考从不请假</h3>
      <p>清晨醒来，你不需要思考就知道如何刷牙、如何系鞋带。大部分日常判断都由一套快速、自动、几乎不费力的系统完成。它擅长识别模式，也擅长在信息不足时给出一个“足够好”的答案。</p>
      <p><span class="hl g">当我们觉得一件事“显而易见”时，通常是快思考已经替我们回答了问题，而慢思考没有被叫醒。</span>这并不总是坏事：如果每个决定都要仔细推敲，我们会在日常琐事中耗尽精力。</p>

/* ===================================================================== *
 *  Interactions
 * ===================================================================== */
function setView(v){ S.view = v; render(); }
function openDoc(id){ S.cur = id; if(!S.tabs.includes(id)) S.tabs.push(id); S.sel=null; S.pop=null; render(); }
function closeTab(id){ S.tabs = S.tabs.filter(t=>t!==id); if (S.cur===id) S.cur = S.tabs[S.tabs.length-1] || (S.browser?'__browser':S.docs[0].id); render(); }
function focusBrowser(){ S.cur='__browser'; S.sel=null; render(); }
function anchorPos(el, dx=0, dy=6, width=300){ const r = el.getBoundingClientRect(), w = win.getBoundingClientRect();
  return {x: Math.max(12, Math.min(r.left - w.left + dx, w.width - width - 12)), y: r.bottom - w.top + dy}; }
function openAddMenu(el){ if (S.pop?.kind==='add'){S.pop=null;render();return;} const p = anchorPos(el,-8); S.pop = {kind:'add', ...p}; render(); }
function openTypeset(el){ if(!el) return; if (S.pop?.kind==='typeset'){S.pop=null;S.pending=null;render();return;} const p = anchorPos(el, -150); S.pending = {...S.typeset}; S.pop = {kind:'typeset', ...p}; render(); }
function openMdInfo(el){ if (S.pop?.kind==='mdinfo'){S.pop=null;render();return;} const p = anchorPos(el, -180); S.pop = {kind:'mdinfo', ...p}; render(); }
function pendTypeset(k,v){ S.pending[k]=v; render(); }
function closeSheet(){ clearTimers(); S.sheet=null; render(); }
function toast(text, ok=true, action=null, ms=2600){ S.hud = {text, ok, action}; render(); clearTimeout(toast.t); toast.t = setTimeout(()=>{ S.hud=null; render(); }, ms); }

let timers = [];
function later(fn, ms){ const t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; clearInterval(tick.t); }
function tick(fn, ms){ clearInterval(tick.t); tick.t = setInterval(fn, ms); }

document.addEventListener('click', (e)=>{
  if (S.pop && !e.target.closest('.pop')) { S.pop=null; S.pending=null; render(); }
});

/* Typeset */
function applyTypeset(){
  const d = doc(S.cur), next = S.pending; S.pop=null; S.pending=null;
  const chapters = d.fmt==='web' ? 1 : 12; let i = 0;
  S.hud = {text:`正在重新排版 · 第 1 / ${chapters} 章`, prog:0}; render();
  tick(()=>{ i++; const pr = Math.min(100, Math.round(i/14*100));
    S.hud = {text:`正在重新排版 · 第 ${Math.max(1,Math.ceil(pr/100*chapters))} / ${chapters} 章`, prog:pr, _shown:true};
    if (pr>=100){ clearInterval(tick.t); S.typeset = next; S._retype = true;
      const sz = SIZES.find(s=>s.k===next.size);
      if (d.fmt==='epub') d.sub = `EPUB · 排版为 ${sz.pages} 页`;
      S._keepScroll = true;
      toast(`已重新排版：共 ${d.fmt==='web'?4:sz.pages} 页 · ${S.hlCount[d.id]||0} 处标注全部对齐`);
      later(()=>{S._retype=false;},600);
    } else render();
  }, 110);
}

/* Imports */
function openPicker(){ S.pop=null; S.sheet={kind:'picker'}; render(); }
function importBook(fmt){
  clearTimers();
  const id = fmt==='mobi' ? 'azw' : 'epub';
  if (fmt==='epub') { S.docs = S.docs.filter(d=>d.id!=='epub'); S.tabs = S.tabs.filter(t=>t!=='epub'); }
  const total = fmt==='mobi'?4:3;
  S.sheet = {kind:'import', fmt, step:0, prog:0, chap:'', dismissable:false};
  render();
  let p = 0;
  tick(()=>{
    p += 2.2; const s = S.sheet; if (!s) return clearInterval(tick.t);
    s.prog = Math.min(100, p);
    const typesetStep = total-2;
    if (p < 14) s.step = 0;
    else if (fmt==='mobi' && p < 28) s.step = 1;
    else if (p < 90) { s.step = typesetStep; s.chap = `第 ${Math.min(12, Math.max(1, Math.ceil((p-28)/62*12)))} / 12 章`; }
    else if (p < 100) { s.step = total-1; s.chap = fmt==='mobi'?'316 页':'286 页'; }
    else {
      clearInterval(tick.t); s.step = total;
      const d = fmt==='mobi' ? {id:'azw', fmt:'mobi', title:'原则', sub:'AZW3 · 排版为 316 页'} : {id:'epub', fmt:'epub', title:'慢下来的大脑', sub:'EPUB · 排版为 286 页'};
      if (!doc(d.id)) S.docs.push(d);
      S.newDoc = d.id; S.sheet = null; S.typeset = {size:'m', page:'fit', font:'serif'};
      openDoc(d.id);
      toast(`已导入「${d.title}」· 共 ${fmt==='mobi'?316:286} 页，可以划线和摘录了`);
      return;
    }
    render();
  }, 90);
}
function cancelImport(){ clearTimers(); S.sheet=null; render(); toast('已取消导入，没有留下任何文件', false); }
function importDrm(){ S.sheet = {kind:'drm'}; render(); }
function importMd(){
  S.sheet = null;
  if (!doc('md')) S.docs.push({id:'md', fmt:'md', title:'读书会讨论提纲', sub:'Markdown · 仅阅读'});

/* Web */
function openAddWeb(url){ S.pop=null; S.sheet={kind:'addweb', url: url ?? 'https://blog.example.com/spaced-repetition', err:''}; render(); later(()=>{ const i=$('#urlIn'); if(i){i.focus();i.select();} },50); }
function normalizeUrl(v){
  v = (v||'').trim(); if (!v) return {err:'请输入网址'};
  if (!/^[a-z]+:\/\//i.test(v)) v = 'https://' + v;
  let u; try { u = new URL(v); } catch { return {err:'这不是一个有效的网址'}; }
  if (!['http:','https:'].includes(u.protocol)) return {err:'只支持 http 和 https 网页'};
  if (!u.hostname.includes('.') && u.hostname!=='localhost') return {err:'这不是一个有效的网址'};
  return {url:u.href};
}
function submitUrl(){ const r = normalizeUrl(S.sheet.url); if (r.err){ S.sheet.err=r.err; render(); $('#urlIn')?.focus(); return; } S.sheet=null; loadUrl(r.url); }
function loadUrl(url, mode='ok'){
  clearTimers();
  S.browser = {url, phase:'loading', prog:4, prompt:false, cookie:true, flashBtn:false};
  S.cur = '__browser'; S.sel=null; render();
  const fail = mode==='error' || /\.invalid/.test(url);
  tick(()=>{
    const b = S.browser; if (!b || b.phase!=='loading') return clearInterval(tick.t);
    b.prog = Math.min(mode==='slow'?72:100, b.prog + (b.prog<60?6:3));
    if (fail && b.prog > 30){ clearInterval(tick.t); b.phase='error'; render(); return; }
    if (b.prog >= 100){ clearInterval(tick.t); render();
      // readiness: load finished + network/DOM quiet for 800ms
      later(()=>{ if (S.browser?.phase==='loading'){ S.browser.phase='ready'; S.browser.prompt=true; S.browser.flashBtn=true; render(); } }, 800);
      return; }
    if (mode==='slow' && b.prog>=72){ clearInterval(tick.t); render();
      later(()=>{ if (S.browser?.phase==='loading'){ S.browser.phase='slow'; S.browser.prompt=true; render(); } }, 1600);
      return; }
    render();
  }, 120);
}
function dismissPrompt(){ if (S.browser?.prompt){ S.browser.prompt=false; render(); } }
function closeBrowser(){ clearTimers(); S.browser=null; S.cur = S.tabs[S.tabs.length-1] || S.docs[0].id; render(); }
function openConvert(){ if(!S.browser) return; S.browser.prompt=false; S.sheet = {kind:'convert', fmt:'pdf-read', title: webTitle()}; render(); }
function startConvert(){
  const fmt = S.sheet.fmt, title = S.sheet.title.trim() || webTitle();
  S.sheet = {kind:'converting', fmt, title, step:0, prog:0, dismissable:false}; render();
  let p = 0;
  tick(()=>{ p += 4; const s = S.sheet; if(!s) return clearInterval(tick.t);
    s.prog = Math.min(100,p); s.step = p<25?0:p<50?1:p<85?2:p<100?3:4;
    if (p>=100){ clearInterval(tick.t);
      const isMd = fmt==='md';
      const d = isMd ? {id:'web-md', fmt:'md', title, sub:'Markdown · 来自网页 · 仅阅读'}
                     : {id:'web', fmt:'web', title, sub: fmt==='pdf-orig'?'网页 · 原样式 PDF · 3 页':'网页 · 阅读模式 PDF · 4 页'};
      S.docs = S.docs.filter(x=>x.id!==d.id); S.docs.push(d); S.newDoc=d.id;
      S.browser=null; S.sheet=null;
      openDoc(d.id);
      toast(isMd ? `已保存「${title}」为 Markdown（仅阅读）` : `已保存「${title}」· 可以划线和摘录了`);
      return; }
    render(); }, 90);
}

/* Selection → floating toolbar */
function bindReader(){
  const scroller = $('.reader-scroll'); if (!scroller) return;
  scroller.onmouseup = () => setTimeout(()=>{
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()){ if (S.sel){ S.sel=null; render(); } return; }
    const r = sel.getRangeAt(0).getBoundingClientRect(), w = win.getBoundingClientRect();
    const isMd = !!sel.anchorNode.parentElement.closest('.mdoc');
    S._range = sel.getRangeAt(0).cloneRange();
    const width = isMd ? 330 : 360;
    S.sel = {md:isMd, x: Math.max(10, r.left - w.left + r.width/2 - width/2), y: r.top - w.top - 48};
    // render overlays only, keep the selection alive
    document.querySelectorAll('.ftb').forEach(e=>e.remove());
    win.insertAdjacentHTML('beforeend', selToolbar());
  }, 0);
  scroller.onscroll = () => { if (S.sel){ S.sel=null; document.querySelectorAll('.ftb').forEach(e=>e.remove()); } };
}
function excerpt(color, onlyHl){
  const r = S._range; const d = doc(S.cur);
  if (r){ try { const span = document.createElement('span'); span.className = 'hl '+color+' flash'; r.surroundContents(span); } catch(e){} }
  const text = (r ? r.toString() : '').trim().slice(0, 90);
  S.hlCount[d.id] = (S.hlCount[d.id]||0)+1;
  window.getSelection().removeAllRanges();
  document.querySelectorAll('.ftb').forEach(e=>e.remove()); S.sel=null;
  S.customHtml[d.id] = $('.reader-scroll').innerHTML.replace(/ flash/g,'');
  S._keepScroll = true;
  if (onlyHl){ toast('已高亮'); return; }
  const src = d.fmt==='web' ? '网页 · blog.example.com · 第 1 页' : d.fmt==='mobi' ? '原则 · 2.1 · 第 101 页' : d.fmt==='epub' ? '慢下来的大脑 · 第一章 · 第 '+(10)+' 页' : d.title+' · 第 14 页';
  S.cards.push({color, fmt:d.fmt, q:text, src});
  S.flashCard = S.cards.length-1;
  S._keepScroll = true;
  toast('已摘录到脑图', true, S.view==='reader'?['查看',"setView('split')"]:null);
  later(()=>{S.flashCard=-1;},1800);
}
