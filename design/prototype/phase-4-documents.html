<style>
/* Tokens mirror packages/mm_design (MMColors.light/dark, MMRadii, MMSizes). Chrome mirrors the
   current app: reader_pane.dart toolbar, workspace_sidebar.dart, map_pane.dart. */
:root{
  --win:#FFFFFF; --sidebar:rgba(242,242,246,.86); --reader:#FFFFFF; --canvas:#FFFFFF; --card:#FFFFFF; --page:#FFFFFF;
  --label:#1D1D1F; --label2:#636366; --label3:#8E8E93; --icon:#6E6E73; --toolIcon:#1D1D1F;
  --sep:rgba(0,0,0,.09); --fill:rgba(120,120,128,.12); --fill4:rgba(120,120,128,.08);
  --sel:rgba(0,0,0,.075); --hover:rgba(0,0,0,.045); --pressed:rgba(0,0,0,.09);
  --accent:#007AFF; --accentTint:rgba(0,122,255,.12); --onAccent:#fff;
  --research:#5E5CE6; --researchTint:rgba(94,92,230,.12);
  --glass:rgba(255,255,255,.78); --glassOpaque:#fff; --hair:rgba(0,0,0,.08); --line:rgba(60,60,67,.24); --excerpt:#3A3A3C;
  --root:#1D1D1F; --onRoot:#fff; --scrim:rgba(0,0,0,.12);
  --cardShadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --pageShadow:0 0 0 .5px rgba(0,0,0,.06),0 2px 10px rgba(0,0,0,.10);
  --sheetShadow:0 24px 60px rgba(0,0,0,.25);
  --ok:#248A3D; --warn:#C93400; --err:#D70015;
  --y:#FFCC00; --g:#34C759; --b:#007AFF; --p:#FF2D55; --o:#FF9500;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  --mono:"SF Mono",Menlo,monospace;
}
.dark{
  --win:#1E1E1F; --sidebar:rgba(44,44,47,.86); --reader:#1E1E1F; --canvas:#1E1E1F; --card:#2C2C2E;
  --label:#F5F5F7; --label2:#AEAEB2; --label3:#8E8E93; --icon:#AEAEB2; --toolIcon:#E5E5EA;
  --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.24); --fill4:rgba(118,118,128,.14);
  --sel:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06); --pressed:rgba(255,255,255,.12);
  --accent:#0A84FF; --accentTint:rgba(10,132,255,.22); --research:#7D7AFF; --researchTint:rgba(125,122,255,.2);
  --glass:rgba(50,50,53,.82); --glassOpaque:#2C2C2E; --hair:rgba(255,255,255,.10); --line:rgba(235,235,245,.22); --excerpt:#D1D1D6;
  --root:#F5F5F7; --onRoot:#1D1D1F; --scrim:rgba(0,0,0,.35);
  --cardShadow:0 2px 10px rgba(0,0,0,.35); --pageShadow:0 0 0 .5px rgba(255,255,255,.06),0 2px 10px rgba(0,0,0,.4); --sheetShadow:0 24px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--sans);font-size:13px;color:var(--label);-webkit-font-smoothing:antialiased}
body{background:#d9dce3;overflow:hidden}
body.dark{background:#111214}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
input{font:inherit;color:inherit}
svg{display:block}
.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:15px;height:15px}.i.xs{width:12px;height:12px}.i.l{width:20px;height:20px}.i.xl{width:28px;height:28px}

#desk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px 316px 16px 16px;transition:padding 260ms}
body.demo-min #desk{padding-right:56px}
#win{position:relative;width:100%;max-width:1512px;height:100%;max-height:949px;background:var(--win);border-radius:24px;overflow:hidden;
  box-shadow:0 0 0 .5px rgba(0,0,0,.28),0 30px 80px rgba(0,0,0,.28);display:flex}

/* ---------- Sidebar (workspace_sidebar.dart) ---------- */
#side{position:relative;z-index:3;width:236px;flex:none;margin:8px 0 8px 8px;border-radius:16px;background:var(--sidebar);
  backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair),0 6px 24px rgba(0,0,0,.06);display:flex;flex-direction:column;padding:8px 8px;overflow:hidden}
.lights{display:flex;gap:8px;height:28px;align-items:center;padding:0 6px}
.lights .dot{width:12px;height:12px;border-radius:6px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.lights .grow{flex:1}
.ibtn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--icon)}
.ibtn:hover{background:var(--hover)}
.set{display:flex;align-items:center;gap:8px;height:36px;margin-top:10px;padding:0 4px 0 6px;font-weight:600;font-size:13.5px}
.set .ic{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.set .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:6px;height:28px;margin:6px 2px 8px;padding:0 8px;border-radius:8px;background:var(--fill4);color:var(--label3)}
.sec{font-size:11px;font-weight:600;color:var(--label2);height:28px;padding:0 4px 0 8px;margin-top:8px;display:flex;align-items:center}
.sec .grow{flex:1}
.sec .add{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--icon);opacity:0}
#side:hover .sec .add,.sec .add.on{opacity:1}
.sec .add:hover,.sec .add.on{background:var(--pressed);color:var(--label)}
.row{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:8px;white-space:nowrap;overflow:hidden;font-size:13px}
.row:hover{background:var(--hover)}.row.on{background:var(--sel)}
.row .ri{color:var(--accent);flex:none}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .cnt{font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums}
.row .badge{min-width:22px;height:18px;padding:0 6px;border-radius:9px;background:var(--accentTint);color:var(--accent);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.row.new{animation:rowin 1.8s}
@keyframes rowin{0%,35%{background:var(--accentTint)}}
.row .tmp{font-size:10.5px;color:var(--label2);padding:0 6px;height:17px;border-radius:9px;background:var(--fill);display:flex;align-items:center}
.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Main ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.titlebar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px 0 22px}
.titlebar .t{font-size:15px;font-weight:600;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.capsule{display:flex;align-items:center;gap:2px;height:36px;padding:3px;border-radius:18px;background:var(--glass);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px var(--hair)}
.tb{position:relative;height:30px;min-width:30px;padding:0 6px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--toolIcon)}
.tb:hover{background:var(--hover)}.tb:active{background:var(--pressed)}
.tb.on{background:var(--accentTint);color:var(--accent)}
.tb.ai{color:var(--research)}
.tb.dis{opacity:.28;pointer-events:none}
.tb.dis-soft{opacity:.28}
.tb .lbl{font-size:12.5px}
.tdiv{width:1px;height:18px;background:var(--sep);margin:0 3px;flex:none}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);padding:3px 7px;border-radius:5px;background:rgba(40,40,42,.92);color:#fff;font-size:11px;white-space:nowrap;pointer-events:none;z-index:80;font-weight:400}
[data-tip]{position:relative}

#content{flex:1;min-height:0;display:flex;position:relative}
.pane{position:relative;min-width:0;display:flex;flex-direction:column}
#reader{flex:1;background:var(--reader)}
#map{flex:1;background:var(--canvas);border-left:.5px solid var(--sep)}
.pane.hide{display:none}

/* Reader tool row (reader_pane.dart _toolbar) */
.rtools{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;position:relative;z-index:6}
.rtools .grow{flex:1}
.ro-pill{display:flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;background:var(--fill4);color:var(--label2);font-size:12px;white-space:nowrap}
.ro-pill:hover{background:var(--fill)}
.rbody{flex:1;min-height:0;display:flex;position:relative}
.rside{width:240px;flex:none;display:flex;flex-direction:column;border-right:.5px solid var(--sep);background:var(--win)}
.rside .tabs{display:flex;justify-content:center;gap:2px;padding:6px 0 8px}
.rside .tabs .tb{width:34px}
.rside .list{flex:1;overflow:auto;padding:0 8px 20px}
.ti{display:flex;align-items:center;gap:6px;width:100%;text-align:left;height:28px;padding:0 8px;border-radius:7px;font-size:12.5px;white-space:nowrap}
.ti .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ti.l2{padding-left:22px;color:var(--label2)}
.ti .pg{color:var(--label3);font-size:11.5px;font-variant-numeric:tabular-nums}
.ti:hover{background:var(--hover)}.ti.on{background:var(--sel);color:var(--label)}
.rside .empty{padding:24px 12px;text-align:center;color:var(--label3);font-size:12px;line-height:1.6}
.thumbs{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:6px}
.thumb{width:110px;height:150px;border-radius:3px;background:var(--page);box-shadow:var(--pageShadow);padding:14px 12px;position:relative}
.thumb i{display:block;height:3px;border-radius:2px;background:#d4d4d8;margin-bottom:5px}
.thumb.on{box-shadow:0 0 0 2px var(--accent)}
.thumb + span{font-size:11px;color:var(--label2);margin-top:-6px}
.rscroll{flex:1;overflow:auto;position:relative;padding:4px 0 90px}

/* Pages: PDF and typeset renditions share the same viewer */
.page{position:relative;margin:0 auto;background:var(--paper,#fff);color:var(--ink,#1d1d1f);box-shadow:var(--pageShadow);border-radius:3px;
  width:min(var(--pw,600px),calc(100% - 40px));padding:var(--pp,64px 62px 64px)}
.page + .page{margin-top:22px}
.page .rh{font-size:10px;color:#8e8e93;display:flex;justify-content:space-between;margin-bottom:24px;font-family:var(--sans)}
.page h2{font-family:var(--serif);font-size:calc(var(--fs,16px) + 6px);font-weight:600;margin:0 0 8px}
.page h3{font-family:var(--serif);font-size:calc(var(--fs,16px) + 1px);font-weight:600;margin:22px 0 12px}
.page p{font-family:var(--pfont,var(--serif));font-size:var(--fs,16px);line-height:var(--lh,2);margin:0 0 14px;text-align:justify;text-indent:2em}
.page .by{font-family:var(--sans);font-size:11px;color:#8e8e93;margin:0 0 18px;text-indent:0}
.page .fig{margin:12px 0 16px;border-radius:4px;height:130px;background:linear-gradient(135deg,#dfe8f5,#efe4f2);display:flex;align-items:center;justify-content:center;color:#7a7f8c;font-size:11px;font-family:var(--sans)}
.page .pno{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:10px;color:#8e8e93;font-family:var(--sans)}
.page ::selection,.mdoc ::selection{background:rgba(0,122,255,.28)}
.hl{border-radius:2px;cursor:pointer}
.hl.y{background:rgba(255,204,0,.38)}.hl.g{background:rgba(52,199,89,.30)}.hl.b{background:rgba(0,122,255,.22)}.hl.p{background:rgba(255,45,85,.22)}.hl.o{background:rgba(255,149,0,.30)}
.hl.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px rgba(0,122,255,.45)}100%{box-shadow:0 0 0 0 rgba(0,122,255,0)}}
.ul{text-decoration:underline;text-decoration-color:#FF9500;text-decoration-thickness:2px;text-underline-offset:4px}
.retype .page{animation:retype 500ms}
@keyframes retype{from{opacity:.25;filter:blur(1.5px)}}
.rs-paper{--paper:#F6EFDC}.rs-green{--paper:#E3EEDB}.rs-dark{--paper:#1F1F21;--ink:#D8D8DC}
.rs-dark .mdoc{background:#1F1F21;color:#D8D8DC}.rs-paper .mdoc{background:#F6EFDC}.rs-green .mdoc{background:#E3EEDB}

/* Provenance line above the first page (renditions only) */
.prov{width:min(var(--pw,600px),calc(100% - 40px));margin:4px auto 12px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--label2);height:24px}
.prov b{color:var(--label);font-weight:500}
.prov .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbtn{height:24px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--accent);white-space:nowrap}
.lbtn:hover{background:var(--accentTint)}

/* Bottom page navigation (reader_pane.dart: chevron pill + 1pt progress) */
.pnav{position:absolute;right:18px;bottom:16px;z-index:5;display:flex;align-items:center;gap:2px;height:36px;padding:3px;border-radius:18px;background:var(--glass);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px var(--hair)}
.pnav .pl{font-size:11.5px;color:var(--label2);padding:0 6px;font-variant-numeric:tabular-nums}
.pline{position:absolute;left:24px;right:140px;bottom:33px;height:1px;background:var(--sep);z-index:4}
.pline i{display:block;height:1px;background:var(--label3);width:var(--p,4%)}

/* Markdown (native, read-only) */
.mdoc{max-width:720px;margin:6px auto 0;padding:24px 48px 60px;color:var(--ink,var(--label));line-height:1.8;font-size:var(--mdfs,15px)}
.mdoc h1{font-size:1.75em;line-height:1.3;margin:0 0 6px;font-weight:700}
.mdoc h2{font-size:1.3em;margin:28px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--sep)}
.mdoc h3{font-size:1.05em;margin:20px 0 6px}
.mdoc p{margin:0 0 12px}
.mdoc a{color:var(--accent);text-decoration:none}
.mdoc blockquote{margin:0 0 12px;padding:2px 14px;border-left:3px solid var(--line);color:var(--label2)}
.mdoc pre{background:var(--fill4);border-radius:8px;padding:12px 14px;overflow:auto;margin:0 0 14px}
.mdoc code{font-family:var(--mono);font-size:12.5px}
.mdoc table{border-collapse:collapse;margin:0 0 14px;font-size:13px;width:100%}
.mdoc th,.mdoc td{border:1px solid var(--sep);padding:6px 10px;text-align:left}.mdoc th{background:var(--fill4);font-weight:600}
.mdoc ul,.mdoc ol{margin:0 0 12px;padding-left:22px}
.mdoc .task{list-style:none;margin-left:-20px}.mdoc .task input{margin-right:6px;vertical-align:-1px}
.mdoc .img{border-radius:8px;height:150px;background:linear-gradient(135deg,#d9e6f7,#f2e3ea);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#6b7280;font-size:11.5px;margin:4px 0 14px}
.mdoc .img.remote{background:var(--fill4);color:var(--label2);border:1px dashed var(--line)}
.mdoc .meta{font-size:12px;color:var(--label2);margin-bottom:22px}

/* In-app browser: the tool row becomes a browser bar */
.url{flex:1;min-width:0;height:30px;border-radius:15px;background:var(--fill4);display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--label2);font-size:12.5px;position:relative;overflow:hidden}
.url input{flex:1;min-width:0;border:0;outline:none;background:none;color:var(--label)}
.url .bprog{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);transition:width 200ms}
.btn{height:28px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  background:var(--card);box-shadow:0 0 0 .5px var(--hair),0 1px 1.5px rgba(0,0,0,.08)}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--accent);color:#fff;box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.pulse{animation:pulse 1.4s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(0,122,255,.22)}}
.webview{position:relative;flex:1;overflow:auto;background:#fff;color:#111;border-top:.5px solid var(--sep)}
.webview .site-nav{height:52px;display:flex;align-items:center;gap:20px;padding:0 28px;border-bottom:1px solid #eee;font-size:13px;color:#555;position:sticky;top:0;background:#fff;z-index:2}
.webview .site-nav b{font-size:16px;color:#111;margin-right:auto}
.webview .site-nav .sub{height:30px;padding:0 12px;border-radius:15px;background:#111;color:#fff;display:flex;align-items:center;font-size:12px}
.webview .wrap{display:flex;gap:36px;padding:34px 40px 60px;max-width:980px;margin:0 auto}
.webview article{flex:1;min-width:0;font-family:Georgia,var(--serif);font-size:16px;line-height:1.8}
.webview article h1{font-family:var(--sans);font-size:30px;line-height:1.25;margin:6px 0 10px}
.webview .kick{font-family:var(--sans);font-size:12px;color:#c2410c;font-weight:600;letter-spacing:.06em}
.webview .byl{font-family:var(--sans);font-size:13px;color:#666;margin-bottom:22px;display:flex;align-items:center;gap:8px}
.webview .byl i{width:26px;height:26px;border-radius:13px;background:linear-gradient(135deg,#fbbf24,#f97316);display:block}
.webview .hero{height:200px;border-radius:10px;background:linear-gradient(135deg,#bfdbfe,#fbcfe8 60%,#fde68a);margin:0 0 22px;display:flex;align-items:flex-end;padding:10px;color:#475569;font:12px var(--sans)}
.webview .hero.lazy{background:#f1f1f3;align-items:center;justify-content:center}
.webview article p{margin:0 0 16px}
.webview aside{width:220px;flex:none;font-size:12.5px;color:#555}
.webview .ad{height:250px;border-radius:8px;background:repeating-linear-gradient(45deg,#f4f4f5 0 10px,#fafafa 10px 20px);display:flex;align-items:center;justify-content:center;color:#a1a1aa;font-size:11px;margin-bottom:16px}
.webview .cookie{position:sticky;bottom:12px;margin:0 auto;width:calc(100% - 40px);max-width:720px;border-radius:12px;background:#111;color:#eee;padding:12px 14px;font:12.5px var(--sans);display:flex;align-items:center;gap:12px}
.webview .cookie button{background:#fff;color:#111;border-radius:6px;padding:5px 10px;font-weight:600}
.webview .skel{padding:40px}
.webview .skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#f0f0f2,#e6e6ea,#f0f0f2);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.web-err{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--label2);text-align:center;padding:40px;border-top:.5px solid var(--sep)}
.web-err .big{width:56px;height:56px;border-radius:16px;background:var(--fill4);display:flex;align-items:center;justify-content:center;color:var(--icon)}
.web-err b{font-size:15px;color:var(--label)}

/* Popovers & dropdowns (MMDropdown: 14 radius, 30pt rows, 14pt icons) */
.pop{position:absolute;z-index:40;border-radius:14px;background:var(--glassOpaque);box-shadow:0 0 0 .5px var(--hair),0 10px 30px rgba(0,0,0,.16);padding:6px}
.pop.anim{animation:fin 140ms}
@keyframes fin{from{opacity:0;transform:translateY(-4px)}}
.mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;min-height:30px;padding:0 8px;border-radius:8px;font-size:13px}
.mi:hover{background:var(--hover)}
.mi .tx{flex:1;white-space:nowrap}.mi small{display:block;font-size:11px;color:var(--label2);margin-top:-2px}
.mi .ck{width:14px;color:var(--accent)}
.mi .k{font-size:11.5px;color:var(--label3)}
.mi .sw{width:16px;height:16px;border-radius:3px;box-shadow:0 0 0 .5px var(--sep)}
.msep{height:.5px;background:var(--sep);margin:5px 8px}
.mhead{font-size:11px;font-weight:600;color:var(--label2);padding:6px 8px 2px}
.zrow{display:flex;align-items:center;gap:8px;padding:6px 8px 8px;color:var(--label2);font-size:12px}
.zrow .track{flex:1;height:4px;border-radius:2px;background:var(--fill);position:relative}
.zrow .track i{position:absolute;left:0;top:0;bottom:0;width:38%;background:var(--accent);border-radius:2px}
.zrow .track b{position:absolute;left:38%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:8px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 1px 3px rgba(0,0,0,.2)}
.typeset{padding:12px}
.typeset .r2{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;gap:10px}
.typeset .lab{font-size:12.5px;color:var(--label2);flex:none}
.seg{display:flex;height:28px;padding:2px;border-radius:14px;background:var(--fill4)}
.seg button{height:24px;padding:0 9px;border-radius:12px;font-size:12px;color:var(--label2);display:flex;align-items:center;gap:4px}
.seg button.on{background:var(--card);color:var(--label);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 .5px var(--hair)}
.typeset .hint{font-size:11.5px;color:var(--label2);line-height:1.5;padding:10px;border-radius:8px;background:var(--fill4);margin-bottom:12px}
.info{padding:14px}
.info b{display:block;margin-bottom:4px}
.info p{margin:0 0 10px;font-size:12px;line-height:1.55;color:var(--label2)}
.info .caps{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;margin:0 0 12px}
.info .caps span{display:flex;align-items:center;gap:5px}
.info .caps .no{color:var(--label3)}

/* Ready bubble (non-modal, anchored at the convert button) */
.ready-pop{position:absolute;z-index:30;width:320px;border-radius:14px;background:var(--glassOpaque);box-shadow:0 0 0 .5px var(--hair),0 12px 36px rgba(0,0,0,.18);padding:14px}
.ready-pop.anim{animation:fin 220ms cubic-bezier(.2,0,0,1)}
.ready-pop::before{content:"";position:absolute;top:-6px;right:60px;width:12px;height:12px;background:var(--glassOpaque);transform:rotate(45deg);box-shadow:-.5px -.5px 0 var(--hair)}
.ready-pop .h{display:flex;gap:10px;align-items:flex-start}
.ready-pop .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(52,199,89,.15);color:var(--ok)}
.ready-pop .ic.w{background:rgba(255,149,0,.15);color:#b86200}
.ready-pop b{display:block;font-size:13px;margin-bottom:2px}
.ready-pop p{margin:0;font-size:12px;line-height:1.5;color:var(--label2)}
.ready-pop .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

/* Selection toolbar (selection_toolbar.dart) */
.ftb{position:absolute;z-index:20;display:flex;align-items:center;gap:1px;height:38px;padding:4px 5px;border-radius:19px;background:var(--glassOpaque);box-shadow:0 0 0 .5px var(--hair),0 6px 20px rgba(0,0,0,.14);animation:fin 120ms}
.cdot{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.cdot i{width:14px;height:14px;border-radius:7px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.cdot:hover{background:var(--hover)}
.ftb .tb{height:28px;min-width:28px}
.ftb .note{font-size:11.5px;color:var(--label2);padding:0 8px 0 2px;white-space:nowrap;display:flex;align-items:center;gap:4px}

/* Sheets */
.scrim{position:absolute;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center}
.scrim.anim{animation:sfade 160ms}
@keyframes sfade{from{opacity:0}}
.sheet{margin-top:56px;width:480px;border-radius:22px;background:var(--win);box-shadow:var(--sheetShadow),0 0 0 .5px var(--hair);overflow:hidden}
.scrim.anim .sheet{animation:sin 240ms cubic-bezier(.2,0,0,1)}
@keyframes sin{from{transform:translateY(-14px);opacity:0}}
.sheet.wide{width:720px}
.sheet .sh{padding:20px 22px 4px}
.sheet .sh b{font-size:15px;display:block}
.sheet .sh p{margin:4px 0 0;color:var(--label2);font-size:12.5px;line-height:1.5}
.sheet .sb{padding:14px 22px}
.sheet .sf{display:flex;align-items:center;gap:8px;padding:12px 22px 18px}
.sheet .sf .grow{flex:1;font-size:12px;color:var(--label2);display:flex;align-items:center;gap:5px;min-width:0}
.field{display:flex;align-items:center;gap:8px;height:30px;border-radius:8px;padding:0 10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--sep)}
.field:focus-within{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--accentTint)}
.field input{flex:1;border:0;outline:none;background:none;min-width:0}
.field.err{box-shadow:inset 0 0 0 1px var(--err)}
.ferr{font-size:11.5px;color:var(--err);margin-top:6px;min-height:16px}
.flab{font-size:12px;color:var(--label2);margin:0 0 6px;font-weight:500}
.pf{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.pf:hover{background:var(--hover)}.pf .ri{color:var(--accent)}
.pf .tx{flex:1}.pf small{display:block;color:var(--label2);font-size:11px}
.steps{display:flex;flex-direction:column;gap:10px;margin:4px 0 6px}
.step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--label3)}
.step .si{width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.step.run{color:var(--label)}.step.run .si{box-shadow:none;color:var(--accent)}
.step.done{color:var(--label)}.step.done .si{background:var(--ok);box-shadow:none;color:#fff}
.step .d{margin-left:auto;font-size:11.5px;color:var(--label2);font-variant-numeric:tabular-nums}
.pbar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width 180ms}
.fileline{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--fill4);margin-bottom:14px}
.fileline .ri{color:var(--accent)}
.fileline .tx{flex:1;min-width:0}.fileline small{display:block;color:var(--label2);font-size:11.5px}
.err-ic{width:44px;height:44px;border-radius:12px;background:rgba(255,59,48,.12);color:var(--err);display:flex;align-items:center;justify-content:center;flex:none}
.conv{display:flex;gap:18px}
.conv .prev{width:230px;flex:none;height:300px;border-radius:12px;background:var(--fill4);padding:12px;position:relative;overflow:hidden}
.conv .prev .pg{background:#fff;border-radius:3px;height:100%;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:14px;overflow:hidden;color:#222;font-size:6.5px;line-height:1.65;position:relative}
.conv .prev .pg h6{font-size:10px;margin:0 0 4px;font-family:var(--serif)}
.conv .prev .pg .ln{height:3px;border-radius:2px;background:#d4d4d8;margin:0 0 4px}
.conv .prev .pg .im{height:48px;border-radius:3px;background:linear-gradient(135deg,#bfdbfe,#fbcfe8 60%,#fde68a);margin:6px 0}
.conv .prev .pg .nav{height:10px;background:#f4f4f5;margin:-14px -14px 8px}
.conv .prev .pg .sd{position:absolute;right:14px;top:40px;width:44px;height:90px;background:repeating-linear-gradient(45deg,#f4f4f5 0 4px,#fafafa 4px 8px);border-radius:3px}
.conv .prev .pg.mdp{font-family:var(--mono);font-size:7.5px;color:#444;white-space:pre-wrap;line-height:1.7}
.conv .prev .cap{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;font-size:11px;color:var(--label2);background:var(--glass);border-radius:6px;padding:3px}
.conv .opts{flex:1;min-width:0}
.fmt{display:flex;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--sep);margin-bottom:8px;align-items:flex-start}
.fmt:hover{background:var(--hover)}
.fmt.on{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accentTint)}
.fmt .rd{width:16px;height:16px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--line);flex:none;margin-top:1px}
.fmt.on .rd{box-shadow:inset 0 0 0 5px var(--accent)}
.fmt .tx{flex:1}.fmt .tx b{font-size:13px;font-weight:600}.fmt small{display:block;color:var(--label2);font-size:11.5px;line-height:1.45;margin-top:2px}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9px;font-size:10.5px;font-weight:500;margin-top:5px;background:rgba(52,199,89,.14);color:var(--ok)}
.tag.ro{background:var(--fill);color:var(--label2)}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.chk input{margin:0;accent-color:var(--accent)}

/* Drop overlay */
.drop{position:absolute;inset:8px;z-index:55;border-radius:18px;background:rgba(0,122,255,.08);box-shadow:inset 0 0 0 2px var(--accent);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.drop .box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 34px;border-radius:18px;background:var(--glassOpaque);box-shadow:0 0 0 .5px var(--hair),0 12px 36px rgba(0,0,0,.15);color:var(--accent)}
.drop b{font-size:15px;color:var(--label)}
.drop span{font-size:12px;color:var(--label2)}
.ghost-file{position:absolute;z-index:56;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.25);transform:rotate(-3deg);font-size:12px;pointer-events:none;color:var(--label)}
.ghost-file .ri{color:var(--accent)}

/* HUD */
.hud{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;padding:9px 12px 9px 14px;border-radius:12px;
  background:var(--glassOpaque);box-shadow:0 0 0 .5px var(--hair),0 10px 30px rgba(0,0,0,.18);font-size:12.5px;white-space:nowrap}
.hud.anim{animation:hin 220ms cubic-bezier(.2,0,0,1)}
@keyframes hin{from{opacity:0;transform:translate(-50%,8px)}}
.hud .pbar{width:120px;margin:0}
.hud .okc{color:var(--ok)}

/* Mind map pane (map_pane.dart) */
.mtools{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;position:relative;z-index:3}
.mtools .t{font-size:15px;font-weight:600;margin-right:auto}
.mtools .seg{height:32px;border-radius:16px}.mtools .seg button{height:28px;border-radius:14px;padding:0 14px;font-size:13px}
.mstage{flex:1;position:relative;overflow:hidden}
.mworld{position:absolute;left:24px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:40px}
.mlinks{position:absolute;inset:0;pointer-events:none;overflow:visible;width:100%;height:100%}
.mroot{background:var(--root);color:var(--onRoot);font-weight:600;font-size:15px;padding:12px 20px;border-radius:12px;white-space:nowrap;flex:none}
.mkids{display:flex;flex-direction:column;gap:14px}
.mcard{position:relative;background:var(--card);border-radius:12px;box-shadow:var(--cardShadow);width:224px;padding:10px 30px 10px 18px}
.mcard .bar{position:absolute;left:7px;top:10px;bottom:10px;width:3px;border-radius:2px}
.mcard .q{font-family:var(--serif);font-size:13px;line-height:20px;color:var(--excerpt);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:3}
.mcard .s{font-size:10.5px;color:var(--label2);margin-top:6px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.mcard .s .ri{color:var(--label3)}
.mcard .go{position:absolute;top:8px;right:8px;color:var(--icon)}
.mcard.flash{animation:nflash 1.6s}
@keyframes nflash{0%,50%{box-shadow:0 0 0 3px rgba(0,122,255,.45),var(--cardShadow)}}
.mtopic{background:var(--fill);border-radius:10px;padding:8px 14px;font-weight:500;width:max-content}
.mbottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;z-index:3}
.mbottom .hint{margin-right:auto;font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mbottom .seg{height:34px;border-radius:17px;flex:none}.mbottom .seg button{height:30px;border-radius:15px;padding:0 14px;font-size:13px}
.zoomv{font-size:13px;padding:0 4px;font-variant-numeric:tabular-nums}

/* ---------- Demo console (outside the product) ---------- */
#demo{position:fixed;right:14px;top:14px;z-index:200;width:288px;max-height:calc(100% - 28px);overflow:auto;border-radius:14px;background:rgba(20,20,22,.94);color:#f2f2f7;
  box-shadow:0 10px 40px rgba(0,0,0,.35);font-size:12px;transition:transform 260ms}
#demo.min{transform:translateX(250px)}
#demo .dh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:600;position:sticky;top:0;background:rgba(20,20,22,.98);z-index:1}
#demo .dh .grow{flex:1}
#demo .dh button{color:#aeaeb2;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center}
#demo .dsec{padding:6px 12px}
#demo .dt{font-size:10.5px;color:#8e8e93;font-weight:600;margin:6px 0 6px;letter-spacing:.04em}
#demo .scn{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:6px 8px;border-radius:8px;margin-bottom:2px;line-height:1.45}
#demo .scn:hover{background:rgba(255,255,255,.08)}
#demo .scn.on{background:rgba(10,132,255,.38)}
#demo .scn .n{width:18px;height:18px;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:10.5px;flex:none;margin-top:1px}
#demo .scn small{display:block;color:#a1a1a6;font-size:10.5px}
#demo .tg{display:flex;align-items:center;justify-content:space-between;padding:5px 2px}
#demo .tg .seg{background:rgba(255,255,255,.08);height:26px}
#demo .tg .seg button{color:#aeaeb2;height:22px;padding:0 8px;font-size:11px}
#demo .tg .seg button.on{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
#guide{margin:10px 12px 6px;padding:9px 10px;border-radius:10px;background:rgba(10,132,255,.22);line-height:1.55;font-size:11.5px;color:#e5e5ea}
#guide b{color:#fff}
</style>
</head>

}

function readerPane(){
  const hide = S.view === 'map' ? 'hide' : '';

/* Same row and order as reader_pane.dart; per-format differences are marked. */
function readerTools(d){
  const md = d.fmt === 'md', rendition = ['epub','mobi','web'].includes(d.fmt);
  const t = (k, icon, label, key) => `<button class="tb ${S.tool===k?'on':''} ${md && k!=='select'?'dis-soft':''}" data-tip="${md && k!=='select' ? label+' · Markdown 暂不支持' : label+(key?' '+key:'')}" onclick="${md && k!=='select'?'':`S.tool='${k}';render()`}">${ico(icon)}</button>`;
  // Slot 3: PDF → crop. Renditions → typeset (the app owns their margins). Markdown → crop, disabled.
  const slot3 = rendition
    ? `<button class="tb ${S.pop?.kind==='typeset'?'on':''}" data-tip="排版" data-k="typeset" onclick="event.stopPropagation();openTypeset(this)">${ico('typeset')}</button>`

      <button class="tb ${S.sync && !md?'on':''} ${md?'dis-soft':''}" data-tip="${md?'Markdown 暂不支持摘录':S.sync?'摘录同步到脑图：开':'摘录同步到脑图：关'}" onclick="${md?'':'S.sync=!S.sync;render()'}">${ico('syncToMap')}</button>

function readerSidebar(d){

}

  const prov = `<div class="prov">${ico('book','i xs')}<span class="grow"><b>${d.fmt==='mobi'?'原则.azw3':'慢下来的大脑.epub'}</b> · ${sz.label}字号 · ${pg.label} · 共 ${d.fmt==='mobi'?316:sz.pages} 页</span><button class="lbtn" onclick="event.stopPropagation();openTypeset($('[data-k=typeset]'))">${ico('typeset','i xs')}调整排版</button></div>`;

      <h3>2.1 拥抱现实，应对现实</h3>

      <p>不要为了“看起来正确”而拒绝承认错误。把每一次失败都记录下来，问自己：下一次怎样才能做得更好？</p>
      <p>真正重要的不是你此刻是否正确，而是你是否在不断地接近正确。</p><div class="pno">101</div></div>`;
  return prov + `
    <div class="page"><div class="rh"><span>慢下来的大脑</span><span>第一章 自动驾驶的心智</span></div>
      <h3>1.1 快思考从不请假</h3>
      <p>清晨醒来，你不需要思考就知道如何刷牙、如何系鞋带。大部分日常判断都由一套快速、自动、几乎不费力的系统完成。它擅长识别模式，也擅长在信息不足时给出一个“足够好”的答案。</p>
      <p><span class="hl g">当我们觉得一件事“显而易见”时，通常是快思考已经替我们回答了问题，而慢思考没有被叫醒。</span>这并不总是坏事：如果每个决定都要仔细推敲，我们会在日常琐事中耗尽精力。</p>
      <p>问题出现在那些看似简单、实则需要计算的场合。面对一道“球拍和球一共一元一角”的题目，大多数人会脱口而出一个错误答案，因为它<span class="ul">听起来对</span>。</p><div class="pno">10</div></div>

      <p>这也解释了为什么疲惫、饥饿或分心的人更容易做出冲动的选择：慢思考没有足够的资源来检查快思考的结论。</p><div class="pno">11</div></div>`;
}

const stepsHtml = (steps, cur) => `<div class="steps">${steps.map(([t,d],i)=>{const st=i<cur?'done':i===cur?'run':''; return `<div class="step ${st}"><span class="si">${st==='done'?ico('check','i xs'):st==='run'?'<span class="spin"></span>':''}</span>${t}<span class="d">${i<=cur?d:''}</span></div>`;}).join('')}</div>`;

function setView(v){ S.view = v; render(); }
function openDoc(id){ S.cur = id; S.sel=null; S.pop=null; render(); }
function focusBrowser(){ S.cur='__browser'; S.sel=null; S.pop=null; render(); }
function openPop(kind, el, w, alignRight){
  if (S.pop?.kind===kind){ S.pop=null; render(); return; }
  const r = el.getBoundingClientRect(), wr = win.getBoundingClientRect();
  let x = alignRight ? r.right - wr.left - w : r.left - wr.left - 6;
  x = Math.max(12, Math.min(x, wr.width - w - 12));
  S.pop = {kind, x, y: r.bottom - wr.top + 6, w}; render();
}
function openAddMenu(el){ openPop('add', el, 280); }
function openTypeset(el){ if(!el) return; S.pending = {...S.typeset}; openPop('typeset', el, 320); if (!S.pop) S.pending = null; }
function pend(k,v){ S.pending[k]=v; render(); }
function closeSheet(){ clearTimers(); S.sheet=null; render(); }
function toast(text, ok=true, action=null, ms=2600){ S.hud = {text, ok, action}; render(); clearTimeout(toast.t); toast.t = setTimeout(()=>{ S.hud=null; render(); }, ms); }

let timers = [];
function later(fn, ms){ const t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; clearInterval(tick.t); }
function tick(fn, ms){ clearInterval(tick.t); tick.t = setInterval(fn, ms); }
document.addEventListener('click', (e)=>{ if (S.pop && !e.target.closest('.pop')) { S.pop=null; S.pending=null; render(); } });

function applyTypeset(){
  const d = doc(S.cur), next = S.pending; S.pop=null; S.pending=null;
  const chapters = d.fmt==='web' ? 1 : 12; let i = 0;
  S.hud = {text:`正在重新排版 · 第 1 / ${chapters} 章`, prog:0}; render();
  tick(()=>{ i++; const pr = Math.min(100, Math.round(i/14*100));
    S.hud = {text:`正在重新排版 · 第 ${Math.max(1,Math.ceil(pr/100*chapters))} / ${chapters} 章`, prog:pr, _shown:true};
    if (pr>=100){ clearInterval(tick.t); S.typeset = next; S._retype = true;
      const sz = SIZES.find(s=>s.k===next.size);
      if (d.fmt==='epub') d.pages = sz.pages;
      S._keepScroll = true;
      toast(`已重新排版：共 ${d.pages} 页 · ${S.hlCount[d.id]||0} 处标注全部对齐`);
      later(()=>{S._retype=false;},600);
    } else render();
  }, 110);
}

function openPicker(){ S.pop=null; S.sheet={kind:'picker'}; render(); }
function importBook(fmt){
  clearTimers();
  // Demo: re-importing the sample EPUB replaces it, so step off it while importing.
  if (fmt==='epub'){ S.docs = S.docs.filter(d=>d.id!=='epub'); if (S.cur==='epub') S.cur='pdf'; }
  const total = fmt==='mobi'?4:3;
  S.sheet = {kind:'import', fmt, step:0, prog:0, chap:'', dismissable:false}; render();
  let p = 0;
  tick(()=>{
    p += 2.2; const s = S.sheet; if (!s) return clearInterval(tick.t);
    s.prog = Math.min(100, p);
    if (p < 14) s.step = 0;
    else if (fmt==='mobi' && p < 28) s.step = 1;
    else if (p < 90) { s.step = total-2; s.chap = `第 ${Math.min(12, Math.max(1, Math.ceil((p-28)/62*12)))} / 12 章`; }
    else if (p < 100) { s.step = total-1; s.chap = fmt==='mobi'?'316 页':'286 页'; }
    else {
      clearInterval(tick.t);
      const d = fmt==='mobi' ? {id:'azw', fmt:'mobi', title:'原则', pages:316} : {id:'epub', fmt:'epub', title:'慢下来的大脑', pages:286};
      if (!doc(d.id)) S.docs.push(d);
      S.newDoc = d.id; S.sheet = null; S.typeset = {size:'m', page:'fit', font:'serif'};
      openDoc(d.id); toast(`已导入「${d.title}」· 共 ${d.pages} 页，可以划线和摘录了`);
      return;
    }
    render();
  }, 90);
}
function cancelImport(){ clearTimers(); S.sheet=null; if (!doc('epub')) S.docs.splice(1,0,BASE_DOCS()[1]); render(); toast('已取消导入，没有留下任何文件', false); }
function importDrm(){ S.sheet = {kind:'drm'}; render(); }
function importMd(){ S.sheet = null; if (!doc('md')) S.docs.push({id:'md', fmt:'md', title:'读书会讨论提纲'}); S.newDoc='md'; openDoc('md'); toast('已导入「读书会讨论提纲」· 1 张本地图片一并保存'); }

function openAddWeb(url){ S.pop=null; S.sheet={kind:'addweb', url: url ?? 'https://blog.example.com/spaced-repetition', err:''}; render(); later(()=>{ const i=$('#urlIn'); if(i){i.focus();i.select();} },50); }
function normalizeUrl(v){
  v = (v||'').trim(); if (!v) return {err:'请输入网址'};
  if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = 'https://' + v;
  let u; try { u = new URL(v); } catch { return {err:'这不是一个有效的网址'}; }
  if (!['http:','https:'].includes(u.protocol)) return {err:'只支持 http 和 https 网页'};
  if (!u.hostname.includes('.') && u.hostname!=='localhost') return {err:'这不是一个有效的网址'};
  return {url:u.href};
}
function submitUrl(){ const r = normalizeUrl(S.sheet.url); if (r.err){ S.sheet.err=r.err; render(); $('#urlIn')?.focus(); return; } S.sheet=null; loadUrl(r.url); }
function loadUrl(url, mode='ok'){
  clearTimers();
  S.browser = {url, phase:'loading', prog:4, prompt:false, cookie:true, pulse:false};
  S.cur = '__browser'; S.sel=null; render();
  const fail = mode==='error' || /\.invalid/.test(url);
  tick(()=>{
    const b = S.browser; if (!b || b.phase!=='loading') return clearInterval(tick.t);
    b.prog = Math.min(mode==='slow'?72:100, b.prog + (b.prog<60?6:3));
    if (fail && b.prog > 30){ clearInterval(tick.t); b.phase='error'; render(); return; }
    if (b.prog >= 100){ clearInterval(tick.t); render();
      // Ready = main frame loaded + network and DOM quiet for 800ms.
      later(()=>{ if (S.browser?.phase==='loading'){ S.browser.phase='ready'; S.browser.prompt=true; S.browser.pulse=true; render(); } }, 800);
      return; }
    if (mode==='slow' && b.prog>=72){ clearInterval(tick.t); render();
      later(()=>{ if (S.browser?.phase==='loading'){ S.browser.phase='slow'; S.browser.prompt=true; render(); } }, 1600);
      return; }
    render();
  }, 120);
}
function dismissPrompt(){ if (S.browser?.prompt){ S.browser.prompt=false; render(); } }
function closeBrowser(){ clearTimers(); S.browser=null; S.cur = S.docs[0].id; render(); }
function openConvert(){ if(!S.browser) return; S.browser.prompt=false; S.sheet = {kind:'convert', fmt:'pdf-read', title: webTitle()}; render(); }
function startConvert(){
  const fmt = S.sheet.fmt, title = S.sheet.title.trim() || webTitle();
  S.sheet = {kind:'converting', fmt, title, step:0, prog:0, dismissable:false}; render();
  let p = 0;
  tick(()=>{ p += 4; const s = S.sheet; if(!s) return clearInterval(tick.t);
    s.prog = Math.min(100,p); s.step = p<25?0:p<50?1:p<85?2:p<100?3:4;
    if (p>=100){ clearInterval(tick.t);
      const isMd = fmt==='md';
      const d = isMd ? {id:'web-md', fmt:'md', title} : {id:'web', fmt:'web', title, pages: fmt==='pdf-orig'?3:4};
      S.docs = S.docs.filter(x=>x.id!==d.id); S.docs.push(d); S.newDoc=d.id; S.browser=null; S.sheet=null;
      openDoc(d.id);
      toast(isMd ? `已保存「${title}」为 Markdown（仅阅读）` : `已保存「${title}」· 可以划线和摘录了`);
      return; }
    render(); }, 90);
}

function bindReader(){
  const sc = $('.rscroll'); if (!sc) return;
  sc.onmouseup = () => setTimeout(()=>{
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()){ if (S.sel){ S.sel=null; document.querySelectorAll('.ftb').forEach(e=>e.remove()); } return; }
    const r = sel.getRangeAt(0).getBoundingClientRect(), w = win.getBoundingClientRect();
    const node = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
    const isMd = !!node.closest('.mdoc');
    S._range = sel.getRangeAt(0).cloneRange();
    const width = isMd ? 340 : 330;
    S.sel = {md:isMd, x: Math.max(10, r.left - w.left + r.width/2 - width/2), y: r.top - w.top - 48};
    document.querySelectorAll('.ftb').forEach(e=>e.remove());
    win.insertAdjacentHTML('beforeend', selToolbar());
  }, 0);
  sc.onscroll = () => { if (S.sel){ S.sel=null; document.querySelectorAll('.ftb').forEach(e=>e.remove()); } };
}
function excerpt(color){
  const r = S._range, d = doc(S.cur);
  if (r){ try { const span = document.createElement('span'); span.className = 'hl '+color+' flash'; r.surroundContents(span); } catch(e){} }
  const text = (r ? r.toString() : '').trim().slice(0, 90);
  S.hlCount[d.id] = (S.hlCount[d.id]||0)+1;
  window.getSelection().removeAllRanges();
  document.querySelectorAll('.ftb').forEach(e=>e.remove()); S.sel=null;
  S.customHtml[d.id] = $('.rscroll').innerHTML.replace(/ flash/g,'');
  const src = d.fmt==='web' ? '间隔重复为什么有效 · 第 1 页' : d.fmt==='mobi' ? '原则 · 2.1 · 第 101 页' : d.fmt==='epub' ? '慢下来的大脑 · 1.1 · 第 10 页' : '华为数字化转型 · 第 27 页';
  if (S.sync) { S.cards.push({color, fmt:d.fmt, q:text, src}); S.flashCard = S.cards.length-1; }
  S._keepScroll = true;
  toast(S.sync ? '已摘录到「主脑图」' : '已高亮', true, S.view==='reader' && S.sync ? ['查看',"setView('split')"] : null);
  later(()=>{S.flashCard=-1;},1800);
}

let curScene = -1;
function reset(){ clearTimers(); clearTimeout(toast.t); const dark = S?.dark ?? false; S = freshState(); S.dark = dark; }
function runScene(i){ curScene=i; SCENES[i].run(); drawDemo(); }
function drawDemo(){
  let g = '', html = '';
  SCENES.forEach((s,i)=>{ if (s.g!==g){ g=s.g; html += `<div class="dt">${g}</div>`; }
    html += `<button class="scn ${i===curScene?'on':''}" onclick="runScene(${i})"><span class="n">${i+1}</span><span>${s.n}<small>${s.d}</small></span></button>`; });
  $('#scenes').innerHTML = html;
  $('#guide').innerHTML = curScene<0 ? '左边是按当前应用还原的可操作原型（侧栏、标题栏、原文工具栏、脑图栏与现有界面一致），右边跳到各个场景。最后一个场景是现有 PDF 界面，方便对照。内容均为演示数据。' : SCENES[curScene].guide;
}
function setDark(v){ S.dark=v; $('#lt').classList.toggle('on',!v); $('#dk').classList.toggle('on',v); render(); }
function toggleDemo(){ $('#demo').classList.toggle('min'); document.body.classList.toggle('demo-min'); setTimeout(drawLinks, 300); }

S = freshState();
render(); drawDemo();
</script>
