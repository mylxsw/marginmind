:root{

  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  --mono:"SF Mono",Menlo,monospace;
  /* MMReaderStyle.white */
  --paper:#FFFFFF; --ink:#000000;
}
.dark{
  --win:#1E1E1F; --sidebar:rgba(44,44,47,.86); --reader:#1E1E1F; --canvas:#1E1E1F; --card:#2C2C2E;
  --label:#F5F5F7; --label2:#AEAEB2; --label3:#8E8E93; --icon:#AEAEB2; --toolIcon:#E5E5EA;
  --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.24); --fill4:rgba(118,118,128,.14);
  --sel:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06); --pressed:rgba(255,255,255,.12);
  --accent:#0A84FF; --accentTint:rgba(10,132,255,.22); --research:#7D7AFF;
  --glass:rgba(50,50,53,.82); --glassOpaque:#2C2C2E; --hair:rgba(255,255,255,.10); --line:rgba(235,235,245,.22); --excerpt:#D1D1D6;
  --root:#F5F5F7; --onRoot:#1D1D1F; --scrim:rgba(0,0,0,.35);
  --cardShadow:0 2px 10px rgba(0,0,0,.35); --pageShadow:0 0 0 .5px rgba(255,255,255,.06),0 2px 10px rgba(0,0,0,.4); --sheetShadow:0 24px 60px rgba(0,0,0,.55);
  --ok:#30D158; --caution:#FF9F0A; --err:#FF453A;
}
/* MMReaderStyle: paperColor / inkColor */

*{box-sizing:border-box}

/* ---------- Stage & device frames ---------- */
#desk{position:absolute;inset:0;right:316px;display:flex;align-items:center;justify-content:center;padding:16px;transition:right 260ms}
body.demo-min #desk{right:44px}
#frame{position:relative;flex:none;transform-origin:center center}
#win{position:relative;width:100%;height:100%;background:var(--win);overflow:hidden;display:flex}
.f-desktop{width:100%;height:100%;max-width:1512px;max-height:949px}

.f-desktop.os-win #win,.f-desktop.os-linux #win{border-radius:8px}

.webchrome{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:12px;color:#3c4043}

.sbar .r{display:flex;gap:5px;align-items:center}
.sbar .bat{width:24px;height:11px;border-radius:3px;border:1px solid currentColor;opacity:.8;position:relative}.sbar .bat::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:91}

.anav{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:108px;height:4px;border-radius:2px;background:var(--label);opacity:.55;z-index:91;pointer-events:none}

/* ---------- Sidebar (workspace_sidebar.dart) ---------- */
#side{position:relative;z-index:3;width:236px;flex:none;margin:8px 0 8px 8px;border-radius:16px;background:var(--sidebar);
  backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair),0 6px 24px rgba(0,0,0,.06);display:flex;flex-direction:column;padding:8px;overflow:hidden}
.lights{display:flex;gap:8px;height:28px;align-items:center;padding:0 6px}
.lights .dot{width:12px;height:12px;border-radius:6px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.grow{flex:1;min-width:0}

.ibtn:hover{background:var(--hover)}
.set{display:flex;align-items:center;gap:8px;height:36px;margin-top:10px;padding:0 4px 0 6px;font-weight:600;font-size:13.5px}
.set .ic{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.set .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:6px;height:28px;margin:6px 2px 8px;padding:0 8px;border-radius:8px;background:var(--fill4);color:var(--label3)}
.sec{font-size:11px;font-weight:600;color:var(--label2);height:28px;padding:0 4px 0 8px;margin-top:8px;display:flex;align-items:center}
.sec .add{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--icon);opacity:0}
#side:hover .sec .add,.sec .add.on,.touch .sec .add{opacity:1}
.sec .add:hover,.sec .add.on{background:var(--pressed);color:var(--label)}
.row{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:8px;white-space:nowrap;overflow:hidden;font-size:13px}
.row:hover{background:var(--hover)}.row.on{background:var(--sel)}
.row .ri{color:var(--accent);flex:none;display:flex}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row.tmp .t{color:var(--label2)}
.row .cnt{font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums}
.row .badge{min-width:22px;height:18px;padding:0 6px;border-radius:9px;background:var(--accentTint);color:var(--accent);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.row.new{animation:rowin 1.8s}
@keyframes rowin{0%,35%{background:var(--accentTint)}}

/* ---------- Main ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.titlebar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px 0 22px}
.titlebar .t{font-size:15px;font-weight:600;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.caption{display:flex;align-self:flex-start;height:32px;margin-right:-10px}
.caption span{width:46px;display:flex;align-items:center;justify-content:center;color:var(--label2)}
.capsule{display:flex;align-items:center;gap:2px;height:36px;padding:3px;border-radius:18px;background:var(--glass);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px var(--hair)}
.tb{position:relative;height:30px;min-width:30px;padding:0 6px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--toolIcon);flex:none}
.tb:hover{background:var(--hover)}.tb:active{background:var(--pressed)}
.tb.on{background:var(--accentTint);color:var(--accent)}

.tb.dis{opacity:.28;pointer-events:none}
.tdiv{width:1px;height:18px;background:var(--sep);margin:0 3px;flex:none}

[data-tip]{position:relative}
.ptr [data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);padding:3px 7px;border-radius:5px;background:rgba(40,40,42,.92);color:#fff;font-size:11px;white-space:nowrap;pointer-events:none;z-index:80;font-weight:400}

#content{flex:1;min-height:0;display:flex;position:relative}
#content.stack{flex-direction:column}
.pane{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}

.pane.hide{display:none}

/* Reader tool row (reader_pane.dart _toolbar) */
.rtools{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;position:relative;z-index:6}
.touch .rtools{height:50px}
.rbody{flex:1;min-height:0;display:flex;position:relative}
.rside{width:240px;flex:none;display:flex;flex-direction:column;border-right:.5px solid var(--sep);background:var(--win)}

.ti{display:flex;align-items:center;gap:6px;width:100%;text-align:left;min-height:28px;padding:0 8px;border-radius:7px;font-size:12.5px;white-space:nowrap}
.ti .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ti.l2{padding-left:22px;color:var(--label2)}
.ti .pg{color:var(--label3);font-size:11.5px;font-variant-numeric:tabular-nums}
.ti:hover{background:var(--hover)}.ti.on{background:var(--sel);color:var(--label)}
.touch .ti{min-height:44px;font-size:15px}
.an{display:flex;gap:8px;width:100%;text-align:left;padding:8px;border-radius:8px}

.an.warn .s{color:var(--caution)}
.lhead{font-size:11px;font-weight:600;color:var(--caution);padding:8px 8px 2px;display:flex;align-items:center;gap:4px}
.empty{padding:28px 12px;text-align:center;color:var(--label3);font-size:12px}
.thumbs{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:6px}
.thumb{width:110px;height:150px;border-radius:3px;background:#fff;box-shadow:var(--pageShadow);position:relative;overflow:hidden}
.thumb.on{box-shadow:0 0 0 2px var(--accent)}
.thumb + span{font-size:11px;color:var(--label2);margin-top:-6px}

/* PDF / fixed-layout pages */
.rview{flex:1;min-width:0;display:flex;position:relative}
.rscroll{flex:1;overflow:auto;position:relative;padding:4px 0 96px;background:var(--reader)}
.page{position:relative;margin:0 auto;background:var(--paper);color:var(--ink);box-shadow:var(--pageShadow);border-radius:3px;width:min(600px,calc(100% - 40px));padding:64px 62px}
.page + .page{margin-top:22px}

.page .pno{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:10px;color:#8e8e93}
.spread{display:flex;justify-content:center;gap:0;margin:0 auto 22px;width:min(860px,calc(100% - 40px))}
.fxp{flex:1;aspect-ratio:3/4;position:relative;overflow:hidden;box-shadow:var(--pageShadow);background:#fff}
.fxp .art{position:absolute;inset:0}

.one .fxp{max-width:460px}
.rscroll{container-type:inline-size}
@container (max-width:760px){.spread{flex-direction:column;align-items:center;gap:22px}.spread .fxp{flex:none;width:min(460px,100%)}}

/* Flowing reader */
.flow{flex:1;min-width:0;position:relative;display:flex;background:var(--paper);color:var(--ink)}
.fview{flex:1;min-width:0;position:relative}
.flow.scroll .fview{overflow:auto}
.flow.paged .fview{overflow:hidden;padding:40px 48px 96px}
.touch .flow.paged .fview{padding:28px 24px 96px}
.fclip{height:100%;overflow:hidden;margin:0 auto}
.fcol{font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);color:var(--ink);transition:transform 260ms cubic-bezier(.2,0,0,1)}
.flow.scroll .fcol{max-width:776px;margin:0 auto;padding:36px 48px 140px}
.touch .flow.scroll .fcol{max-width:728px;padding:24px 24px 160px}

.fcol p{margin:0 0 .8em;text-align:justify;text-indent:2em}

.fcol h2{font-size:1.35em;line-height:1.35;margin:0 0 1em;font-weight:600}

.fcol .by{font-family:var(--sans);font-size:.75em;opacity:.6;margin:0 0 1.6em;text-indent:0}

.fcol .fig{margin:.4em 0 1.2em;border-radius:6px;height:9em;background:linear-gradient(135deg,#dfe8f5,#efe4f2);break-inside:avoid}
.fcol .fig.remote{background:var(--fill4);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:12px}
.fcol .fig.remote button{color:var(--accent);display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px}
.fcol a{color:var(--accent);text-decoration:none}
.fcol.md{font-family:var(--ff)}
.fcol.md p{text-indent:0}
.fcol.md h1{font-size:1.7em}
.fcol.md h2{border-bottom:1px solid var(--sep);padding-bottom:.3em;margin-top:1.4em}
.fcol blockquote{margin:0 0 .8em;padding:0 0 0 1em;border-left:3px solid var(--line);opacity:.8}
.fcol pre{background:rgba(127,127,127,.12);border-radius:8px;padding:.8em 1em;overflow:auto;margin:0 0 1em;break-inside:avoid;line-height:1.6}
.fcol code{font-family:var(--mono);font-size:.82em}
.fcol table{border-collapse:collapse;margin:0 0 1em;font-size:.88em;width:100%;break-inside:avoid;line-height:1.6}

.fcol ul,.fcol ol{margin:0 0 .8em;padding-left:1.4em}
.fcol .task{list-style:none;margin-left:-1.3em}.fcol .task input{margin-right:.4em}
.fcol ::selection,.page ::selection,.fxp ::selection{background:rgba(0,122,255,.28)}
.hl{border-radius:2px;cursor:pointer}
.hl.y{background:rgba(255,204,0,.38)}.hl.g{background:rgba(52,199,89,.30)}.hl.b{background:rgba(0,122,255,.22)}.hl.p{background:rgba(255,45,85,.22)}.hl.o{background:rgba(255,149,0,.30)}
.hl.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px rgba(0,122,255,.45)}100%{box-shadow:0 0 0 0 rgba(0,122,255,0)}}
.ul{text-decoration:underline;text-decoration-color:#FF9500;text-decoration-thickness:2px;text-underline-offset:4px}
.mk-note{display:inline-block;width:8px;height:8px;border-radius:4px;background:#FFD60A;margin-left:2px;vertical-align:.35em}
/* Margin column (reader_margin.dart) beside the text column */
.mcol{width:220px;flex:none;border-left:1px dashed rgba(0,0,0,.13);padding:56px 14px 0;font-family:var(--sans)}
.rs-dark .mcol{border-left-color:rgba(255,255,255,.14)}

/* Bottom navigation (reader_pane.dart _PagePill: badge above chevrons + 1pt track) */
.rnav{position:absolute;left:16px;right:16px;bottom:16px;height:64px;z-index:5;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.rnav > *{pointer-events:auto}
.rnav .badge{height:28px;padding:0 12px;border-radius:18px;background:var(--glass);backdrop-filter:blur(20px);display:flex;align-items:center;font-size:12px;color:var(--label);font-variant-numeric:tabular-nums;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis}
.rnav .nrow{display:flex;align-items:center;width:100%;margin-top:8px;gap:4px}

.rnav .chev[disabled]{opacity:.3}

.rnav .track i{position:absolute;left:0;top:0;height:1px;background:var(--label3)}
.rnav .reveal{transition:opacity 150ms}
.ptr .rnav .reveal{opacity:0}
.ptr #reader:hover .rnav .reveal{opacity:1}

/* In-app browser: MMSizes.browserAddress=30, browserAddressTouch=36, browserProgressTrack=2. */
.url{flex:1;min-width:0;height:30px;border-radius:15px;background:var(--fill4);display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--label2);font-size:12.5px;position:relative;overflow:hidden}
.touch .url{height:36px;border-radius:18px}
.url input{flex:1;min-width:0;border:0;outline:none;background:none;color:var(--label)}
.url .bprog{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);transition:width 200ms}
.btn{height:28px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  background:var(--card);box-shadow:0 0 0 .5px var(--hair),0 1px 1.5px rgba(0,0,0,.08)}
.touch .btn{height:36px;padding:0 14px;border-radius:18px;font-size:15px}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--accent);color:#fff;box-shadow:none}
.btn.wide{width:100%;height:44px;border-radius:12px;font-size:16px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.pulse{animation:pulse 1.4s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(0,122,255,.22)}}
.webview{position:relative;flex:1;overflow:auto;background:#fff;color:#111;border-top:.5px solid var(--sep)}
.webview .site-nav{height:52px;display:flex;align-items:center;gap:20px;padding:0 28px;border-bottom:1px solid #eee;font-size:13px;color:#555;position:sticky;top:0;background:#fff;z-index:2}
.webview .site-nav b{font-size:16px;color:#111;margin-right:auto}
.webview .wrap{display:flex;gap:36px;padding:34px 40px 60px;max-width:980px;margin:0 auto}
.phone-l .webview .wrap{padding:20px 18px 120px}.phone-l .webview aside,.phone-l .webview .site-nav span{display:none}
.webview article{flex:1;min-width:0;font-family:Georgia,var(--serif);font-size:16px;line-height:1.8}
.webview article h1{font-family:var(--sans);font-size:28px;line-height:1.25;margin:6px 0 10px}
.webview .kick{font-family:var(--sans);font-size:12px;color:#c2410c;font-weight:600}
.webview .byl{font-family:var(--sans);font-size:13px;color:#666;margin-bottom:22px}
.webview .hero{height:190px;border-radius:10px;background:linear-gradient(135deg,#bfdbfe,#fbcfe8 60%,#fde68a);margin:0 0 22px}
.webview .hero.lazy{background:#f1f1f3;display:flex;align-items:center;justify-content:center}
.webview article p{margin:0 0 16px}
.webview aside{width:220px;flex:none;font-size:12.5px;color:#555}
.webview .ad{height:250px;border-radius:8px;background:repeating-linear-gradient(45deg,#f4f4f5 0 10px,#fafafa 10px 20px)}
.webview .cookie{position:sticky;bottom:12px;margin:0 auto;width:calc(100% - 40px);max-width:720px;border-radius:12px;background:#111;color:#eee;padding:12px 14px;font:12.5px var(--sans);display:flex;align-items:center;gap:12px}
.webview .cookie button{background:#fff;color:#111;border-radius:6px;padding:5px 10px;font-weight:600}
.webview .skel{padding:40px}
.webview .skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#f0f0f2,#e6e6ea,#f0f0f2);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--label2);text-align:center;padding:40px;background:var(--reader)}
.state .big{width:56px;height:56px;border-radius:16px;background:var(--fill4);display:flex;align-items:center;justify-content:center;color:var(--icon)}
.state b{font-size:15px;color:var(--label)}

/* Popovers & dropdowns (MMDropdownButton: glassOpaque, 14 radius, 30pt rows, 14pt icons) */
.pop{position:absolute;z-index:40;border-radius:14px;background:var(--glassOpaque);box-shadow:0 0 0 .5px var(--hair);padding:4px}
.pop.anim{animation:fin 140ms}
@keyframes fin{from{opacity:0;transform:translateY(-4px)}}
.mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;min-height:30px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:500}
.touch .mi{min-height:44px;font-size:15px}
.mi:hover{background:var(--hover)}
.mi .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .ck{width:14px;color:var(--accent);flex:none}
.mi .k{font-size:11.5px;color:var(--label3);font-weight:400}
.mi .sw{width:16px;height:16px;border-radius:3px;box-shadow:0 0 0 .5px var(--sep)}
.mi.dis{opacity:.35;pointer-events:none}
.msep{height:.5px;background:var(--sep);margin:4px 8px}
/* Reading settings */
.rset{padding:12px;display:flex;flex-direction:column;gap:10px}
.stepper{display:flex;align-items:center;height:36px;border-radius:10px;background:var(--fill4)}
.stepper button{width:64px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-family:var(--serif)}
.stepper button:hover{background:var(--hover)}.stepper button[disabled]{opacity:.3}
.stepper .dots{flex:1;display:flex;justify-content:center;gap:5px}
.stepper .dots i{width:5px;height:5px;border-radius:3px;background:var(--line)}
.stepper .dots i.on{background:var(--label)}
.seg{display:flex;height:28px;padding:2px;border-radius:14px;background:var(--fill4)}
.seg button{flex:1;height:24px;padding:0 8px;border-radius:12px;font-size:12px;color:var(--label2);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--label);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 .5px var(--hair)}
.touch .seg{height:36px;border-radius:18px}.touch .seg button{height:32px;border-radius:16px;font-size:14px}
.swatches{display:flex;justify-content:space-between;padding:2px 4px}
.swatches button{width:36px;height:36px;border-radius:18px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.swatches button.on{box-shadow:0 0 0 2px var(--accent)}
.ls{width:18px;height:14px;display:flex;flex-direction:column;justify-content:center}
.ls i{display:block;height:1.5px;background:currentColor;border-radius:1px}

/* Ready bubble (non-modal) */
.bubble{position:absolute;z-index:30;border-radius:14px;background:var(--glassOpaque);box-shadow:0 0 0 .5px var(--hair),0 12px 36px rgba(0,0,0,.18);padding:12px;display:flex;align-items:center;gap:10px}
.bubble.anim{animation:fin 220ms cubic-bezier(.2,0,0,1)}
.bubble::before{content:"";position:absolute;top:-6px;right:var(--ar,48px);width:12px;height:12px;background:var(--glassOpaque);transform:rotate(45deg);box-shadow:-.5px -.5px 0 var(--hair)}
.bubble b{font-size:13px;font-weight:600;white-space:nowrap;margin-right:auto}
.touch .bubble b{font-size:15px}

/* Selection toolbar (selection_toolbar.dart) */
.ftb{position:absolute;z-index:20;display:flex;align-items:center;gap:1px;height:38px;padding:4px 5px;border-radius:19px;background:var(--glassOpaque);box-shadow:0 0 0 .5px var(--hair),0 6px 20px rgba(0,0,0,.14);animation:fin 120ms}
.touch .ftb{height:48px;border-radius:24px;padding:4px 6px}
.cdot{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.touch .cdot{width:34px;height:40px}
.cdot i{width:14px;height:14px;border-radius:7px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.touch .cdot i{width:18px;height:18px;border-radius:9px}
.cdot.more i{background:conic-gradient(#FF3B30,#FFCC00,#34C759,#007AFF,#AF52DE,#FF3B30)}
.cdot:hover{background:var(--hover)}
.ftb .tb{height:28px;min-width:28px}
.touch .ftb .tb{height:40px;min-width:36px}

/* Sheets (showMMSheet) and bottom sheets (MMBottomSheet) */
.scrim{position:absolute;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center}
.scrim.anim{animation:sfade 160ms}
@keyframes sfade{from{opacity:0}}
.sheet{margin-top:56px;width:440px;border-radius:22px;background:var(--win);box-shadow:var(--sheetShadow),0 0 0 .5px var(--hair);overflow:hidden}
.scrim.anim .sheet{animation:sin 240ms cubic-bezier(.2,0,0,1)}
@keyframes sin{from{transform:translateY(-14px);opacity:0}}
.sheet.wide{width:640px}
.sheet .sh{padding:20px 22px 4px;font-size:15px;font-weight:600}
.sheet .sb{padding:14px 22px}
.sheet .sf{display:flex;align-items:center;gap:8px;padding:12px 22px 18px;justify-content:flex-end}
.scrim.bottom{align-items:flex-end}
.scrim.clear{background:none}
.bsheet{width:100%;border-radius:22px 22px 0 0;background:var(--win);box-shadow:var(--sheetShadow);display:flex;flex-direction:column;max-height:calc(100% - 54px);padding-bottom:34px}
.os-android .bsheet{padding-bottom:20px}
.scrim.anim .bsheet{animation:bin 260ms cubic-bezier(.2,0,0,1)}
@keyframes bin{from{transform:translateY(40%);opacity:.4}}
.bsheet .handle{height:20px;display:flex;align-items:center;justify-content:center;flex:none}
.bsheet .handle i{width:36px;height:5px;border-radius:3px;background:var(--line)}
.bsheet .bb{padding:4px 16px 12px;overflow:auto;flex:1}
.bsheet.medium{height:62%}
.bsheet.full{height:calc(100% - 54px)}
.bsheet .bh{display:flex;align-items:center;gap:8px;padding:0 16px 8px;font-size:17px;font-weight:600}
.field{display:flex;align-items:center;gap:8px;height:30px;border-radius:8px;padding:0 10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--sep)}
.touch .field{height:44px;border-radius:10px;font-size:16px}
.field:focus-within{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--accentTint)}
.field input{flex:1;border:0;outline:none;background:none;min-width:0}
.field.err{box-shadow:inset 0 0 0 1px var(--err)}
.ferr{font-size:11.5px;color:var(--err);margin-top:6px;min-height:16px}
.touch .ferr{font-size:13px}
.pf{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.pf:hover{background:var(--hover)}.pf .ri{color:var(--accent)}
.pf .tx{flex:1}
.alert{display:flex;gap:14px;padding:22px 22px 4px;align-items:flex-start}
.alert .ic{width:40px;height:40px;border-radius:12px;background:rgba(215,0,21,.10);color:var(--err);display:flex;align-items:center;justify-content:center;flex:none}
.alert b{font-size:14px;display:block;margin-bottom:4px}
.alert span{color:var(--label2);font-size:12.5px}
.conv{display:flex;gap:18px}
.conv .prev{width:200px;flex:none;height:260px;border-radius:12px;background:var(--fill4);padding:12px;overflow:hidden}
.phone-l .conv{flex-direction:column-reverse}.phone-l .conv .prev{width:100%;height:300px}
.conv .opts{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.pv{background:#fff;border-radius:3px;height:100%;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:14px;overflow:hidden;color:#222;font-size:7px;line-height:1.7;position:relative}
.pv h6{font-size:11px;margin:0 0 4px;font-family:var(--serif)}
.pv .ln{height:3px;border-radius:2px;background:#d4d4d8;margin:0 0 5px}
.pv .im{height:44px;border-radius:3px;background:linear-gradient(135deg,#bfdbfe,#fbcfe8 60%,#fde68a);margin:6px 0}
.pv .nav{height:10px;background:#f4f4f5;margin:-14px -14px 8px}
.pv .sd{position:absolute;right:14px;top:34px;width:40px;height:90px;background:repeating-linear-gradient(45deg,#f4f4f5 0 4px,#fafafa 4px 8px)}
.pv.mdp{font-family:var(--mono);font-size:8px;color:#444;white-space:pre-wrap;line-height:1.7}

/* Drop overlay */
.drop{position:absolute;inset:8px;z-index:55;border-radius:18px;background:rgba(0,122,255,.08);box-shadow:inset 0 0 0 2px var(--accent);display:flex;align-items:center;justify-content:center}
.drop .box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 34px;border-radius:18px;background:var(--glassOpaque);box-shadow:0 0 0 .5px var(--hair);color:var(--accent)}
.drop b{font-size:15px;color:var(--label)}
.ghost-file{position:absolute;z-index:56;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.25);transform:rotate(-3deg);font-size:12px;pointer-events:none;color:var(--label)}
.ghost-file .ri{color:var(--accent)}

/* HUD (MMHud) */
.hud{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;padding:9px 12px 9px 14px;border-radius:12px;
  background:var(--glassOpaque);box-shadow:0 0 0 .5px var(--hair),0 10px 30px rgba(0,0,0,.18);font-size:12.5px;white-space:nowrap}
.phone-l .hud{bottom:170px;font-size:14px}
.hud.anim{animation:hin 220ms cubic-bezier(.2,0,0,1)}
@keyframes hin{from{opacity:0;transform:translate(-50%,8px)}}
.hud .pbar{width:120px;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.hud .pbar i{display:block;height:100%;background:var(--accent)}
.hud .okc{color:var(--ok)}
.lbtn{height:24px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--accent);white-space:nowrap}
.lbtn:hover{background:var(--accentTint)}

/* Mind map pane (map_pane.dart) */
.mtools{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;position:relative;z-index:3}
.mtools .t{font-size:15px;font-weight:600;margin-right:auto}
.mtools .seg{width:128px}
.mstage{flex:1;position:relative;overflow:hidden}
.mworld{position:absolute;left:24px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:40px}
.phone-l .mworld{left:16px;gap:24px;transform:translateY(-50%) scale(.82);transform-origin:left center}
.mlinks{position:absolute;inset:0;pointer-events:none;overflow:visible;width:100%;height:100%}
.mroot{background:var(--root);color:var(--onRoot);font-weight:600;font-size:15px;padding:12px 20px;border-radius:12px;white-space:nowrap;flex:none;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.mkids{display:flex;flex-direction:column;gap:14px}
.mcard{position:relative;background:var(--card);border-radius:12px;box-shadow:var(--cardShadow);width:224px;padding:10px 30px 10px 18px}
.mcard .bar{position:absolute;left:7px;top:10px;bottom:10px;width:3px;border-radius:2px}
.mcard .q{font-family:var(--serif);font-size:13px;line-height:20px;color:var(--excerpt);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:3}
.mcard .s{font-size:10.5px;color:var(--label2);margin-top:6px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.mcard .go{position:absolute;top:8px;right:8px;color:var(--icon)}
.mcard.flash{animation:nflash 1.6s}
@keyframes nflash{0%,50%{box-shadow:0 0 0 3px rgba(0,122,255,.45),var(--cardShadow)}}
.mtopic{background:var(--fill);border-radius:10px;padding:8px 14px;font-weight:500;width:max-content}

/* Phone chrome */
.phone-l #main{padding-top:54px}
.phone-l.os-android #main{padding-top:36px}
.tablet-l,.medium-l{padding-top:24px}
.ptop{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 20px}
.ptop .t{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbar{position:absolute;left:16px;right:16px;bottom:30px;display:flex;padding:4px;height:60px;border-radius:30px;z-index:10;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 8px 24px rgba(0,0,0,.12),0 0 0 .5px var(--hair)}
.os-android .tabbar{height:64px;border-radius:32px;bottom:20px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--label);border-radius:26px}
.os-android .tabbar button{font-size:12px}
.tabbar button.on{color:var(--accent);font-weight:600;background:var(--accentTint)}
.phone-l .rnav{bottom:104px}
.phone-l .flow.paged .fview{padding-bottom:178px}
.phone-l .rscroll{padding-bottom:190px}

/* ---------- Demo console (outside the product) ---------- */
#demo{position:fixed;right:14px;top:14px;z-index:200;width:288px;max-height:calc(100% - 28px);overflow:auto;border-radius:14px;background:rgba(20,20,22,.94);color:#f2f2f7;
  box-shadow:0 10px 40px rgba(0,0,0,.35);font-size:12px;transition:transform 260ms}
#demo.min{transform:translateX(250px)}
#demo .dh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:600;position:sticky;top:0;background:rgba(20,20,22,.98);z-index:1}
#demo .dh button{color:#aeaeb2;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center}
#demo .dsec{padding:6px 12px}
#demo .dt{font-size:10.5px;color:#8e8e93;font-weight:600;margin:8px 0 6px}
#demo .scn{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:5px 8px;border-radius:8px;margin-bottom:1px;line-height:1.4}
#demo .scn:hover{background:rgba(255,255,255,.08)}
#demo .scn.on{background:rgba(10,132,255,.38)}
#demo .scn .n{width:18px;height:18px;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:10.5px;flex:none}
#demo .tg{display:flex;align-items:center;justify-content:space-between;padding:4px 2px;gap:8px}
#demo .seg{background:rgba(255,255,255,.08);height:26px}
#demo .seg button{color:#aeaeb2;height:22px;padding:0 6px;font-size:11px}
#demo .seg button.on{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
#demo .devs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#demo .devs button{height:24px;border-radius:6px;background:rgba(255,255,255,.08);color:#d1d1d6;font-size:11px}
#demo .devs button.on{background:rgba(10,132,255,.6);color:#fff}
#guide{margin:10px 12px 6px;padding:9px 10px;border-radius:10px;background:rgba(10,132,255,.22);line-height:1.55;font-size:11.5px;color:#e5e5ea}
#guide b{color:#fff}
</style>

const BOOK = () => `
<h2 id="c0">序言：两种速度</h2>
${P('我们每天做出成千上万个判断，其中绝大多数从未进入意识。走路、说话、读出一张脸上的情绪——这些事情快得像是自动发生的。这本书讨论的，是这种“快”与另一种“慢”之间的关系。')}
${P('慢的那一种需要努力。它计算、比较、怀疑，也会疲倦。我们以为自己大部分时候在用它，其实它常常只是在为快思考的结论签字。')}
${P('理解这两种速度，并不是为了让你永远慢下来，而是为了知道什么时候值得停一停。')}
<h2 id="c1">第一章 自动驾驶的心智</h2>
<h3 id="c1-1">1.1 快思考从不请假</h3>
${P('清晨醒来，你不需要思考就知道如何刷牙、如何系鞋带。大部分日常判断都由一套快速、自动、几乎不费力的系统完成。它擅长识别模式，也擅长在信息不足时给出一个“足够好”的答案。')}
${P('<span class="hl g" data-n="a1">当我们觉得一件事“显而易见”时，通常是快思考已经替我们回答了问题，而慢思考没有被叫醒。</span>这并不总是坏事：如果每个决定都要仔细推敲，我们会在日常琐事中耗尽精力。')}
${P('问题出现在那些看似简单、实则需要计算的场合。面对一道“球拍和球一共一元一角”的题目，大多数人会脱口而出一个错误答案，因为它<span class="ul">听起来对</span>。')}
${P('快思考不会请假，也不会举手说“这题我不会”。它总会给出一个答案，哪怕这个答案来自一个更容易的问题。')}
<h3 id="c1-2">1.2 注意力是稀缺品</h3>
${P('慢思考需要努力。当你在心算两位数乘法时，瞳孔会放大，心率会上升，你甚至很难同时走路。注意力像一笔有限的预算，花在这里，就不能花在那里。')}
${P('这也解释了为什么疲惫、饥饿或分心的人更容易做出冲动的选择：慢思考没有足够的资源来检查快思考的结论。<span class="hl y" data-n="a2">自控和认知努力从同一个账户里支取。</span><span class="mk-note"></span>')}
${P('在一项经典实验中，被要求记住一串七位数字的参与者，更可能在随后选择巧克力蛋糕而不是水果沙拉。记忆任务占用了本该用来克制的资源。')}
${P('这并不意味着我们注定被冲动支配，而是提醒我们：重要的决定，最好留给精力充沛的时候。')}
<h2 id="c2">第二章 慢下来的代价</h2>
<h3 id="c2-1">2.1 努力与自控</h3>
${P('把慢思考想象成一位懒惰的监督者。它能检查，但只在必要时才检查；而“必要”的标准，往往由快思考替它决定。')}
${P('当一项任务需要持续专注时，我们会感到一种轻微的不适。这种不适是信号：资源正在被消耗。很多人会在这时转向更轻松的事情，而不是坚持下去。')}
${P('训练可以让某些任务从慢变快。熟练的棋手看一眼棋盘就知道哪一步危险，这种直觉是长期练习沉淀下来的。')}
<h3 id="c2-2">2.2 认知放松</h3>
${P('当信息清晰、熟悉、重复出现时，我们会进入一种“认知放松”的状态。在这种状态下，我们更信任、更愉快，也更少怀疑。')}
${P('广告商深谙此道：一句反复出现的口号，会因为熟悉而显得可信。字体清楚的陈述，比字体模糊的同一句话更容易被判断为真。')}
${P('认知放松让生活轻松，但也让我们更容易被误导。适度的“困难”，有时反而能唤醒慢思考。')}
<h2 id="c3">第三章 记忆的两个自我</h2>
${P('经历的自我活在当下，回忆的自我负责讲故事。我们做选择时，往往听从的是后者。')}
${P('一段假期的价值，不取决于每一天的感受之和，而取决于它的高峰和结尾。回忆的自我会忽略持续时间，只记住几个片段。')}
${P('这解释了为什么一次以愉快收尾的不适经历，会比一次更短但突然结束的不适经历，留下更好的印象。')}
${P('当我们为未来做打算时，值得问一句：我在为哪一个自我做决定？')}`;
const MOBI = () => `

<p>《慢下来的大脑》第一章、第二章，以及 <a href="#" onclick="return false">这篇关于间隔重复的文章</a>。重点关注作者如何区分“快思考”和“慢思考”。</p>

/* ===================================================================== *

    notes: {

/* ===================================================================== *
 *  Rendering
 * ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const win = $('#win'), frame = $('#frame');
const doc = (id) => S.docs.find(d => d.id === id);
const curDoc = () => doc(S.cur);
const isBrowser = () => S.cur === '__browser';
const family = d => ['md','web'].includes(d.fmt) ? 'article' : 'book';
const flowOf = d => S.flow[family(d)];
function hostOf(u){ try{ return new URL(u).host; }catch{ return u; } }
const webTitle = () => '间隔重复为什么有效';
function firstShow(o){ if (o._shown) return ''; queueMicrotask(()=>{ o._shown = true; }); return ' anim'; }
let scale = 1;
const BEZEL = {tablet:18, phone:12, aphone:10};

function render(){
  document.body.classList.toggle('dark', S.dark);
  const v = dev(), l = v.layout;
  frame.className = (v.frame ? `dev ${v.frame}` : 'f-desktop') + ` os-${v.os}`;
  const pad = BEZEL[v.frame] || 0;
  frame.style.width = v.w ? v.w + pad*2 + 'px' : ''; frame.style.height = v.h ? v.h + pad*2 + 'px' : '';
  $('#fchrome').innerHTML = v.os === 'web' ? `<div class="webchrome"><span class="u">${ico('lock','i xs')}app.marginmind.example</span></div>` : '';
  win.className = `${l}-l os-${v.os} ${v.touch ? 'touch' : 'ptr'} ${v.frame==='tablet'&&l==='desktop'?'tablet-l':''}`;
  savePos();
  let h = '';
  if (l === 'phone') h += phoneApp();
  else if (l === 'medium') h += mediumApp();
  else h += (S.sideHidden ? '' : sidebar()) + `<div id="main">${titlebar()}<div id="content">${readerPane()}${mapPane()}</div></div>`;
  h += statusBar() + overlays();
  win.innerHTML = h;
  fit(); layoutFlow(); bindReader(); drawLinks();
}
function fit(){
  const v = dev(), desk = $('#desk');
  if (!v.w){ frame.style.transform=''; scale = 1; return; }
  const aw = desk.clientWidth - 32, ah = desk.clientHeight - 32;
  const fw = v.w + BEZEL[v.frame]*2, fh = v.h + BEZEL[v.frame]*2;
  scale = Math.min(1, aw/fw, ah/fh); frame.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', () => { if (S) render(); });
function statusBar(){
  const v = dev();
  if (v.frame === 'phone') return `<div class="island"></div><div class="sbar" style="height:54px"><span>9:41</span><span class="r">${ico('web','i xs')}<span class="bat"></span></span></div><div class="homeind"></div>`;
  if (v.frame === 'aphone') return `<div class="punch"></div><div class="sbar" style="height:36px;font-size:13px;padding:0 22px"><span>9:41</span><span class="r">${ico('web','i xs')}<span class="bat"></span></span></div><div class="anav"></div>`;
  if (v.frame === 'tablet') return `<div class="sbar" style="height:24px;font-size:12px;padding:0 22px"><span>9:41 10月29日 周四</span><span class="r"><span class="bat"></span></span></div>`;
  return '';
}

function sidebar(){
  const v = dev();
  const rows = S.docs.map(x => `
    <div class="row ${x.id===S.cur && !isBrowser() ? 'on':''} ${S.newDoc===x.id?'new':''}" onclick="openDoc('${x.id}')" title="${x.title}">
      <span class="ri">${dic(x)}</span><span class="t">${x.title}</span>${x.pages?`<span class="cnt">${x.pages}</span>`:''}

  return `<aside id="side">
    <div class="lights">${lights}<span class="grow"></span><button class="ibtn" data-tip="隐藏侧栏">${ico('sidebar')}</button></div>
    <div class="set"><span class="ic">${ico('studySet','i xs')}</span><span class="t">${SET}</span><button class="ibtn" data-tip="显示资料库">${ico('grid','i s')}</button></div>
    <div class="search">${ico('search','i s')}<span>搜索</span></div>
    <div class="sec">脑图</div>
    <div class="row"><span class="ri">${ico('mindMap','i s')}</span><span class="t">主脑图</span></div>
    <div class="sec"><span class="grow">文档</span><button class="add ${S.pop?.kind==='add'?'on':''}" data-tip="${addTip}" onclick="event.stopPropagation();addPressed(this)">${ico('add','i s')}</button></div>
    ${rows}${imp}${b}
    <div class="sec">学习</div>
    <div class="row"><span class="ri">${ico('review','i s')}</span><span class="t">复习</span><span class="badge">20</span></div>
  </aside>`;
}

function docTitle(){
  if (isBrowser()) return S.browser.phase==='error' ? hostOf(S.browser.url) : S.browser.phase==='loading' ? hostOf(S.browser.url) : webTitle();
  return curDoc()?.title || '';
}
function titlebar(){
  const v = dev();
  const cap = v.os==='win' ? `<div class="caption"><span>—</span><span>☐</span><span>✕</span></div>` : v.os==='linux' ? `<button class="ibtn" style="border-radius:14px;background:var(--fill)">${ico('close','i xs')}</button>` : '';

    <div class="capsule">

    <div class="capsule"><button class="tb ai" data-tip="助手">${ico('ai')}</button></div>${cap}

function mediumApp(){
  return `<div id="main"><div class="titlebar"><button class="ibtn" data-tip="显示侧栏">${ico('sidebar')}</button><span class="t">${docTitle()}</span>

  </div>`;

/* ---- Reader ---- */
function readerPane(){
  const hide = L()==='desktop' && S.view === 'map' ? 'hide' : '';
  if (isBrowser()) return `<section id="reader" class="pane ${hide}">${browserBar()}${browserBody()}</section>`;
  const d = curDoc();
  if (!d) return `<section id="reader" class="pane ${hide}"><div class="state"><div class="big">${ico('document','i xl')}</div><b>打开一份文档开始阅读</b></div></section>`;
  const sideHere = S.rside && L() !== 'phone';
  return `<section id="reader" class="pane ${hide} rs-${S.style}">
    ${readerTools(d)}
    <div class="rbody">
      ${sideHere ? `<div class="rside">${sidebarBody(d)}</div>` : ''}
      <div class="rview">${FLOWING(d.fmt) ? flowBody(d) : `<div class="rscroll">${d.fmt==='fixed' ? fixedBody() : pdfBody()}</div>`}${navBar(d)}</div>
    </div>
  </section>`;
}

/* Tool row: same order as reader_pane.dart. Flowing documents swap slot 2 (page zoom, disabled) and slot 3 (crop → reading settings). */
function readerTools(d){
  const flowing = FLOWING(d.fmt), l = L();
  const tool = (k, icon, label, k2) => `<button class="tb ${S.tool===k?'on':''}" data-tip="${label}${k2?' '+k2:''}" onclick="S.tool='${k}';render()">${ico(icon)}</button>`;
  const annotation = `<div class="capsule">
      ${tool('select','select','选择')}${tool('highlight','highlight','高亮',key('H',true))}${tool('underline','underline','下划线')}${tool('area','areaSelect','框选')}${tool('pen','pen','画笔',key('M',true))}
      <div class="tdiv"></div>
      <button class="tb ${S.sync?'on':''}" data-tip="摘录同步到脑图" onclick="S.sync=!S.sync;render()">${ico('syncToMap')}</button>
    </div>`;
  const nav = `<button class="tb ${S.rside?'on':''}" data-tip="${S.rside?'隐藏':'显示'}页面侧栏" onclick="toggleSide()">${ico('readerNavigation')}</button>`;
  const margin = `<button class="tb ${S.margin?'on':''}" data-tip="页边批注" onclick="S.margin=!S.margin;render()">${ico('captionsBubble')}</button>`;
  const compare = `<button class="tb" data-tip="对照阅读">${ico('compare')}</button>`;
  const settings = `<button class="tb ${S.pop?.kind==='rset'||S.sheet?.kind==='rset'?'on':''}" data-k="rset" data-tip="阅读设置" onclick="event.stopPropagation();openSettings(this)">${ico('readingSettings')}</button>`;
  const switcher = `<button class="tb ${S.pop?.kind==='switch'?'on':''}" data-tip="切换文档" onclick="event.stopPropagation();openPop('switch',this,340,true)">${ico('collections')}</button>`;
  if (l !== 'desktop'){
    // Compact and medium: navigation, tools, (medium: margin, compare), then reading settings or More.
    const more = flowing ? settings : `<button class="tb" data-tip="更多" onclick="event.stopPropagation();openPop('more',this,240,true)">${ico('more')}</button>`;
    return `<div class="rtools">${nav}${annotation}${l==='medium'?margin+compare:''}<span class="grow"></span>${more}${switcher}</div>`;
  }
  const zoom = flowing ? `<button class="tb dis" data-tip="页面">${ico('zoomControl')}</button>`
    : `<button class="tb ${S.pop?.kind==='zoom'?'on':''}" data-tip="页面" onclick="event.stopPropagation();openPop('zoom',this,280)">${ico('zoomControl')}</button>`;
  const slot3 = flowing ? settings : `<button class="tb ${d.fmt==='fixed'?'dis':''}" data-tip="裁掉白边">${ico('crop')}</button>`;
  return `<div class="rtools">
    ${nav}${zoom}${slot3}
    <button class="tb ${S.pop?.kind==='style'?'on':''}" data-tip="阅读外观" onclick="event.stopPropagation();openPop('style',this,240)">${ico('appearance')}</button>
    ${annotation}${margin}${compare}
    <span class="grow"></span>${switcher}
  </div>`;
}

/* Page sidebar. Flowing documents: outline, bookmarks, annotations (no thumbnails, no page numbers). */
function sidebarBody(d){
  const flowing = FLOWING(d.fmt);
  const tabs = (flowing ? [] : [['thumbnails','thumbnails','缩略图']]).concat([['outline','outline','目录'],['bookmarks','bookmark','书签'],['annotations','annotations','标注']]);
  const tab = flowing && S.rtab==='thumbnails' ? 'outline' : S.rtab;
  let body = '';
  if (tab === 'outline') body = outlineItems(d);
  else if (tab === 'thumbnails') body = `<div class="thumbs">${(d.fmt==='fixed'?[1,2,3]:[26,27,28]).map((n,i)=>`<div class="thumb ${i===0?'on':''}">${d.fmt==='fixed'?`<div class="art" style="position:absolute;inset:0;background:${FIXED_PAGES[i][0]}"></div>`:''}</div><span>${n}</span>`).join('')}</div>`;
  else if (tab === 'bookmarks'){
    const bm = S.bookmarks[d.id] || [];
    body = bm.length ? bm.map(b=>`<button class="an"><span class="bar" style="background:var(--label3)"></span><span style="min-width:0"><span class="q" style="font-family:var(--sans)">${b.ch}</span><span class="s">${b.q} · ${b.pct}%</span></span></button>`).join('') : `<div class="empty">没有书签</div>`;
  } else {
    const ns = S.notes[d.id] || [];
    const lost = ns.filter(n=>n.lost), ok = ns.filter(n=>!n.lost);
    const item = n => `<button class="an ${n.lost?'warn':''}" onclick="${n.lost?`toast('找不到原文位置',false,null,2600,true)`:`jumpTo('${n.id}')`}"><span class="bar" style="background:var(--${n.c})"></span><span style="min-width:0"><span class="q">${n.q}</span><span class="s">${n.ch}</span></span></button>`;
    body = ns.length ? (lost.length ? `<div class="lhead">${ico('warning','i xs')}需要确认 ${lost.length}</div>${lost.map(item).join('')}<div class="msep"></div>` : '') + ok.map(item).join('') : `<div class="empty">没有标注</div>`;
  }
  return `<div class="tabs">${tabs.map(([k,icon,l])=>`<button class="tb ${tab===k?'on':''}" data-tip="${l}" onclick="S.rtab='${k}';render()">${ico(icon,'i s')}</button>`).join('')}</div><div class="list">${body}</div>`;
}
function outlineItems(d){
  if (d.fmt === 'pdf') return [['第一章 华为管理变革',1,1],['1.1 向 IBM 学习',12,2],['1.2 IPD 的引入',27,2],['第二章 数字化转型',58,1]].map(([t,p,l],i)=>`<button class="ti l${l} ${i===2?'on':''}"><span class="tt">${t}</span><span class="pg">${p}</span></button>`).join('');
  if (d.fmt === 'fixed') return [['封面',1],['第一章',2],['第二章',4]].map(([t,p],i)=>`<button class="ti ${i===1?'on':''}"><span class="tt">${t}</span><span class="pg">${p}</span></button>`).join('');
  const tmp = document.createElement('div'); tmp.innerHTML = flowHtml(d);
  const cur = S.curHead;
  const hs = [...tmp.querySelectorAll('h1,h2,h3')];
  if (!hs.length) return `<div class="empty">没有目录</div>`;
  return hs.map(h=>`<button class="ti ${h.tagName==='H3'?'l2':''} ${h.id===cur?'on':''}" onclick="jumpToHeading('${h.id}')"><span class="tt">${h.textContent}</span></button>`).join('');
}

/* Fixed-layout EPUB: pages at the book's own size; spreads on a regular landscape window. */
function fixedBody(){
  const spread = L() === 'desktop';
  const pages = FIXED_PAGES.map(([bg, t]) => `<div class="fxp"><div class="art" style="background:${bg}"></div><div class="cap">${t}</div></div>`);
  let h = '';
  if (spread) for (let i = 0; i < pages.length; i += 2) h += `<div class="spread">${pages[i]}${pages[i+1]||''}</div>`;
  else h = pages.map(p=>`<div class="spread one">${p}</div>`).join('');
  return h;
}

function flowHtml(d){
  if (S.custom[d.id]) return S.custom[d.id];
  if (d.fmt === 'web') return WEB(d.title);
  return CONTENT[d.fmt]();
}
function flowBody(d){
  const f = flowOf(d), mode = f.mode;
  const fs = FONT_SIZES[f.size];
  const vars = `--fs:${fs}px;--lh:${SPACING[f.spacing]};--ff:${FONT_CSS[f.font]}`;
  const cls = d.fmt==='md' ? 'md' : d.fmt==='web' ? 'web' : 'book';
  const margin = S.margin && L() === 'desktop';
  const notes = (S.notes[d.id]||[]).filter(n=>n.note);
  return `<div class="flow ${mode}" style="${vars}">
    <div class="fview" id="fview">${mode==='paged' ? `<div class="fclip" id="fclip"><article class="fcol ${cls}" id="fcol">${flowHtml(d)}</article></div>` : `<article class="fcol ${cls}" id="fcol">${flowHtml(d)}</article>`}</div>
    ${margin ? `<div class="mcol">${notes.length ? notes.map(n=>`<div class="mnote">${n.note}</div>`).join('') : ''}</div>` : ''}
  </div>`;
}

/* Bottom navigation: badge = chapter · percent (flowing) or n / N (pages). */
function navBar(d){
  const flowing = FLOWING(d.fmt);
  const label = flowing ? `<span id="navlabel"></span>` : d.fmt==='fixed' ? '1 / 48' : `${Math.min(27, d.pages)} / ${d.pages}`;
  const chevrons = !flowing || flowOf(d).mode === 'paged';
  return `<div class="rnav"><div class="badge reveal" ${flowing?`onclick="openOutline()"`:''}>${label}</div>
    <div class="nrow">${chevrons?`<button class="chev reveal" data-tip="上一页" onclick="turn(-1)">${ico('chevronLeft','i s')}</button>`:''}<div class="track"><i id="navtrack" style="width:${flowing?0:9}%"></i></div>${chevrons?`<button class="chev reveal" data-tip="下一页" onclick="turn(1)">${ico('chevronRight','i s')}</button>`:''}</div></div>`;
}

/* ---- Flow layout (paged: CSS columns inside a clip; scroll: one column) ---- */
function layoutFlow(){
  const d = curDoc(), c = $('#fcol');
  if (!c || !d || !FLOWING(d.fmt)) return;
  const f = flowOf(d), want = S.pos[d.id] || 0;
  if (f.mode === 'paged'){
    const v = $('#fview'), clip = $('#fclip');
    const cs = getComputedStyle(v);
    const W = v.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const n = L()==='desktop' && W >= 1000 ? 2 : 1;
    const gap = n === 2 ? 64 : 48;
    const colW = n === 2 ? Math.min((W - gap) / 2, 600) : Math.min(W, 680);
    const viewW = n * colW + (n - 1) * gap;
    clip.style.width = viewW + 'px';
    c.style.columnCount = n; c.style.columnGap = gap + 'px'; c.style.width = viewW + 'px';
    S._step = viewW + gap;
    c.style.transition = 'none'; c.style.transform = 'none';
    const total = Math.max(1, Math.round((c.scrollWidth + gap) / S._step));
    S.pages = total; S.page = Math.min(total - 1, Math.round(want * Math.max(0, total - 1)));
    c.style.transform = `translateX(${-S.page * S._step}px)`;
    void c.offsetWidth; c.style.transition = '';
  } else {
    const v = $('#fview');
    v.scrollTop = want * (v.scrollHeight - v.clientHeight);
    v.onscroll = () => { if (S.sel) clearSel(); updateNav(); };
  }
  updateNav();
}
/* Reading position (0–1) of the flow currently in the DOM, whichever mode it was laid out in. */
function progress(){
  if ($('.flow')?.classList.contains('paged')) return S.pages <= 1 ? 0 : S.page / (S.pages - 1);
  const v = $('#fview'); const m = v.scrollHeight - v.clientHeight; return m <= 0 ? 1 : v.scrollTop / m;
}
function currentHeading(){
  const d = curDoc(), c = $('#fcol'); if (!c) return null;
  const hs = [...c.querySelectorAll('h1,h2,h3')]; if (!hs.length) return null;
  const base = c.getBoundingClientRect();
  let cur = hs[0];
  if (flowOf(d).mode === 'paged'){
    for (const h of hs) if (pageOf(h) <= S.page) cur = h;
  } else {
    const top = $('#fview').getBoundingClientRect().top + 40;
    for (const h of hs) if (h.getBoundingClientRect().top <= top) cur = h;
  }
  return cur;
}
function updateNav(){
  const d = curDoc(); if (!d || !FLOWING(d.fmt)) return;
  const p = progress(), h = currentHeading();
  S.curHead = h?.id;
  const lab = $('#navlabel'); if (lab) lab.textContent = `${h ? h.textContent : d.title} · ${Math.round(p*100)}%`;
  const t = $('#navtrack'); if (t) t.style.width = (p*100) + '%';
  const prev = $('.chev'); if (prev && flowOf(d).mode==='paged'){ const cs = document.querySelectorAll('.chev'); cs[0].toggleAttribute('disabled', S.page===0); cs[1].toggleAttribute('disabled', S.page>=S.pages-1); }
}
function savePos(){
  const d = curDoc(); if (!d || !FLOWING(d.fmt) || !$('#fcol') || S._skipSave) { S._skipSave = false; return; }
  S.pos[d.id] = progress();
}
function turn(delta){
  const d = curDoc(); if (!d || !FLOWING(d.fmt)) return;
  if (flowOf(d).mode === 'scroll'){ const v = $('#fview'); v.scrollBy({top: delta * (v.clientHeight - 40), behavior:'smooth'}); return; }
  const n = Math.max(0, Math.min(S.pages - 1, S.page + delta)); if (n === S.page) return;
  S.page = n; $('#fcol').style.transform = `translateX(${-n * S._step}px)`; clearSel();
  S.pos[d.id] = progress(); updateNav();
}
/* Page (0-based) that holds [el] in paged mode; offsets are measured from the untranslated column start. */
function pageOf(el){ const base = $('#fcol').getBoundingClientRect(); return Math.floor(((el.getBoundingClientRect().left - base.left) / scale + 1) / S._step); }
function goPage(p){ turn(p - S.page); }
function jumpToHeading(id){
  const d = curDoc(), el = $('#'+id); if (!el) return;
  if (flowOf(d).mode === 'paged') goPage(pageOf(el));
  else el.scrollIntoView({block:'start'});
  if (L()==='phone'){ S.sheet = null; render(); }
  else { S.curHead = id; updateNav(); }
}
function jumpTo(nid){
  const el = document.querySelector(`[data-n="${nid}"]`); if (!el) return;
  const d = curDoc();
  if (flowOf(d).mode === 'paged') goPage(pageOf(el));
  else el.scrollIntoView({block:'center'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { turn(1); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { turn(-1); e.preventDefault(); }
  if (e.key === 'Escape') { if (S.pop || S.sheet || S.sel){ S.pop=null; S.sheet=null; S.sel=null; render(); } }
});

    ${d && d.origin==='web' ? `<div class="msep"></div><button class="mi"><span class="ck"></span>${ico('openExternal','i s')}<span class="tx">打开原网页</span></button><button class="mi" onclick="recapture()"><span class="ck"></span>${ico('reload','i s')}<span class="tx">重新抓取</span></button>` : ''}</div></div>`;
  if (s.kind === 'picker') return `<div class="bsheet medium">${handle}<div class="bh">导入文档</div><div class="bb">${pickerList()}</div></div>`;
  if (s.kind === 'error'){ const [ic, why] = ERR[s.err]; return `<div class="bsheet">${handle}<div class="alert" style="padding-top:4px"><div class="ic">${ico(ic,'i l')}</div><div><b>无法导入「${s.name}」</b><span>${why}</span></div></div><div class="bb"><button class="btn pri wide" onclick="closeSheet()">好</button></div></div>`; }

function setView(v){ S.view = v; render(); }
function setTab(t){ S.tab = t === 'library' || t === 'review' ? S.tab : t; render(); if (t==='library'||t==='review') toast(t==='library'?'资料库':'复习', false); }
function openDoc(id){ savePos(); S._skipSave = true; S.cur = id; S.sel=null; S.pop=null; if (L()==='phone') S.sheet=null; render(); }
function focusBrowser(){ savePos(); S._skipSave = true; S.cur='__browser'; S.sel=null; S.pop=null; render(); }
function toggleSide(){ if (L()==='phone'){ S.sheet = {kind:'side'}; render(); return; } S.rside = !S.rside; render(); }
function openOutline(){ S.rtab='outline'; if (L()==='phone'){ S.sheet={kind:'side'}; render(); } else { S.rside = true; render(); } }
function anchorRect(el){
  const r = el.getBoundingClientRect(), wr = win.getBoundingClientRect();
  return {l:(r.left-wr.left)/scale, r:(r.right-wr.left)/scale, b:(r.bottom-wr.top)/scale, W: wr.width/scale};
}
function openPop(kind, el, w, alignRight){
  if (S.pop?.kind===kind){ S.pop=null; render(); return; }
  if (L()==='phone' && kind==='switch'){ S.sheet={kind:'switch'}; render(); return; }
  const a = anchorRect(el);
  let x = alignRight ? a.r - w : a.l - 4;
  x = Math.max(12, Math.min(x, a.W - w - 12));
  S.pop = {kind, x, y: a.b + 6, w}; render();
}
function openSettings(el){ if (L()==='phone'){ S.sheet = S.sheet?.kind==='rset' ? null : {kind:'rset'}; render(); return; } openPop('rset', el, 280, L()!=='desktop'); }
function addPressed(el){ if (dev().browser) openPop('add', el, 240); else openPicker(); }
function setFlow(k, v){
  const d = curDoc(), f = flowOf(d); savePos(); S._skipSave = true;
  if (k === 'size') f.size = Math.max(0, Math.min(FONT_SIZES.length-1, f.size + v)); else f[k] = v;
  render();
}
function closeSheet(){ clearTimers(); S.sheet=null; render(); }
function toast(text, ok=true, action=null, ms=2600, warn=false){ S.hud = {text, ok, action, warn}; render(); clearTimeout(toast.t); toast.t = setTimeout(()=>{ S.hud=null; render(); }, ms); }
let timers = [];
function later(fn, ms){ const t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; clearInterval(tick.t); }
function tick(fn, ms){ clearInterval(tick.t); tick.t = setInterval(fn, ms); }
document.addEventListener('click', (e)=>{ if (S.pop && !e.target.closest('.pop')) { S.pop=null; render(); } });

function openPicker(){ S.pop=null; S.sheet={kind:'picker'}; render(); }
function importBook(fmt){
  const meta = {epub:{id:'epub', title:'慢下来的大脑'}, mobi:{id:'mobi', title:'原则'}, fixed:{id:'fixed', title:'小王子（绘本）', pages:48}, md:{id:'md', title:'读书会讨论提纲'}}[fmt];
  S.sheet = null; S.docs = S.docs.filter(d=>d.id!==meta.id); if (S.cur===meta.id) S.cur='pdf';
  S.importing = {title: meta.title}; render();
  later(()=>{ S.importing = null; S.docs.push({...meta, fmt}); S.newDoc = meta.id; S.pos[meta.id] = 0; openDoc(meta.id); toast(`已导入「${meta.title}」`); }, 1100);
}
function importError(err, name){ S.sheet = {kind:'error', err, name}; render(); }

function openAddWeb(url){ S.pop=null; S.sheet={kind:'addweb', url: url ?? 'blog.example.com/spaced-repetition', err:''}; render(); later(()=>{ const i=$('#urlIn'); if(i){i.focus();i.select();} },50); }
function normalizeUrl(v){
  v = (v||'').trim(); if (!v) return {err:'请输入网址'};
  if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = 'https://' + v;
  let u; try { u = new URL(v); } catch { return {err:'网址无效'}; }
  if (!['http:','https:'].includes(u.protocol)) return {err:'只支持 http 和 https'};
  if (!u.hostname.includes('.') && u.hostname!=='localhost') return {err:'网址无效'};
  return {url:u.href};
}
function submitUrl(){ const r = normalizeUrl(S.sheet.url); if (r.err){ S.sheet.err=r.err; render(); $('#urlIn')?.focus(); return; } S.sheet=null; loadUrl(r.url); }
function browse(v){ const r = normalizeUrl(v); if (!r.err) loadUrl(r.url); }
function loadUrl(url, mode='ok'){
  clearTimers(); savePos(); S._skipSave = true;
  S.browser = {url, phase:'loading', prog:4, prompt:false, cookie:true, pulse:false};
  S.cur = '__browser'; S.sel=null; render();
  const fail = mode==='error' || /\.invalid/.test(url);
  tick(()=>{
    const b = S.browser; if (!b || b.phase!=='loading') return clearInterval(tick.t);
    b.prog = Math.min(mode==='slow'?72:100, b.prog + (b.prog<60?6:3));
    if (fail && b.prog > 30){ clearInterval(tick.t); b.phase='error'; render(); return; }
    if (b.prog >= 100){ clearInterval(tick.t); render();
      // Ready = main frame loaded + network and DOM quiet for 800 ms.
      later(()=>{ if (S.browser?.phase==='loading'){ S.browser.phase='ready'; S.browser.prompt=true; S.browser.pulse=true; render(); } }, 800);
      return; }
    if (mode==='slow' && b.prog>=72){ clearInterval(tick.t); render();
      later(()=>{ if (S.browser?.phase==='loading'){ S.browser.phase='slow'; S.browser.prompt=true; render(); } }, 1600);
      return; }
    render();
  }, 120);
}
function dismissPrompt(){ if (S.browser?.prompt){ S.browser.prompt=false; render(); } }
function closeBrowser(){ clearTimers(); S.browser=null; S.cur = S.docs[0].id; render(); }
function openConvert(){ if(!S.browser) return; S.browser.prompt=false; S.sheet = {kind:'convert', fmt:'read', title: webTitle()}; render(); }
function startConvert(){
  const fmt = S.sheet.fmt, title = S.sheet.title.trim() || webTitle();
  S.sheet = null; let p = 0;
  S.hud = {text:'正在保存', prog:0}; render();
  tick(()=>{ p += 8; S.hud = {text:'正在保存', prog:Math.min(100,p), _shown:true};
    if (p >= 100){ clearInterval(tick.t);
      const d = fmt==='md' ? {id:'web-md', fmt:'md', title, origin:'web'} : fmt==='pdf' ? {id:'web-pdf', fmt:'pdf', title, origin:'web', pages:3} : {id:'web', fmt:'web', title, origin:'web'};
      S.docs = S.docs.filter(x=>x.id!==d.id); S.docs.push(d); S.newDoc=d.id; S.browser=null; S.pos[d.id]=0;
      openDoc(d.id); toast(`已保存「${title}」`);
      return; }
    render(); }, 90);
}
/* Refetch: reopen the source in the built-in browser (logins, lazy content), then update the same document. */
function recapture(){
  const d = curDoc(); S.pop=null; S.sheet=null;
  loadUrl('https://blog.example.com/spaced-repetition'); S.browser.update = d.id; render();
}
function updateDoc(){
  const id = S.browser.update; let p = 0; S.browser.prompt = false;
  S.hud = {text:'正在保存', prog:0}; render();
  tick(()=>{ p += 10; S.hud = {text:'正在保存', prog:Math.min(100,p), _shown:true};
    if (p>=100){ clearInterval(tick.t);
      (S.notes[id] = S.notes[id] || []).forEach((n,i)=>{ if (i===0) n.lost = true; });
      S.browser = null; delete S.custom[id]; openDoc(id);
      toast('1 处标注需要确认', false, ['查看', "S.rtab='annotations';toggleSideOpen()"], 5000, true); return; }
    render(); }, 90);
}
function toggleSideOpen(){ S.hud=null; if (L()==='phone'){ S.sheet={kind:'side'}; } else S.rside = true; render(); }

function clearSel(){ if (S.sel){ S.sel=null; document.querySelectorAll('.ftb').forEach(e=>e.remove()); } }
function bindReader(){
  const sc = $('#fview') || $('.rscroll'); if (!sc) return;
  sc.onmouseup = (e) => setTimeout(()=>{
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()){
      clearSel();
      // Paged mode: the outer quarters of the text turn pages (touch and click).
      const d = curDoc();
      if (d && FLOWING(d.fmt) && flowOf(d).mode==='paged' && !e.target.closest('a,button,.hl')){
        const r = sc.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
        if (x < .25) turn(-1); else if (x > .75) turn(1);
      }
      return;
    }
    const r = sel.getRangeAt(0).getBoundingClientRect(), w = win.getBoundingClientRect();
    S._range = sel.getRangeAt(0).cloneRange();
    const width = L()==='phone' ? 350 : 420, W = w.width/scale;
    let y = (r.top - w.top)/scale - (L()==='phone'?58:48);
    const top = (sc.getBoundingClientRect().top - w.top)/scale;
    if (y < top + 4) y = (r.bottom - w.top)/scale + 10;
    S.sel = {x: Math.max(10, Math.min(W - width - 10, (r.left - w.left)/scale + r.width/scale/2 - width/2)), y};
    document.querySelectorAll('.ftb').forEach(e=>e.remove());
    win.insertAdjacentHTML('beforeend', selToolbar());
  }, 0);
}
function wrapRange(cls){
  const r = S._range; if (!r) return '';
  try { const span = document.createElement('span'); span.className = cls; span.dataset.n = 'n' + Date.now(); r.surroundContents(span); return span.dataset.n; } catch(e){ return ''; }
}
function persistFlow(){ const d = curDoc(); if (d && FLOWING(d.fmt) && $('#fcol')) S.custom[d.id] = $('#fcol').innerHTML.replace(/ flash/g,''); }
function underline(){ wrapRange('ul'); window.getSelection().removeAllRanges(); clearSel(); persistFlow(); }
function excerpt(color){
  const d = curDoc(); const text = (S._range ? S._range.toString() : '').trim().slice(0, 90);
  const id = wrapRange('hl ' + color + ' flash');
  window.getSelection().removeAllRanges(); clearSel(); persistFlow(); savePos(); S._skipSave = true;
  const ch = FLOWING(d.fmt) ? (currentHeading()?.textContent || d.title) : '第 27 页';
  (S.notes[d.id] = S.notes[d.id] || []).push({id, c:color, q:text, ch});
  if (S.sync){ S.cards.push({color, fmt:d.origin==='web'?'web':d.fmt, q:text, src:`${d.title} · ${ch}`}); S.flashCard = S.cards.length-1; }
  toast(S.sync ? '已摘录到「主脑图」' : '已高亮', true, S.view==='reader' && S.sync && L()==='desktop' ? ['查看',"setView('split')"] : null);
  later(()=>{S.flashCard=-1;},1800);
}

function fakeSelect(text){
  const c = $('#fcol'); if (!c) return;
  const w = document.createTreeWalker(c, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())){ const i = n.textContent.indexOf(text); if (i >= 0){
    const d = curDoc(); const r = document.createRange(); r.setStart(n, i); r.setEnd(n, i + text.length);
    if (flowOf(d).mode==='paged') goPage(pageOf(r));
    later(()=>{ const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); const sc = $('#fview'); sc.onmouseup({clientX:0, target:sc}); }, 320);
    return; } }
}
let curScene = -1;
function reset(device){ clearTimers(); clearTimeout(toast.t); const dark = S?.dark ?? false; S = freshState(device); S.dark = dark; S._skipSave = true; }
function runScene(i){ curScene=i; reset(SCENES[i].dev); render(); SCENES[i].run(); drawDemo(); }
function setDevice(k){ const keep = {cur:S.cur, docs:S.docs, browser:S.browser, flow:S.flow, style:S.style, custom:S.custom, notes:S.notes, cards:S.cards, pos:S.pos};
  savePos(); reset(k); Object.assign(S, keep); S._skipSave = true; curScene = -1; render(); drawDemo(); }
function drawDemo(){
  $('#devs').innerHTML = Object.entries(DEVICES).map(([k,v])=>`<button class="${S.device===k?'on':''}" onclick="setDevice('${k}')">${v.label}</button>`).join('');
  let g = '', html = '';
  SCENES.forEach((s,i)=>{ if (s.g!==g){ g=s.g; html += `<div class="dt">${g}</div>`; }
    html += `<button class="scn ${i===curScene?'on':''}" onclick="runScene(${i})"><span class="n">${i+1}</span><span>${s.n}</span></button>`; });
  $('#scenes').innerHTML = html;
  $('#guide').innerHTML = curScene<0 ? '按当前应用还原的可操作原型。上方切换设备，下方跳到各场景。规格见 <b>docs/phase-4-ui.md</b>。' : SCENES[curScene].guide;
}
function setDark(v){ S.dark=v; $('#lt').classList.toggle('on',!v); $('#dk').classList.toggle('on',v); render(); }
function toggleDemo(){ $('#demo').classList.toggle('min'); document.body.classList.toggle('demo-min'); setTimeout(render, 300); }

S = freshState('mac');
render(); drawDemo();
