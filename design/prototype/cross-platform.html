<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarginMind 跨平台适配 · 高保真交互原型</title>
<style>
/* Tokens mirror packages/mm_design (MMColors / MMTypography / MMRadii), same as phase-3-assistant.html. */
:root{
  --win:#FFFFFF; --sidebar:#F2F2F6; --reader:#EDEDF0; --canvas:#FBFBFD; --card:#FFFFFF; --page:#FFFFFF;
  --label:#1D1D1F; --label2:#636366; --label3:#8E8E93; --icon:#6E6E73; --sep:rgba(0,0,0,.09); --fill:rgba(120,120,128,.12); --fill4:rgba(120,120,128,.08);
  --sel:rgba(0,0,0,.075); --hover:rgba(0,0,0,.045); --pressed:rgba(0,0,0,.09);
  --accent:#007AFF; --accentFill:#0A66D0; --accentTint:rgba(0,122,255,.12); --onAccent:#fff;
  --glass:rgba(255,255,255,.86); --hair:rgba(0,0,0,.08); --line:rgba(60,60,67,.30); --excerpt:#3A3A3C;
  --root:#1D1D1F; --onRoot:#fff; --scrim:rgba(0,0,0,.22);
  --cardShadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --sheetShadow:0 24px 60px rgba(0,0,0,.25);
  --research:#5E5CE6; --researchTint:rgba(94,92,230,.10);
  --ok:#28A745; --warn:#C27C0E; --err:#D70015;
  --y:#FFCC00; --g:#34C759; --b:#007AFF; --p:#FF2D55; --o:#FF9500; --v:#AF52DE;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
}
.dark{
  --win:#1E1E1F; --sidebar:#2A2A2D; --reader:#262628; --canvas:#1C1C1E; --card:#2C2C2E; --page:#FFFFFF;
  --label:#F5F5F7; --label2:#AEAEB2; --label3:#8E8E93; --icon:#AEAEB2; --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.24); --fill4:rgba(118,118,128,.14);
  --sel:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06); --pressed:rgba(255,255,255,.12);
  --accent:#0A84FF; --accentTint:rgba(10,132,255,.20);
  --glass:rgba(50,50,53,.88); --hair:rgba(0,0,0,.5); --line:rgba(235,235,245,.26); --excerpt:#D1D1D6;
  --root:#F5F5F7; --onRoot:#1D1D1F; --scrim:rgba(0,0,0,.4);
  --cardShadow:0 2px 10px rgba(0,0,0,.35); --sheetShadow:0 24px 60px rgba(0,0,0,.55);
  --research:#7D7AFF; --researchTint:rgba(125,122,255,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--sans);font-size:13px;color:#1D1D1F;-webkit-font-smoothing:antialiased}
body{background:#E9EAEE;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:14px;height:14px}.i.l{width:20px;height:20px}.i.xl{width:24px;height:24px}

/* ---------- Prototype chrome (outside the device) ---------- */
#top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid rgba(0,0,0,.08);flex-wrap:wrap}
#top h1{font-size:14px;margin:0 8px 0 0;font-weight:700;white-space:nowrap}
.seg{display:inline-flex;background:rgba(120,120,128,.12);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{height:26px;padding:0 10px;border-radius:6px;font-size:12px;color:#3a3a3c;white-space:nowrap}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:#000;font-weight:600}
.seg button .tag{display:inline-block;margin-left:4px;font-size:10px;padding:0 4px;border-radius:4px;background:#FF9500;color:#fff;font-weight:700}
.grp{display:flex;align-items:center;gap:6px}
.grp label{font-size:11px;color:#8e8e93}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 30% 20%,#f4f6fb,#dfe2ea)}
#scaler{transform-origin:center center;position:relative}
#info{flex:none;width:360px;background:#fff;border-left:1px solid rgba(0,0,0,.08);overflow:auto;padding:16px 18px 40px}
#info h2{font-size:16px;margin:0 0 2px}
#info .sub{color:#8e8e93;font-size:12px;margin-bottom:12px}
#info h3{font-size:12px;margin:16px 0 6px;color:#636366;text-transform:uppercase;letter-spacing:.04em}
#info ul{margin:0;padding-left:18px}
#info li{margin:4px 0;line-height:1.45}
#info{overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px}
.b-ok{background:rgba(40,167,69,.13);color:#1e7e34}.b-warn{background:rgba(255,149,0,.15);color:#9a5b00}.b-err{background:rgba(215,0,21,.11);color:#b00012}.b-na{background:rgba(120,120,128,.14);color:#636366}
.issue{border:1px solid rgba(0,0,0,.08);border-radius:10px;padding:8px 10px;margin:6px 0;line-height:1.45}
.issue b{font-size:12px}.issue code{font-size:11px;background:rgba(120,120,128,.12);padding:0 3px;border-radius:3px}
.issue .p{float:right}
.kv{display:grid;grid-template-columns:86px 1fr;gap:3px 8px;font-size:12px}
.kv div:nth-child(odd){color:#8e8e93}
#hint{position:absolute;left:16px;bottom:12px;font-size:11px;color:#636366;background:rgba(255,255,255,.8);padding:6px 10px;border-radius:8px;max-width:520px;line-height:1.45}

/* ---------- Device frames ---------- */
.device{position:relative;background:#111;box-shadow:0 30px 80px rgba(0,0,0,.30),0 0 0 1px rgba(0,0,0,.4)}
.device.tablet{border-radius:38px;padding:18px}
.device.phone{border-radius:56px;padding:12px}
.device.aphone{border-radius:40px;padding:10px}
.device.desktop{border-radius:12px;padding:0;background:transparent;box-shadow:0 30px 80px rgba(0,0,0,.30),0 0 0 .5px rgba(0,0,0,.35)}
.device.browser{border-radius:12px;padding:0;background:#dee1e6;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.screen{position:relative;overflow:hidden;background:var(--win);color:var(--label)}
.tablet .screen{border-radius:22px}.phone .screen{border-radius:46px}.aphone .screen{border-radius:32px}
.desktop .screen{border-radius:12px}
.browser .screen{border-radius:0 0 12px 12px}

/* status bars, home indicator */
.sbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;z-index:50;pointer-events:none;color:var(--label)}
.sbar .r{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:60}
.punch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:7px;background:#000;z-index:60}
.homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--label);opacity:.85;z-index:60;pointer-events:none}
.anav{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:108px;height:4px;border-radius:2px;background:var(--label);opacity:.6;z-index:60}

/* desktop title bars */
.tb-mac .lights{position:absolute;top:18px;left:18px;display:flex;gap:8px;z-index:40}
.tb-mac .lights span{width:12px;height:12px;border-radius:6px}
.tb-win{height:32px;display:flex;align-items:center;background:var(--sidebar);border-bottom:1px solid var(--sep);font-size:12px}
.tb-win .ttl{display:flex;align-items:center;gap:8px;padding-left:12px;flex:1}
.tb-win .ctl{display:flex;height:100%}
.tb-win .ctl span{width:46px;display:flex;align-items:center;justify-content:center}
.tb-win .ctl span:hover{background:var(--hover)}.tb-win .ctl span.x:hover{background:#C42B1C;color:#fff}
.menubar{height:28px;display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--win);border-bottom:1px solid var(--sep);font-size:12px}
.menubar span{padding:3px 8px;border-radius:4px}.menubar span:hover{background:var(--hover)}
.tb-gtk{height:46px;display:flex;align-items:center;padding:0 8px;background:var(--sidebar);border-bottom:1px solid var(--sep);gap:8px}
.tb-gtk .ttl{flex:1;text-align:center;font-weight:700;font-size:13px}
.tb-gtk .x{width:24px;height:24px;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center}
.chrome-tabs{height:38px;display:flex;align-items:flex-end;padding:0 8px;gap:2px}
.chrome-tabs .tab{height:32px;background:#fff;border-radius:8px 8px 0 0;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:12px;min-width:200px}
.chrome-url{height:40px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #d6d6d6}
.chrome-url .u{flex:1;height:28px;border-radius:14px;background:#f1f3f4;display:flex;align-items:center;padding:0 12px;font-size:12px;color:#3c4043;gap:6px}

/* ---------- App ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--win)}
.app .body{flex:1;display:flex;min-height:0;position:relative}
.side{flex:none;width:236px;margin:8px 0 8px 8px;border-radius:14px;background:var(--sidebar);box-shadow:0 0 0 .5px var(--hair);display:flex;flex-direction:column;padding:10px 8px;gap:2px;overflow:hidden;z-index:5}
.side.overlay{position:absolute;left:0;top:0;bottom:0;margin:8px;z-index:30;box-shadow:var(--sheetShadow);width:300px;transform:translateX(-110%);transition:transform 260ms cubic-bezier(.2,0,0,1)}
.side.overlay.open{transform:none}
.side h6{margin:10px 8px 4px;font-size:11px;color:var(--label3);font-weight:600}
.srow{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:8px;color:var(--label);font-size:13px}
.srow .i{color:var(--accent)}
.srow.on{background:var(--sel);font-weight:600}
.srow .n{margin-left:auto;color:var(--label3);font-size:12px}
.touch .srow{height:44px;font-size:15px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.tbar{flex:none;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px}
.touch .tbar{height:calc(56px + var(--it,0px));padding-top:var(--it,0px)}
.tbar .ttl{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .ttl small{display:block;font-weight:400;font-size:11px;color:var(--label3)}
.tbar .sp{flex:1}
.tbtn{height:32px;min-width:32px;padding:0 8px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--icon)}
.tbtn:hover{background:var(--hover)}
.tbtn.on{background:var(--accentTint);color:var(--accent)}
.touch .tbtn{height:44px;min-width:44px}
.pill{display:inline-flex;background:var(--fill4);border-radius:10px;padding:2px;box-shadow:0 0 0 .5px var(--hair)}
.pill .tbtn{height:28px;border-radius:8px}.touch .pill .tbtn{height:38px;min-width:40px}
.btn{height:30px;padding:0 14px;border-radius:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:var(--fill)}
.btn.pri{background:var(--accentFill);color:#fff}
.touch .btn{height:44px;border-radius:22px;padding:0 18px;font-size:15px}

/* library */
.lib{flex:1;overflow:auto;padding:8px 24px 24px}
.lib h4{margin:12px 0 10px;font-size:17px}
.cont{display:flex;align-items:center;gap:12px;background:var(--fill4);border-radius:12px;padding:12px;max-width:380px}
.cont .cv{width:52px;height:64px;border-radius:8px;background:linear-gradient(#cfe3ff,#9cc6ff);display:flex;align-items:center;justify-content:center}
.cont .cv i{width:28px;height:36px;background:#fff;border-radius:2px;display:block}
.prog{height:4px;border-radius:2px;background:var(--fill);margin-top:8px}.prog i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.grid{display:grid;gap:18px}
.set{display:flex;flex-direction:column;gap:6px;user-select:none}
.set .cv{aspect-ratio:1.18;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .5px var(--hair)}
.set .cv i{width:34%;height:72%;background:#fff;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.12);display:block}
.set b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set small{color:var(--label3);font-size:11px}
.list .set{flex-direction:row;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--sep)}
.list .set .cv{width:44px;aspect-ratio:.8}
.list .set .t{flex:1;min-width:0;display:flex;flex-direction:column}
.list{display:flex;flex-direction:column}
.touch .set b{font-size:15px}.touch .set small{font-size:12px}

/* workspace */
.ws{flex:1;display:flex;min-height:0;position:relative}
.ws.vert{flex-direction:column}
.pane{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.reader{background:var(--reader)}
.rtools{flex:none;display:flex;align-items:center;gap:2px;padding:6px 10px}
.rpage{flex:1;overflow:auto;padding:12px 18px 40px}
.page{background:var(--page);color:#1d1d1f;margin:0 auto;max-width:560px;padding:44px 48px 56px;box-shadow:0 1px 3px rgba(0,0,0,.12);font-family:var(--serif);line-height:1.9;font-size:14px}
.page h2{font-size:20px;margin:0 0 4px;font-weight:600}
.page .meta{font-size:10px;color:#8e8e93;font-family:var(--sans);margin-bottom:18px}
.page h3{font-size:14px;margin:18px 0 6px}
.page p{margin:0 0 10px;text-indent:2em;border-radius:3px;transition:background 160ms}
.page p.hl{background:rgba(255,204,0,.42)}
.page p.sel{background:rgba(0,122,255,.22)}
.compact .page{padding:24px 20px 32px;font-size:15px}
.divider{flex:none;width:1px;background:var(--sep);position:relative}
.vert .divider{width:auto;height:1px}
.grab{position:absolute;z-index:6;background:var(--fill);border-radius:3px}
.divider .grab{top:50%;left:-3px;width:7px;height:44px;transform:translateY(-50%)}
.vert .divider .grab{left:50%;top:-3px;height:7px;width:44px;transform:translateX(-50%)}
.map{background:var(--canvas);touch-action:none}
.mhead{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px}
.mhead b{font-size:13px}
.mapvp{flex:1;position:relative;overflow:hidden;cursor:grab}
.mapvp.dragging{cursor:grabbing}
.scene{position:absolute;left:0;top:0;transform-origin:0 0}
.node{position:absolute;background:var(--card);border-radius:10px;box-shadow:var(--cardShadow);padding:8px 10px;font-size:12px;width:190px;line-height:1.4;user-select:none;border:1.5px solid transparent}
.node.root{background:var(--root);color:var(--onRoot);font-weight:700;font-size:13px;width:auto;white-space:nowrap;padding:10px 14px;border-radius:12px}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentTint),var(--cardShadow)}
.node .q{font-family:var(--serif);color:var(--excerpt);border-left:3px solid var(--y);padding-left:7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node .src{margin-top:5px;font-size:10px;color:var(--label3);display:flex;gap:4px;align-items:center}
.node.new{animation:pop 520ms cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.touch .node{font-size:13px;width:210px;padding:10px 12px}
.mctl{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;z-index:4}
.mctl .pill{background:var(--glass);backdrop-filter:blur(20px)}
.lp-ring{position:absolute;width:56px;height:56px;border-radius:28px;border:3px solid var(--accent);pointer-events:none;z-index:70;opacity:.0;transform:translate(-50%,-50%) scale(.4)}
.lp-ring.go{animation:ring 480ms linear forwards}
@keyframes ring{to{opacity:.8;transform:translate(-50%,-50%) scale(1)}}

/* floating selection toolbar */
.ftb{position:absolute;z-index:20;display:flex;gap:2px;background:var(--glass);backdrop-filter:blur(24px);border-radius:12px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.18),0 0 0 .5px var(--hair)}
.ftb button{height:32px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--label)}
.ftb button:hover{background:var(--hover)}
.ftb .dot{width:14px;height:14px;border-radius:7px}
.touch .ftb button{height:40px;font-size:14px}

/* menus, sheets */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:80;opacity:0;pointer-events:none;transition:opacity 220ms}
.scrim.on{opacity:1;pointer-events:auto}
.menu{position:absolute;z-index:90;min-width:220px;background:var(--glass);backdrop-filter:blur(30px);border-radius:12px;padding:5px;box-shadow:0 12px 40px rgba(0,0,0,.22),0 0 0 .5px var(--hair)}
.menu .mi{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:7px;font-size:13px;color:var(--label)}
.menu .mi:hover{background:var(--accent);color:#fff}
.menu .mi .k{margin-left:auto;color:var(--label3);font-size:12px}
.menu .mi:hover .k{color:#fff}
.menu .mi.red{color:var(--err)}
.menu hr{border:0;border-top:1px solid var(--sep);margin:4px 6px}
.touch .menu .mi{height:44px;font-size:15px}
.asheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:90;transform:translateY(110%);transition:transform 300ms cubic-bezier(.2,0,0,1)}
.asheet.on{transform:none}
.asheet .grpb{background:var(--glass);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;margin-top:8px}
.asheet .grpb .mi{height:56px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--accent);border-top:1px solid var(--sep)}
.asheet .grpb .mi:first-child{border-top:0}
.asheet .grpb .mi.red{color:var(--err)}
.asheet .grpb .hd{padding:14px;text-align:center;font-size:13px;color:var(--label3)}
.sheet{position:absolute;z-index:85;background:var(--win);box-shadow:var(--sheetShadow);display:flex;flex-direction:column;transition:transform 320ms cubic-bezier(.2,0,0,1),height 320ms cubic-bezier(.2,0,0,1)}
.sheet.bottom{left:0;right:0;bottom:0;border-radius:16px 16px 0 0;transform:translateY(105%)}
.sheet.bottom.on{transform:none}
.sheet.center{left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;border-radius:14px;transition:all 220ms}
.sheet.center.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.sheet .handle{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:6px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;padding:10px 14px;gap:8px;flex:none}
.sheet .sh b{flex:1;font-size:15px}
.sheet .sb{flex:1;overflow:auto;padding:4px 16px 16px}
.panel{flex:none;width:380px;border-left:1px solid var(--sep);display:flex;flex-direction:column;background:var(--win);z-index:8}
.panel.float{position:absolute;right:8px;top:8px;bottom:8px;border-radius:14px;border:0;box-shadow:var(--sheetShadow);transform:translateX(115%);transition:transform 300ms cubic-bezier(.2,0,0,1)}
.panel.float.on{transform:none}
.msg{margin:10px 0;line-height:1.55}
.msg.u{margin-left:auto;max-width:80%;background:var(--accentTint);padding:8px 12px;border-radius:14px 14px 4px 14px;width:fit-content}
.msg.a .cite{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;background:var(--researchTint);color:var(--research);font-size:10px;font-weight:700;margin:0 2px;vertical-align:1px}
.prop{border:1px solid var(--sep);border-radius:12px;padding:10px;margin:8px 0;background:var(--fill4)}
.prop .row{display:flex;gap:8px;margin-top:8px}
.composer{flex:none;margin:8px 12px 12px;border-radius:16px;box-shadow:0 0 0 1px var(--sep);padding:10px 12px;display:flex;align-items:flex-end;gap:8px;background:var(--win);transition:margin 280ms cubic-bezier(.2,0,0,1)}
.composer .in{flex:1;min-height:20px;color:var(--label3);outline:none}
.composer .in:focus{color:var(--label)}
.send{width:30px;height:30px;border-radius:15px;background:var(--accentFill);color:#fff;display:flex;align-items:center;justify-content:center}
.kbd{position:absolute;left:0;right:0;bottom:0;z-index:95;background:#D1D3D9;transform:translateY(100%);transition:transform 280ms cubic-bezier(.2,0,0,1);padding:8px 4px 26px}
.dark .kbd{background:#2b2b2d}
.kbd.on{transform:none}
.kbd .kr{display:flex;justify-content:center;gap:5px;margin:6px 0}

.tabbar button:active{transform:scale(1.08)}

.touch .rates button{height:60px;font-size:15px}

.toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,20px);background:rgba(30,30,32,.92);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:all 240ms;z-index:120;display:flex;gap:10px;align-items:center;white-space:nowrap;pointer-events:none}

.pencil .pt i{display:block;width:12px;height:30px;border-radius:6px 6px 2px 2px}
.pencil .pt.on{transform:translateY(-6px)}

.outline-box{position:absolute;border:2.5px dashed #FF3B30;border-radius:8px;pointer-events:none}
.num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:11px;background:#D70015;color:#fff;font-size:12px;font-weight:700;flex:none}
.outline-box .num{position:absolute;left:-11px;top:-11px;box-shadow:0 0 0 2px #fff}
.legend{flex:none;width:100%;background:rgba(20,20,22,.94);color:#fff;padding:14px 20px 26px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45}
.legend div{display:flex;gap:10px;align-items:flex-start}

const S = {

  t: {x: 40, y: 0, s: 1}, splitRatio: .5, viewList: false,
};
const plat = () => PLATFORMS.find(p => p.id === S.plat);

/* ======================= Rendering ======================= */
function seg(el, items, cur, on){
  el.innerHTML = items.map(([id, label, tag]) => `<button data-id="${id}" class="${id===cur?'on':''}">${label}${tag?`<span class="tag">${tag}</span>`:''}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (b) on(b.dataset.id); };
}
function renderTop(){
  seg(document.getElementById('segPlat'), PLATFORMS.map(p => [p.id, p.name, p.key ? '重点' : '']), S.plat, id => { S.plat = id; resetUi(); render(); });
  seg(document.getElementById('segScene'), SCENES.map(s => [s.id, s.name]), S.scene, id => { S.scene = id; resetUi(); render(); });
  seg(document.getElementById('segMode'), [['design','目标设计'],['real','现状（实测）']], S.mode, id => { S.mode = id; render(); });
  seg(document.getElementById('segTheme'), [['light','浅色'],['dark','深色']], S.theme, id => { S.theme = id; render(); });
}
function resetUi(){
  Object.assign(S, {sideOpen:false, menu:null, sheet:null, kbd:false, flip:false, selPara:null, selNode:null});
  S.panel = S.scene === 'assistant';
  if (S.scene === 'export') S.sheet = 'export';
  const sc = sizeClass(plat());
  S.tab = S.scene === 'review' ? 'review' : S.scene === 'library' ? 'library' : S.scene === 'export' ? 'map' : 'reader';
  if (S.scene === 'workspace' && sc !== 'compact') S.tab = 'map';
  S.t = {x: 20, y: 0, s: 1, fit: true};
}

function insets(p){
  // Safe-area insets in points: status bar / home indicator per device family.
  if (p.chrome === 'ipados') return {top: 32, bottom: 20, left: 0, right: 0};
  if (p.chrome === 'ios') return {top: 62, bottom: 34, left: 0, right: 0};
  if (p.chrome === 'android') return {top: p.frame === 'aphone' ? 40 : 28, bottom: p.frame === 'aphone' ? 0 : 16, left: 0, right: 0};
  return {top: 0, bottom: 0, left: 0, right: 0};
}

function statusBar(p){
  if (p.chrome === 'ipados') return `<div class="sbar" style="height:32px;font-size:13px;padding:0 24px"><span>9:41&nbsp;&nbsp;10月28日 周三</span><span class="r">${ic('wifi','s')}<span>100%</span><span style="width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;display:inline-block;position:relative"><i style="position:absolute;inset:1px;background:currentColor;border-radius:1px"></i></span></span></div><div class="homeind"></div>`;

  if (p.chrome === 'android') return `${p.frame==='aphone'?'<div class="punch"></div>':''}<div class="sbar" style="height:${insets(p).top}px;font-size:13px;font-weight:500;padding:0 22px"><span>9:41</span><span class="r">${ic('wifi','s')}<span>100%</span></span></div><div class="anav"></div>`;
  return '';
}

function deviceFrame(p, inner){
  const scr = `<div class="screen" style="width:${p.w}px;height:${p.h}px">${inner}</div>`;
  if (p.frame === 'browser') {
    return `<div class="device browser" style="width:${p.w}px"><div class="chrome-tabs"><div class="tab">${ic('book','s')} MarginMind <span style="margin-left:auto;opacity:.5">${ic('x','s')}</span></div></div>

  }
  if (p.frame === 'desktop') return `<div class="device desktop">${scr}</div>`;
  if (p.splitView) {
    // iPad landscape with MarginMind on the left half and Files on the right.
    return `<div class="device tablet"><div style="display:flex;gap:8px;background:#000;border-radius:22px;overflow:hidden;width:${1376}px;height:${p.h}px">${scr}

  return `<div class="device ${p.frame}">${scr}</div>`;

function mapNodes(sc){
  const base = [
    {id:'root', x:40, y:220, root:true, t:'遗忘曲线与间隔重复'},
    {id:'n1', x:330, y:60, q:'最初的几个小时里遗忘得最快，之后速度逐渐放缓。', src:'p.1'},
    {id:'n2', x:330, y:190, q:'熟悉感只说明我们“认得”，不能保证需要时“想起来”。', src:'p.1'},
    {id:'n3', x:330, y:330, t:'间隔重复', topic:true},
    {id:'n4', x:600, y:300, q:'在快要遗忘的时候复习，每次成功回忆让下一次遗忘更晚。', src:'p.1'},
  ];
  S.added.forEach((i, k) => base.push({id:'a'+i, x:600, y:420 + k*110, q:PARAS[i][1].slice(0,44)+'…', src:'p.1', fresh: k === S.added.length-1}));
  return base;
}
function mapPane(p, sc){
  const touch = p.input === 'touch';
  const nodes = mapNodes(sc);
  const pos = Object.fromEntries(nodes.map(n => [n.id, n]));
  const edges = [['root','n1'],['root','n2'],['root','n3'],['n3','n4'], ...S.added.map(i => ['n3','a'+i])];
  const path = ([a,b]) => { const A = pos[a], B = pos[b]; const ax = A.x + (A.root?200:(touch?210:190)), ay = A.y + 22, bx = B.x, by = B.y + 22; const mx = (ax+bx)/2; return `<path d="M${ax} ${ay} C${mx} ${ay},${mx} ${by},${bx} ${by}" fill="none" stroke="var(--line)" stroke-width="1.6"/>`; };
  const nodeHtml = n => n.root
    ? `<div class="node root ${S.selNode==='root'?'sel':''}" data-node="root" style="left:${n.x}px;top:${n.y}px">${n.t}</div>`
    : `<div class="node ${S.selNode===n.id?'sel':''} ${n.fresh?'new':''}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px">${n.topic?`<b>${n.t}</b>`:`<div class="q">${n.q}</div><div class="src">${ic('locate','s')} 第二章 · ${n.src}</div>`}</div>`;
  const hint = touch ? '单指拖动平移 · 双指缩放 · 长按节点打开菜单 · 长按后拖动移动' : '拖动空白处框选 · 触控板双指平移/缩放 · 右键节点打开菜单';
  const single = sc === 'compact' || S.pane !== 'split' || p.splitView;
  return `<div class="pane map" style="flex:${single?1:1-S.splitRatio}">
    ${sc==='compact'?'':`<div class="mhead"><b>主脑图</b><div style="flex:1"></div><div class="pill"><button class="tbtn on" style="font-size:12px;padding:0 10px">脑图</button><button class="tbtn" style="font-size:12px;padding:0 10px">大纲</button></div>${touch?`<button class="tbtn" data-act="selectmode" title="多选">${ic('grid','s')}</button>`:''}<button class="tbtn" data-act="export" title="导出">${ic(p.input==='touch'?'share':'export','s')}</button></div>`}
    <div class="mapvp" id="mapvp"><div class="scene" id="scene" style="transform:translate(${S.t.x}px,${S.t.y}px) scale(${S.t.s})">
      <svg width="1100" height="900" style="position:absolute;left:0;top:0;overflow:visible">${edges.map(path).join('')}</svg>${nodes.map(nodeHtml).join('')}</div>
      <div style="position:absolute;left:12px;bottom:${sc==='compact'?(touch?100:12):14}px;font-size:11px;color:var(--label3);max-width:60%">${hint}</div>
      <div class="mctl"><div class="pill"><button class="tbtn" data-act="zoom" data-d="-1">${ic('minus','s')}</button><button class="tbtn" style="font-size:12px;min-width:48px" data-act="zoom" data-d="0">${Math.round(S.t.s*100)}%</button><button class="tbtn" data-act="zoom" data-d="1">${ic('plus','s')}</button></div></div>
    </div></div>`;
}

function workspace(p, sc){
  if (sc === 'compact') {

      <div class="ws">${v==='map'?mapPane(p, 'medium'):readerPane(p, 'medium')}</div>`;

    if (sc === 'compact') {

  } else {
    main = wsToolbar(p, sc) + workspace(p, sc);
  }
  const chrome = p.frame === 'desktop' ? desktopChrome(p) : '';
  const rowTop = p.chrome === 'win' || p.chrome === 'gtk' ? chrome : '';
  const side = sc === 'compact' ? '' : sidebar(p, sc);
  const sideInline = side && !side.includes('overlay');
  // Touch: the toolbar's glass reaches behind the status bar.
  return `<div class="app ${touch?'touch':''} ${sc}" style="padding-top:${touch?0:ins.top}px;padding-bottom:${showTabs?0:ins.bottom}px;--it:${ins.top}px">
    ${rowTop}${p.chrome==='mac'?chrome:''}
    <div class="body">${sideInline?side:''}<div class="main">${main}</div>${!sideInline?side:''}</div>
    ${showTabs?tabBar(p):''}
    ${overlays(p, sc)}
  </div>${statusBar(p)}`;
}

function hint(){
  const p = plat();
  const t = S.mode === 'real' ? '“现状（实测）”展示本轮在模拟器 / Linux / Chrome 中的真实截图与问题标注；没有截图的平台说明未实测原因。'

function render(){
  renderTop();
  const p = plat();
  const inner = `<div class="${S.theme==='dark'?'dark':''}" style="position:absolute;inset:0;color:var(--label)">${S.mode === 'real' ? realView(p) : app(p)}</div>`;
  const scaler = document.getElementById('scaler');
  scaler.innerHTML = deviceFrame(p, inner);
  fit();
  renderInfo(); hint();
  bindMap();
}
function fit(){
  const st = document.getElementById('stage'), sc = document.getElementById('scaler');
  const d = sc.firstElementChild; if (!d) return;
  sc.style.transform = 'none';
  const r = d.getBoundingClientRect();
  const k = Math.min((st.clientWidth - 40) / r.width, (st.clientHeight - 60) / r.height, 1);
  sc.style.transform = `scale(${k})`;
  S.k = k;
}
window.addEventListener('resize', fit);

/* ======================= Interaction ======================= */
function toast(html){
  const t = document.getElementById('toast'); if (!t) return;
  t.innerHTML = html; t.classList.add('on');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600);
}
function screenPoint(e){
  const scr = document.querySelector('.screen').getBoundingClientRect();
  return {x: (e.clientX - scr.left) / S.k, y: (e.clientY - scr.top) / S.k};
}
function sel(){ return window.getSelection && window.getSelection().removeAllRanges(); }

document.getElementById('scaler').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const p = plat(), sc = sizeClass(p);
  const act = a.dataset.act;
  if (act === 'para') {
    const i = +a.dataset.i; S.selPara = S.selPara === i ? null : i; render();
    if (S.selPara != null) showSelectionToolbar(i);
    return;
  }
  if (act === 'side') { S.sideOpen = !S.sideOpen; render(); return; }
  if (act === 'dismiss') { S.menu = null; S.sheet = null; S.sideOpen = false; S.kbd = false; if (needsFloatingPanel(p, sc)) S.panel = false; render(); return; }
  if (act === 'goto') { S.scene = a.dataset.scene; resetUi(); render(); return; }
  if (act === 'open') { if (pressed.long) return; S.scene = 'workspace'; resetUi(); render(); return; }
  if (act === 'panel') { S.panel = !S.panel; S.kbd = false; render(); return; }
  if (act === 'pane') { S.pane = a.dataset.v; render(); return; }
  if (act === 'tab') { const v = a.dataset.v; if (v === 'library') { S.scene = 'library'; S.tab = 'library'; } else { if (S.scene === 'library') S.scene = 'workspace'; S.tab = v; } S.menu = null; render(); return; }
  if (act === 'view') { S.viewList = a.dataset.v === 'list'; render(); return; }
  if (act === 'zoom') { const d = +a.dataset.d; S.t.s = d === 0 ? 1 : Math.max(.4, Math.min(2.5, S.t.s * (d > 0 ? 1.2 : 1/1.2))); render(); return; }
  if (act === 'flip') { S.flip = !S.flip; render(); return; }
  if (act === 'rate') { S.flip = false; render(); toast('已记录 · 下一张'); return; }
  if (act === 'export') { S.sheet = 'export'; render(); return; }
  if (act === 'import') { S.sheet = 'import'; render(); return; }
  if (act === 'imported') { S.sheet = null; render(); toast('已导入并复制进学习集'); return; }
  if (act === 'menuitem') { const l = a.dataset.l; S.menu = null; if (l.startsWith('导出')) S.sheet = 'export'; render(); if (!l.startsWith('导出')) toast(`${l}`); return; }
  if (act === 'winmenu') { const r = a.getBoundingClientRect(), s = document.querySelector('.screen').getBoundingClientRect(); S.menu = {kind:'win', x:(r.left - s.left)/S.k, y:(r.bottom - s.top)/S.k + 2}; render(); return; }
  if (act === 'compose') { if (p.input === 'touch' && !S.kbd) { S.kbd = true; render(); const el = document.querySelector('[data-act=compose]'); el && el.focus(); } return; }
  if (act === 'kbdoff') { S.kbd = false; render(); return; }
  if (act === 'accept') { S.added.push(6); render(); toast('已添加 1 张卡片 · <a data-act="tab" data-v="map">查看脑图</a>'); return; }
  if (act === 'selectmode') { toast('多选模式：单指拖动框选，再点一次退出'); return; }
  if (act === 'more') { S.menu = {kind:'node', x: 0, y: 0}; render(); return; }
});

function showSelectionToolbar(i){
  const p = plat(), sc = sizeClass(p);
  const el = document.querySelector(`p[data-i="${i}"]`); if (!el) return;
  const scr = document.querySelector('.screen').getBoundingClientRect(), r = el.getBoundingClientRect();
  const x = (r.left - scr.left) / S.k + 20, y = Math.max(insets(p).top + 60, (r.top - scr.top) / S.k - (p.input === 'touch' ? 54 : 44));
  const tb = document.createElement('div'); tb.className = 'ftb'; tb.style.left = x + 'px'; tb.style.top = y + 'px';
  tb.innerHTML = `<button data-x="excerpt">${ic('excerpt','s')}摘录到脑图</button>${['#FFCC00','#34C759','#FF2D55'].map(c=>`<button data-x="hl"><span class="dot" style="background:${c}"></span></button>`).join('')}<button data-x="ask" style="color:var(--research)">${ic('spark','s')}问助手</button><button data-x="copy">拷贝</button>`;
  tb.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return; ev.stopPropagation();
    if (b.dataset.x === 'excerpt') {
      if (!S.added.includes(i)) S.added.push(i);
      S.selPara = null; render();
      toast(sc === 'compact' || S.pane === 'reader' ? '已加入“间隔重复”分支 · <a data-act="tab" data-v="map">查看脑图</a>' : '已加入脑图 · 原文定位已建立');
    } else if (b.dataset.x === 'ask') { S.selPara = null; S.panel = true; render(); }
    else { S.selPara = null; if (b.dataset.x === 'hl' && !S.added.includes(i)) S.added.push(i); render(); }
  };
  document.querySelector('.app').appendChild(tb);
}
document.getElementById('scaler').addEventListener('click', e => {
  const a = e.target.closest('.toast a'); if (a) { S.tab = 'map'; if (sizeClass(plat()) !== 'compact') S.pane = S.pane === 'reader' ? 'split' : S.pane; render(); }
}, true);

/* long-press + context menu (touch) / right-click (pointer) */
const pressed = {t:null, long:false, start:null};
document.getElementById('scaler').addEventListener('contextmenu', e => {
  const p = plat(); const tgt = e.target.closest('[data-node],[data-ctx]'); if (!tgt) return;
  e.preventDefault();
  if (p.input === 'touch') { toast('触屏设备没有右键：请长按'); return; }
  openMenu(tgt, e);
});
function openMenu(tgt, e){
  const pt = screenPoint(e);
  if (tgt.dataset.node) S.selNode = tgt.dataset.node;
  S.menu = {kind: tgt.dataset.ctx || 'node', x: pt.x, y: pt.y};
  render();
}
document.getElementById('scaler').addEventListener('pointerdown', e => {
  const p = plat(); if (p.input !== 'touch') return;
  const tgt = e.target.closest('[data-node],[data-ctx]'); if (!tgt) return;
  pressed.long = false; pressed.start = {x: e.clientX, y: e.clientY};
  const ring = document.createElement('div'); ring.className = 'lp-ring';
  const pt = screenPoint(e); ring.style.left = pt.x + 'px'; ring.style.top = pt.y + 'px';
  document.querySelector('.app').appendChild(ring); requestAnimationFrame(() => ring.classList.add('go'));
  pressed.ring = ring;
  pressed.t = setTimeout(() => { pressed.long = true; ring.remove(); openMenu(tgt, e); }, 500);
});
['pointerup','pointercancel'].forEach(t => document.getElementById('scaler').addEventListener(t, () => { clearTimeout(pressed.t); pressed.ring && pressed.ring.remove(); setTimeout(() => pressed.long = false, 50); }));
document.getElementById('scaler').addEventListener('pointermove', e => {
  if (pressed.start && Math.hypot(e.clientX - pressed.start.x, e.clientY - pressed.start.y) > 8) { clearTimeout(pressed.t); pressed.ring && pressed.ring.remove(); pressed.start = null; }
});

/* map pan / zoom / select */
function bindMap(){
  const vp = document.getElementById('mapvp'); if (!vp) return;
  const scene = document.getElementById('scene');
  if (S.t.fit) {
    // Fit the sample map (about 840×560 scene points) into the viewport once.
    const w = vp.clientWidth, h = vp.clientHeight;
    S.t.s = Math.max(.5, Math.min(1, (w - 30) / 840, (h - 40) / 560));
    S.t.x = Math.max(10, (w - 840 * S.t.s) / 2); S.t.y = Math.max(0, (h - 560 * S.t.s) / 2 - 20 * S.t.s); S.t.fit = false;
    scene.style.transform = `translate(${S.t.x}px,${S.t.y}px) scale(${S.t.s})`;
    const z = vp.querySelector('[data-d="0"]'); if (z) z.textContent = Math.round(S.t.s * 100) + '%';
  }
  let drag = null;
  vp.onpointerdown = e => {
    if (e.button !== 0) return;
    const node = e.target.closest('[data-node]');
    drag = {x: e.clientX, y: e.clientY, tx: S.t.x, ty: S.t.y, moved: false, node: node && node.dataset.node};
    vp.setPointerCapture(e.pointerId);
  };
  vp.onpointermove = e => {
    if (!drag) return;
    const dx = (e.clientX - drag.x) / S.k, dy = (e.clientY - drag.y) / S.k;
    if (!drag.moved && Math.hypot(dx, dy) < 6) return;
    drag.moved = true; vp.classList.add('dragging');
    S.t.x = drag.tx + dx; S.t.y = drag.ty + dy;
    scene.style.transform = `translate(${S.t.x}px,${S.t.y}px) scale(${S.t.s})`;
  };
  vp.onpointerup = () => {
    if (drag && !drag.moved && !pressed.long) { S.selNode = drag.node || null; render(); }
    drag = null; vp.classList.remove('dragging');
  };
  vp.onwheel = e => {
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    const fx = (e.clientX - r.left) / S.k, fy = (e.clientY - r.top) / S.k;
    const f = Math.exp(-e.deltaY / 400), s = Math.max(.4, Math.min(2.5, S.t.s * f)), k = s / S.t.s;
    S.t.x = fx - (fx - S.t.x) * k; S.t.y = fy - (fy - S.t.y) * k; S.t.s = s;
    scene.style.transform = `translate(${S.t.x}px,${S.t.y}px) scale(${S.t.s})`;
    const z = vp.querySelector('[data-d="0"]'); if (z) z.textContent = Math.round(s * 100) + '%';
  };
  const div = document.querySelector('[data-act=divider]');
  if (div) div.onpointerdown = e => {
    const ws = div.parentElement, r = ws.getBoundingClientRect(), vert = ws.classList.contains('vert');
    div.setPointerCapture(e.pointerId);
    div.onpointermove = ev => {
      S.splitRatio = Math.max(.25, Math.min(.75, vert ? (ev.clientY - r.top) / r.height : (ev.clientX - r.left) / r.width));
      const [a,, b] = ws.children; a.style.flex = S.splitRatio; b.style.flex = 1 - S.splitRatio;
    };
    div.onpointerup = () => { div.onpointermove = null; };
  };
}

/* drag a file from the Files app (Split View) into MarginMind */
document.addEventListener('dragstart', e => { const f = e.target.closest && e.target.closest('[data-dragfile]'); if (f) e.dataTransfer.setData('text/plain', f.dataset.dragfile); });

document.addEventListener('drop', e => { if (!(e.target.closest && e.target.closest('.screen'))) return; e.preventDefault(); const n = e.dataTransfer.getData('text/plain'); if (n) toast(`已导入“${n}”`); });

resetUi();
