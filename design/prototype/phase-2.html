<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarginMind 二期 · 高保真交互原型</title>
<style>
/* Tokens mirror packages/mm_design (MMColors / MMTypography / MMRadii). */
:root{
  --win:#FFFFFF; --sidebar:rgba(242,242,246,.86); --reader:#EDEDF0; --canvas:#FBFBFD; --card:#FFFFFF; --page:#FFFFFF;
  --label:#1D1D1F; --label2:#636366; --icon:#6E6E73; --sep:rgba(0,0,0,.09); --fill:rgba(120,120,128,.12); --fill4:rgba(120,120,128,.08);
  --sel:rgba(0,0,0,.075); --hover:rgba(0,0,0,.045); --pressed:rgba(0,0,0,.09);
  --accent:#007AFF; --accentFill:#0A66D0; --accentTint:rgba(0,122,255,.12); --onAccent:#fff;
  --glass:rgba(255,255,255,.80); --hair:rgba(0,0,0,.08); --line:rgba(60,60,67,.24); --excerpt:#3A3A3C;
  --root:#1D1D1F; --onRoot:#fff; --scrim:rgba(0,0,0,.12);
  --cardShadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --sheetShadow:0 24px 60px rgba(0,0,0,.25);
  --research:#5E5CE6; --researchTint:rgba(94,92,230,.10);
  --ok:#28A745; --warn:#C27C0E; --err:#D70015;
  --y:#FFCC00; --g:#34C759; --b:#007AFF; --p:#FF2D55; --o:#FF9500; --v:#AF52DE;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  --mono:"SF Mono",Menlo,monospace;
}
.dark{
  --win:#1E1E1F; --sidebar:rgba(44,44,47,.86); --reader:#262628; --canvas:#1C1C1E; --card:#2C2C2E; --page:#FFFFFF;
  --label:#F5F5F7; --label2:#AEAEB2; --icon:#AEAEB2; --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.24); --fill4:rgba(118,118,128,.14);
  --sel:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06); --pressed:rgba(255,255,255,.12);
  --accent:#0A84FF; --accentTint:rgba(10,132,255,.20);
  --glass:rgba(50,50,53,.80); --hair:rgba(0,0,0,.5); --line:rgba(235,235,245,.22); --excerpt:#D1D1D6;
  --root:#F5F5F7; --onRoot:#1D1D1F; --scrim:rgba(0,0,0,.25);
  --cardShadow:0 2px 10px rgba(0,0,0,.35); --sheetShadow:0 24px 60px rgba(0,0,0,.55);
  --research:#7D7AFF; --researchTint:rgba(125,122,255,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--sans);font-size:13px;color:var(--label);-webkit-font-smoothing:antialiased}
body{background:linear-gradient(135deg,#c9d6e8 0%,#e6dcef 50%,#f1e2d6 100%);overflow:hidden}
body.dark{background:linear-gradient(135deg,#1b2333 0%,#2a2333 50%,#33281f 100%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:14px;height:14px}.i.xs{width:12px;height:12px}.i.l{width:18px;height:18px}

#desk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px 318px 18px 18px;transition:padding 260ms}
body.demo-min #desk{padding-right:58px}
#win{position:relative;width:100%;max-width:1520px;height:100%;max-height:940px;background:var(--win);border-radius:24px;overflow:hidden;
  box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 30px 80px rgba(0,0,0,.28);display:flex;transition:max-width 320ms cubic-bezier(.2,0,0,1)}
#win.narrow{max-width:1040px}

/* ---------- Sidebar ---------- */
#side{position:relative;z-index:3;width:236px;flex:none;margin:8px 0 8px 8px;border-radius:16px;background:var(--sidebar);
  backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair),0 6px 24px rgba(0,0,0,.06);
  display:flex;flex-direction:column;padding:10px 8px;gap:2px;overflow:hidden;transition:margin 320ms,width 320ms,opacity 200ms}
#win.side-off #side{width:0;margin-left:0;padding:0;opacity:0}
.lights{display:flex;gap:8px;height:28px;align-items:center;padding:0 6px}
.lights span{width:12px;height:12px;border-radius:6px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.side-set{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:8px;font-weight:600;font-size:13px}
.side-set .ic{width:22px;height:22px;border-radius:6px;background:linear-gradient(180deg,#5E9BFF,#2D6FE0);color:#fff;display:flex;align-items:center;justify-content:center}
.side-search{display:flex;align-items:center;gap:6px;height:28px;margin:4px 2px 6px;padding:0 8px;border-radius:8px;background:var(--fill4);color:var(--label2)}
.side-search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:13px}
.sec{font-size:11px;font-weight:600;color:var(--label2);padding:10px 8px 4px;display:flex;align-items:center}
.sec .grow{flex:1}
.row{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:8px;white-space:nowrap;overflow:hidden}
.row:hover{background:var(--hover)}.row.on{background:var(--sel)}
.row .ri{color:var(--accent);flex:none}.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.count{font-size:11px;color:var(--label2);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:9px;font-size:10.5px;font-weight:500;background:var(--fill);color:var(--label2);white-space:nowrap}
.pill.run{background:var(--researchTint);color:var(--research)}
.pill.ok{background:rgba(52,199,89,.14);color:#1f8a3b}.dark .pill.ok{color:#4cd964}
.pill.warn{background:rgba(255,149,0,.15);color:#b86200}.dark .pill.warn{color:#ffb340}
.pill.err{background:rgba(255,59,48,.12);color:#c4161c}.dark .pill.err{color:#ff6961}
.pill.ext{background:transparent;box-shadow:inset 0 0 0 1px var(--sep)}
.dot{width:6px;height:6px;border-radius:3px;background:currentColor;flex:none}
.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Main ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.toolbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;position:relative;z-index:4}
#win.side-off .toolbar{padding-left:118px}
.tb-lights{display:none;position:absolute;left:16px;top:14px;padding:0}
#win.side-off .tb-lights{display:flex}
.tb-title{min-width:0;margin-right:auto;display:flex;flex-direction:column;line-height:1.15}
.tb-title b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title span{font-size:11px;color:var(--label2)}
.capsule{display:flex;align-items:center;height:36px;padding:3px;border-radius:18px;background:var(--glass);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px var(--hair)}
.tbtn{position:relative;height:30px;min-width:30px;padding:0 7px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--icon)}
.tbtn:hover{background:var(--hover)}.tbtn:active{background:var(--pressed)}
.tbtn.on{background:var(--accentTint);color:var(--accent)}
.tbtn.research.on{background:var(--researchTint);color:var(--research)}
.tbtn .lbl{font-size:12px}
.tdiv{width:1px;height:16px;background:var(--sep);margin:0 3px}
.seg{display:flex;height:30px;padding:2px;border-radius:15px;background:var(--fill4)}
.seg button{height:26px;padding:0 10px;border-radius:13px;font-size:12px;color:var(--label2);display:flex;align-items:center;gap:4px}
.seg button.on{background:var(--card);color:var(--label);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 .5px var(--hair)}
.seg.sm{height:26px}.seg.sm button{height:22px;padding:0 8px;font-size:11.5px}
.tip{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);padding:3px 7px;border-radius:5px;background:rgba(40,40,42,.92);color:#fff;font-size:11px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 120ms .4s;z-index:50}
[data-tip]:hover>.tip{opacity:1}
.prog-capsule{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 12px;border-radius:15px;background:var(--glass);box-shadow:0 0 0 .5px var(--hair);font-size:12px;color:var(--label2)}
.prog-capsule .bar{width:80px;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.prog-capsule .bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width 300ms}

#content{flex:1;min-height:0;display:flex;position:relative;margin:0 8px 8px 8px;gap:0}
.pane{position:relative;min-width:0;border-radius:14px;overflow:hidden;transition:flex 320ms cubic-bezier(.2,0,0,1),opacity 200ms}
#reader{flex:1.05;background:var(--reader);display:flex;flex-direction:column}
#map{flex:1;background:var(--canvas);box-shadow:inset 0 0 0 .5px var(--sep)}
.vdiv{width:8px;flex:none;cursor:col-resize;position:relative}
.vdiv::after{content:"";position:absolute;left:3.5px;top:12px;bottom:12px;width:1px;background:transparent}
.pane.hide{flex:0 0 0 !important;opacity:0;pointer-events:none}
.vdiv.hide{display:none}

/* ---------- Reader ---------- */
.doc-tabs{display:flex;gap:4px;padding:6px 8px 0;flex:none}
.doc-tab{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:12px;color:var(--label2);max-width:240px}
.doc-tab .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-tab.on{background:var(--win);color:var(--label);box-shadow:0 0 0 .5px var(--hair)}
.doc-tab:hover:not(.on){background:var(--hover)}
.reader-scroll{flex:1;overflow:auto;position:relative;padding:18px 0 80px}
.page{position:relative;margin:0 auto;background:var(--page);color:#1d1d1f;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06);
  width:560px;padding:56px 58px 60px;transform-origin:top center;transition:width 200ms}
.page + .page{margin-top:16px}
.page .run-head{font-size:10px;color:#8e8e93;display:flex;justify-content:space-between;margin-bottom:26px;font-family:var(--sans)}
.page h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 6px}
.page h3{font-family:var(--serif);font-size:15.5px;font-weight:600;margin:22px 0 10px}
.page p{font-family:var(--serif);font-size:14.5px;line-height:2.05;margin:0 0 10px;text-align:justify;text-indent:2em}
.page .pno{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:10px;color:#8e8e93;font-family:var(--sans)}
.page ::selection{background:rgba(0,122,255,.28)}
.hl{border-radius:2px;cursor:pointer}
.hl.y{background:rgba(255,204,0,.36)}.hl.g{background:rgba(52,199,89,.30)}.hl.b{background:rgba(0,122,255,.24)}.hl.p{background:rgba(255,45,85,.24)}.hl.o{background:rgba(255,149,0,.30)}.hl.v{background:rgba(175,82,222,.26)}
.hl.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px rgba(0,122,255,.45)}100%{box-shadow:0 0 0 0 rgba(0,122,255,0)}}
.rn-anchor{background-image:linear-gradient(90deg,var(--research) 50%,transparent 50%);background-size:6px 1.5px;background-repeat:repeat-x;background-position:0 100%;padding-bottom:1px}
.rn-marker{position:absolute;right:16px;width:24px;height:24px;border-radius:12px 12px 12px 4px;background:var(--research);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;box-shadow:0 2px 6px rgba(94,92,230,.4);cursor:pointer;animation:pop 320ms cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.ink-layer{position:absolute;inset:0;pointer-events:none}
.ink-layer.active{pointer-events:auto;cursor:crosshair}
.ink-layer.erase{cursor:cell}
.ink-layer path,.ink-layer ellipse,.ink-layer line{vector-effect:non-scaling-stroke}
.ink-layer.erase .stroke{cursor:pointer}
.ink-layer.erase .stroke:hover{opacity:.35}
.scan .scan-img{filter:contrast(1.05) blur(.25px);user-select:none;-webkit-user-select:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 2px,transparent 2px 4px)}
.scan.page{background:#f7f4ec}
.scan .scan-img p{color:#2b2b2b;transform:rotate(-.35deg)}
.scan.recognized .scan-img{user-select:text;-webkit-user-select:text}
.ocr-badge{position:absolute;top:14px;right:14px;font-family:var(--sans);font-size:10.5px}
.reader-banner{margin:0 auto 14px;width:560px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--win);box-shadow:0 0 0 .5px var(--hair);font-size:12.5px;line-height:1.5}
.reader-banner .bi{width:28px;height:28px;border-radius:8px;background:var(--accentTint);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.reader-banner .bt{flex:1}.reader-banner b{display:block;font-size:13px;margin-bottom:2px}
.reader-float{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.pen-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:2px;height:40px;padding:4px 6px;border-radius:20px;background:var(--glass);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px var(--hair)}
.cdot{width:16px;height:16px;border-radius:8px;margin:0 3px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2);position:relative}
.cdot.on::after{content:"";position:absolute;inset:-4px;border-radius:12px;box-shadow:0 0 0 2px var(--accent)}
.wdot{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.wdot.on{background:var(--accentTint)}
.wdot i{display:block;border-radius:6px;background:var(--label)}

/* Floating selection toolbar (MMFloatingToolbar) */
.ftb{position:absolute;z-index:20;display:flex;align-items:center;gap:1px;height:38px;padding:4px;border-radius:19px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair),0 6px 20px rgba(0,0,0,.10);animation:fin 150ms}
@keyframes fin{from{opacity:0;transform:translateY(4px)}}
.ftb .cdot{width:14px;height:14px;margin:0 5px}
.ftb .tbtn{height:30px}
.ftb .tbtn.research{color:var(--research);padding:0 9px 0 7px}
.ftb .tbtn.research:hover{background:var(--researchTint)}
.kbd{font-family:var(--sans);font-size:10.5px;color:var(--label2);padding:0 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--sep);line-height:16px}

/* ---------- Mind map ---------- */
.map-stage{position:absolute;inset:0;overflow:hidden;cursor:grab}
.map-world{position:absolute;left:0;top:0;transform-origin:0 0}
.map-world svg.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.node{position:absolute;cursor:default;user-select:none;-webkit-user-select:none}
.node.sel>.nb{box-shadow:0 0 0 2px var(--accent),var(--cardShadow) !important}
.node.flash>.nb{animation:nflash 1.6s}
@keyframes nflash{0%,50%{box-shadow:0 0 0 4px rgba(94,92,230,.45),var(--cardShadow)}100%{box-shadow:var(--cardShadow)}}
.nb{position:relative}
.n-root .nb{background:var(--root);color:var(--onRoot);font-weight:600;font-size:15px;padding:10px 18px;border-radius:12px;white-space:nowrap}
.n-topic .nb{background:var(--fill);padding:7px 12px;border-radius:10px;font-weight:500;white-space:nowrap}
.n-note .nb{background:var(--fill4);padding:8px 12px;border-radius:10px;width:220px;line-height:1.5;font-size:12.5px}
.n-note .nb ul,.n-note .nb ol{margin:2px 0;padding-left:18px}.n-note .nb p{margin:0}
.n-note.editing .nb{background:var(--card);box-shadow:0 0 0 2px var(--accent)}
.n-ex .nb,.n-img .nb,.n-rn .nb{background:var(--card);border-radius:12px;box-shadow:var(--cardShadow);width:var(--w,240px);padding:10px 12px 10px 18px}
.n-ex .bar,.n-img .bar,.n-rn .bar{position:absolute;left:7px;top:10px;bottom:10px;width:3px;border-radius:2px}
.n-ex .ttl{font-size:12.5px;font-weight:600;margin-bottom:4px;line-height:1.35;padding-right:22px}
.n-ex .q{font-family:var(--serif);font-size:13px;line-height:20px;color:var(--excerpt);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:4}
.compact .n-ex .q{-webkit-line-clamp:2}
.n-ex.expanded .q{-webkit-line-clamp:unset;display:block}
.more{display:flex;align-items:center;gap:3px;margin-top:5px;font-size:11px;color:var(--accent);cursor:pointer;width:max-content;padding:1px 4px 1px 0;border-radius:4px}
.more:hover{text-decoration:underline}
.goto{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--icon);opacity:.7}
.goto:hover{background:var(--hover);opacity:1}
.src{font-size:10.5px;color:var(--label2);margin-top:6px;display:flex;align-items:center;gap:4px}
.n-img .imgbox{border-radius:6px;overflow:hidden;background:var(--fill4);margin-top:2px}
.n-img .imgbox img,.n-img .imgbox svg{display:block;width:100%;height:auto}
.n-img .ttl{font-size:12.5px;font-weight:600;margin-bottom:6px}
.n-rn .nb{background:linear-gradient(180deg,var(--researchTint),transparent 70%),var(--card)}
.n-rn .bar{background:var(--research)}
.n-rn .kind{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--research);font-weight:600;margin-bottom:4px}
.n-rn .ttl{font-size:12.5px;font-weight:600;line-height:1.4}
.n-rn .sum{font-size:12px;line-height:1.5;color:var(--label2);margin-top:3px;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:2}
.compact .n-rn .sum,.compact .n-img .imgbox{display:none}
.resize{position:absolute;top:8px;bottom:8px;right:-5px;width:10px;cursor:ew-resize;opacity:0;display:flex;align-items:center;justify-content:center}
.resize::after{content:"";width:3px;height:22px;border-radius:2px;background:var(--accent)}
.node:hover .resize,.node.sel .resize{opacity:.7}
.add-child{position:absolute;right:-30px;top:50%;margin-top:-11px;width:22px;height:22px;border-radius:11px;background:var(--card);box-shadow:0 0 0 .5px var(--hair),0 1px 3px rgba(0,0,0,.12);display:none;align-items:center;justify-content:center;color:var(--icon)}
.node.sel .add-child{display:flex}
.map-controls{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;align-items:center;z-index:5}
.map-hint{position:absolute;left:12px;bottom:14px;font-size:11.5px;color:var(--label2);display:flex;align-items:center;gap:6px;z-index:5}
.drop-overlay{position:absolute;inset:8px;border-radius:12px;border:2px dashed var(--accent);background:var(--accentTint);display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--accent);font-weight:600;z-index:30}
.drop-overlay.on{display:flex}

/* ---------- Right panel (research / inspector) ---------- */
#rpanel{flex:0 0 0;width:0;opacity:0;margin-left:0;background:var(--win);border-radius:14px;box-shadow:0 0 0 .5px var(--sep);display:flex;flex-direction:column;overflow:hidden;transition:flex 320ms cubic-bezier(.2,0,0,1),opacity 200ms,margin 320ms}
#rpanel.open{flex:0 0 400px;opacity:1;margin-left:8px}
#win.narrow #rpanel.open{flex-basis:360px}
.rp-head{padding:12px 14px 10px;border-bottom:1px solid var(--sep);flex:none}
.rp-top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.rp-kind{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--research)}
.rp-kind.detail{color:var(--label2)}
.ib{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--icon)}
.ib:hover{background:var(--hover)}
.origin{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--fill4);cursor:pointer}
.origin:hover{background:var(--fill)}
.origin .oq{font-family:var(--serif);font-size:12px;line-height:1.6;color:var(--excerpt);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:2}
.origin .om{font-size:11px;color:var(--label2);margin-top:2px;display:flex;gap:6px;align-items:center}
.rp-q{font-size:15px;font-weight:600;line-height:1.4;margin:10px 0 0;outline:none;border-radius:6px;padding:2px 4px;margin-left:-4px}
.rp-q:hover{background:var(--hover)}.rp-q:focus{background:var(--fill4);box-shadow:0 0 0 2px var(--accentTint)}
.runline{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--label2)}
.steps{display:flex;gap:4px;align-items:center;flex:1;min-width:0;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:4px;white-space:nowrap}
.step.done{color:var(--label)}.step.now{color:var(--research);font-weight:500}
.step .chev{opacity:.4}
.lnk{color:var(--accent);cursor:pointer}.lnk:hover{text-decoration:underline}
.rp-tabs{padding:10px 14px 0;flex:none}
.rp-body{flex:1;overflow:auto;padding:12px 14px 16px;position:relative}
.rp-foot{flex:none;border-top:1px solid var(--sep);padding:10px 12px}
.composer{display:flex;align-items:flex-end;gap:6px;padding:6px 6px 6px 10px;border-radius:12px;background:var(--fill4);box-shadow:inset 0 0 0 .5px var(--sep)}
.composer textarea{flex:1;border:0;background:none;resize:none;outline:none;height:20px;line-height:20px;font-size:13px}
.sendb{width:26px;height:26px;border-radius:13px;background:var(--research);color:#fff;display:flex;align-items:center;justify-content:center}
.comp-meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--label2)}
.mode-badge{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;font-size:11.5px;line-height:1.45;margin-bottom:12px;background:var(--fill4);color:var(--label2)}
.mode-badge.offline{background:rgba(255,149,0,.10);color:#9a5a00}.dark .mode-badge.offline{color:#ffb340}
.mode-badge.web{background:var(--researchTint);color:var(--research)}
.ans-sec{margin-bottom:14px}
.ans-sec h4{font-size:11px;font-weight:600;color:var(--label2);margin:0 0 6px;letter-spacing:.02em}
.pt{display:flex;gap:8px;padding:7px 8px;margin:0 -8px;border-radius:9px;line-height:1.6;position:relative}
.pt:hover{background:var(--hover)}
.pt.chk{background:var(--researchTint)}
.pt .cb{width:15px;height:15px;border-radius:4px;box-shadow:inset 0 0 0 1.2px var(--label2);flex:none;margin-top:3px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;opacity:.55}
.pt:hover .cb,.pt.chk .cb{opacity:1}
.pt.chk .cb{background:var(--research);box-shadow:none}
.pt .tx{flex:1;min-width:0}
.pt .tx[contenteditable=true]{outline:none;background:var(--card);box-shadow:0 0 0 2px var(--accent);border-radius:5px;padding:0 4px;margin:0 -4px}
.pt .acts{position:absolute;right:6px;top:-12px;display:none;gap:1px;padding:2px;border-radius:8px;background:var(--glass);backdrop-filter:blur(20px);box-shadow:0 0 0 .5px var(--hair),0 2px 8px rgba(0,0,0,.1)}
.pt:hover .acts{display:flex}
.pt .acts button{height:22px;padding:0 7px;border-radius:6px;font-size:11px;color:var(--label2)}
.pt .acts button:hover{background:var(--hover);color:var(--label)}
.edited{font-size:10.5px;color:var(--research);margin-left:4px;white-space:nowrap}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:15px;padding:0 4px;margin:0 1px;border-radius:4px;background:var(--fill);color:var(--label2);font-size:10px;font-weight:600;vertical-align:1px;cursor:pointer;font-family:var(--sans)}
.cite:hover{background:var(--research);color:#fff}
.quote{font-family:var(--serif);font-size:12.5px;line-height:1.7;color:var(--excerpt);border-left:2px solid var(--research);padding:1px 0 1px 9px;margin-top:4px}
.savebar{position:sticky;bottom:-16px;margin:12px -14px -16px;padding:10px 14px;background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--sep);display:flex;align-items:center;gap:8px}
.btn{height:28px;padding:0 12px;border-radius:14px;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;background:var(--fill);color:var(--label)}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--accent);color:#fff}
.btn.res{background:var(--research);color:#fff}
.btn.plain{background:none;color:var(--accent);padding:0 6px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{height:24px;padding:0 9px;font-size:11.5px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:30px 18px;color:var(--label2);font-size:12.5px;line-height:1.6}
.empty .ei{width:40px;height:40px;border-radius:12px;background:var(--fill4);display:flex;align-items:center;justify-content:center;color:var(--icon)}
.empty b{color:var(--label);font-size:13.5px}
.src-item{padding:10px;margin:0 -6px 6px;border-radius:10px;position:relative}
.src-item:hover{background:var(--hover)}
.src-item .st{display:flex;gap:8px;align-items:flex-start}
.src-ic{width:26px;height:26px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.src-item h5{margin:0;font-size:13px;font-weight:600;line-height:1.4}
.src-item .meta{font-size:11px;color:var(--label2);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.src-item .why{font-size:12px;line-height:1.55;margin-top:6px;color:var(--label)}
.src-item .why b{font-weight:500;color:var(--label2)}
.src-item .sa{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.src-item.inuse::before{content:"";position:absolute;left:-2px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--research)}
.dupe{font-size:11px;color:var(--label2);margin-top:6px;display:flex;align-items:center;gap:4px}
.filter-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{height:24px;padding:0 9px;border-radius:12px;font-size:11.5px;box-shadow:inset 0 0 0 1px var(--sep);color:var(--label2);display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--label);color:var(--win);box-shadow:none}
.chip:hover:not(.on){background:var(--hover)}
.article{font-size:13.5px;line-height:1.85}
.article h1{font-size:18px;line-height:1.4;margin:6px 0 6px}
.article h2{font-size:14.5px;margin:18px 0 6px}
.article p{margin:0 0 10px;position:relative}
.article p[data-pid]::before{content:attr(data-pid);position:absolute;left:-26px;top:3px;font-size:9.5px;color:var(--label2);opacity:0;font-family:var(--mono)}
.article p:hover::before{opacity:.8}
.article p.cited{background:var(--researchTint);border-radius:4px;box-shadow:-6px 0 0 var(--researchTint),6px 0 0 var(--researchTint)}
.article table{border-collapse:collapse;font-size:12px;margin:6px 0 12px;width:100%}
.article th,.article td{border:1px solid var(--sep);padding:4px 7px;text-align:left}
.article th{background:var(--fill4);font-weight:600}
.article figure{margin:8px 0 12px;font-size:11.5px;color:var(--label2)}
.article ::selection{background:rgba(94,92,230,.28)}
.ai-box{border-radius:10px;padding:9px 11px;background:var(--researchTint);margin:10px 0 14px;font-size:12.5px;line-height:1.6}
.ai-box .h{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--research);margin-bottom:3px}
.art-meta{font-size:11px;color:var(--label2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.clip-tb{position:absolute;z-index:25;display:flex;gap:2px;padding:3px;border-radius:16px;background:var(--glass);backdrop-filter:blur(20px);box-shadow:0 0 0 .5px var(--hair),0 4px 14px rgba(0,0,0,.12)}
.clip-tb button{height:26px;padding:0 10px;border-radius:13px;font-size:12px;display:flex;align-items:center;gap:4px}
.clip-tb button:hover{background:var(--hover)}
.saved-item{padding:10px 12px;border-radius:12px;box-shadow:0 0 0 .5px var(--sep);margin-bottom:8px;background:var(--card)}
.saved-item h5{margin:0 0 4px;font-size:13px}
.saved-item .att{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.att-chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;background:var(--fill4);font-size:11px;color:var(--label2);cursor:pointer}
.att-chip:hover{background:var(--fill);color:var(--label)}
.clip-draft{padding:8px 10px;border-radius:10px;background:var(--fill4);margin-bottom:6px;font-size:12px;line-height:1.6}
.clip-draft .from{font-size:10.5px;color:var(--label2);margin-top:3px}
.insp-sec{margin-bottom:16px}
.insp-sec h4{font-size:11px;font-weight:600;color:var(--label2);margin:0 0 6px}
.insp-quote{font-family:var(--serif);font-size:14px;line-height:1.9;color:var(--excerpt);padding:10px 12px;border-radius:10px;background:var(--fill4)}
.insp-title{font-size:16px;font-weight:600;line-height:1.4;outline:none;padding:2px 4px;margin:0 -4px;border-radius:6px}
.insp-title:focus{background:var(--fill4);box-shadow:0 0 0 2px var(--accentTint)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 8px;font-size:12px}
.kv span:nth-child(odd){color:var(--label2)}
.tag{display:inline-flex;height:20px;padding:0 7px;border-radius:10px;background:var(--fill);font-size:11px;align-items:center;margin:0 4px 4px 0}

/* ---------- Popovers / sheets / HUD ---------- */
.pop{position:absolute;z-index:40;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);border-radius:14px;box-shadow:0 0 0 .5px var(--hair),0 14px 40px rgba(0,0,0,.18);animation:fin 160ms}
.dark .pop{background:rgba(44,44,47,.94)}
.launch{width:440px;padding:14px}
.launch .lh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--research);margin-bottom:8px}
.launch .lq{padding:7px 10px;border-radius:9px;background:var(--fill4)}
.launch .lq span{font-family:var(--serif);font-size:12.5px;line-height:1.65;color:var(--excerpt);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:2}
.intents{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.intent{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 7px;border-radius:10px;font-size:11.5px;color:var(--label);position:relative;box-shadow:inset 0 0 0 1px var(--sep)}
.intent .ii{color:var(--research)}
.intent:hover{background:var(--hover)}
.intent.on{background:var(--researchTint);box-shadow:inset 0 0 0 1.5px var(--research)}
.intent .rec{position:absolute;top:-6px;right:-4px;font-size:9px;padding:0 4px;border-radius:5px;background:var(--research);color:#fff;line-height:14px}
.fld{margin-top:10px}
.fld label{display:flex;align-items:center;font-size:11px;font-weight:600;color:var(--label2);margin-bottom:4px}
.fld label .grow{flex:1}
.ta{width:100%;border:0;outline:none;border-radius:8px;padding:7px 9px;background:var(--card);box-shadow:inset 0 0 0 1px var(--sep);font-size:13px;line-height:1.5;resize:none}
.ta:focus{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--accentTint)}
.kw{display:flex;flex-wrap:wrap;gap:5px;padding:5px;border-radius:8px;background:var(--card);box-shadow:inset 0 0 0 1px var(--sep)}
.kw span{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 4px 0 8px;border-radius:6px;background:var(--fill);font-size:12px}
.kw span button{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--label2)}
.kw input{border:0;outline:none;background:none;flex:1;min-width:80px;font-size:12px}
.ctx{margin-top:10px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--sep);font-size:12px}
.ctx-h{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer}
.ctx-h .grow{flex:1;color:var(--label2)}
.ctx-b{padding:0 10px 10px;display:none}
.ctx.open .ctx-b{display:block}
.ctx-part{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--sep);align-items:flex-start}
.ctx-part .tx{font-family:var(--serif);font-size:11.5px;line-height:1.6;color:var(--excerpt);flex:1}
.ctx-part .tx.sel{color:var(--label)}
.sw{width:28px;height:16px;border-radius:8px;background:var(--fill);position:relative;flex:none;cursor:pointer;transition:background 150ms}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left 150ms}
.sw.on{background:var(--ok)}.sw.on::after{left:14px}
.sw.dis{opacity:.4;pointer-events:none}
.lfoot{display:flex;align-items:center;gap:8px;margin-top:12px}
.lfoot .grow{flex:1}
.note{font-size:11px;color:var(--label2);line-height:1.5}
.warnline{display:flex;gap:6px;align-items:flex-start;font-size:11.5px;line-height:1.5;color:var(--label2);padding:7px 9px;border-radius:8px;background:rgba(255,149,0,.10);margin-top:8px}
.menu{min-width:200px;padding:5px}
.mi{display:flex;align-items:center;gap:8px;height:26px;padding:0 9px;border-radius:6px;font-size:13px;white-space:nowrap}
.mi:hover{background:var(--accent);color:#fff}
.mi:hover .count,.mi:hover .ii{color:#fff}
.mi .grow{flex:1}.mi .ii{color:var(--icon)}
.mi.res .ii{color:var(--research)}
.msep{height:1px;background:var(--sep);margin:4px 6px}
.mh{font-size:11px;font-weight:600;color:var(--label2);padding:4px 9px 2px}
.scrim{position:absolute;inset:0;z-index:60;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;animation:fade 200ms}
@keyframes fade{from{opacity:0}}
.sheet{margin-top:56px;width:520px;max-height:calc(100% - 80px);overflow:auto;background:var(--win);border-radius:16px;box-shadow:0 0 0 .5px var(--hair),var(--sheetShadow);padding:18px 20px;animation:drop 260ms cubic-bezier(.2,0,0,1)}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}
.sheet h3{margin:0 0 4px;font-size:15px}
.sheet .sub{font-size:12px;color:var(--label2);margin-bottom:12px}
.sfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;align-items:center}
.sfoot .grow{flex:1}
.radio{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--sep);margin-bottom:6px;cursor:pointer}
.radio .rd{width:16px;height:16px;border-radius:8px;box-shadow:inset 0 0 0 1.4px var(--label2);flex:none;margin-top:1px}
.radio.on{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accentTint)}
.radio.on .rd{box-shadow:inset 0 0 0 5px var(--accent)}
.radio b{display:block;font-size:13px;font-weight:500}.radio span{font-size:11.5px;color:var(--label2)}
.cbx{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:8px;cursor:pointer}
.cbx i{width:15px;height:15px;border-radius:4px;box-shadow:inset 0 0 0 1.2px var(--label2);display:flex;align-items:center;justify-content:center;color:#fff}
.cbx.on i{background:var(--accent);box-shadow:none}
.cite-row{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--fill4);margin-bottom:4px;font-size:12px}
.cite-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-box{height:200px;border-radius:10px;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--sep);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.hud{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;height:36px;padding:0 8px 0 16px;border-radius:18px;background:rgba(30,30,32,.88);color:#fff;font-size:12.5px;backdrop-filter:blur(20px);animation:fin 200ms;white-space:nowrap}
.hud .btn{background:rgba(255,255,255,.14);color:#fff;height:26px}
.lightbox{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:fade 200ms}
.lightbox .lb-img{max-width:80%;max-height:75%;overflow:auto;border-radius:8px;background:#fff}
.lightbox .lb-bar{display:flex;gap:8px;align-items:center;color:#fff;font-size:12px}
.review{position:absolute;inset:0;z-index:65;background:var(--win);display:flex;flex-direction:column;animation:fade 200ms}
.rv-top{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px 0 88px}
.rv-card{margin:20px auto 0;width:620px;min-height:420px;border-radius:18px;background:var(--card);box-shadow:0 0 0 .5px var(--hair),0 8px 30px rgba(0,0,0,.08);padding:28px 32px;display:flex;flex-direction:column}
.rv-path{font-size:11.5px;color:var(--label2);display:flex;gap:4px;align-items:center;margin-bottom:14px}
.rv-q{font-size:20px;font-weight:600;line-height:1.45}
.rv-ans{border-top:1px solid var(--sep);margin-top:18px;padding-top:18px}
.rv-rate{display:flex;gap:10px;justify-content:center;margin-top:auto;padding-top:22px}
.rv-rate .btn{height:44px;min-width:104px;flex-direction:column;gap:0;border-radius:12px}
.rv-rate .btn small{font-size:10.5px;color:var(--label2)}

/* ---------- Demo console (outside the product) ---------- */
#demo{position:fixed;right:14px;top:14px;z-index:200;width:288px;max-height:calc(100% - 28px);overflow:auto;border-radius:14px;background:rgba(20,20,22,.90);color:#f2f2f7;
  backdrop-filter:blur(20px);box-shadow:0 10px 40px rgba(0,0,0,.35);font-size:12px;transition:transform 260ms}
#demo.min{transform:translateX(250px)}
#demo .dh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:600;position:sticky;top:0;background:rgba(20,20,22,.96)}
#demo .dh .grow{flex:1}
#demo .dh button{color:#aeaeb2;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center}
#demo .dh button:hover{background:rgba(255,255,255,.1)}
#demo .dsec{padding:8px 12px}
#demo .dt{font-size:10.5px;color:#8e8e93;font-weight:600;margin:4px 0 6px;letter-spacing:.04em}
#demo .scn{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:6px 8px;border-radius:8px;margin-bottom:2px;line-height:1.45}
#demo .scn:hover{background:rgba(255,255,255,.08)}
#demo .scn.on{background:rgba(94,92,230,.35)}
#demo .scn .n{width:18px;height:18px;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:10.5px;flex:none;margin-top:1px}
#demo .scn small{display:block;color:#a1a1a6;font-size:10.5px}
#demo .tg{display:flex;align-items:center;justify-content:space-between;padding:5px 2px}
#demo .tg .seg{background:rgba(255,255,255,.08)}
#demo .tg .seg button{color:#aeaeb2;height:22px;padding:0 8px;font-size:11px}
#demo .tg .seg button.on{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
#demo .seg{height:26px}
#guide{margin:8px 12px 12px;padding:9px 10px;border-radius:10px;background:rgba(94,92,230,.25);line-height:1.55;font-size:11.5px;color:#e5e5ea}
#guide b{color:#fff}
.coach{position:absolute;z-index:90;pointer-events:none;border-radius:12px;box-shadow:0 0 0 3px rgba(94,92,230,.85),0 0 0 9px rgba(94,92,230,.25);animation:coach 1.4s ease-in-out infinite}
@keyframes coach{50%{box-shadow:0 0 0 3px rgba(94,92,230,.85),0 0 0 14px rgba(94,92,230,.08)}}
</style>

<h3>3.2　锚定效应</h3>
<p>当人们需要估计一个未知的数量时，往往会先想到某个数字，再从它出发进行调整。问题在于，这种调整通常是不充分的：最初出现的数字——哪怕与问题毫无关系——会把最终的估计“拉”向自己。特沃斯基和卡尼曼把这种现象称为<span class="hl y" data-hl="h1">锚定效应</span>。</p>
<p>在一项经典实验中，研究者先转动一个动过手脚的幸运轮，让它停在 10 或 65，然后请被试估计联合国中非洲国家所占的比例。看到 10 的人给出的估计中位数是 25%，看到 65 的人则是 45%。<span id="s-claim">一个明显随机的数字，竟能让估计相差将近一倍。</span></p>
<p>锚定并不局限于实验室。<span class="hl g" data-hl="h2">房地产经纪人在看过不同的挂牌价之后，对同一套房子的估价出现了显著差异，而他们大多否认自己受到了挂牌价的影响。</span>法官在量刑时、谈判者在出价时，也会被首先提出的数字所牵引。</p>
<p>关于锚定为什么会发生，目前有两种主要解释。<span id="s-mech">一种认为它来自“调整不足”：人们从锚出发，调整到一个似乎合理的范围边缘就停下了；另一种认为它是一种“选择性通达”：锚激活了与之相容的信息，使人更容易想到支持锚值的证据。</span>两种机制可能在不同情境下各自起作用。</p>
<p>值得注意的是，提醒人们“不要受锚影响”往往收效甚微。比较有效的做法是主动“考虑相反的情况”——刻意寻找锚值可能错误的理由。</p>

  if (!S.net) { T(900, () => { s.status = 'failed'; s.error = s.mode === 'ai' ? '无法连接 AI 服务：网络不可用' : '检索失败：网络不可用'; }); return; }

  T(1100, () => { s.sources = demoSources().filter(x => s.srcKinds.includes(x.kind) || (s.srcKinds.includes('web') && x.kind === 'web')); if (!s.sources.length) s.sources = demoSources(); s.step = 1; });

function commitNote(s, st, pts, cites) {

  S.notes[id] = note;
  if (st.dest !== 'map' && s.origin.type === 'pdf') { const a = { id: s.origin.anchor || uid('a'), noteId: id, doc: s.origin.doc, page: s.origin.page, sid: 's-claim' }; S.anchors.push(a); note.att.pdf = a; }
  if (st.dest !== 'pdf') {
    const nid = uid('m'); S.nodes.push({ id: nid, parent: st.target, kind: 'rn', noteId: id }); note.att.node = nid; S.selected = nid;
    if (st.split && pts.length > 1) pts.forEach(p => S.nodes.push({ id: uid('n'), parent: nid, kind: 'note', html: `<p>${esc(s.edits[p.id] || p.t)}</p>` }));
  }
  s.saved.push(id); s.checked.clear(); s.clips = [];
  renderAll();
  if (note.att.node) flashNode(note.att.node);
  const where = st.dest === 'both' ? '原文和脑图' : st.dest === 'pdf' ? '原文' : '脑图';
  const mapHidden = S.layout === 'reader' && st.dest !== 'pdf';
  hud(`已保存到${where}${mapHidden ? '（脑图暂时收起）' : ''}`, mapHidden ? '在脑图中查看' : '撤销', mapHidden ? () => { S.layout = 'split'; applyLayout(); setTimeout(() => flashNode(note.att.node), 360); } : undo);
}
