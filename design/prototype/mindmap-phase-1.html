<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarginMind · 思维导图操作优化（一期）· 高保真交互原型</title>
<style>
/* Tokens mirror packages/mm_design (MMColors / MMTypography / MMRadii), same as the phase-2/3 prototypes. */
:root{
  --win:#FFFFFF; --reader:#F5F5F7; --canvas:#FFFFFF; --card:#FFFFFF; --page:#FFFFFF;
  --label:#1D1D1F; --label2:#636366; --label3:#8E8E93; --icon:#6E6E73; --sep:rgba(0,0,0,.09); --fill:rgba(120,120,128,.12); --fill4:rgba(120,120,128,.08);
  --hover:rgba(0,0,0,.045); --pressed:rgba(0,0,0,.09);
  --accent:#007AFF; --accentTint:rgba(0,122,255,.12); --onAccent:#fff;
  --glass:rgba(255,255,255,.86); --hair:rgba(0,0,0,.10); --line:rgba(60,60,67,.30); --excerpt:#3A3A3C;
  --cardShadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --popShadow:0 10px 36px rgba(0,0,0,.16);
  --rel:#5E5CE6; --err:#D70015;
  --y:#FFCC00; --g:#34C759; --b:#007AFF; --p:#FF2D55; --o:#FF9500; --v:#AF52DE;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
}
.dark{
  --win:#1E1E1F; --reader:#1E1E1F; --canvas:#1E1E1F; --card:#2C2C2E; --page:#2A2A2C;
  --label:#F5F5F7; --label2:#AEAEB2; --label3:#8E8E93; --icon:#AEAEB2; --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.24); --fill4:rgba(118,118,128,.14);
  --hover:rgba(255,255,255,.06); --pressed:rgba(255,255,255,.12);
  --accent:#0A84FF; --accentTint:rgba(10,132,255,.22);
  --glass:rgba(44,44,47,.90); --hair:rgba(255,255,255,.10); --line:rgba(235,235,245,.28); --excerpt:#D1D1D6;
  --cardShadow:0 2px 10px rgba(0,0,0,.35); --popShadow:0 12px 40px rgba(0,0,0,.5);
  --rel:#7D7AFF;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--sans);font-size:13px;color:var(--label);-webkit-font-smoothing:antialiased}
body{background:linear-gradient(135deg,#c9d6e8 0%,#e6dcef 50%,#f1e2d6 100%);overflow:hidden}
body.dark{background:linear-gradient(135deg,#1b2333 0%,#2a2333 50%,#33281f 100%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
svg{display:block}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:14px;height:14px}
.kbd{font-size:11px;color:var(--label2);font-family:var(--sans);margin-left:auto;padding-left:14px}

#desk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px 338px 18px 18px}
#win{position:relative;width:100%;max-width:1560px;height:100%;max-height:960px;background:var(--win);border-radius:24px;overflow:hidden;
  box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 30px 80px rgba(0,0,0,.28);display:flex;flex-direction:column}
#tb{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:.5px solid var(--sep)}
.lights{display:flex;gap:8px}.lights span{width:12px;height:12px;border-radius:6px}
#tb .ttl{font-weight:600;font-size:13px;margin-left:12px}
#tb .sub{color:var(--label2);font-size:11.5px}
#main{flex:1;display:flex;min-height:0}

/* ---------- Reader (simplified; real app renders PDF pages) ---------- */
#reader{width:36%;min-width:320px;max-width:540px;display:flex;flex-direction:column;background:var(--reader);border-right:.5px solid var(--sep)}
.rbar{height:40px;display:flex;align-items:center;gap:6px;padding:0 12px;flex:none}
.dtab{height:26px;padding:0 10px;border-radius:7px;font-size:12px;color:var(--label2);display:flex;align-items:center;gap:6px}
.dtab.on{background:var(--fill);color:var(--label);font-weight:500}
.dtab:hover:not(.on){background:var(--hover)}
#page{flex:1;overflow:auto;position:relative;padding:8px 22px 40px}
.paper{background:var(--page);border-radius:4px;box-shadow:0 0 0 .5px var(--hair),0 2px 8px rgba(0,0,0,.06);padding:34px 40px 40px;max-width:520px;margin:0 auto}
.paper h2{font-family:var(--serif);font-size:19px;margin:0 0 4px;font-weight:600}
.paper .pg{font-size:11px;color:var(--label3);margin:18px 0 6px;text-align:right}
.paper p{font-family:var(--serif);font-size:15px;line-height:28px;margin:0 0 12px;color:var(--label);text-align:justify}
mark.hl{background:none;color:inherit;border-radius:2px;cursor:pointer;padding:1px 0}
mark.hl.y{background:rgba(255,204,0,.36)}mark.hl.g{background:rgba(52,199,89,.30)}mark.hl.b{background:rgba(0,122,255,.24)}
mark.hl.p{background:rgba(255,45,85,.24)}mark.hl.o{background:rgba(255,149,0,.32)}mark.hl.v{background:rgba(175,82,222,.26)}
mark.hl.flash{animation:hflash 1.6s}
@keyframes hflash{0%,55%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- Map pane ---------- */
#map{flex:1;position:relative;background:var(--canvas);overflow:hidden;min-width:0}
.pane-bar{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:20;
  background:linear-gradient(var(--canvas) 70%,transparent);pointer-events:none}
.pane-bar>*{pointer-events:auto}
.pane-bar .ttl{font-weight:600;font-size:13px}
.seg{display:inline-flex;background:var(--fill);border-radius:8px;padding:2px;gap:2px}
.seg button{height:22px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--label2)}
.seg button.on{background:var(--card);color:var(--label);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.dark .seg button.on{background:#636366}
.capsule{display:flex;align-items:center;gap:2px;height:30px;padding:0 3px;border-radius:15px;background:var(--glass);box-shadow:0 0 0 .5px var(--hair);backdrop-filter:blur(20px)}
.tbtn{height:24px;min-width:24px;padding:0 6px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--icon);font-size:12px;position:relative}
.tbtn:hover{background:var(--hover);color:var(--label)}
.tbtn.on{background:var(--accentTint);color:var(--accent)}
.tbtn[disabled]{opacity:.38}
.tbtn[disabled]:hover{background:none}
.grow{flex:1}

#stage{position:absolute;inset:0;cursor:default}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world svg.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#world svg.links .hit{pointer-events:stroke;cursor:pointer}
.node{position:absolute;user-select:none;-webkit-user-select:none;transition:left 320ms cubic-bezier(.2,0,0,1),top 320ms cubic-bezier(.2,0,0,1),opacity 200ms}
.nolay .node{transition:none}
.nb{position:relative}
.node.sel>.nb{box-shadow:0 0 0 2px var(--accent),var(--cardShadow)!important}
.node.target>.nb{box-shadow:0 0 0 2px var(--rel),0 0 0 6px color-mix(in srgb,var(--rel) 22%,transparent)!important}
.node.mergeTarget>.nb{outline:2px dashed var(--accent);outline-offset:4px}
.node.merging{opacity:.25}
.node.flash>.nb{animation:nflash 1.6s}
@keyframes nflash{0%,50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent),var(--cardShadow)}100%{box-shadow:var(--cardShadow)}}
.n-root .nb{background:var(--rootBg);color:var(--rootFg);font-weight:600;font-size:16px;padding:11px 20px;border-radius:14px;white-space:nowrap}
.n-topic .nb{background:var(--fill);padding:7px 12px;border-radius:10px;font-weight:500;white-space:pre;line-height:1.45}
.n-topic.d1 .nb{background:var(--d1Bg,var(--fill));color:var(--d1Fg,var(--label));font-size:14px;font-weight:600;padding:8px 14px}
.n-sum .nb{background:var(--sumBg);color:var(--sumFg);padding:7px 13px;border-radius:10px;font-weight:600;white-space:pre}
.n-note .nb{background:var(--fill4);padding:8px 12px;border-radius:10px;width:200px;line-height:1.5;font-size:12.5px}
.n-ex .nb{background:var(--card);border-radius:12px;box-shadow:var(--cardShadow);width:250px;padding:10px 12px 10px 18px}
.n-ex .bar{position:absolute;left:7px;top:10px;bottom:10px;width:3px;border-radius:2px}
.n-ex .ttl{font-size:12.5px;font-weight:600;margin-bottom:4px;line-height:1.35;padding-right:22px}
.n-ex .segs{font-family:var(--serif);font-size:13px;line-height:20px;color:var(--excerpt)}
.n-ex .sg{position:relative;border-radius:5px;margin:0 -5px;padding:1px 5px}
.n-ex .sg+.sg{margin-top:4px}
.n-ex.merged .sg+.sg{border-top:.5px dashed var(--sep);padding-top:5px;border-radius:0 0 5px 5px}
.n-ex .sg.src{cursor:pointer}
.n-ex .sg.src:hover{background:var(--hover)}
.n-ex .sg.src:hover .sgmeta{opacity:1}
.n-ex .sg.lit{background:var(--accentTint)}
.n-ex .sg .dot{display:inline-block;width:6px;height:6px;border-radius:3px;margin-right:6px;vertical-align:2px}
.n-ex .sg.own{font-family:var(--sans);font-size:12.5px;color:var(--label)}
.sgmeta{position:absolute;right:2px;top:1px;opacity:0;font-family:var(--sans);font-size:10.5px;color:var(--accent);background:var(--card);padding:0 4px;border-radius:4px;display:flex;align-items:center;gap:2px}
.n-ex .src-line{font-size:10.5px;color:var(--label2);margin-top:6px;display:flex;align-items:center;gap:4px}
.goto{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--icon);opacity:.7}
.goto:hover{background:var(--hover);opacity:1}
.mbadge{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--label2);background:var(--fill4);border-radius:5px;padding:0 5px;height:17px;margin-left:4px;font-weight:500;vertical-align:1px}
.editing>.nb{outline:none;box-shadow:0 0 0 2px var(--accent)!important}
[contenteditable]{outline:none;cursor:text;-webkit-user-select:text;user-select:text}
.add-child{position:absolute;top:50%;margin-top:-11px;width:22px;height:22px;border-radius:11px;background:var(--card);box-shadow:0 0 0 .5px var(--hair),0 1px 3px rgba(0,0,0,.12);display:none;align-items:center;justify-content:center;color:var(--icon)}
.node.solo .add-child{display:flex}
.add-child:hover{color:var(--accent)}
.link-h{position:absolute;top:-11px;right:-11px;width:22px;height:22px;border-radius:11px;background:var(--rel);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:crosshair}
.node.solo .link-h{display:flex}
.node.solo:not(.n-root) .link-h{animation:pop .2s}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.node.dim{opacity:.35}

.marquee{position:absolute;border:1px solid var(--accent);background:var(--accentTint);border-radius:3px;pointer-events:none;z-index:15;display:none}
.rel-label{position:absolute;transform:translate(-50%,-50%);background:var(--canvas);color:var(--rel);font-size:12px;padding:1px 6px;border-radius:6px;white-space:nowrap;cursor:pointer;z-index:4}
.rel-label.empty{color:var(--label3);font-style:italic;opacity:0}
.rel-label.sel{box-shadow:0 0 0 1.5px var(--rel)}
.rel-label.sel.empty,.rel-label.editing{opacity:1}
.handle{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:6px;background:var(--card);border:2px solid var(--rel);z-index:6;cursor:grab}
.handle.sq{border-radius:3px;border-color:var(--accent);cursor:ns-resize}

/* Floating selection bar */
#selbar{position:absolute;z-index:30;display:none;align-items:center;gap:2px;height:34px;padding:0 4px;border-radius:17px;background:var(--glass);
  box-shadow:0 0 0 .5px var(--hair),var(--popShadow);backdrop-filter:blur(24px) saturate(1.6);transform:translateX(-50%);white-space:nowrap}
#selbar.on{display:flex;animation:fadeup .16s}
@keyframes fadeup{from{opacity:0;transform:translate(-50%,4px)}}
#selbar .cnt{font-size:12px;color:var(--label2);padding:0 8px 0 10px;font-weight:500}
#selbar .tbtn{height:28px;padding:0 9px;border-radius:14px;color:var(--label)}
#selbar .tbtn .i{color:var(--icon)}
#selbar .tbtn:hover .i{color:var(--accent)}
#selbar .div{width:.5px;height:16px;background:var(--sep);margin:0 3px}
#selbar .cdot{width:14px;height:14px;border-radius:7px;margin:0 3px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
#selbar .cdot:hover{transform:scale(1.2)}
.tip{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);background:var(--label);color:var(--win);font-size:11.5px;font-weight:400;line-height:1.45;padding:5px 9px;border-radius:7px;
  white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:50}
.tip.w{white-space:normal;width:220px;text-align:left}
[data-tip]:hover>.tip{opacity:1;transition-delay:.25s}

/* Relation bar */
#relbar{position:absolute;z-index:30;display:none;align-items:center;gap:2px;height:30px;padding:0 3px;border-radius:15px;background:var(--glass);box-shadow:0 0 0 .5px var(--hair),var(--popShadow);transform:translate(-50%,0);backdrop-filter:blur(24px)}
#relbar.on{display:flex}

/* Style popover */
#stylePop{position:absolute;right:12px;top:46px;width:300px;z-index:40;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);border-radius:14px;
  box-shadow:0 0 0 .5px var(--hair),var(--popShadow);padding:14px;display:none}
#stylePop.on{display:block;animation:fadeup2 .16s}
@keyframes fadeup2{from{opacity:0;transform:translateY(-4px)}}
.sp-h{font-size:11px;font-weight:600;color:var(--label2);margin:2px 2px 8px;display:flex;align-items:center}
.sp-h .sm{font-weight:400;margin-left:auto}
.structs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sc{border-radius:10px;padding:6px 4px 6px;text-align:center;font-size:11.5px;color:var(--label2)}
.sc .th{height:52px;border-radius:7px;background:var(--card);box-shadow:0 0 0 .5px var(--hair);margin-bottom:5px;display:flex;align-items:center;justify-content:center}
.dark .sc .th{background:#3A3A3C}
.sc:hover .th{box-shadow:0 0 0 1.5px var(--line)}
.sc.on .th{box-shadow:0 0 0 2px var(--accent)}
.sc.on{color:var(--label);font-weight:600}
.pals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pal{border-radius:10px;padding:4px;text-align:center;font-size:11.5px;color:var(--label2)}
.pal .th{height:44px;border-radius:8px;box-shadow:0 0 0 .5px var(--hair);margin-bottom:5px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pal:hover .th{box-shadow:0 0 0 1.5px var(--line)}
.pal.on .th{box-shadow:0 0 0 2px var(--accent)}
.pal.on{color:var(--label);font-weight:600}
.sc .th svg{width:56px}
.sp-note{font-size:11.5px;color:var(--label2);line-height:1.5;margin-top:12px;padding-top:10px;border-top:.5px solid var(--sep)}

.map-hint{position:absolute;left:14px;bottom:14px;font-size:11.5px;color:var(--label2);display:flex;align-items:center;gap:6px;z-index:5;max-width:60%}
.map-hint b{color:var(--label);font-weight:600}
.map-ctrl{position:absolute;right:12px;bottom:12px;z-index:5}
#hud{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:10px;height:34px;padding:0 6px 0 14px;border-radius:17px;
  background:rgba(40,40,42,.92);color:#fff;font-size:12.5px;box-shadow:0 8px 28px rgba(0,0,0,.25);white-space:nowrap}
#hud.on{display:flex;animation:fadeup3 .2s}
@keyframes fadeup3{from{opacity:0;transform:translate(-50%,6px)}}
#hud button{height:24px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:500}
#hud button:hover{background:rgba(255,255,255,.24)}
#hud.noact{padding-right:14px}

/* Context menu */
#ctx{position:fixed;z-index:80;min-width:210px;background:var(--glass);backdrop-filter:blur(30px);border-radius:10px;padding:5px;box-shadow:0 0 0 .5px var(--hair),var(--popShadow);display:none}
#ctx.on{display:block}
#ctx .mi{height:26px;display:flex;align-items:center;padding:0 10px;border-radius:6px;font-size:13px}
#ctx .mi:hover:not(.dis){background:var(--accent);color:#fff}
#ctx .mi:hover:not(.dis) .kbd{color:rgba(255,255,255,.8)}
#ctx .mi.dis{color:var(--label3)}
#ctx .why{font-size:11px;color:var(--label3);padding:0 10px 4px;line-height:1.4;max-width:240px}
#ctx .msep{height:.5px;background:var(--sep);margin:4px 8px}

/* ---------- Demo console ---------- */
#demo{position:fixed;right:14px;top:14px;bottom:14px;width:310px;border-radius:16px;background:rgba(255,255,255,.80);backdrop-filter:blur(30px) saturate(1.6);
  box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 18px 50px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;color:#1D1D1F;z-index:100}
body.dark #demo{background:rgba(36,36,38,.86);color:#F5F5F7}
#demo .dh{padding:14px 16px 10px;border-bottom:.5px solid rgba(0,0,0,.08)}
body.dark #demo .dh{border-color:rgba(255,255,255,.08)}
#demo .dh b{font-size:13px}
#demo .dh .s{font-size:11.5px;opacity:.65;margin-top:3px;line-height:1.45}
#demo .dl{flex:1;overflow:auto;padding:8px}
#demo .grp{font-size:11px;font-weight:600;opacity:.55;margin:10px 8px 4px}
.sc-btn{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:8px;font-size:12.5px;line-height:1.35}
.sc-btn:hover{background:rgba(120,120,128,.12)}
.sc-btn.on{background:var(--accent);color:#fff}
.sc-btn .n{display:inline-block;width:22px;opacity:.6;font-variant-numeric:tabular-nums}
#notes{border-top:.5px solid rgba(0,0,0,.08);padding:12px 16px;font-size:12px;line-height:1.55;max-height:45%;overflow:auto}
body.dark #notes{border-color:rgba(255,255,255,.08)}
#notes h4{margin:0 0 6px;font-size:12.5px}
#notes ul{margin:4px 0 8px;padding-left:16px}
#notes li{margin-bottom:3px}
#notes .lab{font-size:11px;font-weight:600;opacity:.6;margin-top:8px}
#demo .df{display:flex;gap:8px;padding:10px 12px;border-top:.5px solid rgba(0,0,0,.08)}
body.dark #demo .df{border-color:rgba(255,255,255,.08)}
#demo .df button{flex:1;height:28px;border-radius:8px;background:rgba(120,120,128,.14);font-size:12px}
#demo .df button:hover{background:rgba(120,120,128,.24)}
</style>
</head>

const node = id => S.nodes.find(n => n.id === id);

function mapOrder() {

let G = {}; // geometry: id -> {x,y,w,h,dir}
let SG = {}; // summary bracket geometry
function render(opts = {}) {

/* ---------- Layout ---------- */
function measure() {
  const M = {};
  for (const n of S.nodes) { const nb = els[n.id].firstElementChild; M[n.id] = { w: nb.offsetWidth, h: nb.offsetHeight }; }
  return M;
}
function layout() {

  const memo = {};

    const ks = kids(pid).map(k => k.id), out = []; const ss = sumsOf(pid);

      else { out.push({ ids: [ks[i]] }); i++; }
    }

  };

    if (memo[id] != null) return memo[id];
    const gs = groups(id); return memo[id] = Math.max(M[id].h, stackH(gs));
  };

  const stackH = gs => gs.length ? gs.reduce((a, g) => a + groupH(g), 0) + VG * (gs.length - 1) : 0;
  const extent = (id, dir) => { const g = G[id]; let e = dir > 0 ? g.x + g.w : g.x; kids(id).forEach(k => { const x = extent(k.id, dir); e = dir > 0 ? Math.max(e, x) : Math.min(e, x); }); sumsOf(id).forEach(s => { const x = extent(s.nodeId, dir); e = dir > 0 ? Math.max(e, x) : Math.min(e, x); }); return e; };

    const gs = groups(id);
