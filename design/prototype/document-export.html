<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarginMind 导出文档副本 · 高保真原型（GUL-602）</title>
<style>
/* MMColors.light / MMColors.dark (packages/mm_design/lib/src/tokens/colors.dart) with the flat-surface
   tokens of docs/layout-density.md (surface / border / selSeg). Same variable names as layout-density.html. */
.light{
  --window:#FFFFFF; --sidebar:#F2F2F6; --reader:#FFFFFF; --canvas:#FFFFFF;
  --label:#1D1D1F; --label2:#636366; --label3:#8E8E93; --icon:#6E6E73; --sep:rgba(0,0,0,.09); --fill:rgba(120,120,128,.16); --fill4:rgba(120,120,128,.08);
  --selRow:rgba(0,0,0,.075); --hover:rgba(0,0,0,.043); --pressed:rgba(0,0,0,.09);
  --accent:#007AFF; --accentTint:rgba(0,122,255,.12); --onAccent:#fff; --critical:#FF3B30; --caution:#C27C0E; --cautionTint:rgba(255,159,10,.14);
  --research:#5E5CE6; --surface:#FFFFFF; --border:rgba(0,0,0,.12); --selSeg:#FFFFFF; --line:rgba(60,60,67,.24);
  --root:#1D1D1F; --onRoot:#FFFFFF; --scrim:rgba(0,0,0,.18); --stage:#F4F4F6; --menubar:rgba(246,246,246,.96);
}
.dark{
  --window:#1E1E1F; --sidebar:#2C2C2F; --reader:#1E1E1F; --canvas:#1E1E1F;
  --label:#F5F5F7; --label2:#AEAEB2; --label3:#8E8E93; --icon:#AEAEB2; --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.32); --fill4:rgba(118,118,128,.14);
  --selRow:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06); --pressed:rgba(255,255,255,.12);
  --accent:#0A84FF; --accentTint:rgba(10,132,255,.20); --onAccent:#fff; --critical:#FF453A; --caution:#FFB340; --cautionTint:rgba(255,179,64,.16);
  --research:#7D7AFF; --surface:#323235; --border:rgba(255,255,255,.12); --selSeg:#636366; --line:rgba(235,235,245,.22);
  --root:#F5F5F7; --onRoot:#1D1D1F; --scrim:rgba(0,0,0,.35); --stage:#262628; --menubar:rgba(40,40,42,.96);
}
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","Noto Serif CJK SC","Noto Serif SC","STSong","SimSun",serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{background:#E4E5EA;overflow:hidden;display:flex}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Console ---------- */
#stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#scaler{transform-origin:center center;flex:none}
#console{width:300px;flex:none;background:#fff;border-left:1px solid rgba(0,0,0,.08);display:flex;flex-direction:column;font-size:12px;color:#1d1d1f}
#console header{padding:14px 16px 10px;border-bottom:1px solid rgba(0,0,0,.06)}
#console header b{font-size:13px;display:block;margin-bottom:2px}
#console header span{color:#636366}
.cseg{display:inline-flex;background:rgba(120,120,128,.12);border-radius:8px;padding:2px;gap:2px;margin-top:10px}
.cseg button{height:24px;padding:0 10px;border-radius:6px;color:#3a3a3c;white-space:nowrap}
.cseg button.on{background:#fff;color:#000;font-weight:600;box-shadow:0 0 0 .5px rgba(0,0,0,.1)}
#scenes{flex:1;overflow:auto;padding:6px 8px 16px}
#scenes h4{margin:12px 8px 4px;font-size:11px;color:#8e8e93;font-weight:600}
#scenes button{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:7px;line-height:16px}
#scenes button:hover{background:rgba(0,0,0,.04)}
#scenes button.on{background:rgba(0,122,255,.1);color:#0a5fd0}
#scenes button i{font-style:normal;color:#8e8e93;font-variant-numeric:tabular-nums;margin-right:6px}
#scenes button small{display:block;color:#8e8e93;margin-left:22px;font-size:11px}
#scenes button.on small{color:#4a7fc8}

/* ---------- Devices ---------- */
.device{position:relative;background:#0b0b0c}
.device.desktop{border-radius:12px;outline:.5px solid rgba(0,0,0,.4)}
.device.tablet{border-radius:40px;padding:16px}
.device.phone{border-radius:58px;padding:12px}
.screen{position:relative;overflow:hidden;background:var(--window);color:var(--label);font-size:13px;line-height:16px}
.desktop .screen{border-radius:12px}.tablet .screen{border-radius:24px}.phone .screen{border-radius:47px}
.menubar{position:absolute;left:0;right:0;top:0;height:24px;background:var(--menubar);display:flex;align-items:center;gap:18px;padding:0 16px;font-size:13px;z-index:120;border-bottom:.5px solid var(--sep)}
.menubar b{font-weight:700}.menubar span.on{background:var(--accent);color:#fff;border-radius:4px;padding:1px 8px;margin:0 -8px}
.menubar .r{margin-left:auto;color:var(--label2)}
.sbar{position:absolute;left:0;right:0;top:0;height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:600;z-index:60;pointer-events:none}
.phone .sbar{height:54px;padding:0 36px 0 44px;font-size:16px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:200}
.homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:var(--label);opacity:.85;z-index:200}

/* ---------- Workspace (simplified; see layout-density.html for the full toolbar spec) ---------- */
.app{position:absolute;left:0;right:0;bottom:0;background:var(--window)}
.side{position:absolute;left:8px;top:8px;bottom:8px;width:236px;border-radius:16px;background:var(--sidebar);border:.5px solid var(--border);padding:0 10px 10px;z-index:30}
.side .shd{height:44px;display:flex;align-items:center;gap:8px;padding-left:4px}
.lights{display:flex;gap:8px}.lights span{width:12px;height:12px;border-radius:6px}
.side .setrow{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px}
.side .setrow .badge{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.side .setrow b{font-size:13px}
.side h6{margin:14px 10px 4px;font-size:11px;color:var(--label2);font-weight:600}
.srow{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:8px;width:100%;text-align:left;position:relative}
.srow .i{color:var(--accent)}.srow.on{background:var(--selRow)}.srow.ctx{outline:2px solid var(--accent);outline-offset:-2px}
.srow .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{position:absolute;top:0;right:0;bottom:0;left:252px;display:flex}
.pane{position:relative;overflow:hidden;flex:1 1 0;min-width:0}
.pane.reader{flex:1.45 1 0;background:var(--reader)}
.divider{width:1px;background:var(--sep);flex:none}
.phead{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:10;background:var(--window)}
.tb{height:30px;min-width:32px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--label);position:relative}
.tb:hover{background:var(--hover)}.tb.on{background:var(--accentTint);color:var(--accent)}.tb.open{background:var(--pressed)}
.tb.lbl{padding:0 10px;font-size:12px;font-weight:500}
.grp{display:inline-flex;align-items:center;padding:3px;border-radius:18px;background:var(--fill4)}
.pnum{white-space:nowrap;font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums;padding:0 4px}
.segc{display:inline-flex;height:28px;padding:2px;border-radius:14px;background:var(--fill4);flex:none}
.segc button{height:24px;padding:0 12px;border-radius:12px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;white-space:nowrap}
.segc button.on{background:var(--selSeg);outline:.5px solid var(--border);outline-offset:-.5px}
.segc button[disabled]{opacity:.35;cursor:default}
.readbody{position:absolute;left:0;right:0;top:52px;bottom:0;display:flex;justify-content:center;padding-top:12px;overflow:hidden}
.mapbody{position:absolute;left:0;right:0;top:52px;bottom:0}
.node{position:absolute;font-size:12px;line-height:16px}
.node.root{background:var(--root);color:var(--onRoot);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.node.ex{width:170px;background:var(--window);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-family:var(--serif);font-size:12px;line-height:18px}
.node.ex i{display:block;width:18px;height:3px;border-radius:2px;margin-bottom:5px}

/* ---------- Page (always the original paper colors: export ignores the reader style) ---------- */
.pgwrap{position:relative;flex:none}
.pg{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;color:#1d1d1f;outline:.5px solid rgba(0,0,0,.16);overflow:hidden}
.pg .body{position:absolute;left:0;top:0;bottom:0;padding:44px;font-family:var(--serif);font-size:11px;line-height:19px}
.pg.crop .body{padding:18px 20px;font-size:12.4px;line-height:21px}
.pg .run{display:flex;justify-content:space-between;font-family:var(--sans);font-size:8px;line-height:10px;color:#8e8e93;margin-bottom:14px}
.pg.crop .run{margin-bottom:8px}
.pg h3{font-family:var(--sans);font-size:14px;line-height:20px;margin:0 0 12px;font-weight:700}
.pg p{margin:0 0 9px;text-indent:2em;position:relative}
.pg .ext{position:absolute;top:0;bottom:0;right:0;background:#FAFAFA;border-left:.5px solid rgba(0,0,0,.08)}
.pg svg.lead{position:absolute;inset:0;pointer-events:none;overflow:visible}
.mnote{position:absolute;font-family:var(--sans);font-size:9px;line-height:13px;color:#3a3a3c;background:#fff;border:.5px solid rgba(0,0,0,.14);border-left:2.5px solid;border-radius:5px;padding:5px 7px}
.mk{position:relative;border-radius:1.5px}
.hl{padding:1px 0}
sup.fn{font-family:var(--sans);font-size:7.5px;line-height:0;color:#0A66D0;font-weight:700;margin-left:1px;position:relative;cursor:default}
.editable .mk:hover{outline:1.5px solid rgba(0,122,255,.75);outline-offset:1px}
.editable .mk:hover::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 4px);background:#1d1d1f;color:#fff;font:600 8.5px/12px var(--sans);padding:2px 6px;border-radius:4px;white-space:nowrap;z-index:5;text-indent:0}
.ink{position:absolute;pointer-events:none;overflow:visible}
.endp h3{margin-bottom:14px}
.endp .en{display:flex;gap:8px;margin-bottom:11px;font-family:var(--sans);font-size:9.5px;line-height:14px}
.endp .en b{color:#0A66D0;font-size:9px;min-width:12px}
.endp .en q{display:block;font-family:var(--serif);font-size:10px;line-height:15px;color:#3a3a3c;border-left:2.5px solid;padding-left:6px;margin-bottom:3px;quotes:none}
.endp .en small{color:#8e8e93;font-size:8.5px}

/* ---------- Menus, HUD, save panel ---------- */
.menu{position:absolute;background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:5px;min-width:230px;font-size:13px;z-index:110;color:var(--label)}
.mi{height:24px;padding:0 9px;border-radius:5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.mi .i{color:var(--icon)}
.mi:hover,.mi.hot{background:var(--accent);color:#fff}.mi:hover .i,.mi.hot .i{color:#fff}
.mi.dis{opacity:.35;pointer-events:none}.mi.red{color:var(--critical)}
.mi .k{margin-left:auto;padding-left:24px;color:var(--label2);font-size:12px}.mi:hover .k,.mi.hot .k{color:rgba(255,255,255,.8)}
.mi .chk{width:14px;text-align:center}
.msep{height:1px;background:var(--sep);margin:5px 9px}
.mhint{position:absolute;z-index:111;background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.hud{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--surface);border:.5px solid var(--border);border-radius:22px;padding:0 8px 0 14px;height:44px;font-size:13px;font-weight:500;z-index:130}
.hud .i{color:#34C759}.hud button{color:var(--accent);padding:0 10px;height:30px;border-radius:15px}.hud button:hover{background:var(--hover)}
.savep{position:absolute;left:50%;top:0;transform:translateX(-50%);width:470px;background:var(--surface);border:.5px solid var(--border);border-top:0;border-radius:0 0 12px 12px;padding:18px 20px 16px;z-index:125;font-size:13px}
.savep .f{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.savep .f label{width:60px;text-align:right;color:var(--label2)}
.savep .f div{flex:1;height:24px;border-radius:6px;border:.5px solid var(--border);background:var(--window);display:flex;align-items:center;padding:0 8px}
.savep .f div.sel{border:2px solid var(--accent);background:var(--accentTint)}

/* ---------- Sheet (MMSheet, flat: surface + hairline, no shadow) ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:90}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:900px;background:var(--surface);border:.5px solid var(--border);border-radius:22px;padding:20px 22px 18px;z-index:95;color:var(--label)}
.sh-t{display:flex;align-items:baseline;gap:12px}
.sh-t b{font-size:15px;line-height:20px;font-weight:700}
.sh-t span{margin-left:auto;font-size:11px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px;display:flex;align-items:center;gap:5px}
.sh-b{display:flex;gap:16px;height:520px;margin-top:18px}
.sh-b.busy .opts,.sh-b.busy .pv{opacity:.4;pointer-events:none}
.opts{width:280px;flex:none;overflow:auto;padding:0 4px 8px 0;margin-top:-12px}
.gt{font-size:11px;line-height:14px;font-weight:600;color:var(--label2);margin:12px 2px 6px;display:flex;align-items:center}
.gt button{margin-left:auto;color:var(--accent);font-weight:500}
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fmt{border-radius:10px;padding:8px 6px 6px;text-align:center;font-size:11px;line-height:14px;box-shadow:inset 0 0 0 1px var(--sep);color:var(--label)}
.fmt:hover{background:var(--hover)}
.fmt.on{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accentTint);color:var(--accent);font-weight:600}
.fmt svg.i{width:28px;height:28px;stroke-width:1.4;display:block;margin:0 auto 3px;color:var(--icon)}
.fmt.on svg.i{color:var(--accent)}
.fmt small{display:block;font-size:10px;color:var(--label2);font-weight:400;height:13px}
.list{border-radius:10px;background:var(--fill4);overflow:hidden}
.row{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 10px;position:relative}
.row+.row,.row+.sub,.sub+.row{border-top:.5px solid var(--sep)}
.row .i{color:var(--icon)}
.row .n{flex:1;white-space:nowrap}
.row .c{color:var(--label2);font-variant-numeric:tabular-nums;font-size:12px}
.row.dis .n,.row.dis .i,.row.dis .c{opacity:.4}
.row .why{font-size:10.5px;color:var(--accent);white-space:nowrap}
.sw{width:30px;height:18px;border-radius:9px;background:var(--fill);position:relative;flex:none;transition:background 160ms}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:7px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.12);transition:transform 160ms}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(12px)}
.sw[disabled]{opacity:.35;cursor:default}
.sub{padding:6px 10px 9px 34px}
.dots{display:flex;gap:12px}
.dot{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--label2);font-variant-numeric:tabular-nums}
.dot i{width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.dot i svg{width:12px;height:12px;stroke-width:3}
.dot.off i{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--c)}
.dot.off i svg{display:none}
.segw{display:flex}.segw .segc{width:100%}.segw .segc button{flex:1;justify-content:center;padding:0 6px}
.cap{font-size:11px;line-height:15px;color:var(--label2);margin:6px 2px 0}
.fld{margin-top:8px;height:26px;border-radius:7px;border:.5px solid var(--border);background:var(--window);display:flex;align-items:center;padding:0 8px;font-size:12px}
.fld input{border:0;outline:0;background:none;font:inherit;color:var(--label);flex:1;min-width:0}
.fld.bad{border:1.5px solid var(--critical)}
.err{font-size:11px;color:var(--critical);margin:4px 2px 0}
.banner{display:flex;gap:8px;align-items:flex-start;background:var(--cautionTint);color:var(--label);border-radius:10px;padding:8px 10px;font-size:11.5px;line-height:16px;margin-top:12px}
.banner .i{color:var(--caution);margin-top:0}
.notice{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--label2);margin:12px 2px 0}
.notice .i{color:var(--caution);width:14px;height:14px}
.notice button{margin-left:auto;color:var(--accent)}

.pv{flex:1;min-width:0;background:var(--reader);border-radius:12px;border:.5px solid var(--sep);display:flex;flex-direction:column;overflow:hidden}
.pv-h{height:36px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px 0 12px;border-bottom:.5px solid var(--sep);font-size:11px}
.pv-h .fn{flex:1;min-width:0;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-h .fn svg{width:12px;height:12px;color:var(--icon)}
.pv-h .tb{height:24px;min-width:24px;border-radius:12px}.pv-h .tb svg{width:14px;height:14px}
.pv-h .tb[disabled]{opacity:.3;pointer-events:none}
.pv-h .pn{font-variant-numeric:tabular-nums;color:var(--label2);min-width:62px;text-align:center}
.badge2{font-size:10px;color:var(--label2);background:var(--fill4);border-radius:8px;padding:1px 7px;margin-right:4px;white-space:nowrap}
.pv-s{flex:1;position:relative;display:flex;background:var(--stage);overflow:hidden}
.pv-s .center{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
.rail{width:120px;flex:none;background:var(--sidebar);border-right:.5px solid var(--sep);padding:10px 6px;font-size:10px;line-height:13px;overflow:hidden;color:var(--label)}
.rail b{display:block;font-size:9.5px;color:var(--label2);margin:0 4px 6px}
.rail div{padding:3px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail div.on{background:var(--selRow)}.rail div.k{padding-left:12px;color:var(--label2)}
.rail .bm{display:flex;align-items:center;gap:4px}.rail .bm svg{width:9px;height:9px;color:var(--critical)}
.sh-f{display:flex;align-items:center;gap:8px;margin-top:18px;min-height:28px}
.sh-f .st{flex:1;font-size:11px;color:var(--label2);font-variant-numeric:tabular-nums}
.btn{height:28px;padding:0 14px;border-radius:14px;font-size:13px;font-weight:500;background:var(--fill4);color:var(--label);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--fill)}
.btn.pri{background:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.4;pointer-events:none}
.prog{width:180px;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);transition:width 120ms linear}
.failrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--critical)}
.failrow .i{width:14px;height:14px}

/* EPUB / Markdown previews */
.rf{width:380px;background:#fff;color:#1d1d1f;font-family:var(--serif);font-size:13px;line-height:23px;padding:28px 30px 40px;margin:20px auto;outline:.5px solid rgba(0,0,0,.14);border-radius:4px}
.rf h3{font-family:var(--sans);font-size:17px;line-height:24px;margin:0 0 16px}
.rf p{margin:0 0 12px;text-indent:2em;position:relative}
.rf sup.fn{font-size:9px}
.rf .pop{display:none;position:absolute;left:0;transform:translateX(-85%);top:16px;width:220px;background:#fff;border:.5px solid rgba(0,0,0,.2);border-radius:10px;padding:9px 11px;font:12px/17px var(--sans);color:#1d1d1f;text-indent:0;z-index:9;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.rf sup.fn:hover .pop,.rf sup.fn.show .pop{display:block}

  '可是踏实感和学会之间并没有必然联系。真正决定一段知识能否留下来的，是它在之后被调用了多少次，以及每一次调用离上一次有多远。',

      { t: '然而时机只是一半。另一半在于取出的方式。重读一遍笔记，和合上书本试着复述，是两种完全不同的练习。', m: [{ id: 'b1', s: '合上书本试着复述', k: 'hl', c: 2 }] },
      { t: '前者让人产生熟悉感，熟悉感又很容易被误认为掌握。后者让人难受，因为它会暴露出哪里其实还不会——而正是这种难受，把记忆刻得更深。',

const doc = () => DOCS[S.doc];

function usable(m) { return !S.empty && !(S.review && m.review); }

    <div class="bt"><button data-act="close">取消</button><b>分享副本</b><span style="width:60px"></span></div>
    <div class="bb"><div style="height:300px;display:flex">${previewHTML(361, 300)}</div>${optionsHTML('phone')}<div class="cap" style="margin-top:12px">${statsText()}</div></div>
    <div class="bf">${S.phase === 'busy' ? `<div style="display:flex;align-items:center;gap:10px"><div class="prog" style="flex:1"><i style="width:${S.progress * 100}%"></i></div><button class="btn" data-act="cancelExport">取消</button></div>` : `<button class="btn pri" data-act="export" ${canExport() ? '' : 'disabled'}>${ic('share')}分享…</button>`}</div></div>`;
}

/* ---------------- Workspace ---------------- */
function sidebarHTML(ctxDoc) {
  const docs = [PDF, EPUB, MD];
  return `<div class="side"><div class="shd"><div class="lights"><span style="background:#FF5F57"></span><span style="background:#FEBC2E"></span><span style="background:#28C840"></span></div></div>
    <div class="setrow"><span class="badge">${ic('book')}</span><b>学习科学</b></div>
    <h6>文档</h6>${docs.map(x => `<div class="srow ${x.id === S.doc ? 'on' : ''} ${ctxDoc === x.id ? 'ctx' : ''}">${ic(x.ext === 'epub' ? 'book' : x.ext === 'md' ? 'md' : 'file')}<span class="t">${x.title}</span></div>`).join('')}
    <h6>脑图</h6><div class="srow">${ic('map')}<span class="t">主脑图</span></div>
    <h6>学习</h6><div class="srow">${ic('checkc')}<span class="t">复习</span></div></div>`;
}
function readerHTML(moreOpen) {
  const d = doc();
  let page;
  if (d.id === 'pdf') page = scaled({ p: 12 }, 520, 660, { W: 420, H: 594, label: '12', all: true });
  else if (d.id === 'epub') page = `<div style="transform:scale(1.1);transform-origin:top center">${epubChapterHTML(true)}</div>`;
  else page = `<div class="rf" style="margin-top:0">${MD.lines.map(l => l.h ? `<h3>${esc(l.t)}</h3>` : `<p style="text-indent:0">• ${markHTML(l.li, l.m || [], [], { all: true })}</p>`).join('')}</div>`;
  return `<div class="pane reader"><div class="phead">
      <button class="tb">${ic('panel')}</button>
      ${d.id === 'pdf' ? `<span class="grp"><button class="tb">${ic('left')}</button><span class="pnum">12 / 248</span><button class="tb">${ic('right')}</button></span>` : ''}
      <span class="grp"><button class="tb on">${ic('pointer')}</button><button class="tb">${ic('hl')}</button><button class="tb">${ic('ul')}</button><button class="tb">${ic('pen')}</button><button class="tb">${ic('scan')}</button></span>
      <span style="flex:1"></span>
      <button class="tb ${moreOpen ? 'open' : ''}" data-act="more" id="moreBtn">${ic('more')}</button>
    </div><div class="readbody">${page}</div></div>`;
}
function mapHTML() {
  const ex = [['每一次回想都会改变它的河道', 0, 60], ['曲线最陡的部分出现在学习后的头一个小时', 2, 160], ['恰好在那之前把它重新取出来', 0, 280], ['熟悉感又很容易被误认为掌握', 0, 380]];
  return `<div class="pane"><div class="phead"><div class="segc"><button class="on">脑图</button><button>大纲</button></div><span style="flex:1"></span><button class="tb lbl">${ic('sparkles')}助手</button></div>
    <div class="mapbody"><svg style="position:absolute;inset:0;width:100%;height:100%">${ex.map(([, , y]) => `<path d="M128 252 C160 252 160 ${y + 24} 196 ${y + 24}" fill="none" stroke="var(--line)" stroke-width="1.5"/>`).join('')}</svg>
    <div class="node root" style="left:24px;top:234px">记忆的形状</div>
    ${ex.map(([t, c, y]) => `<div class="node ex" style="left:196px;top:${y}px"><i style="background:${COLORS[c]}"></i>${t}</div>`).join('')}</div></div>`;
}
function moreMenuHTML() {
  return `<div class="menu" id="moreMenu" style="left:0;top:0">
    <div class="mi">${ic('note')}页边批注</div><div class="mi">${ic('gear')}阅读设置</div><div class="mi">${ic('book')}生词提示</div>
    <div class="msep"></div><div class="mi"><span class="chk"></span>实际大小</div><div class="mi"><span class="chk"></span>适合宽度</div><div class="mi"><span class="chk">✓</span>适合页面</div><div class="mi">${ic('crop')}裁边…</div>
    <div class="msep"></div><div class="mi"><span class="chk">✓</span>白色</div><div class="mi"><span class="chk"></span>黑暗</div><div class="mi"><span class="chk"></span>纸质</div><div class="mi"><span class="chk"></span>淡绿</div>
    <div class="msep"></div><div class="mi hot" data-act="open">${ic('download')}导出副本…<span class="k">⇧⌘S</span></div></div>`;
}
function fileMenuHTML() {
  return `<div class="menu" style="left:96px;top:24px;min-width:250px">
    <div class="mi">新建学习集<span class="k">⌘N</span></div><div class="mi">导入文档…<span class="k">⌘O</span></div><div class="mi">添加网页…</div>
    <div class="msep"></div><div class="mi">整理学习笔记…<span class="k">⌥⌘P</span></div>
    <div class="msep"></div><div class="mi hot" data-act="open">导出副本…<span class="k">⇧⌘S</span></div><div class="mi dis">导出笔记…</div><div class="mi">导出脑图…</div>
    <div class="msep"></div><div class="mi">关闭<span class="k">⌘W</span></div></div>`;
}
function ctxMenuHTML() {
  return `<div class="menu" id="ctxMenu" style="left:0;top:0;min-width:180px"><div class="mi">重命名…</div><div class="mi hot" data-act="open">导出副本…</div><div class="msep"></div><div class="mi red">移除文档…</div></div>`;
}
function hudHTML() {
  return `<div class="hud">${ic('checkc')}已导出<button data-act="hud">在 Finder 中显示</button></div>`;
}
function savePanelHTML() {
  return `<div class="scrim" style="background:transparent;z-index:124"></div><div class="savep"><div class="f"><label>存储为：</label><div class="sel">${esc(fileName())}</div></div>
    <div class="f"><label>标签：</label><div></div></div><div class="f"><label>位置：</label><div>${ic('folder')}&nbsp;下载</div></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px"><button class="btn" data-act="saveCancel">取消</button><button class="btn pri" data-act="save">存储</button></div></div>`;
}

/* ---------------- Render ---------------- */
function render() {
  document.body.className = S.theme;
  const sc = document.getElementById('scaler');
  const keepScroll = document.getElementById('pvscroll')?.scrollTop || 0;
  let html;
  if (S.device === 'mac') {
    const ctx = S.menu === 'ctx' ? 'pdf' : null;
    html = `<div class="device desktop ${S.theme}"><div class="screen" style="width:1280px;height:824px">
      <div class="menubar"><span></span><b>MarginMind</b><span class="${S.menu === 'file' ? 'on' : ''}">文件</span><span>编辑</span><span>显示</span><span>窗口</span><span>帮助</span><span class="r">10月31日 周六 14:20</span></div>
      <div class="app" style="top:24px">${sidebarHTML(ctx)}<div class="main">${readerHTML(S.menu === 'more')}<div class="divider"></div>${mapHTML()}</div>
      ${S.menu === 'more' ? moreMenuHTML() : ''}${S.menu === 'ctx' ? ctxMenuHTML() : ''}
      ${S.sheet ? sheetHTML(false) : ''}${S.phase === 'save' ? savePanelHTML() : ''}${S.hud ? hudHTML() : ''}</div>
      ${S.menu === 'file' ? fileMenuHTML() : ''}</div></div>`;
  } else if (S.device === 'ipad') {
    html = `<div class="device tablet ${S.theme}"><div class="screen" style="width:1180px;height:820px"><div class="sbar"><span>14:20</span><span>100%</span></div>
      <div class="app touch" style="top:24px">${sidebarHTML()}<div class="main">${readerHTML(false)}<div class="divider"></div>${mapHTML()}</div>
      ${S.sheet ? sheetHTML(true) : ''}</div></div></div>`;
  } else {
    html = `<div class="device phone ${S.theme}"><div class="screen" style="width:393px;height:852px"><div class="island"></div><div class="sbar"><span>14:20</span><span>100%</span></div>
      <div class="app" style="top:54px"><div class="main" style="left:0">${readerHTML(false)}</div>${S.sheet ? phoneSheetHTML() : ''}</div><div class="homeind"></div></div></div>`;
  }
  sc.innerHTML = html;
  layoutMargins(sc);
  const pv = document.getElementById('pvscroll'); if (pv) pv.scrollTop = keepScroll;
  const inp = document.getElementById('customRange');
  if (inp) {
    inp.oninput = () => { S.o.custom = inp.value; const pos = inp.selectionStart; render(); const n = document.getElementById('customRange'); n.focus(); n.setSelectionRange(pos, pos); };
  }
  fit();
  placeMenus(sc);
  document.querySelectorAll('#theme button').forEach(b => b.classList.toggle('on', b.dataset.t === S.theme));
  document.querySelectorAll('#scenes button').forEach(b => b.classList.toggle('on', +b.dataset.i === S.scene));
}
// Anchor popup menus to their buttons in unscaled window coordinates.
function placeMenus(sc) {
  const app = sc.querySelector('.app'); if (!app) return;
  const s = scale(), a = app.getBoundingClientRect();
  const more = document.getElementById('moreMenu'), btn = document.getElementById('moreBtn');
  if (more && btn) { const b = btn.getBoundingClientRect(); more.style.left = `${(b.right - a.left) / s - more.offsetWidth}px`; more.style.top = `${(b.bottom - a.top) / s + 4}px`; }
  const ctx = document.getElementById('ctxMenu'), row = sc.querySelector('.srow.ctx');
  if (ctx && row) { const r = row.getBoundingClientRect(); ctx.style.left = `${(r.left - a.left) / s + 120}px`; ctx.style.top = `${(r.top - a.top) / s + 14}px`; }
}
function scale() { const m = /scale\(([^)]+)\)/.exec(document.getElementById('scaler').style.transform); return m ? +m[1] : 1; }
function fit() {
  const st = document.getElementById('stage'), sc = document.getElementById('scaler'), dev = sc.firstElementChild;
  if (!dev) return;
  const s = Math.min((st.clientWidth - 40) / dev.offsetWidth, (st.clientHeight - 40) / dev.offsetHeight, 1);
  sc.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit);

/* ---------------- Interaction ---------------- */
let timer = null;
function startExport() {
  S.failed = false;
  if (S.device === 'mac') { S.phase = 'save'; render(); return; }
  runProgress();
}
function runProgress() {
  S.phase = 'busy'; S.progress = 0; render();
  clearInterval(timer);
  timer = setInterval(() => {
    S.progress = Math.min(1, S.progress + 0.04);
    if (S.progress >= 1) {
      clearInterval(timer); S.phase = 'idle';
      if (S.scene === 16) { S.failed = true; render(); return; }
      S.sheet = false; S.hud = S.device === 'mac'; render();
      if (S.hud) setTimeout(() => { S.hud = false; render(); }, 3200);
      return;
    }
    render();
  }, 90);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (S.menu && !e.target.closest('.menu')) { S.menu = null; render(); } return; }
  if (t.disabled) return;
  const act = t.dataset.act, v = t.dataset.v, o = S.o;
  switch (act) {
    case 'more': S.menu = S.menu === 'more' ? null : 'more'; break;
    case 'open': S.menu = null; S.sheet = true; break;
    case 'close': if (S.phase === 'busy') return; S.sheet = false; S.failed = false; break;
    case 'fmt': S.fmt = v; if (v === 'pdf' && doc().id !== 'pdf') S.page = 5; break;
    case 'hl': case 'ul': case 'note': case 'ink': case 'toc': case 'crop': o[act] = !o[act]; if (act === 'hl' && o.hl && !o.colors.some(Boolean)) o.colors = o.colors.map(() => true); break;
    case 'all': { const on = !(o.hl && o.ul && o.note && (o.ink || !inkSupported()) && o.toc); o.hl = o.ul = o.note = o.ink = o.toc = on; if (on) o.colors = o.colors.map(() => true); break; }
    case 'color': { o.colors[+v] = !o.colors[+v]; const used = counts().perColor.map((n, i) => n > 0 && o.colors[i]); if (!used.some(Boolean)) { o.hl = false; o.colors = o.colors.map(() => true); } break; }
    case 'place': o.place = v; break;
    case 'placeR': o.placeR = v; break;
    case 'mode': o.mode = v; break;
    case 'range': o.range = v; break;
    case 'layout': o.layout = v; break;
    case 'page': setIndex(curIndex() + +v); break;
    case 'nextmark': { const j = nextMarkIndex(); if (j >= 0) setIndex(j); break; }
    case 'chap': S.chap = Math.max(0, Math.min(EPUB.chapters.length - 1, S.chap + +v)); break;
    case 'export': startExport(); return;
    case 'save': runProgress(); return;
    case 'saveCancel': S.phase = 'idle'; break;
    case 'cancelExport': clearInterval(timer); S.phase = 'idle'; S.progress = 0; break;
    case 'hud': S.hud = false; break;
    default: return;
  }
  render();
});

/* ---------------- Scenes ---------------- */
const base = (patch = {}) => { clearInterval(timer); Object.assign(S, { device: 'mac', doc: 'pdf', fmt: 'pdf', o: DEFAULT_OPTS(), sheet: true, menu: null, phase: 'idle', progress: 0, hud: false, failed: false, empty: false, protected: false, review: false, page: 12, chap: 1 }, patch); };
const SCENES = [
  { g: '入口', n: '阅读器「⋯」菜单', d: '最后一组：导出副本… ⇧⌘S', set() { base({ sheet: false, menu: 'more' }); } },
  { g: '入口', n: '文件菜单', d: '与导出笔记、导出脑图同组', set() { base({ sheet: false, menu: 'file' }); } },
  { g: '入口', n: '侧栏文档右键', d: '导出未打开的文档', set() { base({ sheet: false, menu: 'ctx' }); } },
  { g: 'PDF', n: '默认：全部保留', d: '可编辑注释，批注在页边；悬停标注看效果', set() { base(); } },
  { g: 'PDF', n: '只留黄色重点', d: '点掉其他颜色、关掉批注', set() { base(); S.o.colors = [true, false, false, false, true, true]; S.o.note = false; S.o.ul = false; } },
  { g: 'PDF', n: '打印 / 审阅', d: '合并到页面，批注放文末', set() { base({ page: 'end' }); S.o.mode = 'flat'; S.o.place = 'end'; } },
  { g: 'PDF', n: '只要有标注的页 + 裁边', d: '放进墨水屏', set() { base({ page: 13 }); S.o.range = 'marked'; S.o.crop = true; S.o.toc = false; } },
  { g: 'PDF', n: '自定义页码（出错）', d: '越界时禁用导出', set() { base(); S.o.range = 'custom'; S.o.custom = '12-14, 300'; } },
  { g: '电子书与 Markdown', n: 'EPUB 原格式', d: '批注成为弹出脚注；画笔置灰', set() { base({ doc: 'epub', fmt: 'epub', chap: 1 }); } },
  { g: '电子书与 Markdown', n: 'EPUB → PDF', d: '固定版式，画笔可保留', set() { base({ doc: 'epub', fmt: 'pdf', page: 5 }); } },
  { g: '电子书与 Markdown', n: 'Markdown 原格式', d: '<mark> + 脚注', set() { base({ doc: 'md', fmt: 'md' }); } },
  { g: '状态', n: '没有标注', d: '干净副本：只带目录与书签', set() { base({ empty: true }); } },
  { g: '状态', n: '受保护的 PDF', d: '作者禁止修改', set() { base({ protected: true }); } },
  { g: '状态', n: '有位置待确认的标注', d: '不导出并提示数量', set() { base({ review: true }); } },
  { g: '状态', n: '导出中', d: '进度 + 取消；面板不关闭', set() { base(); S.phase = 'busy'; S.progress = .48; } },
  { g: '状态', n: '导出完成', d: 'HUD“已导出”+ 在 Finder 中显示', set() { base({ sheet: false, hud: true }); } },
  { g: '状态', n: '导出失败', d: '点“导出…”→ 存储 → 失败 + 重试', set() { base({ failed: true }); } },
  { g: '设备', n: 'iPad', d: '同一面板，触控尺寸；分享…', set() { base({ device: 'ipad' }); } },
  { g: '设备', n: 'iPhone', d: '全高底部面板：预览在上，分享…', set() { base({ device: 'phone' }); } },
];
function buildConsole() {
  let h = '', g = '';
  SCENES.forEach((s, i) => { if (s.g !== g) { g = s.g; h += `<h4>${g}</h4>`; } h += `<button data-i="${i}"><i>${String(i + 1).padStart(2, '0')}</i>${s.n}<small>${esc(s.d)}</small></button>`; });
  const el = document.getElementById('scenes'); el.innerHTML = h;
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; go(+b.dataset.i); e.stopPropagation(); };
  document.getElementById('theme').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.theme = b.dataset.t; render(); e.stopPropagation(); };
}
function go(i) { S.scene = i; SCENES[i].set(); render(); history.replaceState(null, '', `?scene=${i + 1}&theme=${S.theme}`); }
// Scene 17 (index 16) demonstrates a failing write: every export attempt there fails.
buildConsole();
const q = new URLSearchParams(location.search);
S.theme = q.get('theme') === 'dark' ? 'dark' : 'light';
go(Math.max(0, Math.min(SCENES.length - 1, (+q.get('scene') || 4) - 1)));
</script>
