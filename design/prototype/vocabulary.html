<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarginMind · 生词本（查词 / 生词提示 / 生词本）· 高保真交互原型</title>
<style>
/* Tokens mirror packages/mm_design (MMColors / MMTypography / MMRadii). */
:root{
  --win:#FFFFFF; --sidebar:rgba(242,242,246,.86); --reader:#FFFFFF; --card:#FFFFFF; --page:#FFFFFF; --pageText:#1d1d1f;
  --label:#1D1D1F; --label2:#636366; --label3:#8E8E93; --icon:#6E6E73; --sep:rgba(0,0,0,.09); --fill:rgba(120,120,128,.12); --fill4:rgba(120,120,128,.08);
  --sel:rgba(0,0,0,.075); --hover:rgba(0,0,0,.045); --pressed:rgba(0,0,0,.09);
  --accent:#007AFF; --accentTint:rgba(0,122,255,.12); --onAccent:#fff;
  --glass:rgba(255,255,255,.86); --glassOpaque:#F7F7F9; --hair:rgba(0,0,0,.08);
  /* Vocabulary hint colour: fixed teal, distinct from the six annotation colours and the accent. */
  --vocab:#0E8A86; --vocabTint:rgba(14,138,134,.12); --vocabLine:rgba(14,138,134,.75);
  --positive:#248A3D; --caution:#C93400; --critical:#D70015;
  --y:#FFCC00; --g:#34C759; --b:#007AFF; --p:#FF2D55; --o:#FF9500; --v:#AF52DE;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
}
.dark{
  --win:#1E1E1F; --sidebar:rgba(44,44,47,.86); --reader:#1E1E1F; --card:#2C2C2E; --page:#1E1E1F; --pageText:#E5E5EA;
  --label:#F5F5F7; --label2:#AEAEB2; --label3:#8E8E93; --icon:#AEAEB2; --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.24); --fill4:rgba(118,118,128,.14);
  --sel:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06); --pressed:rgba(255,255,255,.12);
  --accent:#0A84FF; --accentTint:rgba(10,132,255,.20);
  --glass:rgba(50,50,53,.88); --glassOpaque:#2A2A2D; --hair:rgba(255,255,255,.10);
  --vocab:#40C8C0; --vocabTint:rgba(64,200,192,.16); --vocabLine:rgba(64,200,192,.8);
  --positive:#30D158; --caution:#FF9F0A; --critical:#FF453A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--sans);font-size:13px;color:var(--label);-webkit-font-smoothing:antialiased}
body{background:linear-gradient(135deg,#c9d6e8 0%,#e6dcef 50%,#f1e2d6 100%);overflow:hidden}
body.dark{background:linear-gradient(135deg,#1b2333 0%,#2a2333 50%,#33281f 100%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
input,textarea{font:inherit;color:inherit}
svg{display:block}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:14px;height:14px}.i.xs{width:12px;height:12px}.i.l{width:18px;height:18px}
.i.fill{fill:currentColor}

#desk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px 318px 18px 18px;transition:padding 260ms}
body.demo-min #desk{padding-right:58px}
#win{position:relative;width:100%;max-width:1440px;height:100%;max-height:900px;background:var(--win);border-radius:24px;overflow:hidden;
  box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 30px 80px rgba(0,0,0,.28);display:flex}

/* ---------- Sidebar ---------- */
#side{position:relative;z-index:3;width:236px;flex:none;margin:8px 0 8px 8px;border-radius:16px;background:var(--sidebar);
  backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair);display:flex;flex-direction:column;padding:10px 8px;gap:2px;overflow:hidden}
.lights{display:flex;gap:8px;height:28px;align-items:center;padding:0 6px}
.lights span{width:12px;height:12px;border-radius:6px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.side-set{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:8px;font-weight:600}
.side-set .ic{width:22px;height:22px;border-radius:6px;background:linear-gradient(180deg,#5E9BFF,#2D6FE0);color:#fff;display:flex;align-items:center;justify-content:center}
.sec{font-size:11px;font-weight:600;color:var(--label2);padding:12px 8px 4px}
.row{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:8px;white-space:nowrap;overflow:hidden}
.row:hover{background:var(--hover)}.row.on{background:var(--sel)}
.row .ri{color:var(--accent);flex:none}.row .ri.voc{color:var(--vocab)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.count{font-size:11px;color:var(--label2);font-variant-numeric:tabular-nums}
.new-badge{font-size:9.5px;font-weight:600;color:var(--vocab);background:var(--vocabTint);border-radius:5px;padding:1px 4px}

/* ---------- Main / toolbar ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.toolbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;position:relative;z-index:6}
.tb-title{min-width:0;margin-right:auto;display:flex;flex-direction:column;line-height:1.15}
.tb-title b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title span{font-size:11px;color:var(--label2)}
.capsule{display:flex;align-items:center;height:36px;padding:3px;border-radius:18px;background:var(--glass);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px var(--hair)}
.tbtn{position:relative;height:30px;min-width:30px;padding:0 7px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--icon)}
.tbtn:hover{background:var(--hover)}.tbtn:active{background:var(--pressed)}
.tbtn.on{background:var(--accentTint);color:var(--accent)}
.tbtn.voc.on{background:var(--vocabTint);color:var(--vocab)}
.tbtn .lbl{font-size:12px}
.tdiv{width:1px;height:16px;background:var(--sep);margin:0 3px;flex:none}
.tip{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);padding:3px 7px;border-radius:5px;background:rgba(40,40,42,.92);color:#fff;font-size:11px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 120ms .35s;z-index:50;font-weight:400}
[data-tip]:hover>.tip{opacity:1}
.seg{display:flex;height:28px;padding:2px;border-radius:14px;background:var(--fill4)}
.seg button{flex:1;height:24px;padding:0 10px;border-radius:12px;font-size:12px;color:var(--label2);display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--label);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 .5px var(--hair)}
.seg.sm{height:24px}.seg.sm button{height:20px;padding:0 8px;font-size:11.5px}

#content{flex:1;min-height:0;display:flex;position:relative;margin:0 8px 8px 8px}

/* ---------- Reader ---------- */
#reader{flex:1;min-width:0;position:relative;background:var(--reader);border-radius:14px;overflow:hidden}
.reader-scroll{position:absolute;inset:0;overflow:auto;padding:28px 0 90px}
.page{position:relative;margin:0 auto;width:680px;max-width:calc(100% - 96px);color:var(--pageText)}
.page .kicker{font-size:11px;color:var(--label3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.page h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0 0 6px;line-height:1.3}
.page .byline{font-size:12px;color:var(--label3);margin-bottom:30px}
.page p{font-family:var(--serif);font-size:16.5px;line-height:1.9;margin:0 0 16px;text-align:justify;hyphens:auto}
.page p.flashp{animation:pflash 1.6s}
@keyframes pflash{0%,40%{background:var(--vocabTint)}100%{background:transparent}}
.page ::selection{background:rgba(0,122,255,.26)}
.hl{border-radius:2px}.hl.y{background:rgba(255,204,0,.36)}.hl.g{background:rgba(52,199,89,.30)}
/* Vocabulary occurrence: 1.5pt dotted underline in --vocab; gloss mode adds a small label in the line gap. */
body.hint-underline .vw,body.hint-gloss .vw{background-image:radial-gradient(circle,var(--vocabLine) .9px,transparent 1.1px);background-size:4px 2px;background-repeat:repeat-x;background-position:0 calc(100% - 1px);padding-bottom:2px;cursor:pointer;border-radius:2px}
body.hint-underline .vw:hover,body.hint-gloss .vw:hover,.vw.cur{background-color:var(--vocabTint)}
body.hint-gloss .vw{position:relative}
body.hint-gloss .vw::before{content:attr(data-g);position:absolute;left:50%;bottom:calc(100% - 3px);transform:translateX(-50%);font-family:var(--sans);font-size:10px;line-height:12px;color:var(--vocab);white-space:nowrap;pointer-events:none;letter-spacing:0;text-indent:0}
.vw.pulse{animation:vpulse 1.6s}
@keyframes vpulse{0%,45%{background-color:rgba(14,138,134,.32)}100%{background-color:transparent}}
.vw.known{background-image:none !important;cursor:text}
body:not(.show-known) .vw.known:hover{background-color:transparent}
body.show-known .vw.known{background-image:radial-gradient(circle,var(--label3) .8px,transparent 1px) !important}
body.hint-gloss .vw.known::before{content:none}


/* ---------- Floating toolbar + popovers ---------- */
#layer{position:absolute;inset:0;pointer-events:none;z-index:20}
#layer>*{pointer-events:auto}
.ftb{position:absolute;display:flex;align-items:center;gap:1px;height:38px;padding:4px;border-radius:19px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair);animation:fin 150ms}
@keyframes fin{from{opacity:0;transform:translateY(4px)}}
.ftb .cdot{width:14px;height:14px;margin:0 5px;border-radius:7px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.ftb .tbtn.ai{color:#5E5CE6}
.ftb .tbtn .badge{position:absolute;right:3px;top:4px;width:6px;height:6px;border-radius:3px;background:var(--vocab);box-shadow:0 0 0 1.5px var(--glass)}

.card{position:absolute;width:360px;border-radius:16px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair),0 10px 30px rgba(0,0,0,.10);padding:14px;animation:fin 150ms;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 24px);overflow:auto}
.card.wide{width:400px}
.card-h{display:flex;align-items:flex-start;gap:8px}
.term{font-size:21px;font-weight:600;line-height:1.2;letter-spacing:-.01em;word-break:break-word}
.phon{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;color:var(--label2);font-size:12px}
.pn{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.ibtn{position:relative;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--icon);flex:none}
.ibtn:hover{background:var(--hover)}.ibtn:active{background:var(--pressed)}
.ibtn.sm{width:22px;height:22px;border-radius:6px}
.ibtn:disabled{opacity:.35}
.ibtn.speaking{color:var(--accent)}
.add{height:28px;padding:0 11px 0 9px;border-radius:14px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;background:var(--vocab);color:#fff;white-space:nowrap;flex:none}
.add:hover{filter:brightness(1.06)}.add:active{filter:brightness(.94)}
.add.done{background:var(--vocabTint);color:var(--vocab)}
.add:disabled{background:var(--fill);color:var(--label3)}
.senses{display:flex;flex-direction:column;gap:6px}
.sense{display:flex;gap:8px;align-items:baseline;line-height:1.5}
.pos{flex:none;font-size:10.5px;font-weight:600;color:var(--label2);background:var(--fill4);border-radius:4px;padding:0 5px;line-height:17px;font-style:italic}
.ctx{border-radius:10px;background:var(--vocabTint);padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.ctx .lab{font-size:11px;font-weight:600;color:var(--vocab);display:flex;align-items:center;gap:6px}
.ctx .mean{font-weight:500}
.ctx .src{font-family:var(--serif);font-size:13px;line-height:1.65;color:var(--label)}
.ctx .src b{font-weight:600;color:var(--vocab)}
.ctx .tr{font-size:12px;color:var(--label2);line-height:1.55}
.forms{font-size:11.5px;color:var(--label2);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:10px;background:var(--fill4);font-size:11.5px;color:var(--label)}
.chip button{color:var(--label3);width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:7px}
.chip button:hover{background:var(--fill);color:var(--label)}
.card-f{display:flex;align-items:center;gap:4px;border-top:.5px solid var(--sep);padding-top:8px;margin-top:2px;font-size:11.5px;color:var(--label2)}
.card-f .grow{flex:1}
.lnk{height:24px;padding:0 8px;border-radius:12px;color:var(--accent);font-size:12px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.lnk:hover{background:var(--hover)}
.lnk.ai{color:#5E5CE6}
.status{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:500;background:var(--vocabTint);color:var(--vocab);white-space:nowrap}
.status.known{background:rgba(52,199,89,.14);color:var(--positive)}
.status .dot{width:6px;height:6px;border-radius:3px;background:currentColor}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--fill4) 0%,var(--fill) 50%,var(--fill4) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.problem{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--fill4);font-size:12.5px;line-height:1.55;color:var(--label2)}
.problem b{color:var(--label);font-weight:600}
.lang{display:flex;align-items:center;gap:2px}
.popup{height:24px;padding:0 6px 0 8px;border-radius:6px;background:var(--fill4);font-size:12px;display:flex;align-items:center;gap:4px}
.trans-src{font-family:var(--serif);font-size:13.5px;line-height:1.65;color:var(--label2);max-height:96px;overflow:auto}
.trans-out{font-size:14px;line-height:1.7}
.hintline{font-size:11.5px;color:var(--label3);display:flex;align-items:center;gap:5px;line-height:1.4}

/* Occurrence popover */
.vpop{position:absolute;width:300px;border-radius:14px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair),0 8px 24px rgba(0,0,0,.10);padding:12px;animation:fin 150ms;display:flex;flex-direction:column;gap:8px}
.vpop .term{font-size:17px}
.vpop .nav{white-space:nowrap;display:flex;align-items:center;gap:2px;font-size:11.5px;color:var(--label2);font-variant-numeric:tabular-nums}

/* Menus / settings popover */
.menu{position:absolute;width:280px;border-radius:14px;background:var(--glassOpaque);box-shadow:0 0 0 .5px var(--hair),0 10px 30px rgba(0,0,0,.12);padding:4px;animation:fin 120ms;z-index:30}
.menu .mh{font-size:11px;font-weight:600;color:var(--label2);padding:8px 10px 4px}
.menu .mrow{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:500}
.menu .mrow.hov:hover{background:var(--hover)}
.menu .mrow .grow{flex:1}
.menu .msep{height:.5px;background:var(--sep);margin:4px 8px}
.menu .mnote{font-size:11px;color:var(--label3);padding:2px 10px 8px;line-height:1.45}
.sw{width:26px;height:15px;border-radius:8px;background:var(--fill);position:relative;flex:none;transition:background 150ms}
.sw::after{content:"";position:absolute;left:1.5px;top:1.5px;width:12px;height:12px;border-radius:6px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left 150ms}
.sw.on{background:var(--accent)}.sw.on::after{left:12.5px}
.kbd{font-size:11px;color:var(--label3);font-variant-numeric:tabular-nums}

/* HUD */
.hud{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;height:36px;padding:0 8px 0 16px;border-radius:18px;background:rgba(30,30,32,.88);color:#fff;font-size:12.5px;backdrop-filter:blur(20px);animation:fin 200ms;white-space:nowrap}
.hud button{height:26px;padding:0 10px;border-radius:13px;color:#64D2FF;font-weight:500}
.hud button:hover{background:rgba(255,255,255,.1)}
.hud .dotv{width:7px;height:7px;border-radius:4px;background:#40C8C0}

/* ---------- Vocabulary book ---------- */
#book{flex:1;min-width:0;display:none;background:var(--reader);border-radius:14px;overflow:hidden}
body.view-book #book{display:flex}
body.view-book #reader{display:none}
.bk-list{width:340px;flex:none;display:flex;flex-direction:column;border-right:.5px solid var(--sep)}
.bk-head{padding:14px 14px 8px;display:flex;flex-direction:column;gap:8px}
.bk-title{display:flex;align-items:baseline;gap:8px}
.bk-title b{font-size:15px;font-weight:600}
.bk-title span{font-size:11.5px;color:var(--label2)}
.search{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:8px;background:var(--fill4);color:var(--label2)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:13px;color:var(--label)}
.bk-filters{display:flex;gap:6px;align-items:center}
.bk-rows{flex:1;overflow:auto;padding:4px 8px 12px}
.bk-row{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px}
.bk-row:hover{background:var(--hover)}.bk-row.on{background:var(--sel)}
.bk-row .w{font-weight:600;font-size:13.5px}
.bk-row .m{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-row .meta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.bk-row .sd{width:7px;height:7px;border-radius:4px;background:var(--vocab)}
.bk-row .sd.known{background:var(--positive)}
.bk-group{font-size:11px;font-weight:600;color:var(--label3);padding:10px 8px 4px}
.bk-detail{flex:1;min-width:0;overflow:auto;padding:24px 32px 40px}
.bk-detail .term{font-size:30px}
.bk-sec{margin-top:22px}
.bk-sec h4{margin:0 0 8px;font-size:11px;font-weight:600;color:var(--label2);display:flex;align-items:center;gap:6px}
.bk-sec h4 .grow{flex:1}
.note-area{width:100%;min-height:64px;resize:vertical;border-radius:8px;border:.5px solid var(--sep);background:var(--fill4);padding:8px 10px;font-size:13px;line-height:1.6;outline:none}
.note-area:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentTint)}
.ex{border-radius:10px;padding:10px 12px;box-shadow:inset 0 0 0 .5px var(--sep);display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.ex .src{font-family:var(--serif);font-size:14px;line-height:1.7}
.ex .src b{color:var(--vocab);font-weight:600}
.ex .tr{font-size:12px;color:var(--label2)}
.ex .from{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--label3)}
.ex .from .grow{flex:1}
.ex.gone .src{color:var(--label2)}
.bk-actions{display:flex;gap:8px;margin-top:26px}
.btn{height:28px;padding:0 12px;border-radius:14px;background:var(--fill);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(.97)}
.btn.danger{color:var(--critical);background:transparent}
.btn.danger:hover{background:rgba(215,0,21,.08)}
.form-in{border:0;outline:none;background:transparent;width:90px;font-size:11.5px;height:20px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--label2);text-align:center;padding:40px}
.empty .big{width:44px;height:44px;border-radius:12px;background:var(--vocabTint);color:var(--vocab);display:flex;align-items:center;justify-content:center}

/* ---------- Demo console ---------- */
#demo{position:fixed;right:14px;top:14px;z-index:200;width:288px;max-height:calc(100% - 28px);overflow:auto;border-radius:14px;background:rgba(20,20,22,.94);color:#f2f2f7;
  box-shadow:0 10px 40px rgba(0,0,0,.35);font-size:12px;transition:transform 260ms}
#demo.min{transform:translateX(250px)}
#demo .dh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:600;position:sticky;top:0;background:rgba(20,20,22,.98);z-index:1}

  $$('#dHint button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const keepMenu = !!$('#aaMenu');
  renderReader();
  if (keepMenu) { $('#aaMenu')?.remove(); openAa(); }
}
function toggleHints() {
  if (hintsActive()) setHint('off'); else setHint(S.lastHint || 'underline');
}

/* ---------------- Vocabulary book ---------------- */
function setView(v) {
  S.view = v; closeFloating();
  document.body.classList.toggle('view-book', v === 'book');
  $$('#side .row').forEach(r => r.classList.toggle('on', r.dataset.nav === v || (v === 'reader' && r.dataset.nav === 'reader')));
  $('#readerTools').style.visibility = v === 'book' ? 'hidden' : '';
  $('#tbTitle').textContent = v === 'book' ? '生词本' : DOC.title;
  $('#tbSub').textContent = v === 'book' ? '' : '第 1 / 3 章 · 12%';
  if (v === 'book') renderBook(); else renderReader();
}
function bookList() {
  const q = S.bookQuery.trim().toLowerCase();
  return S.vocab.filter(v => (S.bookFilter === 'all' || v.status === S.bookFilter)
    && (S.bookScope === 'all' || v.contexts.some(c => c.set === DOC.set) || occurrencesIn(v) > 0)
    && (!q || v.term.toLowerCase().includes(q) || v.senses.some(s => s[1].includes(q)) || v.forms.some(f => f.includes(q))));
}
function occurrencesIn(v) {
  const idx = new Map(); for (const f of v.forms) { const t = f.toLowerCase().split(/\s+/); if (!idx.has(t[0])) idx.set(t[0], []); idx.get(t[0]).push({ toks: t, v }); }
  return DOC.paras.reduce((n, p) => n + matchPara(p, idx).length, 0);
}
function renderBook() {
  const list = bookList();
  if (S.bookSel && !list.some(v => v.id === S.bookSel)) S.bookSel = null;
  if (!S.bookSel && list.length) S.bookSel = list[0].id;
  const today = list.filter(v => now() - v.added < 86400e3), older = list.filter(v => now() - v.added >= 86400e3);
  const row = v => {
    const n = occurrencesIn(v);
    return `<div class="bk-row ${S.bookSel === v.id ? 'on' : ''}" data-book="${v.id}">
      <div style="min-width:0;flex:1"><div class="w">${esc(v.term)}${v.kind === 'phrase' ? ' <span class="pos" style="font-style:normal">短语</span>' : ''}</div><div class="m">${esc(v.senses.map(s => s[1]).join('；') || '—')}</div></div>
      <div class="meta"><span class="sd ${v.status === 'known' ? 'known' : ''}" title="${v.status === 'known' ? '已掌握' : '学习中'}"></span>${n ? `<span class="count" title="本文出现次数">${n}</span>` : ''}</div></div>`;
  };
  const rows = list.length ? (today.length ? `<div class="bk-group">今天</div>${today.map(row).join('')}` : '') + (older.length ? `<div class="bk-group">更早</div>${older.map(row).join('')}` : '')
    : `<div class="empty"><div class="big">${ic('vocab', 'l')}</div><b style="color:var(--label)">${S.bookQuery ? '没有匹配的词' : '这里还没有词'}</b></div>`;
  $('#book').innerHTML = `<div class="bk-list">
      <div class="bk-head"><div class="search">${ic('search', 's')}<input id="bkQ" placeholder="搜索单词、释义" value="${esc(S.bookQuery)}"></div>
        <div class="bk-filters"><div class="seg sm" id="bkScope"><button data-v="set" ${S.bookScope === 'set' ? 'class="on"' : ''}>本学习集</button><button data-v="all" ${S.bookScope === 'all' ? 'class="on"' : ''}>全部</button></div>
          <div class="seg sm" id="bkFilter" style="margin-left:auto"><button data-v="learning" ${S.bookFilter === 'learning' ? 'class="on"' : ''}>学习中</button><button data-v="known" ${S.bookFilter === 'known' ? 'class="on"' : ''}>已掌握</button><button data-v="all" ${S.bookFilter === 'all' ? 'class="on"' : ''}>全部</button></div></div>
      </div>
      <div class="bk-rows">${rows}</div></div>
    <div class="bk-detail" id="bkDetail"></div>`;

}
function renderBookDetail() {
  const v = S.vocab.find(x => x.id === S.bookSel), host = $('#bkDetail'); if (!host) return;
  if (!v) { host.innerHTML = ''; return; }
  const ctx = v.contexts.map((c, k) => {
    const re = new RegExp(`\\b(${(c.hit || v.term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})\\b`, 'i');
    const here = c.doc === DOC.id, otherSet = c.set !== DOC.set;
    return `<div class="ex"><div class="src">${esc(c.sentence).replace(re, '<b>$1</b>')}</div>${c.tr ? `<div class="tr">${esc(c.tr)}</div>` : ''}
      <div class="from">${ic('doc', 'xs')}<span>${esc(c.set)} · ${esc(c.docTitle)}</span><span class="grow"></span>
      ${here ? `<button class="lnk" data-act="jump" data-id="${v.id}" data-k="${k}">${ic('goto', 'xs')}回到原文</button>` : `<button class="lnk" data-act="hud:演示：打开「${esc(c.set)}」并定位到原句">${otherSet ? '打开学习集' : '打开文档'} ›</button>`}
      <button class="ibtn sm" data-act="del-ctx" data-id="${v.id}" data-k="${k}" title="删除这条例句">${ic('close', 'xs')}</button></div></div>`;
  }).join('');
  host.innerHTML = `<div class="card-h" style="align-items:center"><div style="flex:1;min-width:0">
      <div class="term">${esc(v.term)}</div>
      <div class="phon" style="margin-top:8px">${v.phon?.uk ? phonHtml(v) : ''}
        <span class="status${v.status === 'known' ? ' known' : ''}"><span class="dot"></span>${v.status === 'known' ? '已掌握' : '学习中'}</span></div></div></div>
    <div class="bk-sec"><h4>释义<span class="grow"></span><button class="ibtn sm" data-act="hud:演示：重新生成释义" title="重新生成">${ic('spark', 's')}</button></h4>
      <div class="senses">${v.senses.length ? v.senses.map(([p, m]) => `<div class="sense"><span class="pos">${esc(p)}</span><span>${esc(m)}</span></div>`).join('') : '<span style="color:var(--label3)">—</span>'}</div></div>
    <div class="bk-sec"><h4>行间释义</h4>
      <input class="note-area" style="min-height:0;height:30px;resize:none" maxlength="8" data-edit="gloss" value="${esc(v.gloss || '')}" placeholder="如：平台期"></div>
    <div class="bk-sec"><h4>笔记</h4><textarea class="note-area" data-edit="note" placeholder="笔记">${esc(v.note || '')}</textarea></div>
    <div class="bk-sec"><h4>词形</h4>
      <div class="forms">${v.forms.map((f, k) => `<span class="chip">${esc(f)}${v.forms.length > 1 ? `<button data-act="del-form" data-id="${v.id}" data-k="${k}" title="不再识别">${ic('close', 'xs')}</button>` : ''}</span>`).join('')}
        <span class="chip" style="background:transparent;box-shadow:inset 0 0 0 .5px var(--sep)">${ic('plus', 'xs')}<input class="form-in" data-addform="${v.id}" placeholder="添加"></span></div></div>
    <div class="bk-sec"><h4>例句</h4>${ctx || '<span style="color:var(--label2)">没有例句。</span>'}</div>
    <div class="bk-actions"><button class="btn" data-act="${v.status === 'known' ? 'unknown' : 'known'}" data-id="${v.id}">${ic('check', 's')}${v.status === 'known' ? '重新学习' : '标为已掌握'}</button>
      <span style="flex:1"></span><button class="btn danger" data-act="remove" data-id="${v.id}">${ic('trash', 's')}从生词本删除</button></div>`;
}
function jumpTo(id, k) {
  const v = S.vocab.find(x => x.id === id); const c = v?.contexts[k]; if (!c) return;
  setView('reader');
  const p = $(`#page p[data-p="${c.p}"]`); if (!p) return;
  p.scrollIntoView({ block: 'center', behavior: 'smooth' });
  p.classList.remove('flashp'); void p.offsetWidth; p.classList.add('flashp');
  $$(`.vw[data-v="${id}"]`, p).forEach(e => { e.classList.remove('pulse'); void e.offsetWidth; e.classList.add('pulse'); });
}

/* ---------------- Speech (system TTS in the app; Web Speech here) ---------------- */
function speak(btn, term) {
  btn.classList.add('speaking');
  try {
    const u = new SpeechSynthesisUtterance(term); u.lang = btn.title.includes('英') ? 'en-GB' : 'en-US';
    u.onend = () => btn.classList.remove('speaking'); speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch { /* no speech engine in this browser */ }
  setTimeout(() => btn.classList.remove('speaking'), 1500);
}

/* ---------------- Events ---------------- */
document.addEventListener('mouseup', e => {
  if (e.target.closest('#layer,#demo,.toolbar')) return;
  if (!e.target.closest('#page')) return;
  setTimeout(() => {
    const sel = window.getSelection();
    if (sel.isCollapsed) {
      const vw = e.target.closest('.vw:not(.known)') || (S.showKnown && e.target.closest('.vw'));
      if (vw && hintsActive()) openOccurrence(vw); else closeFloating(true);
      return;
    }
    onSelectionEnd();
  }, 0);
});
document.addEventListener('mousedown', e => {
  if (e.target.closest('#layer,#demo,#aaBtn,#hintBtn')) return;

});
document.addEventListener('click', e => {
  const t = e.target;
  const sp = t.closest('[data-speak]'); if (sp) { speak(sp, sp.dataset.speak); return; }
  if (t.closest('[data-close]')) { closeFloating(); return; }
  const fb = t.closest('[data-ftb]');
  if (fb) {
    const k = fb.dataset.ftb;
    if (k === 'lookup') openLookup();
    else if (k === 'copy') { closeFloating(); hud('已复制'); }
    else if (k === 'hl') { closeFloating(); hud('演示：已摘录到脑图'); }
    else if (k.startsWith('hud:')) { closeFloating(); hud(k.slice(4)); }
    return;
  }
  const nav = t.closest('[data-nav]');
  if (nav) { const n = nav.dataset.nav; if (n === 'book') setView('book'); else if (n === 'reader') setView('reader'); else hud('演示：该入口不在本原型范围内'); return; }
  const bk = t.closest('[data-book]'); if (bk) { S.bookSel = bk.dataset.book; renderBook(); return; }
  const seg = t.closest('#bkScope button,#bkFilter button');
  if (seg) { if (seg.parentElement.id === 'bkScope') S.bookScope = seg.dataset.v; else S.bookFilter = seg.dataset.v; S.bookSel = null; renderBook(); return; }
  const ah = t.closest('#aaHint button'); if (ah) { setHint(ah.dataset.v); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, card = a.closest('.card');
  if (act === 'add-word' || act === 'add-phrase' || act === 'add-bare') addFromCard(card);
  else if (act === 'vocab-menu') { const v = S.vocab.find(x => x.id === a.dataset.id); vocabMenu(a, v); }
  else if (act === 'add-context') {
    const v = S.vocab.find(x => x.id === a.dataset.id), L = card._lookup || {};
    const sentence = L.sentence || sentenceOf(S.sel.pi, S.sel.text), trKey = Object.keys(SENT_TR).find(k => sentence.startsWith(k));
    v.contexts.unshift({ set: DOC.set, doc: DOC.id, docTitle: DOC.title, p: S.sel?.pi ?? 0, sentence, hit: S.sel?.text, tr: trKey ? SENT_TR[trKey] : '', at: now() });
    fillWordCard(card, S.sel, sentence); hud('已收录例句', null, null, true);
  }
  else if (act === 'translate-sentence') { const s = S.sel; S.sel = { ...s, text: sentenceOf(s.pi, s.text), kind: 'sentence' }; closeFloating(true); transCard(); }
  else if (act === 'ask') { closeFloating(); hud('演示：已带上选区打开助手'); }
  else if (act === 'copy-tr') hud('已复制译文');
  else if (act === 'known') setStatus(a.dataset.id, 'known');
  else if (act === 'unknown') setStatus(a.dataset.id, 'learning');
  else if (act === 'remove') removeEntry(a.dataset.id);
  else if (act === 'book-entry') { S.bookSel = a.dataset.id; const v = S.vocab.find(x => x.id === a.dataset.id); if (v && v.status === 'known') S.bookFilter = 'all'; S.bookScope = 'all'; setView('book'); }
  else if (act === 'occ-prev') stepOccurrence(-1);
  else if (act === 'occ-next') stepOccurrence(1);
  else if (act === 'toggle-docoff') { S.docOff = !S.docOff; renderReader(); $('#aaMenu')?.remove(); openAa(); }
  else if (act === 'toggle-known') { S.showKnown = !S.showKnown; renderReader(); $('#aaMenu')?.remove(); openAa(); }
  else if (act === 'jump') jumpTo(a.dataset.id, +a.dataset.k);
  else if (act === 'del-ctx') { const v = S.vocab.find(x => x.id === a.dataset.id); const [c] = v.contexts.splice(+a.dataset.k, 1); renderBookDetail(); hud('已删除例句', '撤销', () => { v.contexts.splice(+a.dataset.k, 0, c); renderBookDetail(); }); }
  else if (act === 'del-form') { const v = S.vocab.find(x => x.id === a.dataset.id); v.forms.splice(+a.dataset.k, 1); renderBook(); }
  else if (act.startsWith('hud:')) { closeFloating(); hud(act.slice(4)); }
});
function vocabMenu(anchor, v) {
  $$('.menu', layer()).forEach(e => e.remove());
  const m = document.createElement('div'); m.className = 'menu'; m.style.width = '200px';
  m.innerHTML = `<div class="mrow hov" data-act="book-entry" data-id="${v.id}"><span class="grow">在生词本中查看</span></div>
    <div class="mrow hov" data-act="${v.status === 'known' ? 'unknown' : 'known'}" data-id="${v.id}"><span class="grow">${v.status === 'known' ? '重新学习' : '标为已掌握'}</span></div>
    <div class="msep"></div><div class="mrow hov" data-act="remove" data-id="${v.id}" style="color:var(--critical)"><span class="grow">移出生词本</span></div>`;
  layer().appendChild(m);
  const r = relRect(anchor.getBoundingClientRect());
  m.style.left = Math.min(r.x, r.bw - 212) + 'px'; m.style.top = (r.y + r.h + 4) + 'px';

$('#hintBtn').onclick = () => toggleHints();
$('#aaBtn').onclick = () => { if ($('#aaMenu')) $('#aaMenu').remove(); else openAa(); };
$$('[data-hud]').forEach(b => b.onclick = () => hud(b.dataset.hud));
document.addEventListener('input', e => {
  if (e.target.id === 'bkQ') { S.bookQuery = e.target.value; const pos = e.target.selectionStart; renderBook(); const q = $('#bkQ'); q.focus(); q.setSelectionRange(pos, pos); return; }
  const ed = e.target.dataset.edit;

});
document.addEventListener('keydown', e => {
  const typing = e.target.closest('input,textarea');
  if (e.target.dataset?.addform && e.key === 'Enter') {
    const v = S.vocab.find(x => x.id === e.target.dataset.addform), f = e.target.value.trim().toLowerCase();
    if (f && !v.forms.includes(f)) { v.forms.push(f); renderBook(); $(`[data-addform="${v.id}"]`)?.focus(); }
    return;
  }
  if (e.key === 'Escape') { closeFloating(); return; }
  if (e.shiftKey && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'u') { e.preventDefault(); toggleHints(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('.ftb', layer()) && e.key.toLowerCase() === 't') { e.preventDefault(); openLookup(); return; }
  const addable = $('.card .add:not(.done):not(:disabled)', layer());
  if (addable && e.key.toLowerCase() === 's') { e.preventDefault(); addable.click(); }
});

/* ---------------- Programmatic selection for scenes ---------------- */
function selectText(pi, text, nth = 0) {
  const p = $(`#page p[data-p="${pi}"]`);
  const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
  let full = '', nodes = [];
  while (walker.nextNode()) { nodes.push([walker.currentNode, full.length]); full += walker.currentNode.data; }
  let at = -1; for (let k = 0; k <= nth; k++) at = full.indexOf(text, at + 1);
  if (at < 0) return false;
  const pos = off => { for (let k = nodes.length - 1; k >= 0; k--) if (nodes[k][1] <= off) return [nodes[k][0], off - nodes[k][1]]; };
  const [sn, so] = pos(at), [en, eo] = pos(at + text.length);
  const r = document.createRange(); r.setStart(sn, so); r.setEnd(en, eo);
  p.scrollIntoView({ block: 'center' });
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  S.sel = { text, pi, rect: r.getBoundingClientRect(), kind: classify(text) };
  return true;
}

  { t: '再次查已收录的词', d: '按钮显示状态，+ 收录当前句为例句', run: () => { setView('reader'); setTimeout(() => { selectText(3, 'plateaus'); openLookup(); }, 60); } },
  { t: '点按正文中的生词', d: '释义、本文各处切换、掌握 / 移出', run: () => { setHint('underline'); setView('reader'); setTimeout(() => { const el = $('.vw[data-v="v-plateau"]'); el.scrollIntoView({ block: 'center' }); setTimeout(() => openOccurrence(el), 50); }, 60); } },
  { t: '行间释义模式', d: '在行距空隙显示简短释义，不重排正文', run: () => { setView('reader'); setHint('gloss'); $('#scroll').scrollTop = 0; } },
  { t: '阅读设置 · 关闭提示', d: '关闭 / 下划线 / 行间释义；可只在本文档隐藏', run: () => { setView('reader'); setHint('underline'); setTimeout(openAa, 50); } },
  { t: '生词本 · 列表与详情', d: '本学习集 / 全部；学习中 / 已掌握；例句可回原文', run: () => { S.bookScope = 'all'; S.bookFilter = 'learning'; S.bookSel = 'v-tacit'; setView('book'); } },
  { t: '生词本 → 回到原文', d: '点例句的「回到原文」，跳到出处并闪烁', run: () => { S.bookScope = 'set'; S.bookFilter = 'learning'; S.bookSel = 'v-plateau'; setView('book'); setTimeout(() => jumpTo('v-plateau', 0), 900); } },
  { t: '未设置模型时查词', d: '与划词翻译相同的问题状态，仍可加入', run: () => { setAi('setup'); setView('reader'); setTimeout(() => { selectText(4, 'glamorous'); openLookup(); }, 60); } },
];
function renderScenes() {
  $('#scenes').innerHTML = SCENES.map((s, i) => `<button class="scn ${S.scene === i ? 'on' : ''}" data-scn="${i}"><span class="n">${i + 1}</span><span>${s.t}<small>${s.d}</small></span></button>`).join('');
}
$('#scenes').addEventListener('click', e => {
  const b = e.target.closest('[data-scn]'); if (!b) return;
  const i = +b.dataset.scn; S.scene = i; renderScenes(); closeFloating(); $('#hudHost').innerHTML = '';

});
function setAi(v) { S.ai = v; $$('#dAi button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
$('#dAi').onclick = e => { const b = e.target.closest('button'); if (b) setAi(b.dataset.v); };

$('#dTheme').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.theme = b.dataset.v; document.body.classList.toggle('dark', S.theme === 'dark'); $$('#dTheme button').forEach(x => x.classList.toggle('on', x === b)); };
$('#dReset').onclick = () => { reset(); hud('演示数据已重置'); };

  if (S.view === 'book') renderBook();
}

paintIcons();
renderReader();
renderScenes();
