<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarginMind · 全文翻译（分批确认 / 一次完成）· 高保真交互原型</title>
<style>
/* Tokens mirror packages/mm_design (MMColors / MMTypography / MMRadii). */
:root{
  --win:#FFFFFF; --sidebar:rgba(242,242,246,.86); --reader:#F2F2F5; --card:#FFFFFF; --page:#FFFFFF; --pageText:#1d1d1f;
  --label:#1D1D1F; --label2:#636366; --label3:#8E8E93; --icon:#6E6E73; --sep:rgba(0,0,0,.09); --fill:rgba(120,120,128,.12); --fill4:rgba(120,120,128,.08);
  --sel:rgba(0,0,0,.075); --hover:rgba(0,0,0,.045); --pressed:rgba(0,0,0,.09);
  --accent:#007AFF; --accentTint:rgba(0,122,255,.12); --accentPair:rgba(0,122,255,.09); --onAccent:#fff;
  --glass:rgba(255,255,255,.90); --glassOpaque:#F7F7F9; --hair:rgba(0,0,0,.08);
  --positive:#248A3D; --positiveTint:rgba(36,138,61,.10); --caution:#C93400; --cautionTint:rgba(201,52,0,.09); --critical:#D70015; --criticalTint:rgba(215,0,21,.08);
  /* Page-grid states (translation job). Grey family for "not sent", accent for "in flight", green for "saved". */
  --gNone:rgba(120,120,128,.14); --gQueued:rgba(0,122,255,.22); --gRun:#007AFF; --gDone:#34C759; --gReused:#8FD9A4; --gSkip:transparent; --gFail:#FF3B30; --gPartial:#FFCC00;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
}
.dark{
  --win:#1E1E1F; --sidebar:rgba(44,44,47,.86); --reader:#161617; --card:#2C2C2E; --page:#232325; --pageText:#E5E5EA;
  --label:#F5F5F7; --label2:#AEAEB2; --label3:#8E8E93; --icon:#AEAEB2; --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.24); --fill4:rgba(118,118,128,.14);
  --sel:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06); --pressed:rgba(255,255,255,.12);
  --accent:#0A84FF; --accentTint:rgba(10,132,255,.20); --accentPair:rgba(10,132,255,.16);
  --glass:rgba(50,50,53,.92); --glassOpaque:#2A2A2D; --hair:rgba(255,255,255,.10);
  --positive:#30D158; --positiveTint:rgba(48,209,88,.14); --caution:#FF9F0A; --cautionTint:rgba(255,159,10,.14); --critical:#FF453A; --criticalTint:rgba(255,69,58,.14);
  --gNone:rgba(118,118,128,.26); --gQueued:rgba(10,132,255,.35); --gRun:#0A84FF; --gDone:#30D158; --gReused:#1F8A43; --gFail:#FF453A; --gPartial:#FFD60A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--sans);font-size:13px;color:var(--label);-webkit-font-smoothing:antialiased}
body{background:linear-gradient(135deg,#c9d6e8 0%,#e6dcef 50%,#f1e2d6 100%);overflow:hidden}
body.dark{background:linear-gradient(135deg,#1b2333 0%,#2a2333 50%,#33281f 100%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
input,textarea{font:inherit;color:inherit}
svg{display:block}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:14px;height:14px}.i.xs{width:12px;height:12px}.i.l{width:18px;height:18px}
.i.fill{fill:currentColor}
.num{font-variant-numeric:tabular-nums}

#desk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px 318px 18px 18px;transition:padding 260ms}
body.demo-min #desk{padding-right:58px}
#win{position:relative;width:100%;max-width:1440px;height:100%;max-height:900px;background:var(--win);border-radius:24px;overflow:hidden;
  box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 30px 80px rgba(0,0,0,.28);display:flex}

/* ---------- Sidebar ---------- */
#side{position:relative;z-index:3;width:236px;flex:none;margin:8px 0 8px 8px;border-radius:16px;background:var(--sidebar);
  backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair);display:flex;flex-direction:column;padding:10px 8px;gap:2px;overflow:hidden;transition:width 220ms,margin 220ms,opacity 220ms}
body.side-off #side{width:0;margin-right:0;padding:0;opacity:0}
.lights{display:flex;gap:8px;height:28px;align-items:center;padding:0 6px}
.lights span{width:12px;height:12px;border-radius:6px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.side-set{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:8px;font-weight:600;white-space:nowrap}
.side-set .ic{width:22px;height:22px;border-radius:6px;background:linear-gradient(180deg,#5E9BFF,#2D6FE0);color:#fff;display:flex;align-items:center;justify-content:center}
.sec{font-size:11px;font-weight:600;color:var(--label2);padding:12px 8px 4px;white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:8px;white-space:nowrap;overflow:hidden}
.row:hover{background:var(--hover)}.row.on{background:var(--sel)}
.row .ri{color:var(--accent);flex:none}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.count{font-size:11px;color:var(--label2);font-variant-numeric:tabular-nums}
/* Sidebar job indicator: 14pt ring, same colours as the toolbar capsule. */
.ring{width:14px;height:14px;flex:none;border-radius:50%;background:conic-gradient(var(--rc,var(--accent)) calc(var(--p,0)*1%),var(--fill) 0)}
.ring.paused{--rc:var(--label3)}.ring.err{--rc:var(--critical)}.ring.review{--rc:var(--accent)}
.ring::after{content:"";display:block;margin:3px;width:8px;height:8px;border-radius:50%;background:var(--sidebar)}
body:not(.dark) .ring::after{background:#F2F2F6}
body.dark .ring::after{background:#2C2C2F}
.dotq{width:7px;height:7px;border-radius:4px;background:var(--accent);flex:none}

/* ---------- Main / toolbar ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.toolbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;position:relative;z-index:6}
.tb-title{min-width:0;margin-right:auto;display:flex;flex-direction:column;line-height:1.15}
.tb-title b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title span{font-size:11px;color:var(--label2)}
.capsule{display:flex;align-items:center;height:36px;padding:3px;border-radius:18px;background:var(--glass);box-shadow:0 0 0 .5px var(--hair)}
.tbtn{position:relative;height:30px;min-width:30px;padding:0 7px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--icon)}
.tbtn:hover{background:var(--hover)}.tbtn:active{background:var(--pressed)}
.tbtn.on{background:var(--accentTint);color:var(--accent)}
.tdiv{width:1px;height:16px;background:var(--sep);margin:0 3px;flex:none}
.tip{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);padding:3px 7px;border-radius:5px;background:rgba(40,40,42,.92);color:#fff;font-size:11px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 120ms .35s;z-index:50;font-weight:400}
[data-tip]:hover>.tip{opacity:1}
.seg{display:flex;height:28px;padding:2px;border-radius:14px;background:var(--fill4)}
.seg button{flex:1;height:24px;padding:0 10px;border-radius:12px;font-size:12px;color:var(--label2);display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--label);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 .5px var(--hair)}
.seg.sm{height:24px}.seg.sm button{height:20px;padding:0 8px;font-size:11.5px}
.seg button:disabled{opacity:.4}

#content{flex:1;min-height:0;display:flex;position:relative;margin:0 8px 8px 8px}

/* ---------- Compare reader ---------- */
#reader{flex:1;min-width:0;position:relative;background:var(--reader);border-radius:14px;overflow:hidden;display:flex}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.ptitle{height:36px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;border-bottom:.5px solid var(--sep);background:var(--win);position:relative;z-index:4}
.dname{height:24px;padding:0 6px;border-radius:7px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;max-width:230px;color:var(--label)}
.dname:hover{background:var(--hover)}
.dname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dname .i{color:var(--icon)}
.lang{font-size:11px;color:var(--label2);background:var(--fill4);border-radius:5px;padding:1px 6px;white-space:nowrap}
.ptitle .sp{flex:1}
.pgno{font-size:11px;color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ibtn{position:relative;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--icon);flex:none}
.ibtn:hover{background:var(--hover)}.ibtn:active{background:var(--pressed)}
.ibtn.sm{width:24px;height:24px;border-radius:7px}
.ibtn.on{background:var(--accentTint);color:var(--accent)}
.gutter{width:34px;flex:none;background:var(--reader);border-left:.5px solid var(--sep);border-right:.5px solid var(--sep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;z-index:3}
.gutter .gb{width:28px;height:28px;border-radius:8px;background:var(--glass);box-shadow:0 0 0 .5px var(--hair);display:flex;align-items:center;justify-content:center;color:var(--icon);position:relative}
.gutter .gb.on{background:var(--accentTint);color:var(--accent)}
.gutter .gb .tip{top:50%;left:calc(100% + 6px);transform:translateY(-50%)}
.pscroll{flex:1;min-height:0;overflow:auto;padding:16px 0 80px;scroll-behavior:auto}
.pg{position:relative;margin:0 auto 14px;width:calc(100% - 40px);max-width:520px;min-height:300px;background:var(--page);border-radius:3px;box-shadow:0 0 0 .5px var(--hair),0 1px 3px rgba(0,0,0,.06);padding:30px 38px 34px;color:var(--pageText)}
.pg .hdr{font-family:var(--sans);font-size:9.5px;letter-spacing:.12em;color:var(--label3);text-transform:uppercase;margin-bottom:18px}
.pg .ftr{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:10px;color:var(--label3);font-variant-numeric:tabular-nums}
.pg h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:4px 0 14px;line-height:1.35}
.pg p,.pg .para{font-family:var(--serif);font-size:13px;line-height:1.78;margin:0 0 11px;text-align:justify;hyphens:auto;border-radius:3px;transition:background 120ms}
.pg .fig{height:120px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--fill4) 0 8px,transparent 8px 16px);box-shadow:inset 0 0 0 .5px var(--sep);margin:6px 0 10px;display:flex;align-items:center;justify-content:center;color:var(--label3);font-size:11px}
.pg .cap{font-family:var(--sans);font-size:11px;color:var(--label2);text-align:center}
.pg .pair{background:var(--accentPair);box-shadow:0 0 0 3px var(--accentPair)}
.pg.cur-batch{box-shadow:0 0 0 .5px var(--hair),0 1px 3px rgba(0,0,0,.06)}
.pg .pgmark{position:absolute;top:10px;right:12px;font-size:10px;color:var(--label3);display:flex;align-items:center;gap:4px}
/* Translation side */
#paneR .para{position:relative;font-size:13.5px;line-height:1.85}
#paneR .para.wait{color:transparent;user-select:none;min-height:46px;background:linear-gradient(90deg,var(--fill4) 0%,var(--fill) 40%,var(--fill4) 80%);background-size:300% 100%;animation:shim 1.2s linear infinite}
#paneR .para.wait.short{min-height:24px}
#paneR .para.queued{color:transparent;user-select:none;min-height:46px;background:var(--fill4);animation:none}
#paneR .para.queued.short{min-height:24px}
@keyframes shim{from{background-position:100% 0}to{background-position:-50% 0}}
#paneR .para.arrive{animation:arrive 360ms}
@keyframes arrive{from{opacity:0}}
#paneR .para.keep{color:var(--label3)}
#paneR .para.fail{padding:8px 10px 8px 12px;background:var(--criticalTint);border-radius:6px;box-shadow:inset 2px 0 0 var(--critical)}
#paneR .para.fail .orig{color:var(--label2);font-size:12.5px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#paneR .para.fail .fl{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11.5px;color:var(--critical);margin-top:6px}
#paneR .para.fail .fl .sp{flex:1}
#paneR .para .rt{font-family:var(--sans);position:absolute;right:-2px;top:-20px;font-size:10px;color:var(--label3);background:var(--page);padding:0 4px;border-radius:4px}
#paneR .para.editing{outline:1.5px solid var(--accent);outline-offset:3px;background:var(--page);cursor:text}
#paneR .para .edm{display:inline-flex;vertical-align:1px;margin-left:4px;color:var(--label3)}
.pacts{position:absolute;right:-4px;top:-30px;display:none;align-items:center;gap:1px;height:28px;padding:2px;border-radius:14px;background:var(--glass);box-shadow:0 0 0 .5px var(--hair),0 4px 14px rgba(0,0,0,.08);z-index:5}
#paneR .para.done:hover .pacts,#paneR .para.done.pacts-on .pacts{display:flex}
.pacts .ibtn{width:24px;height:24px;border-radius:12px}
.pacts .ibtn .tip{top:auto;bottom:calc(100% + 6px)}
.placeholder-page{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:300px;color:var(--label3);font-size:12px;text-align:center}
.placeholder-page .sub{font-size:11.5px}
.plain{height:24px;padding:0 9px;border-radius:7px;font-size:12px;color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.plain:hover{background:var(--accentTint)}
.plain.crit{color:var(--critical)}.plain.crit:hover{background:var(--criticalTint)}
.plain.grey{color:var(--label2)}.plain.grey:hover{background:var(--hover)}

/* ---------- Job capsule (AI pane title bar) ---------- */
.job{height:24px;padding:0 8px 0 6px;border-radius:12px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--fill4);color:var(--label)}
.job:hover{background:var(--fill)}
.job .ring{width:12px;height:12px}
.job .ring::after{margin:2.5px;width:7px;height:7px;background:var(--win) !important}
.job.review{background:var(--accentTint);color:var(--accent)}
.job.err{background:var(--criticalTint);color:var(--critical)}
.job.warn{background:var(--cautionTint);color:var(--caution)}
.job.ok{background:var(--positiveTint);color:var(--positive)}
.job .sub{color:var(--label2);font-weight:400}
.job.review .sub,.job.err .sub,.job.warn .sub,.job.ok .sub{color:inherit;opacity:.8}
.spin{width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Strip under AI title (job-level problems) ---------- */
#strip:empty{display:none}
.strip{display:flex;align-items:center;gap:8px;min-height:36px;padding:6px 8px 6px 12px;font-size:12px;border-bottom:.5px solid var(--sep);background:var(--win);position:relative;z-index:3;animation:fin 160ms}
.strip.err{background:linear-gradient(var(--criticalTint),var(--criticalTint)),var(--win);color:var(--label)}
.strip.warn{background:linear-gradient(var(--cautionTint),var(--cautionTint)),var(--win)}
.strip .si{flex:none}
.strip.err .si{color:var(--critical)}.strip.warn .si{color:var(--caution)}
.strip .tx{flex:1;min-width:0;line-height:1.4}
.strip .tx small{color:var(--label2);font-size:11.5px;margin-left:4px}

/* ---------- Floating: menus, popovers, checkpoint, sheet ---------- */
#layer{position:absolute;inset:0;pointer-events:none;z-index:40}
#layer>*{pointer-events:auto}
@keyframes fin{from{opacity:0;transform:translateY(4px)}}
.menu{position:absolute;min-width:250px;padding:5px;border-radius:12px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair),0 10px 30px rgba(0,0,0,.14);animation:fin 140ms;font-size:13px}
.mi{display:flex;align-items:center;gap:8px;height:26px;padding:0 9px;border-radius:7px;white-space:nowrap}
.mi:hover{background:var(--accent);color:#fff}.mi:hover .k,.mi:hover .i,.mi:hover .badge{color:#fff}
.mi .i{color:var(--icon)}
.mi .k{margin-left:auto;color:var(--label3);font-size:12px;padding-left:16px}
.mi.dis{color:var(--label3)}.mi.dis:hover{background:none;color:var(--label3)}.mi.dis:hover .i{color:var(--label3)}
.mi .badge{font-size:10px;color:var(--accent);font-weight:600;margin-left:2px}
.mi.flash{animation:miflash 1.4s 2}
@keyframes miflash{0%,100%{background:none}50%{background:var(--accentTint)}}
.msep{height:.5px;background:var(--sep);margin:5px 8px}
.mh{font-size:11px;color:var(--label3);padding:4px 9px 2px;font-weight:600}

.pop{position:absolute;width:372px;border-radius:16px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair),0 12px 34px rgba(0,0,0,.14);padding:14px;animation:fin 150ms;display:flex;flex-direction:column;gap:12px}
.pop-h{display:flex;align-items:center;gap:8px}
.pop-h b{font-size:13px}
.pop-h .sub{color:var(--label2);font-size:12px}
.pop-h .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.cell{aspect-ratio:3/4;border-radius:2.5px;background:var(--gNone);position:relative}
.cell:hover{outline:1.5px solid var(--label2);outline-offset:1px}
.cell.queued{background:var(--gQueued)}
.cell.run{background:var(--gRun);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.cell.done{background:var(--gDone)}
.cell.reused{background:var(--gReused)}
.cell.skip{background:transparent;box-shadow:inset 0 0 0 1px var(--gNone)}
.cell.fail{background:var(--gFail)}
.cell.partial{background:linear-gradient(180deg,var(--gDone) 0 50%,var(--gFail) 50%)}
.cell.out{opacity:.35}
.cell.cur::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--label)}
.cell.bstart{box-shadow:-2px 0 0 0 var(--label3)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--label2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:10px;border-radius:2px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:10px;background:var(--fill4);padding:8px 10px}
.stat b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--label2)}
.stat.crit b{color:var(--critical)}
.kv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--label2)}
.kv b{font-weight:500;color:var(--label);font-variant-numeric:tabular-nums}
.pop-f{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.pop-f .sp{flex:1}
.btn{height:28px;padding:0 13px;border-radius:8px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;background:var(--fill);color:var(--label)}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;filter:none}
.btn.danger{color:var(--critical)}
.cell-tip{position:absolute;padding:4px 8px;border-radius:6px;background:rgba(40,40,42,.94);color:#fff;font-size:11px;white-space:nowrap;pointer-events:none;z-index:60;transform:translate(-50%,-100%);margin-top:-6px}

/* Checkpoint: anchored to the bottom of the AI pane, never covering the left pane. */
#checkpoint:empty{display:none}
.ckpt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(420px,calc(100% - 24px));border-radius:16px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--hair),0 12px 34px rgba(0,0,0,.16);padding:14px;display:flex;flex-direction:column;gap:11px;z-index:6;animation:ckin 240ms cubic-bezier(.2,.8,.2,1)}
@keyframes ckin{from{opacity:0;transform:translate(-50%,10px)}}
.ckpt.min{width:auto;padding:6px 6px 6px 12px;flex-direction:row;align-items:center;gap:8px;border-radius:20px}
.ck-h{display:flex;align-items:center;gap:8px}
.ck-h .badge{width:22px;height:22px;border-radius:11px;background:var(--accentTint);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.ck-h b{font-size:13px}
.ck-h .sub{color:var(--label2);font-size:12px}
.ck-h .sp{flex:1}

  if (fig) el.style.cssText = 'font-family:var(--sans);font-size:11px;color:var(--label2);text-align:center';
  if (st.s === 'none') { el.classList.add('queued'); el.innerHTML = ''; return; }

    el.classList.add(st.s === 'run' ? 'wait' : 'queued');
    el.innerHTML = st.retryLabel ? `<span class="rt">${st.retryLabel}</span>` : '';
    return;
  }
  if (st.s === 'fail') {
    el.classList.add('fail');
    el.innerHTML = `<div class="orig">${esc(p.en)}</div><div class="fl">${ic('warn', 'xs')}<span>未译 · ${esc(st.err || '请求失败')}</span><span class="sp"></span><button class="plain crit" data-act="retry" data-id="${id}">${ic('retry', 'xs')}重试</button></div>`;
    return;
  }
  el.classList.add('done');
  if (st.arrive) { el.classList.add('arrive'); st.arrive = false; }
  el.innerHTML = `${esc(st.zh)}${st.edited ? `<span class="edm" title="已手动修改">${ic('pencil', 'xs')}</span>` : ''}<span class="pacts">
    <button class="ibtn" data-tip data-act="retrans" data-id="${id}">${ic('retry', 's')}<span class="tip">重新翻译</span></button>

    <button class="ibtn" data-tip data-act="copy" data-id="${id}">${ic('copy', 's')}<span class="tip">拷贝</span></button></span>`;
}

let syncing = false;

}
function syncFrom(src, dst) {

<h1>全文翻译 · 约束与规范</h1>
<p class="lead">完整说明见 <code>docs/full-translation.md</code>。这里列出实现时<b>必须遵守</b>的规则。原型中的文档与译文都是演示数据。</p>

<h2>1. 原则</h2>
<ol>
<li><b>克制。</b>没有新的工具栏按钮；入口在对照阅读菜单、文档右键和「更多」。任务进度只在 AI 栏标题条的一枚胶囊里，侧栏文档行一个进度环。</li>
<li><b>停就是停。</b>暂停、检查点、出错时，<span class="must">不发出任何新请求</span>；在途请求完成后照常保存。</li>
<li><b>付过费的结果一定保存。</b>每段成功立即落盘；停止、退出、崩溃最多丢失在途请求。</li>
<li><b>同一段不译两次。</b>按原文内容（textKey）缓存；重复段落只译一次；页眉页码、已是目标语言的段落不发送。重译只能由用户逐段发起。</li>
<li><b>原文是锚点。</b>译文一一对应原文段落，悬停联动，摘录指向原文。</li>
</ol>

<h2>2. 状态</h2>
<table><tr><th>任务状态</th><th>胶囊</th><th>会发请求？</th><th>离开方式</th></tr>
<tr><td>running</td><td>进度环 + 百分比 + 第 n 批 · x/y 页</td><td>是（最多 2 个并发）</td><td>批完成 → review / done；暂停；错误</td></tr>
<tr><td>review（仅分批）</td><td>✓ 第 n 批待确认（强调色）</td><td>否</td><td>继续下一批 / 翻译剩余全部 / 结束</td></tr>
<tr><td>paused</td><td>⏸ 已暂停 · x/y 页</td><td>否</td><td>继续 / 停止</td></tr>
<tr><td>offline</td><td>等待网络（警示色）</td><td>否</td><td>联网自动继续（用户暂停过的除外）</td></tr>
<tr><td>budget</td><td>已暂停 · 超出预估</td><td>否</td><td>继续（本任务不再询问）/ 停止</td></tr>
<tr><td>error</td><td>已暂停（错误色）+ 标题条下横条</td><td>否</td><td>修好后重试 / 停止</td></tr>
<tr><td>done</td><td>全文已译 / 已完成 · n 段未译</td><td>否（单段重试除外）</td><td>—</td></tr>
<tr><td>stopped</td><td>已停止 · x/y 页</td><td>否</td><td>继续翻译…（新任务，自动复用）</td></tr></table>
<p>段落状态：未开始 → 排队 → 翻译中 → 已译 / 复用 / 未译（失败）；另有“无需翻译”（页眉、页码、已是目标语言）。</p>

<h2>3. 失败与重试</h2>
<table><tr><th>类别</th><th>例子</th><th>处理</th></tr>
<tr><td>临时</td><td>超时、429、5xx、连接重置</td><td>自动退避重试：2s / 8s / 30s（±20% 抖动，尊重 Retry-After），最多 3 次；连续 429 时并发 2 → 1</td></tr>
<tr><td>网络</td><td>系统报告离线</td><td>任务进入 offline；在途请求退回排队；联网自动继续</td></tr>
<tr><td>段落级</td><td>输出为空、被截断、拒绝、打包解析不匹配</td><td>打包请求先拆成单段再试；仍失败 → 段落标“未译”，其余继续</td></tr>
<tr><td>任务级</td><td>401/403、额度用尽、模型不存在</td><td>立即暂停整个任务，不重试，横条说明并给出“打开设置”</td></tr>
<tr><td>预算</td><td>实际 token &gt; 预估 150%</td><td>暂停一次询问</td></tr>
<tr><td>进程</td><td>退出、崩溃、睡眠</td><td>任务记为 paused；重开不自动继续；进度以译文存储为准重建</td></tr></table>
<p>重试层级：段落（原地「重试」）→ 全部未译（面板 / 检查点「重试 n 段」）→ 任务（暂停后「继续」从断点）。“重试”永远不重发已成功的段落。</p>

<h2>4. 避免重复调用</h2>
<ol>
<li><b>内容键</b> <code>textKey = sha256(splitVersion, 规范化原文, 目标语言)</code>，与页码、位置、文档摘要、模型、“术语与要求”都无关；模型与要求只作为出处记录在译文上（<code>model</code>、<code>profileDigest</code>）。所以换页码、重新识别文字、换模型、改要求都<b>不会</b>让已有译文失效。</li>
<li>启动前先查缓存（含逐段对照留下的译文与旧版 <code>translationCaches</code>），只为缺失的段落排队；预估里扣除复用部分。</li>
<li>相同 <code>textKey</code> 的段落只发一次请求，结果扇出到每一处；相同文字在途时，其他副本等待而不是再发。</li>
<li>页眉页脚（≥ 30% 页面相同位置出现的相同文字）、页码、纯数字 / 符号、已是目标语言的段落不发送。</li>
<li>每个（文档，目标语言）只有一个调度器；逐段对照的按需翻译与全文任务共用它，在途请求按 <code>textKey</code> 去重。任务存在时不触发按需翻译。</li>
<li>修改“术语与要求”不使已有译文失效；只影响之后排队的段落。手动修改过的段落不会被任何批量操作覆盖。</li>
</ol>

<h2>5. 数据存储</h2>
<pre>&lt;set&gt;.mmset/
  studyset.json                       // 不放全文译文（避免每次编辑重写大文件、进入撤销快照）
  translations/
    &lt;documentId&gt;/&lt;targetLang&gt;/

      segments.jsonl                  // 追加写：每段一行，成功即 fsync</pre>
<p><code>segments.jsonl</code> 每行：<code>{v, key, fp, page, index, text, model, profile, origin: "ai"|"edited"|"legacy", at}</code>。同一 <code>key</code> 以最后一行为准；尾部不完整的行在加载时丢弃。被覆盖的行超过 30% 时在空闲时压缩重写。<code>job.json</code> 只记录设置与游标，<b>进度以 segments 为准</b>重新计算。</p>

<h2>6. 尺寸与令牌</h2>
<table><tr><th>元素</th><th>规格</th></tr>
<tr><td>设置面板</td><td><code>MMSheet</code> 宽 560，表单标签列 96，圆角 16</td></tr>

<tr><td>动效</td><td>译文到达淡入 360ms；占位微光 1.2s；减弱动态效果时全部去除</td></tr></table>
