name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed apps packages
      - run: flutter analyze
      - run: dart test
        working-directory: packages/mm_core
      - run: flutter test
        working-directory: packages/mm_design
      - run: flutter test
        working-directory: packages/mm_platform
      - run: flutter test
        working-directory: apps/marginmind

  macos:
    name: Build macOS app
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --debug
        working-directory: apps/marginmind
