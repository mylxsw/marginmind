name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed apps packages
      - run: flutter analyze
      - run: python3 -m unittest discover -s tool/tests
      - run: python3 tool/coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  macos:
    name: Build and test macOS app
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --debug
        working-directory: apps/marginmind
      - run: xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug -destination 'platform=macOS' -enableCodeCoverage YES
        working-directory: apps/marginmind
        timeout-minutes: 20
      - run: flutter test integration_test/browser_test.dart -d macos --reporter expanded
        working-directory: apps/marginmind
        timeout-minutes: 20
      - run: flutter test integration_test/reflow_reader_test.dart -d macos --reporter expanded
        working-directory: apps/marginmind

  web:
    name: Build and test browser storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart test --platform chrome test/browser_library_store_test.dart
        working-directory: packages/mm_data
      - run: flutter build web --release
        working-directory: apps/marginmind
      - run: python3 -m pip install playwright==1.64.1
      - run: python3 docs/evidence/platform/GUL-543/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-evidence
          path: docs/evidence/platform/GUL-543/

  linux:
    name: Build Linux app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release
        working-directory: apps/marginmind

  ios:
    name: Build iOS simulator
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --no-codesign
        working-directory: apps/marginmind
      - name: Run iOS browser integration
        working-directory: apps/marginmind
        timeout-minutes: 20
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          open -a Simulator --args -CurrentDeviceUDID "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          flutter test integration_test/browser_test.dart -d "$device_id" --reporter expanded --verbose

  android:
    name: Build Android debug
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
        working-directory: apps/marginmind
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/marginmind
          script: flutter test integration_test/browser_test.dart -d emulator-5554 --reporter expanded

  windows:
    name: Build and run Windows browser
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - uses: NuGet/setup-nuget@v2
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --debug
        working-directory: apps/marginmind
      - run: flutter test integration_test/browser_test.dart -d windows --reporter expanded
        working-directory: apps/marginmind
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-browser-build
          path: apps/marginmind/build/windows/x64/runner/Debug/
