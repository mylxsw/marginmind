<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foliarc · 网页转文档 AI 整理（交互原型）</title>
<style>
/* Tokens copied from packages/mm_design/lib/src/tokens (colors, metrics, typography). */
:root[data-theme=dark]{--win:#1E1E1F;--side:#2C2C2F;--chrome:#171718;--card:#2C2C2E;--surface:#323235;--label:#F5F5F7;--sec:#AEAEB2;--icon:#AEAEB2;--sep:rgba(255,255,255,.09);--fill:rgba(118,118,128,.24);--qfill:rgba(118,118,128,.14);--sel:rgba(255,255,255,.10);--hover:rgba(255,255,255,.06);--accent:#0A84FF;--accentfill:#0A66D0;--tint:rgba(10,132,255,.2);--pos:#30D158;--cau:#FF9F0A;--crit:#FF453A;--hair:rgba(0,0,0,.5);--border:rgba(255,255,255,.12);--scrim:rgba(0,0,0,.25);--shadow:0 24px 60px rgba(0,0,0,.55);--seg:#636366;--ex:#D1D1D6;--stage:#0b0b0c}
:root[data-theme=light]{--win:#FFFFFF;--side:#F2F2F6;--chrome:#F2F2F6;--card:#FFFFFF;--surface:#FFFFFF;--label:#1D1D1F;--sec:#636366;--icon:#6E6E73;--sep:rgba(0,0,0,.09);--fill:rgba(120,120,128,.12);--qfill:rgba(120,120,128,.08);--sel:rgba(0,0,0,.075);--hover:rgba(0,0,0,.043);--accent:#007AFF;--accentfill:#0A66D0;--tint:rgba(0,122,255,.12);--pos:#248A3D;--cau:#C93400;--crit:#D70015;--hair:rgba(0,0,0,.08);--border:rgba(0,0,0,.12);--scrim:rgba(0,0,0,.12);--shadow:0 24px 60px rgba(0,0,0,.25);--seg:#fff;--ex:#3A3A3C;--stage:#d9d9de}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--label);font:13px/16px -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
svg{display:block;flex:none}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.scroll{overflow:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}

/* Prototype control bar: not part of the product. */
#bar{height:44px;flex:none;display:flex;align-items:center;gap:16px;padding:0 14px;background:#000;color:#ddd;font-size:12px;border-bottom:1px dashed #555;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
#bar b{color:#fff;font-weight:600}
#bar .g{display:flex;align-items:center;gap:6px}
#bar .g>span{color:#999}
#bar .o{display:flex;background:#222;border-radius:7px;padding:2px}
#bar .o button{padding:3px 8px;border-radius:5px;color:#bbb}
#bar .o button.on{background:#555;color:#fff}
#bar .re{margin-left:auto;padding:4px 10px;border:1px solid #555;border-radius:7px;color:#eee}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}

/* Desktop window */
.win{width:min(1326px,100%);height:min(866px,100%);min-width:1040px;background:var(--win);border-radius:16px;border:.5px solid var(--border);box-shadow:var(--shadow);display:flex;overflow:hidden;position:relative}
.side{width:226px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:0 8px 10px}
.lights{height:48px;display:flex;align-items:center;gap:8px;padding-left:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights .sp{flex:1}
.lights svg{color:var(--icon);margin-right:8px}
.grp{font-size:11px;line-height:14px;font-weight:600;color:var(--sec);padding:12px 8px 6px}
.row{height:28px;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 8px;overflow:hidden}
.row svg{color:var(--accent)}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.on{background:var(--sel)}
.row.temp span{color:var(--sec)}
.row .badge{margin-left:auto;background:var(--tint);color:var(--accent);font-size:10px;border-radius:9px;padding:0 6px;line-height:16px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tabs{height:44px;flex:none;background:var(--chrome);display:flex;align-items:flex-end;padding:0 12px 0 8px;gap:2px}
.tab{height:38px;padding:0 12px;display:flex;align-items:center;gap:7px;border-radius:9px 9px 0 0;color:var(--sec);max-width:210px;white-space:nowrap}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--win);color:var(--label);font-weight:600}
.tabs .sp{flex:1}
.tabs .tools{display:flex;gap:14px;align-items:center;height:38px;color:var(--icon)}
.tabs .dot{width:20px;height:20px;border-radius:50%;background:var(--accent);opacity:.85}
.urlbar{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;color:var(--icon)}
.url{flex:1;height:30px;border-radius:15px;background:var(--qfill);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--label)}
.url svg{color:var(--icon)}
.iconbtn{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--icon)}
.iconbtn:hover{background:var(--hover)}
.content{flex:1;min-height:0;position:relative;overflow:hidden}

/* Messy page shown in the embedded browser; browser content ignores app theme. */
.web{position:absolute;inset:0;background:#fff;color:#222;overflow:auto;font:15px/1.75 Georgia,"Noto Serif CJK SC","Songti SC",serif}
.web .nav{background:#b3202a;color:#fff;font:13px/40px sans-serif;padding:0 20px;display:flex;gap:18px;white-space:nowrap;overflow:hidden}
.web .wrap{display:flex;gap:22px;padding:14px 22px;max-width:1040px;margin:auto}
.web .col{flex:1;min-width:0}
.web .aside{width:210px;flex:none;font:12px/1.5 sans-serif;color:#666}
.web .ad{background:repeating-linear-gradient(45deg,#fff0c9,#fff0c9 8px,#ffe7a8 8px,#ffe7a8 16px);color:#8a5a00;font:600 13px/1.4 sans-serif;padding:14px;margin:12px 0;text-align:center;border:1px solid #f0cf7a}
.web h1{font:700 25px/1.35 sans-serif;margin:8px 0}
.web .meta{font:12px sans-serif;color:#888}
.web .b{font-weight:700;color:#b3202a;margin:14px 0 4px}
.web p{margin:6px 0}
.web .card{border:1px solid #eee;padding:8px;margin-bottom:10px;background:#fafafa}
.web svg{width:100%;height:auto;max-width:440px}
.pop{position:absolute;top:8px;right:12px;width:290px;background:var(--surface);border:.5px solid var(--border);border-radius:14px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,.28);z-index:2}
.pop .h{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--label)}
.pop .h svg{color:var(--accent);width:20px;height:20px}
.pop p{margin:8px 0 12px;color:var(--sec)}
.pop .a{display:flex;justify-content:flex-end;gap:8px}

/* Controls */
.btn{height:32px;min-width:72px;padding:0 14px;border-radius:8px;background:var(--fill);color:var(--label);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.pri{background:var(--accentfill);color:#fff}
.btn.plain{background:none;color:var(--accent);min-width:0;padding:0 8px}
.btn.plain:hover{background:var(--hover)}
.btn.crit{background:var(--crit);color:#fff}
.btn:disabled{opacity:.42;filter:none}
.btn.sm{height:24px;min-width:0;padding:0 9px;font-size:12px;border-radius:6px}
.link{color:var(--accent)}
.link:hover{text-decoration:underline}
.seg{display:inline-flex;background:var(--fill);border-radius:7px;padding:2px}
.seg button{height:22px;padding:0 10px;border-radius:5px;font-size:12px;color:var(--label)}
.seg button.on{background:var(--seg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw{width:32px;height:19px;border-radius:10px;background:var(--fill);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:15px}
.sw:disabled{opacity:.42}
.spin{width:14px;height:14px;border-radius:50%;border:1.6px solid var(--fill);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* Sheet: MMSheet, width MMSizes.webConversionSheetWidth (1080) */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:5}
.sheet{width:min(1080px,calc(100% - 48px));background:var(--surface);border-radius:16px;border:.5px solid var(--border);box-shadow:var(--shadow);padding:20px 24px;display:flex;flex-direction:column;max-height:calc(100% - 32px);animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.sheet>h2{margin:0 0 16px;font-size:15px;line-height:20px;font-weight:700}
.sbody{display:flex;height:min(600px,calc(100vh - 44px - 28px - 210px));min-height:220px}
.left{flex:65;min-width:0;display:flex;flex-direction:column;position:relative}
.vr{width:.5px;background:var(--sep);margin:0 20px;flex:none}
.right{flex:35;min-width:0}
.sbody.full .vr,.sbody.full .right{display:none}
.sfoot{border-top:.5px solid var(--sep);margin-top:12px;padding-top:14px;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.sfoot .note{margin-right:auto;font-size:11px;line-height:14px;color:var(--sec)}
.lab{font-size:12px;line-height:15px;font-weight:500;color:var(--sec);margin-bottom:8px}
.sec{margin-bottom:22px}
.input{width:100%;height:36px;border-radius:8px;border:.5px solid var(--border);background:var(--qfill);color:var(--label);font:inherit;padding:0 10px;outline:0}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fmt{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 12px;border-radius:8px;border:.5px solid var(--hair);background:var(--qfill);width:100%;text-align:left;margin-bottom:8px}
.fmt:hover{background:var(--hover)}
.fmt svg{width:22px;height:22px;color:var(--sec)}
.fmt b{flex:1;font-weight:600}
.fmt .r{width:16px;height:16px;border-radius:50%;border:1.3px solid var(--sec);flex:none}
.fmt.on{background:var(--tint);border:1px solid var(--accent)}
.fmt.on svg{color:var(--accent)}
.fmt.on .r{border:1.3px solid var(--accent);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 8px var(--accent)}
.aic{border-radius:10px;border:.5px solid var(--hair);background:var(--qfill);padding:12px}
.aic.on{border:1px solid var(--accent)}
.aic .top{display:flex;align-items:center;gap:8px}
.aic .top svg{color:var(--accent);width:18px;height:18px}
.aic .top b{flex:1;font-weight:600}
.aic p{margin:8px 0 0;color:var(--sec);font-size:12px;line-height:17px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:.5px solid var(--sep)}
.pick{height:24px;display:inline-flex;align-items:center;gap:5px;padding:0 8px;border-radius:6px;background:var(--fill);font-size:12px;position:relative}
.menu{position:absolute;right:0;top:28px;width:230px;background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:4}
.menu button{display:flex;width:100%;gap:6px;align-items:center;padding:6px 8px;border-radius:7px;text-align:left}
.menu button:hover{background:var(--accentfill);color:#fff}
.issue{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;line-height:16px}
.issue.crit{color:var(--crit)}.issue.mute{color:var(--sec)}
.issue .link{margin-left:auto;white-space:nowrap}

/* Progress */
.strip{flex:none;display:flex;align-items:center;gap:10px;min-height:32px;margin-bottom:10px}
.strip .st{display:flex;align-items:center;gap:7px;min-width:0;font-weight:600;white-space:nowrap}
.strip .meta{color:var(--sec);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.strip .sp{flex:1}
.bar{flex:none;height:2px;background:var(--qfill);border-radius:1px;margin:-4px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.follow{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);height:28px;padding:0 12px;border-radius:14px;background:var(--surface);border:.5px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;gap:6px;font-size:12px}
.stage{display:flex;gap:9px;padding:6px 0;align-items:flex-start;line-height:18px}
.stage .ico{width:16px;height:18px;display:grid;place-items:center;flex:none}
.stage.todo{color:var(--sec)}
.stage small{display:block;color:var(--sec);font-size:11px;line-height:14px}
.ok{color:var(--pos)}.cau{color:var(--cau)}.bad{color:var(--crit)}
.dot0{width:6px;height:6px;border-radius:50%;background:var(--fill)}
.slist{margin:2px 0 6px 25px}
.srow{display:flex;align-items:center;gap:8px;height:26px;border-radius:6px;padding:0 6px;margin-left:-6px;width:100%;text-align:left}
.srow:hover{background:var(--hover)}
.srow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow.cur{background:var(--tint)}
.srow.todo .t{color:var(--sec)}
.srow .re{display:none;color:var(--accent);font-size:11px;white-space:nowrap}
.srow:hover .re{display:block}
.okline{display:flex;align-items:center;gap:6px;font-size:12px;line-height:18px;color:var(--sec)}
.cauline{margin-top:8px;padding:10px;border-radius:8px;background:color-mix(in srgb,var(--cau) 12%,transparent);font-size:12px;line-height:17px}
.cauline .a{display:flex;gap:10px;margin-top:6px}

/* Article preview */
.doc{flex:1;min-height:0;position:relative}
.docs{position:absolute;inset:0;overflow:auto;scrollbar-width:none}.docs::-webkit-scrollbar{display:none}
.hd .m{font-size:12px;line-height:15px;font-weight:500;color:var(--sec);margin-bottom:12px}
.hd h1{font-size:20px;line-height:28px;margin:0 0 20px;font-weight:700}
.prose{font-size:15px;line-height:1.75;color:var(--label);overflow-wrap:anywhere}
.prose p{margin:0 0 14px}
.prose h1,.prose h2{font-size:17px;line-height:1.5;margin:22px 0 10px;font-weight:700}
.prose h3{font-size:15px;line-height:1.5;margin:18px 0 8px;font-weight:600}
.prose ul,.prose ol{margin:0 0 14px;padding-left:22px}
.prose li{margin-bottom:5px}
.prose blockquote{margin:0 0 14px;padding:0 0 0 12px;border-left:3px solid var(--fill);color:var(--ex)}
.prose code{font:12.5px/1.5 "SF Mono",Menlo,"JetBrains Mono",Consolas,monospace;background:var(--qfill);padding:1px 4px;border-radius:4px}
.prose pre{background:var(--qfill);padding:10px 12px;border-radius:8px;overflow:auto;margin:0 0 14px}
.prose pre code{background:none;padding:0;white-space:pre;font-size:12px}
.prose table{border-collapse:collapse;margin:0 0 14px;font-size:13.5px;width:100%}
.prose th,.prose td{border:.5px solid var(--border);padding:6px 9px;text-align:left}
.prose th{background:var(--qfill);font-weight:600}
.prose a{color:var(--accent);text-decoration:none}
.prose figure{margin:0 0 14px}
.prose figure svg{width:100%;max-width:440px;height:auto;border-radius:6px;background:#fff}
.prose figcaption{font-size:12px;color:var(--sec);margin-top:4px}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);margin-left:2px;vertical-align:-.15em;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.waiting{display:flex;align-items:center;gap:8px;color:var(--sec);padding:6px 0 18px}
.sourcepre{font:12px/1.6 "SF Mono",Menlo,"JetBrains Mono",Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:var(--label)}
.rawblk{position:relative;padding-left:10px;border-left:2px dashed var(--fill);margin-bottom:16px;color:var(--sec)}
.rawblk .tag,.tagx{font-size:11px;line-height:14px;font-weight:600;color:var(--sec);display:block;margin-bottom:6px}
.failc{border:.5px solid var(--crit);background:color-mix(in srgb,var(--crit) 10%,transparent);border-radius:10px;padding:12px;margin-bottom:16px}
.failc .h{display:flex;gap:7px;font-weight:600;align-items:center}
.failc p{margin:6px 0 10px;color:var(--sec);font-size:12px;line-height:17px}
.failc .a{display:flex;gap:8px}
.flash{animation:fl 1.1s ease-out}
@keyframes fl{0%,40%{background:var(--tint)}100%{background:transparent}}

/* PDF pages */
.pages{background:rgba(120,120,128,.14);border-radius:8px;padding:14px;min-height:100%}
.page{background:#fff;color:#222;width:100%;max-width:560px;aspect-ratio:1/1.414;margin:0 auto 14px;padding:44px 46px 34px;font:12.5px/1.8 "Songti SC","Noto Serif CJK SC","Noto Serif SC",serif;box-shadow:0 1px 6px rgba(0,0,0,.28);position:relative;overflow:hidden}
.page .pin{height:calc(100% - 18px);overflow:hidden}
.page h1{font-size:19px;line-height:1.4;margin:0 0 6px}.page h2{font-size:14.5px;margin:12px 0 5px}.page h3{font-size:13px;margin:10px 0 4px}
.page p{margin:0 0 7px}.page ul,.page ol{margin:0 0 7px;padding-left:18px}
.page blockquote{margin:0 0 7px;padding-left:9px;border-left:2px solid #ccc;color:#555}
.page pre{background:#f4f4f5;padding:7px;font:10.5px/1.5 Menlo,monospace;margin:0 0 7px;overflow:hidden}.page code{font:10.5px Menlo,monospace}
.page table{border-collapse:collapse;width:100%;margin:0 0 7px;font-size:11px}.page th,.page td{border:.5px solid #bbb;padding:3px 5px;text-align:left}
.page figure{margin:0 0 7px}.page figure svg{width:70%;height:auto}.page figcaption{font-size:10px;color:#777}
.page a{color:#0a58ca;text-decoration:none}
.page .src{font:10px sans-serif;color:#777;margin-bottom:12px}
.page .no{position:absolute;bottom:14px;left:0;right:0;text-align:center;font:10px sans-serif;color:#999}
.pages.printed .page{font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
#measure{position:absolute;left:-9999px;top:0;visibility:hidden}

/* Edit + compare */
.split2{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column}
.panebody{flex:1;min-height:0;position:relative}
textarea.ed{position:absolute;inset:0;width:100%;height:100%;resize:none;background:var(--qfill);border:.5px solid var(--border);border-radius:8px;color:var(--label);font:12px/1.65 "SF Mono",Menlo,"JetBrains Mono",Consolas,monospace;padding:12px;outline:0}
textarea.ed:focus{border-color:var(--accent)}
.cmp{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
.cmp .chd{position:sticky;top:0;background:var(--surface);z-index:1;font-size:12px;font-weight:600;color:var(--sec);padding-bottom:8px}
.cmp .cc{padding:12px 0 2px;border-top:.5px solid var(--sep);min-width:0}
.cmp .raw{font-size:13px;line-height:1.7;color:var(--ex)}
.cmp .raw p{margin:0 0 8px}
.cmp .raw a{color:var(--accent);text-decoration:none}
.cmp .raw svg,.rawblk svg{width:100%;height:auto;background:#fff;border-radius:4px}
.cmp .raw del{text-decoration:line-through;color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,transparent);text-decoration-thickness:1px}
.cmp .prose{font-size:13px;line-height:1.7}
.cmp .prose p,.cmp .prose ul,.cmp .prose ol,.cmp .prose pre,.cmp .prose blockquote,.cmp .prose table,.cmp .prose figure{margin-bottom:8px}
.cmp .prose h2{font-size:14px;margin:0 0 6px}
.ctag{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 0 8px;color:var(--cau);font-size:12px}

/* Reader after save */
.reader{position:absolute;inset:0;background:var(--win);overflow:auto;padding:40px 0 60px}
.reader .in{width:min(640px,calc(100% - 48px));margin:auto}
.reader h1.ti{font:700 25px/1.4 inherit;margin:0 0 10px}
.reader .by{color:var(--sec);font-size:12.5px;display:flex;gap:6px;align-items:center;margin-bottom:26px;position:relative;flex-wrap:wrap}
.chip{height:20px;border-radius:10px;background:var(--tint);color:var(--accent);display:inline-flex;align-items:center;gap:4px;padding:0 8px;font-size:11px;font-weight:600}
.chip svg{width:12px;height:12px}
.reader .prose{font-family:"Songti SC","Noto Serif CJK SC","Noto Serif SC",serif;font-size:16.5px;line-height:32px}
.reader .prose h1,.reader .prose h2,.reader .prose h3{font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}

{t:'间隔效应',raw:[`**二、间隔效应**`,`~猜你喜欢：7 天背完 3500 词？这个方法太狠了 >>`,`同样学习 60 分钟，分散到几天通常比集中在一次效果更好。心理学称之为间隔效应。原因主要有三点 1. 提取变难 间隔后回想更费力，而费力的回想让记忆更牢固 2. 情境变化 不同时间和环境提供了更多线索 3. 巩固 睡眠让新记忆有时间整合进已有知识`,`“最有效的复习时机，是你快要忘记、但还能想起来的时候。”——罗伯特·比约克`],
ai:`## 间隔效应

同样学习 60 分钟，分散到几天通常比集中在一次效果更好。心理学称之为**间隔效应**，原因主要有三点：

1. **提取变难**：间隔后回想更费力，而费力的回想让记忆更牢固。
2. **情境变化**：不同时间和环境提供了更多线索。
3. **巩固**：睡眠让新记忆有时间整合进已有知识。

> 最有效的复习时机，是你快要忘记、但还能想起来的时候。
> ——罗伯特·比约克`},

ai:`## 计算下次复习

下面的代码演示如何由稳定性计算间隔：

\`\`\`python
def next_interval(stability, retention=0.9):
    factor = 19 / 81
    decay = -0.5
    return round(stability / factor * (retention ** (1 / decay) - 1))
\`\`\`

当 \`retention\` 等于 0.9 时，间隔恰好等于稳定性。调高目标记住率会缩短间隔，复习量随之增加，所以并不是越高越好。`},

 return o+'</div>'}
/* AI off, PDF: the existing path prints the live page, debris included. */
function paginate(sel,src,printed){const h=$(sel);if(!h)return;const m=$('#measure');const w=Math.min(h.clientWidth-28,560)||520;m.style.width=w+'px';
 const pad=S.device==='phone'?48:92;const H=Math.round(w*1.414)-(S.device==='phone'?68:96);
 const t=document.createElement('div');t.innerHTML=`<h1>${esc(S.saved?.name||S.name||TITLE)}</h1>${printed?'':`<div class="src">${HOST} · ${DATE}</div>`}`+md(src);
 const probe=document.createElement('div');probe.className='page';probe.style.cssText=`height:auto;aspect-ratio:auto;width:${w}px;padding:0 ${pad/2}px;box-shadow:none`;m.innerHTML='';m.appendChild(probe);
 const pages=[];let cur=[];[...t.children].forEach(el=>{probe.appendChild(el);if(probe.offsetHeight>H&&cur.length){pages.push(cur);cur=[];probe.innerHTML='';probe.appendChild(el)}cur.push(el.outerHTML)});if(cur.length)pages.push(cur);m.innerHTML='';
 h.innerHTML=`<div class="pages${printed?' printed':''}">${pages.map((p,i)=>`<div class="page"><div class="pin">${p.join('')}</div><div class="no">${i+1} / ${pages.length}</div></div>`).join('')}</div>`}

/* ---------- Right pane ---------- */
function formatsHtml(){const rows=[['read','阅读模式','doc'],['pdf','PDF','pdf'],['md','Markdown','md']];return rows.map(([k,l,i])=>`<button class="fmt ${S.fmt===k?'on':''}" data-fmt="${k}" role="radio" aria-checked="${S.fmt===k}"><svg class="ic" viewBox="0 0 16 16">${P[i]}</svg><b>${l}</b><span class="r"></span></button>`).join('')}
function aiCard(){const off=blocked();const on=S.ai&&!off;
 let extra='';
 if(S.config==='none')extra=`<div class="issue mute"><span>添加模型后即可使用</span><button class="link" data-a="settings">去设置</button></div>`;
 else if(S.config==='off')extra=`<div class="issue crit">${I('warn',13)}<span>模型已停用</span><button class="link" data-a="settings">去设置</button></div>`;
 else if(on)extra=`<div class="mrow"><span style="color:var(--sec);font-size:12px">模型</span><button class="pick" data-a="menu">${esc(S.model.name)}${I('down',11)}${S.menu?`<div class="menu">${MODELS.map(m=>`<button data-model="${m.id}">${m.id===S.model.id?I('check',12):'<span style="width:12px"></span>'}<span>${esc(m.name)}<br><small style="opacity:.7">${esc(m.svc)}</small></span></button>`).join('')}</div>`:''}</button></div><p>约 ${TOTAL.toLocaleString()} 字，分 ${SECS.length} 段。${S.model.local?'在本机处理，内容不会离开这台设备。':`正文会发送到 ${esc(S.model.svc)}。`}</p>`;
 return `<div class="aic ${on?'on':''}"><div class="top">${I('ai',18)}<b>AI 整理</b><button class="sw ${on?'on':''}" role="switch" aria-checked="${on}" aria-label="AI 整理" data-a="toggle" ${off?'disabled':''}></button></div><p>修正标题、列表和段落，去掉页面杂质，不改写原文。</p>${extra}</div>`}
function progressHtml(){const p=S.prepStep||0,running=S.phase==='running'||S.phase==='prep';
 const stage=(state,t,sub)=>`<div class="stage ${state==='todo'?'todo':''}"><span class="ico">${state==='ok'?`<span class="ok">${I('check',14)}</span>`:state==='run'?'<span class="spin"></span>':'<span class="dot0"></span>'}</span><div>${t}${sub?`<small>${sub}</small>`:''}</div></div>`;
 const n=doneCount(),all=S.secs.length,organizing=S.phase!=='prep';
 const rows=S.secs.map((s,i)=>{const ic=s.state==='done'?(s.warn&&!s.ack?`<span class="cau">${I('warn',13)}</span>`:`<span class="ok">${I('check',13)}</span>`):s.state==='run'?'<span class="spin" style="width:12px;height:12px"></span>':s.state==='fail'?`<span class="bad">${I('warn',13)}</span>`:'<span class="dot0" style="margin:0 3.5px"></span>';
  const canRe=!running&&!S.edited&&(s.state==='done'||s.state==='raw');
  return `<button class="srow ${s.state==='run'?'cur':''} ${s.state==='wait'||s.state==='raw'?'todo':''}" data-goto="${i}" title="${esc(s.t)}">${ic}<span class="t">${esc(s.t)}</span>${canRe?`<span class="re" data-rerun="${i}">重新整理</span>`:''}</button>`}).join('');
 const fin=S.phase==='done'||S.phase==='stopped';
 const warns=S.secs.filter(s=>s.warn&&s.state==='done'&&!s.ack);
 const check=S.phase==='done'?`<div class="okline"><span class="ok">${I('check',13)}</span>图片 2/2、链接 1/1、代码块 1/1 都在</div>${warns.map(s=>`<div class="cauline"><b class="cau">${esc(s.t)}：比原文少 ${s.warn}%</b><br>可能删掉了推广内容，也可能误删了正文。<div class="a"><button class="link" data-compare="${S.secs.indexOf(s)}">查看对照</button><button class="link" data-ack="${S.secs.indexOf(s)}">没问题</button></div></div>`).join('')}`:'';
 return `<div class="lab">${S.phase==='done'?'完整性检查':fin?'段落':'整理进度'}</div>
 ${fin?'':stage(p>=1?'ok':'run','读取网页正文',p>=1?`${TOTAL.toLocaleString()} 字`:'')+stage(p>=2?'ok':p===1?'run':'todo','按章节分段',p>=2?`${SECS.length} 段`:'')}
 ${fin?'':stage(organizing?(n===all&&!S.active?'ok':'run'):'todo','整理正文',organizing?`${n}/${all}`:'')}
 ${fin?check:''}
 ${fin&&S.phase==='done'?'<div class="lab" style="margin-top:14px">段落</div>':''}
 <div class="${fin?'':'slist'}">${organizing?rows:''}</div>
 ${fin?'':stage(S.checking?'run':'todo','检查完整性','')}
 ${fin&&S.edited?`<div class="issue mute" style="margin-top:8px">已手动编辑，不能再按段重新整理。</div>`:''}
 ${fin?`<div style="margin-top:14px"><button class="link" data-a="discard">放弃整理，用原始内容</button></div>`:''}`}
function renderRight(){const r=$('#right');if(!r)return;
 if(!r.querySelector('#nm')){r.innerHTML=`<div class="sec"><div class="lab">文档名称</div><input class="input" id="nm" placeholder="标题" aria-label="文档名称" value="${esc(S.name)}"></div><div class="sec"><div class="lab">保存格式</div><div id="fmts"></div></div><div class="sec" id="aip"></div>`;
  $('#nm').oninput=e=>{S.name=e.target.value;S.nameEdited=true;renderFoot();const h=$('.hd h1');if(h)h.textContent=S.name}}
 $('#fmts').innerHTML=formatsHtml();$('#aip').innerHTML=S.phase==='idle'?`<div class="lab">内容处理</div>${aiCard()}`:progressHtml()}
function renderFoot(){const f=$('#foot');if(!f)return;const emptyName=!S.name.trim();const phone=S.device==='phone';
 const cancel=`<button class="btn" data-a="cancel">取消</button>`;
 if(S.phase==='idle'){const ai=S.ai&&!blocked();f.innerHTML=`${cancel}<button class="btn pri" data-a="${ai?'start':'save'}" ${emptyName?'disabled':''}>${ai?'开始整理':'保存文档'}</button>`;return}
 if(S.phase==='prep'||S.phase==='running'){f.innerHTML=`<span class="note">可以随时停止，已整理的内容会保留。</span>${phone?'':cancel}<button class="btn" data-a="stop">${I('stop',13)}停止整理</button>${phone?'':`<button class="btn pri" disabled>保存文档</button>`}`;return}
 f.innerHTML=`${cancel}<button class="btn pri" data-a="save" ${emptyName?'disabled':''}>保存文档</button>`}

/* ---------- Reader after save ---------- */
function readerHtml(){const s=S.saved;const by=`<div class="by"><span class="link">${HOST}</span> · ${DATE}${s.ai?` <button class="chip" data-a="prov">${I('ai',12)}AI 整理</button>`:''}${S.prov?`<div class="prov"><dl><dt>模型</dt><dd>${esc(S.model.name)}</dd><dt>处理</dt><dd>整理格式${s.edited?'，之后手动编辑过':''}${s.partial?`，${s.partial} 段保留原始内容`:''}</dd><dt>原始内容</dt><dd>网页快照已保存</dd></dl><div class="a"><button class="link">查看原网页快照</button><button class="link">打开原网页</button></div></div>`:''}</div>`;
 if(s.fmt==='pdf')return `<div class="reader" style="padding:14px"><div class="pagesHost" style="max-width:640px;margin:auto"></div></div>`;
 return `<div class="reader"><div class="in"><h1 class="ti">${esc(s.name)}</h1>${by}<div class="prose">${md(s.md)}</div></div></div>`}

function doSave(){const ai=S.phase!=='idle';const un=ai?S.secs.filter(x=>x.state!=='done').length:0;
 const src=ai?fullMd():SECS.map(rawText).join('\n\n');S.tok++;
 S.saved={name:S.name.trim(),fmt:S.fmt,md:src,ai,edited:S.edited,partial:un};
 S.saved.printed=!ai&&S.fmt==='pdf';
 S.screen='doc';render();hud(`已保存「${S.saved.name}」`,'check')}
function tryClose(){const busy=S.phase!=='idle'&&(S.phase==='prep'||S.phase==='running'||doneCount()>0||S.edited);
 if(busy){alertBox('放弃整理结果？',S.edited?'已整理的内容和你的编辑都不会保留。':'已整理的内容不会保留。',S.phase==='running'||S.phase==='prep'?'继续整理':'返回','放弃',()=>{S.tok++;closeSheet()});return}
 closeSheet()}
function closeSheet(){S.tok++;Object.assign(S,{screen:'browser',popover:false,ai:false,phase:'idle',secs:[],queue:[],edited:false,mdEdit:null,tab:'preview',phoneSet:false,menu:false,err:null,name:RAW_TITLE,nameEdited:false,active:-1});render()}
function alertBox(t,b,no,yes,cb){const r=(S.device==='phone'?$('.ph'):$('.win'));const d=document.createElement('div');d.className='alert';d.innerHTML=`<div role="alertdialog"><h3>${t}</h3><p>${b}</p><div class="a"><button class="btn" data-x="no">${no}</button><button class="btn crit" data-x="yes">${yes}</button></div></div>`;r.appendChild(d);d.addEventListener('click',e=>{const x=e.target.dataset.x;if(!x)return;d.remove();if(x==='yes')cb()})}
function settingsMock(){const r=(S.device==='phone'?$('.ph'):$('.win'));const d=document.createElement('div');d.className='alert';d.innerHTML=`<div><h3>设置 › AI 功能</h3><p>这里跳转到现有的模型设置页。“网页整理”作为新的一行出现在重型任务里，默认跟随重型任务模型。</p><div class="a"><button class="btn" data-x="no">返回</button><button class="btn pri" data-x="yes">模拟配置完成</button></div></div>`;r.appendChild(d);d.addEventListener('click',e=>{const x=e.target.dataset.x;if(!x)return;d.remove();if(x==='yes'){S.config='ok';renderBar();renderRight();renderFoot();hud('模型已可用','check')}})}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{const t=e.target;
 const bb=t.closest('[data-b]');if(bb){let{b:k,v}=bb.dataset;if(k==='speed')v=+v;const prev=S[k];S[k]=v;
  if(k==='theme'){document.documentElement.dataset.theme=v;renderBar();return}
  if(k==='device'){if(prev!==v){const mid=S.phase==='running'||S.phase==='prep';render();if(mid){}}return}
  if(k==='config'){if(blocked())S.ai=false;renderBar();if($('#sbody'))renderSheet();return}
  renderBar();return}
 const r=t.closest('[data-rerun]');if(r){e.stopPropagation();rerun(+r.dataset.rerun);return}
 const raw=t.closest('[data-raw]');if(raw){useRaw(+raw.dataset.raw);return}
 const ack=t.closest('[data-ack]');if(ack){S.secs[+ack.dataset.ack].ack=true;renderRight();if(S.tab==='compare')renderLeft();hud('已确认','check');return}
 const cp=t.closest('[data-compare]');if(cp){S.compareTo=+cp.dataset.compare;S.tab='compare';S.phoneSet=false;renderSheet();return}
 const go=t.closest('[data-goto]');if(go){const i=+go.dataset.goto;S.phoneSet=false;if(S.phase==='done'||S.phase==='stopped'){if(S.tab!=='preview'||S.fmt!=='read'||S.edited){if(S.edited||S.fmt!=='read'){S.compareTo=i;S.tab='compare'}else S.tab='preview';renderSheet()}}if($('#sec'+i))scrollToSec(i);return}
 const f=t.closest('[data-fmt]');if(f){S.fmt=f.dataset.fmt;$('#fmts').innerHTML=formatsHtml();if(S.phase==='idle'||(S.phase!=='running'&&S.phase!=='prep'&&S.tab==='preview'))renderLeft();if(S.phase==='done'&&S.tab!=='preview'&&S.device!=='phone'){}return}
 const tb=t.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;S.phoneSet=false;renderSheet();return}
 const vw=t.closest('[data-view]');if(vw){S.view=vw.dataset.view;renderLeft();return}
 const m=t.closest('[data-model]');if(m){S.model=MODELS.find(x=>x.id===m.dataset.model);S.menu=false;renderRight();return}
 const a=t.closest('[data-a]');
 if(!a){if(S.menu){S.menu=false;renderRight()}if(S.prov&&!t.closest('.prov')){S.prov=false;paintScreen()}return}
 switch(a.dataset.a){
  case'reset':reset();break;
  case'later':S.popover=false;paintScreen();break;
  case'open':S.popover=false;S.screen='sheet';render();break;
  case'toggle':if(!blocked()){S.ai=!S.ai;renderRight();renderFoot()}break;
  case'menu':S.menu=!S.menu;renderRight();break;
  case'settings':settingsMock();break;
  case'start':start();break;
  case'stop':stopRun();break;
  case'resume':resume();break;
  case'follow':S.follow=true;a.remove();follow();break;
  case'cancel':tryClose();break;
  case'save':doSave();break;
  case'restore':alertBox('还原 AI 结果？','你对 Markdown 的修改将被丢弃。','返回','还原',()=>{S.edited=false;S.mdEdit=null;renderSheet()});break;
  case'discard':alertBox('放弃整理？','将回到未整理的内容。'+(S.edited?'你的编辑也不会保留。':''),'返回','放弃',discardAI);break;
  case'phoneset':S.phoneSet=!S.phoneSet;renderSheet();break;
  case'prov':S.prov=!S.prov;paintScreen();break;
 }});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const al=$('.alert');if(al){al.remove();return}if(S.screen==='sheet')tryClose()});
const qs=new URLSearchParams(location.search);for(const k of['config','sim','theme','device'])if(qs.get(k))S[k]=qs.get(k);if(qs.get('speed'))S.speed=+qs.get('speed');
render();
</script>
