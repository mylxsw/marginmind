name: marginmind
description: "MarginMind — read, excerpt and map what you learn."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: any
  shared_preferences: ^2.5.6
  mm_core:
    path: ../../packages/mm_core
  mm_design:
    path: ../../packages/mm_design
  mm_platform:
    path: ../../packages/mm_platform

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: false
  ios: false
  macos:
    generate: true
    image_path: assets/icon/app_icon_macos.png
  windows:
    generate: true
    image_path: assets/icon/app_icon_macos.png
    icon_size: 256
