name: marginmind
description: "MarginMind — read, excerpt and map what you learn."
publish_to: none
version: 0.4.0+4
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.1.0
  flutter_riverpod: ^3.4.3
  intl: any
  path: ^1.9.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  mm_core:
    path: ../../packages/mm_core
  mm_data:
    path: ../../packages/mm_data
  mm_design:
    path: ../../packages/mm_design
  mm_layout:
    path: ../../packages/mm_layout
  mm_pdf:
    path: ../../packages/mm_pdf
  mm_platform:
    path: ../../packages/mm_platform
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sample/

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: false
  ios: false
  macos:
    generate: true
    image_path: assets/icon/app_icon_macos.png
  windows:
    generate: true
    image_path: assets/icon/app_icon_macos.png
    icon_size: 256
