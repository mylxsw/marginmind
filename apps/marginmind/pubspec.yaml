name: marginmind
description: "MarginMind — read, excerpt and map what you learn."
publish_to: none
version: 0.8.0+8
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  web: ^1.1.1
  dart_agent_core: 2.1.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.1.0
  flutter_riverpod: ^3.4.3
  crypto: ^3.0.6
  intl: any
  path: ^1.9.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  mm_assistant:
    path: ../../packages/mm_assistant
  mm_research:
    path: ../../packages/mm_research
  mm_book:
    path: ../../packages/mm_book
  mm_core:
    path: ../../packages/mm_core
  mm_data:
    path: ../../packages/mm_data
  mm_design:
    path: ../../packages/mm_design
  mm_layout:
    path: ../../packages/mm_layout
  mm_pdf:
    path: ../../packages/mm_pdf
  mm_platform:
    path: ../../packages/mm_platform
  desktop_drop:
    path: ../../third_party/desktop_drop
  markdown: ^7.3.1

dev_dependencies:
  integration_test:
    sdk: flutter
  window_manager: ^0.5.1
  dio: ^5.9.0
  vm_service: ^15.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  pdfrx: any
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sample/

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: false
  ios: false
  macos:
    generate: true
    image_path: assets/icon/app_icon_macos.png
  windows:
    generate: true
    image_path: assets/icon/app_icon_macos.png
    icon_size: 256
